[lyrics.1]
text = "Pur -- er in heart, O God, Help me to be; May I de -- vote my life Whol -- ly to Thee. Watch Thou my way -- ward feet, Guide me with coun -- sel sweet; Pur -- er in heart, Help me to be."

[lyrics.2]
text = "Pur -- er in heart, O God, Help me to be; Teach me to do Thy will Most lov -- ing -- ly. Be Thou my Friend and Guide, Let me with Thee a -- bide; Pur -- er in heart, Help me to be."

[lyrics.3]
