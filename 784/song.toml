[lyrics.1]
text = "“Glo -- ry to God in the high -- est,” This is the cry of my soul; Bless -- ings like bil -- lows of mer -- cy O’er me un -- ceas -- ing -- ly roll. Je -- sus has come to il -- lu -- mine My dark and sor -- row -- ful heart; So sweet I find His com -- mun -- ion, Nev -- er from Him will I part."

[lyrics.2]
text = "For my in -- iq -- ui -- ty dy -- ing, Je -- sus on Cal -- va -- ry bled; Ma -- ny a drop of His heart’s blood For my sal -- va -- tion was shed. Now there is no con -- dem -- na -- tion, Gone is my bur -- den of sin; Long -- ings for pur -- i -- ty fill me, I would be spot -- less with -- in."

[lyrics.3]
text = "What I shall be in the fu -- ture Does not in full -- ness ap -- pear, Viewed in a mir -- ror but dark -- ly, Seen thro’ the cloud and the tear; But this I know with re -- joic -- ing, When all my bat -- tles are past, Purged from my er -- rors and earth- -- stains, I shall be like Him at last."

[lyrics.chorus]
text = "I will fol -- low Je -- sus by the help of God, Thro’ the lone -- ly path where Calv’ -- ry’s He -- ro trod; The world and all its fol -- ly I would for -- ev -- er flee: Je -- sus is e -- nough for me."

