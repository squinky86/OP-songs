[lyrics.1]
text = "One sweet -- ly sol -- emn tho’t Comes to me o’er and o’er; To -- day I’m near -- er to my home Than e’er I’ve been be -- fore."

[lyrics.2]
text = "Near -- er my Fa -- ther’s house, Where man -- y man -- sions be; And near -- er to the great white throne, Near -- er the crys -- tal sea."

[lyrics.3]
text = "Near -- er the bound of life, Where falls my bur -- den down; Near -- er to where I leave my cross, And where I gain my crown."

[lyrics.4]
text = "Sav -- ior, con -- firm my trust, Com -- plete my faith in Thee; And let me feel as if I stood Close to e -- ter -- ni -- ty—"

[lyrics.5]
text = "Feel as if now my feet Were slip -- ping o’er the brink; For I may now be near -- er home, Much near -- er than I think."
