[lyrics.1]
text = "Ye who love the Sav -- ior low -- ly And are work -- ing in His name, Serv -- ing in His tem -- ples ho -- ly, O’er and o’er the word pro -- claim; Make it plain to all who hear it, Let it ev -- er -- more be heard; sad -- ness, glad -- ness, ev -- er -- last -- ing word."

