[lyrics.1]
text = "Si -- lent night, ho -- ly night, All is calm, all is bright Round yon Vir -- gin Moth -- er and Child, Ho -- ly In -- fant so ten -- der and mild, Sleep in heav -- en -- ly peace, Sleep in heav -- en -- ly peace."

[lyrics.2]
text = "Si -- lent night, ho -- ly night, Shep -- herds quake at the sight; Glo -- ries stream from heav -- en a -- far, Heav -- en -- ly hosts sing Al -- le -- lu -- ia! Christ the Sav -- ior is born! Christ the Sav -- ior is born!"

[lyrics.3]
text = "Si -- lent night, ho -- ly night, Son of God, love’s pure light; Ra -- diant beams from Thy ho -- ly face With the dawn of re -- deem -- _ -- ing grace, Je -- sus, Lord, at Thy birth, Je -- sus, Lord, at Thy birth."