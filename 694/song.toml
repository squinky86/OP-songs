[lyrics.1]
text = "Christ went a build -- ing to pre -- pare, Not made with hands; And ’twill be decked with jew -- els rare, Not made with hands."

[lyrics.2]
text = "Christ went a build -- ing to pre -- pare, Not made with hands; A glor -- ious home be -- yond com -- pare, Not made with hands."

[lyrics.3]
text = "Put on the ar -- mor of our God, Not made with hands; And take the path our Cap -- tain trod, Not made with hands."

[lyrics.4]
text = "With shield of faith de -- fy the foe, Not made with hands; Un -- til you hear the trum -- pet blow, Not made with hands."

[lyrics.5]
text = "Then come up, chil -- dren, get your crown, Not made with hands; When you have laid your ar -- mor down, Not made with hands."

[lyrics.6]
text = "That cit -- y’s built with pre -- cious stones, Not made with hands; With -- in we’ll gath -- er round the throne, Not made with hands."

[lyrics.chorus]
text = "I know (I know), I know (I know), I have an -- oth -- er build -- ing; I know (I know), I know (I know), Not made with hands."

