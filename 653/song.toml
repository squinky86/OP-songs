[lyrics.1]
text = "No need of the light of the sun or the moon To shine on that coun -- try fair; It al -- ways is bright -- er than sun -- ni -- est noon, @s1"

[lyrics.2]
text = "The val -- leys and fields are per -- pet -- u -- al green, With flow -- ers of beau -- ty rare; And noth -- ing de -- cay -- ing will ev -- er be seen @s1"

[lyrics.3]
text = "There all the re -- deemed in His glo -- ry shall rest, And none shall a bur -- den bear; With won -- der -- ful light we shall ev -- er be blest, @s1"

[lyrics.chorus]
text = "The Lamb is the light up there, up there, ’Tis bright -- er than noon -- day fair; No night ev -- er comes to shad -- ow those homes, The Lamb is the light up there."

