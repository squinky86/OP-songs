[lyrics.1]
text = "We give Thee but Thine own, What -- e’er the gift may be; All that we have is Thine a -- lone, A trust, O Lord, from Thee."

[lyrics.2]
text = "May we Thy boun -- ties thus As stew -- ards true re -- ceive; And glad -- ly, as Thou bless -- est us, To Thee our first- -- fruits give."

[lyrics.3]
text = "And we be -- lieve Thy word, Tho’ dim our faith may be; What -- e’er for Thine we do, O Lord, We do it un -- to Thee."
