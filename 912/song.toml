[lyrics.1]
text = "My sins, my sins, my Sav -- ior, Their guilt I nev -- er knew; Till with Thee in the des -- ert, I near Thy pas -- sion drew; Till with Thee in the gar -- den, I heard Thy plead -- ing pray’r, And saw Thy blood- -- sweat fall -- ing, That told Thy sor -- row there."

[lyrics.2]
text = "My sins, my sins, my Sav -- ior! How sad on Thee they fall! Seen thro’ Thy gen -- tle pa -- tience, I ten -- fold feel them all; I know they are for -- giv -- en, But still, their pain to me Is all the grief and an -- guish They laid, my Lord, on Thee."

[lyrics.3]
text = "My songs, my songs, my Sav -- ior, E’en in the time of woe, Shall tell of all Thy good -- ness To suff -- ’ring man be -- low; Thy good -- ness and Thy fa -- vor, Whose pres -- ence from a -- bove Re -- joice those hearts, my Sav -- ior, That live in Thee and love."
