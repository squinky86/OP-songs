[lyrics.1]
text = "Come, view the cross where Je -- sus died, By cru -- el hands was cru -- ci -- fied; O won -- drous tho't, how could it be That He, should die for e -- ven me?"

[lyrics.2]
text = "The sweet -- est song on mor -- tal tongue, Or earth -- ly voic -- es ev -- er sung, Is of the One of Cal -- va -- ry, Who gives to all sal -- va -- tion free."

[lyrics.3]
text = "No oth -- er One in heav'n -- ly bliss Could e'er con -- ceive a love like this; He left His home in glo -- ry there And came to earth our sins to bear."

[lyrics.chorus]
text = "A -- lone, a -- lone on Cal -- va -- ry, He bore the shame and mis -- er -- y; O won -- drous love, how could it be That He should die for e -- ven me"

