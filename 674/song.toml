[lyrics.1]
text = "Far be -- yond all earth -- ly sor -- row free from pain and strife, There’s a home of man -- y man -- sions and e -- ter -- nal life; Just be -- yond life’s flit -- ting dreams, where the heal -- ing wa -- ter gleams, There we’ll dwell with friends for -- ev -- er ’round the shin -- ing throne."

