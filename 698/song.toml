[lyrics.1]
text = "Thou hast bro -- ken all the bonds that bound me, And hast made me hap -- py pure and free, So, to help the fall -- en ones a -- round me, Man of Gal -- i -- lee de -- pend on me."

[lyrics.2]
text = "Count -- less bur -- dens dai -- ly Thou dost light -- en, Heal the sick and cause the blind to see, So, to help Thee all the world to bright -- en, Man of Gal -- i -- lee de -- pend on me."

[lyrics.3]
text = "Of sal -- va -- tion and Thy mer -- cy tell -- ing, I shall spend my earth -- ly days with Thee, Till I en -- ter Thy e -- ter -- nal dwell -- ing, Man of Gal -- i -- lee de -- pend on me."

