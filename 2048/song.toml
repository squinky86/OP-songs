[lyrics.1]
text = "Life’s ev -- ’ning sun is bend -- ing low, Far down the west -- ern slope; Yet in the twi -- light, calm, se -- rene, A -- bides the Star of Hope."

[lyrics.2]
text = "Lo, ’tis to faith’s en -- light -- ened sight, The Lamb of Cal -- va -- ry; Tho’ once He died He lives a -- gain, The Star of Hope for me."

[lyrics.3]
