[lyrics.1]
text = "I’m a pil -- grim and I’m a stran -- ger; I can tar -- ry, I can tar -- ry but a night. Do not de -- tain me, for I am go -- ing To where the foun -- tains are ev -- er flow -- ing."

[lyrics.2]
text = "Of that cit -- y to which I jour -- ney, My Re -- deem -- er my Re -- deem -- er is the light. There is no sor -- row nor an -- y sigh -- ing, Nor an -- y tears there, nor an -- y dy -- ing."

[lyrics.3]
text = "There the sun -- beams are ev -- er shin -- ing, O my long -- ing heart, my long -- ing heart is there. Here in this coun -- try, so dark and drear -- y, I long have wan -- dered, for -- lorn and wear -- y."

[lyrics.chorus]
text = "I’m a pil -- grim, and I’m a stran -- ger; I can tar -- ry, I can tar -- ry but a night."
