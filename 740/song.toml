[lyrics.1]
text = "There is much to do, there’s work on ev -- ’ry hand, Hark! the cry for help comes ring -- ing thro’ the land; Je -- sus calls for reap -- ers, I must ac -- tive be, What wilt Thou, O Mas -- ter? Here am I, send me."

[lyrics.2]
text = "There’s the plain -- tive cry of mourn -- ing souls dis -- tressed, And the sigh of hearts who seek but find no rest; These should have my love and ten -- der sym -- pa -- thy, Read -- y at Thy bid -- ding, Here am I, send me."

[lyrics.3]
text = "There are hung’ -- ring souls who cry a -- loud for bread, With the bread of life they’re long -- ing to be fed; Shall they starve and fam -- ish while a feast is free? I must be more faith -- ful, Here am I, send me."

[lyrics.4]
text = "There are souls who lin -- ger on the brink of woe, Lord, I must not, can not bear to let them go; Let me go and tell them, broth -- er, turn and flee, Mas -- ter, I would save them, Here am I, send me."

[lyrics.chorus]
text = "Here am I, send me, Lord, send me, Here am I, send me, Lord, send me, Here am I, send me, Lord, send me, Read -- y at Thy bid -- ding, Lord, send me."
