[lyrics.1]
text = "Ho -- ly Fa -- ther, cheer our way With Thy love’s per -- pet -- ual ray: Grant us ev -- ’ry clos -- ing day Light at eve -- ning- -- time."

[lyrics.2]
text = "Ho -- ly Sav -- iour, calm our fears When earth’s bright -- ness dis -- ap -- pears: Grant us in our la -- ter years Light at eve -- ning- -- time."

[lyrics.3]
text = "Ho -- ly Spir -- it be Thou nigh When in mor -- tal pains we lie; Grant us, as we come to die, Light at eve -- ning- -- time."

[lyrics.4]
text = "Ho -- ly, bless -- ed Trin -- i -- ty, Dark -- ness is not dark to Thee: Those Thou keep -- est al -- ways see Light at eve -- ning- -- time."

