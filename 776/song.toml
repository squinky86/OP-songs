des''4 c''4 bes'4 aes'4 g'4 f'4 | ees'4 c'4 des'4 ees'2( aes'4) | g'4 f'4 g'4 bes'4 aes'4 f'4 | ees'2.~ ees'2! r4 |
c''2.~@c c''4 bes'4 aes'4 | bes'4 aes'4 f'4 g'2. | des''2.~ des''4 c''4 bes'4 | aes'4 g'4 f'4 ees'2. |
