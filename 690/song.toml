# Source: Tidings of Joy (1928) #65, page scan (TJ1928 p66, lower half); lyrics
# transcribed from that scan. Plate: "Copyright, 1923, by Quartet Music Co., in
# 'Searchlight Songs.' Owned and controlled by J. W. Ferrill." Words credited
# "J. W. F.", music J. W. Ferrill (hymnary lists J. W. Ferrill as author, 1923).
# Seven-shape plate; shapes agreed with staff position throughout.
# Tempo: none printed; 96 is a guess.
# Form, written out in performance order: line 1 (M1-5) -> segno strain (M5-9,
# each stanza's own line 2, ends at the plate's Fine) -> Refrain (M9-13) ->
# D.S. back to the segno strain with the plate's "D.S." row, which is the same
# in every stanza ("If your faith grows weak turn the searchlight on, And follow
# the bloodstained trail.") -> Fine (M17). Hence an ordinary chorus with @c.
# The plate ties the two beat-4 eighths in M3 and M6; stanzas split them
# differently (v3 "When He", v1 "He has"), so they are dashed slurs with `_`.
# The plate also prints an arc over the tenor's pickup into the segno strain
# (two syllables); ignored.
# Refrain echo: the plate's second refrain row "Savior's bloodstain trail," is
# sung by alto, tenor and bass (they move in quarters under the soprano's held
# "trail"), so those three parts have chorus overrides.
# Plate readings kept: "bloodstain trail" in the refrain vs "bloodstained" in
# the stanzas; v3 "I've follow the bloodstained trail" (probably a misprint for
# "followed", kept as printed).
title = "The Blood-Stained Trail"
copyrights = [
  "Lyrics and Music: J. W. Ferrill, 1923 (public domain)",
  "Arrangement by OpenPsalm, 2026 and released under the CC-BY 4.0 license",
]
key_signature = "Ab"
time_sig_numerator = 4
time_sig_denominator = 4
tempo_bpm = 96
verse_count = 3
phrase_breaks = ["5:48", "9:48", "13:48"]
