[lyrics.1]
text = "More like the Mas -- ter I would ev -- er be, More of His meek -- ness, more hu -- mil -- i -- ty; More zeal to la -- bor, more cour -- age to be true, More con -- se -- cra -- tion for work He bids me do."

[lyrics.2]
text = "More like the Mas -- ter is my dai -- ly prayer; More strength to car -- ry cross -- es I must bear; More ear -- nest ef -- fort to bring His king -- dom in; More of His Spir -- it, the wan -- der -- er to win."

[lyrics.3]
text = "More like the Mas -- ter I would live and grow; More of His love to o -- thers I would show; More self de -- ni -- al, like His in Ga -- li -- lee, More like the Mas -- ter I long to ev -- er be."

[lyrics.chorus]
text = "Take my heart, O take my heart, I would be Thine a -- lone; Take my heart, O take my heart and make it all Thine own; Purge Thou me from ev -- 'ry sin, O Lord, I now im -- plore, Wash and keep, O wash and keep me Thine for -- ev -- er more."
