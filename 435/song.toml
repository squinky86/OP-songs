[lyrics.1]
text = "I’ve found my Lord, and He is mine, He won me by His love; I’ll serve Him all my years of time, And dwell with Him a -- bove."

[lyrics.2]
text = "No oth -- er Lord but Christ I know; I walk with Him a -- lone; His streams of love for -- ev -- er flow With -- in my heart, His throne."

[lyrics.3]
text = "He’s dear -- er to my heart than life, He found me lost in sin; He calmed the sea of in -- ward strife, And bid me come to Him."

[lyrics.4]
text = "My flesh re -- coiled be -- fore the cross, And Sa -- tan whis -- pered there, “Thy gain will not re -- pay the loss, His yoke is hard to bear.”"

[lyrics.5]
text = "I’ve tried the road of sin and found Its pros -- pects all de -- ceive; I’ve proved the Lord, and joys a -- bound, More than I could be -- lieve."

[lyrics.chorus]
text = "His yoke is ea -- sy, His bur -- den is light; I’ve found it so, I’ve found it so; His serv -- ice is my sweet -- est de -- light, His bless -- ings ev -- er flow."
