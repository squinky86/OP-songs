# Source: Christian Hymns (1889), No. 266 "By and By", page 265 of the book
# (hymnary CH1889a page image 263). Notes and all four stanzas read from that
# plate scan. Credits on the plate: words "W. T. D.", music "Rev. W. T. Dale";
# "W. T. D." is probably Dale himself, but the plate prints only initials, so the
# Lyrics line keeps them. Footer: From "Last Words; or Spirit Whispers," by per.
# No copyright line on the plate; 1889 (this book) is the earliest year in hand.
# Closed-score SATB, homophonic throughout: the "By and by, by and by" echo is
# sung by all four parts together, so global lyrics serve every part.
# Form: four lines, pickup + 4 bars each, lines 1, 2 and 4 share the same music.
# Line 3 (B strain): tenor and bass sit in unison on G3 on most notes, as printed.
# Metrical elision kept from the plate: heav’n-ly (st. 3).
# Tempo: not printed; 100 bpm is a guess.
title = "By and By"
copyrights = [
  "Lyrics and Music: W. T. Dale, 1889 (public domain)",
  "Arrangement by OpenPsalm, 2026 and released under the CC-BY 4.0 license",
]
key_signature = "G"
time_sig_numerator = 3
time_sig_denominator = 4
tempo_bpm = 100
verse_count = 4
phrase_breaks = ["5:32", "9:32", "13:32"]
optional_phrase_breaks = ["3:32", "7:32", "11:32", "15:32"]

