[lyrics.1]
text = "Dear Lord, take up our tan -- gled strands, Where we have wrought in vain, That by the skill of Thy dear hands Some beau -- ty may re -- main."

[lyrics.2]
text = "Touch Thou the sad, dis -- cord -- ant keys Of ev -- ’ry trou -- bled breast, And change to peace -- ful har -- mo -- nies The sigh -- ings of un -- rest."

[lyrics.3]
text = "Where brok -- en vows in frag -- ments lie— The toil of wast -- ed years— Do Thou make whole a -- gain, we cry, And give a song for tears."

[lyrics.4]
text = "Take all the fail -- ures, each mis -- take Of our poor hu -- man ways, Then, Sav -- ior, for Thine own dear sake, Make them show forth Thy praise."

[lyrics.chorus]
text = "Trans -- formed by grace di -- vine, The glo -- ry shall be Thine; To Thy most ho -- ly will, O Lord, We now our all re -- sign."
