[lyrics.1]
text = "In vain in high and ho -- ly lays, My soul her grate -- ful voice would raise; For who can sing the wor -- thy praise Of the won -- der -- ful love of Je -- sus!"

[lyrics.2]
text = "A joy by day, a peace by night; In storms a calm, in dark -- ness light; In pain a balm, in weak -- ness might, Is the won -- der -- ful love of Je -- sus."

[lyrics.3]
text = "My hope for par -- don when I call, My trust for lift -- ing when I fall; In life, in death, my all in all, Is the won -- der -- ful love of Je -- sus."

[lyrics.chorus]
text = "Won -- der -- ful love! won -- der -- ful love! Won -- der -- ful love of Je -- sus! Won -- der -- ful love! won -- der -- ful love! Won -- der -- ful love of Je -- sus!"
