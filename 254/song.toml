[lyrics.1]
text = "All hail, Thou Son of Da -- vid, Re -- deem -- er of the world! We stand be -- neath Thy ban -- ner That nev -- er shall be furled. All hail! with joy we greet Thee, And loud ho -- san -- nas sing; We wave our palms be -- fore Thee, And cry, \"All hail, O King!\""

[lyrics.2]
text = "Ho -- san -- na in the high -- est To Thee, Thou Ho -- ly One! All hail the Lord's a -- noint -- ed, Great Da -- vid's great -- er Son. Ride on, ride on in tri -- umph! Thy name, Thy praise we sing; Ho -- san -- na in the high -- est, Ho -- san -- na to our King!"

[lyrics.3]
text = "Ho -- san -- na, sing the chil -- dren; Ho -- san -- na, earth re -- plies; The world with song is vi -- brant— It ech -- oes thro' the skies. For ev -- er and for -- ev -- er, In earth and heav'n a -- bove, Our song shall be \"Ho -- san -- na To Thee, O King of Love.\""

[lyrics.chorus]
text = "Ho -- san -- na, ho -- san -- na, Ho -- san -- na to the Lord! Ho -- san -- na, ho -- san -- na, Ho -- san -- na to the King."

[lyrics.coda]
text = "Ho -- san -- na, ho -- san -- na, ho -- san -- na in the high -- est."
