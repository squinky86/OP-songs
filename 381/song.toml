[lyrics.1]
text = "A -- way in a man -- ger, no crib for a bed, The lit -- tle Lord Je -- sus laid down His sweet head. The stars in the sky _ looked down where He lay, The lit -- tle Lord Je -- sus, a -- sleep on the hay."

[lyrics.2]
text = "The cat -- tle are low -- ing, the Ba -- by a -- wakes, But lit -- tle Lord Je -- sus, no cry -- ing He makes; I love Thee, Lord Je -- sus, look down from the sky And stay by my cra -- dle till morn -- ing is nigh."

[lyrics.3]
