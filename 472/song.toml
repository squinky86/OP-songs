[lyrics.1]
text = "Is there heav -- y weight of care, In thy bo -- som an -- y -- where, And you need a friend to sym -- pa -- thize with you? Go to Je -- sus with it all, And for com -- fort on Him call, He will give you such, as oth -- ers can -- not do!"

[lyrics.2]
text = "In thy trou -- ble He is near, Oh, my broth -- er, do not fear, Ask of Him the bur -- den there to roll a -- way, That His Spir -- it en -- ter in, And its might -- y work be -- gin, And thy soul will have a hap -- py, hap -- py day!"

[lyrics.3]
text = "You can touch Him with your cry, And He'll nev -- er pass you by, For He feels the depths of all thy spir -- it's woe, He has trav -- eled sor -- row's road And has car -- ried of its load, And He'll car -- ry thine, my broth -- er, to Him go!"

[lyrics.4]
text = "When, Him trust -- ing, you have tried, You'll be ful -- ly sat -- is -- fied, That there is no oth -- er friend like this dear one, He such bless -- ing will im -- part, As will glad -- den all thy heart, Go to Him if you would have it sure -- ly done!"

[lyrics.chorus]
text = "Go to Je -- sus with it all! Go to Je -- sus with it all! He's the help -- er that you need, He's a com -- fort -- er in -- deed! Go to Je -- sus with it all, with it all!"
