[lyrics.1]
text = "Lift up, lift up thy voice with sing -- ing, Dear land, with strength lift up thy voice! The king -- doms of the earth are bring -- ing Their trea -- sures to thy gates— Re -- joice!"

[lyrics.2]
text = "And shall His flock with strife be riv -- en? Shall en -- vious lines His church di -- vide, When He, the Lord of earth and Heav -- en, Stands at the door to claim His bride?"

[lyrics.3]
text = "Lift up thy gates! Bring forth ob -- la -- tions! One crowned with crowns a mes -- sage brings: His Word, a sword to smite the na -- tions; His Name— The Christ, the King of kings."

[lyrics.4]
text = "He comes! Let all the earth a -- dore Him; The path His hu -- man na -- ture trod Spreads to a roy -- al realm be -- fore Him, The Life of life, The Word of God!"

[lyrics.chorus]
text = "A -- rise and shine in youth im -- mor -- tal, Thy Light is come, thy King ap -- pears! Be -- yond the cen -- t'ry's swing -- ing por -- tal, Breaks a new dawn— the thou -- sand years."

