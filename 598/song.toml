[lyrics.1]
text = "The time has come when we must part, We hope to meet a -- gain. To sing our songs of joy and praise, While we on earth re -- main."

[lyrics.2]
text = "But if no more while here we meet, Let each re -- solve in heart, That he to that bright home shall come, Where we shall nev -- er part."

[lyrics.3]
text = "’Tis there we’ll meet with friends so dear, Who’ve passed be -- yond the sea, We’ll safe -- ly dwell with Christ our Lord, And with Him ev -- er be."

[lyrics.4]
text = "For ev -- er -- more we’ll sing His praise, On that bright hap -- py shore, In one u -- nit -- ed voice of song, And part no nev -- er more."
