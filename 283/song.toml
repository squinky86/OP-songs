[lyrics.1]
text = "Love o -- pened wide the door for me, The door that leads to God; The hand of Je -- sus turned the key, And marked that door with blood."

[lyrics.2]
text = "Love o -- pened wide the door for me, The door to par -- d'ning grace, And clothed my soul with right -- eous -- ness, To stand be -- fore His face."

[lyrics.3]
text = "Love o -- pened wide the door for me, The door that leads to rest, My troub -- led soul found sweet re -- lief From bur -- dens that op -- pressed."

[lyrics.4]
text = "Love o -- pened wide the door for me, The door that leads to pow'r, My weak -- ness changed to glo -- rious strength, In -- creas -- ing hour by hour."

[lyrics.chorus]
text = "Love o -- pened wide the door for me, Re -- stored my soul, and set me free; His life He free -- ly gave, my life to save, 'Twas Love that o -- pened wide the door for me."
