text = "Ev -- 'ry -- bod -- y will be hap -- py o -- ver there, o -- ver there, will be hap -- py o -- ver there, We will shout and sing His prais -- es thro’ the nev -- er end -- ing ag -- es, Ev -- 'ry -- bod -- y will be hap -- py o -- ver there."

