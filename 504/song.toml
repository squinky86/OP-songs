[lyrics.1]
text = "Simp -- ly trust -- ing ev -- ery day, Trust -- ing through a storm -- y way; E -- ven when my faith is small, Trust -- ing Je -- sus, that is all."

[lyrics.2]
text = "Bright -- ly does His Spir -- it shine In -- to this poor heart of mine; While He leads I can -- not fall; Trust -- ing Je -- sus, that is all."

[lyrics.3]
text = "Sing -- ing if my way is clear, Pray -- ing if the path be drear; If in dan -- ger for Him call; Trust -- ing Je -- sus, that is all."

[lyrics.4]
text = "Trust -- ing Him while life shall last, Trust -- ing Him till earth be past; Till with -- in the jas -- per wall, Trust -- ing Je -- sus, that is all."

[lyrics.chorus]
text = "Trust -- ing as the mo -- ments fly, Trust -- ing as the days go by; Trust -- ing Him what -- e'er be -- fall, Trust -- ing Je -- sus, that is all."
