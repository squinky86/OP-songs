[lyrics.1]
text = "In the Christ -- ian’s home in glo -- ry There re -- mains a land of rest; There my Sav -- ior’s gone be -- fore me, To ful -- fill my soul’s re -- quest."

[lyrics.2]
text = "He is fit -- ting up my man -- sion, Which e -- ter -- nal -- ly shall stand; For my stay shall not be tran -- sient In that ho -- ly, hap -- py land."

[lyrics.3]
text = "Death it -- self shall then be van -- quished, And its sting shall be with -- drawn: Shout for glad -- ness, O ye ran -- somed; Hail with joy the ris -- ing morn."

[lyrics.chorus]
text = "There is rest for the wear -- y, There is rest for the wear -- y, There is rest for the wear -- y, There is rest for you. On the oth -- er side of Jor -- dan, In the sweet fields of E -- den, Where the tree of life is bloom -- ing, There is rest for you."
