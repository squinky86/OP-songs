[lyrics.1]
text = "It mat -- ters not where Je -- sus calls me To serve Him here be -- low, Tho’ it may be where count -- less dan -- gers Are lurk -- ing, yet, I’ll go; For Him, I’ll give my all, (my all,) On me He may re -- ly, (re -- ly,) Wher -- ev -- er du -- ty here may call, I will an -- swer, here am I."

[parts.Soprano.lyrics.1]
text = "It mat -- ters not where Je -- sus calls me To serve Him here be -- low, Tho’ it may be where count -- less dan -- gers Are lurk -- ing, yet, I’ll go; For Him, I’ll give my all, On me He may re -- ly, Wher -- ev -- er du -- ty here may call, I will an -- swer, here am I."

[lyrics.2]
text = "Tho’ it may be on moun -- tain drear -- y, Or des -- ert’s burn -- ing sand, With will -- ing hand I’ll help in spread -- ing The gos -- pel thro’ the land; What -- e’er the task may be, (may be,) That to my lot may fall, (may fall,) I’ll trust in Him who cares for me, And go for -- ward at His call."

[parts.Soprano.lyrics.2]
text = "Tho’ it may be on moun -- tain drear -- y, Or des -- ert’s burn -- ing sand, With will -- ing hand I’ll help in spread -- ing The gos -- pel thro’ the land; What -- e’er the task may be, That to my lot may fall, I’ll trust in Him who cares for me, And go for -- ward at His call."

[lyrics.3]
text = "There may be some -- one sick or hun -- gry, Yes, ev -- en near my door, Who needs the help that I am a -- ble To give from out my store; To light -- en grief or woe, (or woe,) Or bur -- dens which they bear, (they bear,) In Je -- sus’ name, I’ll glad -- ly go, An -- y -- time, and an -- y -- where!"

[parts.Soprano.lyrics.3]
text = "There may be some -- one sick or hun -- gry, Yes, ev -- en near my door, Who needs the help that I am a -- ble To give from out my store; To light -- en grief or woe, Or bur -- dens which they bear, In Je -- sus’ name, I’ll glad -- ly go, An -- y -- time, and an -- y -- where!"

[lyrics.chorus]
text = "I’ll go wher -- ev -- er He needs me, To serve, be it night yes, night or day, I’ll fol -- low on where He leads me, His lov -- ing voice I will o -- bey: What -- e’er He bids me to do here, That oth -- ers His grace His grace may know, To du -- ty’s call I will be true, Where He needs me I will go."

[parts.Soprano.lyrics.chorus]
text = "I’ll go wher -- ev -- er He needs me, To serve, be it night or day, I’ll fol -- low on where He leads me, His lov -- ing voice o -- bey: What -- e’er He bids me to do here, That oth -- ers His grace may know, To du -- ty’s call I will be true, Where He needs me I will go."
