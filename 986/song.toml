[lyrics.1]
text = "The sun de -- clines o’er land and sea Creeps on the night; The twin -- kling stars come one by one To shed their light; With Thee there is no dark -- ness, Lord: With us a -- bide; And ’neath Thy wings we rest se -- cure This e -- ven -- tide."

[lyrics.2]
text = "And when with morn -- ing light we rise, Kept by Thy care, We’ll lift to Thee, with grate -- ful hearts, Our morn -- ing pray’r. Be Thou thro’ life our Strength and Stay, Our Guard and Guide To that dear home where there will be No e -- ven -- tide."

[lyrics.coda]
text = "A -- men."
