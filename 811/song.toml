[lyrics.1]
text = "An -- oth -- er week with all its cares hath flown, An -- oth -- er day of rest and peace is here; Sweet day on which our wea -- ried hearts are drawn In ho -- ly fel -- low -- ship to Je -- sus near."

[lyrics.2]
text = "Je -- sus, our great High Priest, our Sac -- ri -- fice, Our Pass -- o -- ver, rich gift of love di -- vine! With Thee we would in -- to the ho -- liest rise, Com -- mun -- ing with Thee in the bread and wine."

[lyrics.3]
text = "O what a feast in -- ef -- fa -- ble is this, Thy ta -- ble spread with more than an -- gels’ food! An -- gels the high -- est nev -- er taste the bliss, The dear com -- mun -- ion of Thy flesh and blood."

[lyrics.4]
text = "May we as ser -- vants joy to do Thy will, As sons the hon -- or of Thy house main -- tain, As sol -- diers stand pre -- pared for con -- flict still, And count all suff’ -- ring, borne for Thee, as gain."
