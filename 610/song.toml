[lyrics.1]
text = "O land of rest, for thee I sigh! When will the mo -- ment come When I shall lay my ar -- mor by And dwell in peace at home?"

[lyrics.2]
text = "No tran -- quil joys on earth I know, No peace -- ful, shelt’ -- ring dome; This world’s a wild -- er -- ness of woe, This world is not my home."

[lyrics.3]
text = "To Je -- sus Christ I fled for rest; He bade me cease to roam, And lean for com -- fort on His breast Till He con -- duct me home."

[lyrics.4]
text = "I sought at once my Sav -- ior’s side; No more my steps shall roam. With Him I’ll brave death’s chill -- ing tide And reach my heav’n -- ly home."

[lyrics.chorus]
text = "We’ll work till Je -- sus comes, We’ll work till Je -- sus comes, We’ll work till Je -- sus comes, And we’ll be gath -- ered home."
