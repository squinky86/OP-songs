[lyrics.1]
text = "I can hear my Sav -- ior call -- ing, I can hear my Sav -- ior call -- ing, I can hear my Sav -- ior call -- ing, “Take thy cross and fol -- low, fol -- low Me.”"

[lyrics.2]
text = "I’ll go with Him through the gar -- den, I’ll go with Him through the gar -- den, I’ll go with Him through the gar -- den, I’ll go with Him, with Him all the way."

[lyrics.3]
text = "I’ll go with Him through the judg -- ment, I’ll go with Him through the judg -- ment, I’ll go with Him through the judg -- ment, I’ll go with Him, with Him all the way."

[lyrics.4]
text = "He will give me grace and glo -- ry, He will give me grace and glo -- ry, He will give me grace and glo -- ry, And go with me, with me all the way."

