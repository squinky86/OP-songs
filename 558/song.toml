[lyrics.1]
text = "I’m lean -- ing on Je -- sus, my dear -- est friend, With Him my guide I’m tru -- ly blest, I’m weak, but He will con -- de -- scend To give sup -- port and rest."

[lyrics.2]
text = "I’m lean -- ing on Je -- sus, with child- -- like faith, To Him the fu -- ture I con -- fide; Each step of life’s un -- trod -- den path, His love shall sweet -- ly guide."

[lyrics.3]
text = "I’m lean -- ing on Je -- sus, tho’ faint and weak, His lov -- ing voice sa -- lutes my ear, His heav’n -- ly ac -- cents com -- fort speak, I have no cause to fear."

[lyrics.4]
text = "I’m lean -- ing on Je -- sus, no dread a -- larms, Al -- though I stand on death’s cold brink, I’ll feel His ev -- er -- last -- ing arms, I will not, can -- not sink."

[lyrics.chorus]
text = "O He sweet -- ly sup -- ports me, While on His bo -- som I’m lean -- ing, He’ll bear me o -- ver the sea of life, And bring me safe -- ly home."
