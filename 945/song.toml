[lyrics.1]
text = "On -- ward, Chris -- tian, though the re -- gion Where thou art be drear and lone; God has set a guard -- ian le -- gion Ver -- y near thee: press thou on. Lis -- ten, Chris -- tian! their ho -- san -- na Roll -- eth o’er thee: “God is Love;” Write up -- on Thy red- -- cross ban -- ner, “Up -- ward ev -- er; heav’n’s a -- bove.”"

[lyrics.2]
text = "By the thorn- -- road, and none oth -- er, Is the mount of vi -- sion won; Tread it with -- out shrink -- ing, broth -- er— Je -- sus trod it— press thou on. By thy trust -- ful, calm en -- deav -- or, Guid -- ing, cheer -- ing, like the sun, Earth- -- bound hearts thou shalt de -- liv -- er; O, for their sake press thou on!"
