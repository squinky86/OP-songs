[lyrics.1]
text = "Christ is mak -- ing sin -- ners free, full sal -- va -- tion giv -- ing, Who -- so -- ev -- er will may come, none He will re -- fuse; There -- fore, that the lost may know and with Christ be -- liev -- ing, All the way, ev -- ’ry day, tell and sing the news."

