[lyrics.1]
text = "More love to Thee, O Christ, More love to Thee! Hear Thou the prayer I make On bend -- ed knee; This is my ear -- nest plea: More love, O Christ, to Thee; More love to Thee, More love to Thee!"

[lyrics.2]
text = "Once earth -- ly joy I craved, Sought peace and rest; Now Thee a -- lone I seek, Give what is best; This all my prayer shall be: More love, O Christ, to Thee; More love to Thee, More love to Thee!"

[lyrics.3]
text = "Let sor -- row do its work, Come grief or pain; Sweet are Thy mes -- sen -- gers, Sweet their re -- frain; When they can sing with me: More love, O Christ, to Thee; More love to Thee, More love to Thee!"

[lyrics.4]
text = "Then shall my lat -- est breath Whis -- per Thy praise; This be the part -- ing cry My heart shall raise; This still its prayer shall be: More love, O Christ, to Thee; More love to Thee, More love to Thee!"

