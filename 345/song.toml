text = "Love thy -- self last. The vast -- ness -- es a -- bove thee Are filled with spir -- it for -- ces, strong and pure; And fer -- vent -- ly these faith -- ful friends shall love thee, Keep thy watch o -- ver oth -- ers, and en -- dure."

