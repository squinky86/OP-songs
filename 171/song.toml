text = "More ho -- li -- ness give me, more striv -- ings with -- in, More pa -- tience in suf -- fering, more sor -- row for sin. More faith in my Sav -- ior, more sense of His care. More joy in His ser -- vice, more pur -- pose in prayer. _"

[lyrics.2]
