[lyrics.1]
text = "Je -- sus my Sav -- ior prom -- ised that He, there, would be with me, When I am called the shad -- owed vale of death to pass through! And I am ful -- ly trust -- ing Him for this, the ful -- fil -- ing, Yes, I be -- lieve that He to it will ev -- er be true!"

[lyrics.2]
text = "Count I, the wealth of earth as dross, to have the as -- sur -- ance.— Thro’ the sweet prom -- ise, that He’ll nev -- er leave me a -- lone! That, in this tri -- al, when all earth -- ly friends can but fail me, Dear -- er than all, the hope, I there, shall claim as my own!"

[lyrics.3]
text = "I am con -- fid -- ing, ev -- er, in His glo -- ri -- ous prom -- ise, Wait -- ing the mo -- ment when the scene, my spir -- it shall view! Trust -- ing the hand of Him, my Lord, to reach and to save me, Bid -- ding my soul, the waves, to pass, all hap -- pi -- ly through!"

[lyrics.chorus]
text = "Yes, I be -- lieve that He’ll be there, and too, will go with me! Calm -- ing the waves that would with -- out Him o -- ver me roll! Yes, I be -- lieve that He’ll be there, and too, will go with me! And, in the cross -- ing, He will speak sweet peace to my soul!"
