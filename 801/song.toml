[lyrics.1]
text = "Make me, O Lord, by grace di -- vine, A burn -- ing and a shin -- ing light; For Thee to live, for Thee to shine, A burn -- ing and a shin -- ing light."

[lyrics.2]
text = "Lord, kin -- dle in my heart the flame, A burn -- ing and a shin -- ing light; To mag -- ni -- fy Thy sav -- ing name, A burn -- ing and a shin -- ing light."

[lyrics.3]
text = "O dai -- ly feed the flame a -- new, A burn -- ing and a shin -- ing light; That I may ren -- der serv -- ice true, A burn -- ing and a shin -- ing light."

[lyrics.4]
text = "To bright -- en path -- ways as I go, A burn -- ing and a shin -- ing light; To shed a -- round love’s cheer -- y glow, A burn -- ing and a shin -- ing light."

[lyrics.chorus]
text = "Burn -- ing, burn -- ing with the fire of love; Shin -- ing, shin -- ing for the King a -- bove; By grace di -- vine, O keep me Thine! A burn -- ing and a shin -- ing light."

[parts.Alto.lyrics.chorus]
text = "Burn -- ing, with the fire of love; Shin -- ing​ for the King a -- bove; By grace di -- vine, O keep me Thine! A burn -- ing and a shin -- ing light."

[parts.Tenor.lyrics.chorus]
text = "Burn -- ing, ev -- er burn -- ing with the fire of love; Shin -- ing, ev -- er shin -- ing for the King a -- bove; By grace di -- vine, O keep me Thine! A burn -- ing and a shin -- ing light."

