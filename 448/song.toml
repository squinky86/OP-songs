[lyrics.1]
text = "Lord, I care not for rich -- es, Ne -- ither sil -- ver nor gold; I would make sure of Hea -- ven, I would en -- ter the fold. In the book of Thy king -- dom, With its pag -- es so fair, Tell me, Je -- sus, my Sav -- ior, Is my name wri -- ten there?"

[lyrics.2]
text = "Lord, my sins they are ma -- ny, Like the sands of the sea, But Thy blood, O my Sav -- ior, Is suf -- fi -- cient for me; For Thy prom -- ise is writ -- ten, In bright let -- ters that glow, “Though your sins be as scar -- let, I will make them like snow.”"

[lyrics.3]
text = "Oh! that beau -- ti -- ful ci -- ty, With its man -- sions of light, With its glor -- i -- fied be -- ings, In pure gar -- ments of white; Where no e -- vil thing com -- eth To de -- spoil what is fair; Where the an -- gels are watch -- ing, Yes, my name’s writ -- ten there."

[lyrics.chorus]
text = "Is my name writ -- ten there, On the page white and fair? In the book of Thy king -- dom, Is my name writ -- ten there?"
