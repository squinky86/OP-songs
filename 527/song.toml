[parts.Alto.lyrics.1]
text = "When the sun of your life has gone down, And the clouds in the west turn to gold, (turn to gold,) End -- less night then to you will have come, If the light has gone out in your soul."

[parts.Alto.lyrics.2]
text = "When you come to the end of the way, And life’s sto -- ry for you has been told, (has been told,) O how sad all to you will ap -- pear, If the light has gone out in your soul."

[parts.Alto.lyrics.3]
text = "When be -- fore judg -- ment’s bar you shall stand, And the deeds that have here had con -- trol, (had con -- trol,) Good and e -- vil ap -- pear, O what then, If the light has gone out in your soul?"

[parts.Alto.lyrics.chorus]
text = "O just think how in death you will feel, you will feel, With the light grow -- ing dim in your soul; O how lone -- ly ’twill be! O how still! how still! When the light has gone out of your soul."

