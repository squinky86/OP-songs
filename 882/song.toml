[lyrics.1]
text = "Je -- sus, and didst Thou leave the sky To bear our sins and woes! And didst Thou bleed and groan and die, For vile, re -- bel -- lious foes!"

[lyrics.2]
text = "Well might the skies with won -- der view A love so strange as Thine; No thought of an -- gels ev -- er knew Com -- pas -- sion so di -- vine."

[lyrics.3]
text = "Vic -- to -- rious love! can lan -- guage tell The won -- ders of Thy pow’r, Which con -- quered all the force of hell In that tre -- men -- dous hour!"

[lyrics.4]
text = "What glad re -- turn can I im -- part For fa -- vors so di -- vine? O take this heart, this worth -- less heart, And make it on -- ly Thine!"
