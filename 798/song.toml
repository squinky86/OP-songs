[lyrics.1]
text = "My heart o’er -- flows with a hap -- py song, Which with joy I sing to the need -- y throng, As with my Sav -- iour I press a -- long, For His joy is mine. I’ve found the soul’s ev -- er -- last -- ing Spring In Je -- ho -- vah’s Son, the e -- ter -- nal King, And now for -- ev -- er my heart shall sing Of His grace di -- vine."

[lyrics.2]
text = "He found me sink -- ing in dark de -- spair, And He lift -- ed me in His love -- light fair, Be -- stow -- ing com -- fort be -- yond com -- pare To this heart of mine. He hid my past and re -- stored my soul, Took my way -- ward life un -- der His con -- trol, And now I’ll sing, while the a -- ges roll, Of His grace di -- vine."

[lyrics.3]
text = "O way -- ward life, won’t you trust this Friend? On His lift -- ing love won’t you now de -- pend? He’ll keep your soul, when this life shall end, Just as He’ll keep mine. He died to save you from shame and sin, And His par -- don now you may free -- ly win, O come to -- day and a -- new be -- gin, Trust -- ing grace di -- vine."

[lyrics.chorus]
text = "’Twas grace, grace, grace di -- vine that lift -- ed me, ’Twas won -- drous grace, grace di -- vine that lift -- ed me, And now I’m liv -- ing on a high -- er plain, And His love is mine; ’Twas grace, grace, grace di -- vine and glo -- ri -- ous, ’Twas won -- drous grace, might -- y and vic -- to -- ri -- ous, That lift -- ed me, And filled my heart with praise, It was grace di -- vine."

[parts.Alto.lyrics.chorus]
text = "’Twas grace di -- vine that lift -- ed me, ’Twas grace, grace, Won -- drous grace so rich and free, that lift -- ed me, And now I’m liv -- ing on a high -- er plain, And His love is mine; ’Twas grace di -- vine and glo -- ri -- ous, ’Twas grace, grace, might -- y and vic -- to -- ri -- ous, ’Twas won -- drous grace That lift -- ed me, And filled my heart with praise, It was grace di -- vine."

