[lyrics.1]
text = "The hand that can save is reach -- ing to you, Dear sin -- ner, take hold and be free; ’Tis of -- fered in love— com -- pas -- sion so true, The hand that was nailed to the tree."

[lyrics.2]
text = "It lift -- ed my soul from dark -- ness and shame To rap -- tur -- ous glo -- ry sub -- lime, Dear sin -- ner, to you, is of -- fered the same, The hand of a Sav -- iour di -- vine."

[lyrics.3]
text = "Oh! will you be -- hold? the nail- -- prints are there, A to -- ken of won -- der -- ful love, Take hold of His hand, dear sin -- ner, and share His glo -- ry in heav -- en a -- bove."

[lyrics.chorus]
text = "Reach -- ing to you, yes, reach -- ing to you, Though weak and un -- worth -- y you’ve been, Reach -- ing to you, yes, reach -- ing to you, Take hold and be lift -- ed from sin."
