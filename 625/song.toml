[lyrics.1]
text = "My bro -- ther, a -- wake, and sing the sweet sto -- ry, Soon the day of re -- un -- ion will come; Then oh, what a won -- der -- ful sing -- ing in glo -- ry, When all re -- deemed sing -- ers get home."

[lyrics.2]
text = "No mor -- tal hath e’er con -- ceived of its beau -- ty, That a -- waits the re -- deemed ones at home; Be sure, my dear bro -- ther, you live up to du -- ty, For soon our Re -- deem -- er will come."

[lyrics.3]
text = "Keep work -- ing and sing, press on -- ward, my bro -- ther, Till the Sav -- ior shall bid you to come; How sweet it will be then to meet with each o -- ther, When all re -- deemed sing -- ers get home."

[lyrics.chorus]
text = "Then, oh, what a won -- der -- ful, won -- der -- ful sing -- ing, When all re -- deemed sing -- ers get home; Re -- un -- ion, re -- un -- ion, thro’ ag -- es still ring -- ing, When all re -- deemed sing -- ers get home."
