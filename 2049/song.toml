[lyrics.1]
text = "I have a dear Sav -- ior kind and true From Him I shall ne’er de -- part, My strength ev’ -- ry day He doth re -- new— His pict -- ure is in my heart."

[lyrics.2]
text = "While trust -- ing in Him a -- long the way What bless -- ings He doth im -- part, He fills me with joy each pass -- ing day— His pict -- ure is in my heart."

[lyrics.3]
text = "Tho’ I can -- not see His bless -- ed face He keeps me from Sa -- tan’s dart, And in -- to my soul He pours His grace,— His pict -- ure is in my heart."

[lyrics.4]
text = "To Je -- sus my soul doth now be -- long For heav -- en I’ve made a start, His won -- der -- ful love is now my song— His pict -- ure is in my heart."

[lyrics.chorus]
text = "His pict -- ure is in my heart— His pict -- ure is in my heart— When I’m lone -- ly and sad This thought makes me glad,— His pict -- ure is in my heart."

