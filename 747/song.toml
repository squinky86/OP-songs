[lyrics.1]
text = "Thro’ troub -- les and tri -- als and ills that be -- fall, As on -- ward a pil -- grim I move, Thro’ dark -- ness and sun -- shine, temp -- ta -- tions and all, I’m seek -- ing a man -- sion a -- bove."

[lyrics.2]
text = "Tho’ gloom -- y the day, and grow dark -- er the night, Strong faith in my Pi -- lot I have; I’ll trust in my Sav -- ior and fol -- low the right, While seek -- ing a man -- sion a -- bove."

[lyrics.3]
text = "Tho’ tem -- pests may rise, I’ve a ref -- uge that’s near, ’Tis Je -- sus, my Sav -- ior I love; In Him I am trust -- ing— there’s noth -- ing to fear, While seek -- ing a man -- sion a -- bove."

[lyrics.4]
text = "Af -- flic -- tions may try me, and trou -- bles may come, I’ve noth -- ing but Je -- sus to love; I’m go -- ing to glo -- ry, the Chris -- tian’s blest home— A beau -- ti -- ful man -- sion a -- bove."

[lyrics.chorus]
text = "I’m seek -- ing a man -- sion a man -- sion a -- bove, I’m seek -- ing a man -- sion a man -- sion a -- bove; I’m on my way home -- ward to glo -- ry on high— I’m seek -- ing a man -- sion a man -- sion a -- bove."

[parts.Soprano.lyrics.chorus]
