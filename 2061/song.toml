[lyrics.1]
text = "There’s a God who’s stand -- ing at _ heav -- en’s door, He’s look -- ing this u -- ni -- verse o’er; And He sees each mor -- tal with a search -- ing eye, You can’t do wrong and get by."

[lyrics.2]
text = "Out in -- to the dark -- ness you a -- lone may go, And seeds for the wick -- ed one sow; There’s an eye that’s watch -- ing from the throne on high, You can’t do wrong and get by."

[lyrics.3]
text = "Yes, He knows your se -- crets, ev -- ’ry -- thing you do, He knows that your life is un -- true; You can ne’er de -- ceive Him, there’s no use to try, You can’t do wrong and get by."

[lyrics.chorus]
text = "You can’t do wrong and get by, No mat -- ter how much you may try; Noth -- ing hid -- den can be, ev -- ’ry -- thing He doth see, You can’t do wrong and get by."
