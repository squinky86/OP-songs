[lyrics.1]
text = "O -- ver the way some soul needs you, Waits for a touch that is kind and true; Close to your door there is ill -- ness and strife; Go in God's name with the wa -- ter of life."

[lyrics.2]
text = "O -- ver the way deep shad -- ows fall; An -- swer the pit -- e -- ous, plain -- tive call; Strength -- en the soul, meet -- ing trou -- bles su -- preme; Tell of the Christ who is strong to re -- deem."

[lyrics.3]
text = "O -- ver the way some soul needs song, Fight -- ing the bat -- tle of right and wrong; Go to the wea -- ry with heart -- en -- ing aid; Car -- ry the gos -- pel of faith, un -- a -- fraid."

[lyrics.4]
text = "When it is time for God's \"Well done,\" You will be glad for the souls you've won; Oft -- en a mo -- ment, just o -- ver the way, Chang -- es un -- speak -- a -- ble dark -- ness to day."

[lyrics.chorus]
text = "Go o -- ver the way to some soul to -- day, Go, car -- ry the mes -- sage with -- out de -- lay; Go o -- ver the way where the skies are gray, And tell of the Sav -- ior's love."
