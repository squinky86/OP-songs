]
key_signature = "F"
time_sig_numerator = 4
time_sig_denominator = 4
tempo_bpm = 100
verse_count = 3
phrase_breaks = ["3:48", "5:48", "7:48", "9:48", "13:48"]
# The stanzas are written in half-lines with triple internal rhyme ("for-sake you /
# o-ver-take you / a-wake you"; "rain-ing / com-plain-ing / gain-ing"), so the three
# mid-line caesurae below are real. Each was re-checked against all three stanzas and
# lands on a word boundary in every one of them. The fourth available caesura (8:48) is
# NOT listed: it would break "will | drive the clouds away" and "help to | make the
# whole world glad".
optional_phrase_breaks = ["11:48", "15:48"]
non_breaking_phrase_breaks = ["10:64", "12:64"]

