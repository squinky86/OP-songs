[lyrics.1]
text = "My Lord has gar -- ments so won -- drous fine, And myrrh their tex -- ture fills; Its fra -- grance reached to this heart of mine,— With joy my be -- ing thrills."

[lyrics.2]
text = "His life had al -- so its sor -- rows sore, For al -- oes had a part; And when I think of the cross He bore, My eyes with tear -- drops start."

[lyrics.3]
text = "His gar -- ments too were in cas -- sia dipped, With heal -- ing in a touch; Each time my feet in some sin have slipped, He took me from its clutch."

[lyrics.4]
text = "In gar -- ments glo -- ri -- ous He will come, To o -- pen wide the door; And I shall en -- ter my heav’n -- ly home, To dwell for -- ev -- er -- more."

[lyrics.chorus]
text = "Out of the i -- vo -- ry pal -- a -- ces, In -- to a world of woe, On -- ly His great e -- ter -- nal love Made my Sav -- ior go."
