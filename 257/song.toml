[lyrics.1]
text = "I shall see the King, Where the an -- gels sing; I shall see the King some day, In the bet -- ter land, On the gold -- en strand, And with Him shall ev -- er stay."

[lyrics.2]
text = "In the land of song, In the glo -- ry- -- throng, Where there nev -- er comes a night, With my Lord once slain I shall ev -- er reign In the glo -- ry- -- land of light."

[lyrics.3]
text = "I shall see the King, All my trib -- utes bring, And shall look up -- on His face; Then my song shall be How He ran -- somed me And has kept me by His grace."

[lyrics.chorus]
text = "In His glo -- ry, I shall see the King, And for -- ev -- er end -- less prais -- es sing; ’Twas on Cal -- va -- ry Je -- sus died for me; I shall see the King some day."
