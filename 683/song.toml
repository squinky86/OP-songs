[lyrics.1]
text = "Tell the sto -- ry of the bless -- ed Sav -- ior’s love To the lost you meet a -- long the way; Let it give its glad -- ness to hearts of sad -- ness, Tell it from day to day."

[lyrics.2]
text = "There are man -- y still who won’t o -- bey His will, And their sad hearts nev -- er have a song; Tell these souls who wan -- der and tal -- ents squan -- der That they are liv -- ing wrong."

[lyrics.3]
text = "Help the Sav -- ior dear each day that you are here, La -- bor till the sun of life goes down; Tell the sweet old sto -- ry of love and glo -- ry, Win -- ning life’s bless -- ed crown."

[lyrics.chorus]
text = "Go tell the sto -- ry sweet To the lost you meet, Stay -- ing close be -- side them, To Je -- sus guide them: And the temp -- ter de -- feat, Go tell the sto -- ry now, Pay the Lord your vow; Tell the un -- be -- liev -- ing Of Je -- sus’ heal -- ing, Go tell the sto -- ry now."
