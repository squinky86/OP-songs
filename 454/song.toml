[lyrics.1]
text = "My soul was en -- wrapt in the shad -- ows of night, My path -- way was gloom -- y and lone; But Je -- sus passed by and His won -- der -- ful light A -- round me in ra -- di -- ance shone."

[lyrics.2]
text = "No long -- er I stray in sins' dark -- ness and cold, For Je -- sus is with me, I know; O how I'll re -- joice in the light of His love, When free from earth's sor -- rows be -- low."

[lyrics.3]
text = "O sin -- ner, be -- ware, 'tis a dan -- ger -- ous path, 'Twill lead you still fur -- ther a -- way; Ac -- cept His sal -- va -- tion now of -- fered to you, And night will be turned in -- to day."

