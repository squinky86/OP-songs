[lyrics.1]
text = "Earth -- ly wealth and hon -- ored fame may nev -- er come to me, And an earth -- ly pal -- ace fair, here mine may nev -- er be; But let come, let come what may, if Christ for me doth care, An -- y -- where is home, sweet home, if He is on -- ly on -- ly there."

[parts.Soprano.lyrics.1]
text = "Earth -- ly wealth and fame may nev -- er come to me, And a pal -- ace fair, here mine may nev -- er be; But let come what may, if Christ for me doth care, An -- y -- where is home, if He is on -- ly there."

[parts.Bass.lyrics.1]
text = "Earth -- ly wealth and hon -- ored fame may nev -- er come to me, And an earth -- ly pal -- ace fair, here mine may nev -- er be; But let come, let come what may, if Christ for me doth care, An -- y -- where is home, sweet home, if He is on -- ly there."

[lyrics.2]
text = "Oft I’m tossed, am tossed a -- bout and driv -- en by the foe, Sad with -- in and sad with -- out wher -- ev -- er I may go; So I press, I press a -- long, still look -- ing up in pray’r, Oh, I know ’tis home, sweet home, if Christ is on -- ly on -- ly there."

[parts.Soprano.lyrics.2]
text = "Oft I’m tossed a -- bout and driv -- en by the foe, Sad with -- in, with -- out wher -- ev -- er I may go; But I press a -- long still look -- ing up in pray’r, For its home, sweet home, if Christ is on -- ly there."

[parts.Bass.lyrics.2]
text = "Oft I’m tossed, am tossed a -- bout and driv -- en by the foe, Sad with -- in and sad with -- out wher -- ev -- er I may go; So I press, I press a -- long, still look -- ing up in pray’r, Oh, I know ’tis home, sweet home, if Christ is on -- ly there."

[lyrics.3]
text = "I will la -- bor, la -- bor on, till I am called a -- way, Till the morn at last shall dawn, of that e -- ter -- nal day; Ev -- er look -- ing un -- to Christ, who keeps me in His care, An -- y -- where is home, sweet home, if Christ, my Lord is on -- ly there."

[parts.Soprano.lyrics.3]
text = "I will la -- bor on till I am called a -- way, ’Till the morn shall dawn, of that e -- ter -- nal day; Look -- ing un -- to Him, who keeps me in His care, An -- y -- where is home, if Christ, my Lord is there."

[parts.Bass.lyrics.3]
text = "I will la -- bor, la -- bor on, till I am called a -- way, Till the morn at last shall dawn, of that e -- ter -- nal day; Ev -- er look -- ing un -- to Christ, who keeps me in His care, An -- y -- where is home, sweet home, if Christ, my Lord is there."

[lyrics.chorus]
text = "An -- y -- where is home, sweet home, Let come and go what may, An -- y -- where I chance to roam, He keeps me all the way, each day; So for my dear Mas -- ter’s sake, my cross I’ll meek -- ly bear, An -- y -- where is home, sweet home, If Christ, my Lord is on -- ly there."

[parts.Soprano.lyrics.chorus]
text = "An -- y -- where is home, Let come and go what may, An -- y -- where I roam, He keeps me all the way; So for His dear sake, my cross I’ll meek -- ly bear, An -- y -- where is home, If Christ, my Lord is there."

[parts.Bass.lyrics.chorus]
text = "An -- y -- where is home, sweet home, Let come and go what come what may, An -- y -- where I chance to roam, He keeps me all the way, each day; So for my dear Mas -- ter’s sake, my cross I’ll meek -- ly bear, An -- y -- where is home, sweet home, If Christ, my Lord is there."
