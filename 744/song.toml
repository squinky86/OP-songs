text = "My Re -- deem -- er has gone to pre -- pare Bless -- ed man -- sions of rest by and by Soon He’ll call me home to rest with the ran -- somed and the best, For it all will be glo -- ry by and by"

[parts.Bass.lyrics.1]
text = "My Re -- deem -- er has gone to pre -- pare Bless -- ed man -- sions of rest by and by (by and by,) Soon He’ll call me home to rest with the ran -- somed and the best, For it all will be glo -- ry by and by"

[lyrics.2]
text = "I’ve no trea -- sures to bind me be -- low (here be -- low,) In this land full of sor -- row and woe (here be -- low,) All my trea -- sures are a -- bove in that land of peace and love, Soon I’ll go and shall rest for -- ev -- er -- more (ev -- er -- more.)"

[parts.Soprano.lyrics.2]
text = "I’ve no trea -- sures to bind me be -- low In this land full of sor -- row and woe All my trea -- sures are a -- bove in that land of peace and love, Soon I’ll go and shall rest for -- ev -- er -- more"

[parts.Bass.lyrics.2]
text = "I’ve no trea -- sures to bind me be -- low In this land full of sor -- row and woe (here be -- low,) All my trea -- sures are a -- bove in that land of peace and love, Soon I’ll go and shall rest for -- ev -- er -- more"

[lyrics.3]
text = "I shall sing home at last by and by (by and by,) And my voice will be tuned to the lyre (heav’n -- ly lyre,) Then my songs shall ev -- er be home at rest be -- yond the sea, It will all soon be glo -- ry by and by (by and by.)"

