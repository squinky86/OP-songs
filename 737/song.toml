[lyrics.1]
text = "I was stained with -- in; I was chained to sin; But the Lord has set me free; When His love di -- vine saved this soul of mine, ’Twas the day of days for me."

[lyrics.2]
text = "When He led me out of the vale of doubt, Caused the shad -- ows all to flee; Made my heart so glad, which had long been sad, ’Twas a day of days for me."

[lyrics.3]
text = "When He turned my soul ’tward the shin -- ing goal, Told me where my rest would be; And be -- came my guide to the glo -- ry side, ’Twas a day of days for me."

[lyrics.chorus]
text = "’Twas the day of days for me, for me, ’Twas the day of days for me for me When He made me whole, and re -- freshed my soul, ’Twas a day of days for me."

[parts.Soprano.lyrics.chorus]
text = "’Twas the day of days for me, ’Twas the day of days for me When He made me whole, and re -- freshed my soul, ’Twas a day of days for me."
