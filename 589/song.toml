[lyrics.1]
text = "O the peace that fills me, ’Mid the strug -- gling throng, O the joy that thrills me, As I go a -- long; Close to Him who loves me, See -- ing oft His smile, Sure that He will faith -- ful be, I’m sing -- ing all the while."

[lyrics.2]
text = "I have been for -- giv -- en! All my sin is gone, With the King of heav -- en I am press -- ing on; Trust -- ing ev -- ’ry prom -- ise, Hap -- py ev -- ’ry day, In His light by day and night, I’m sing -- ing all the way."

[lyrics.3]
text = "Je -- sus, faith -- ful Lov -- er! All my heart is Thine, Full to run -- ning o -- ver With Thy love di -- vine; Keep me Thine for -- ev -- er, Let my faith in -- crease, Then my song, my hap -- py song, Shall nev -- er, nev -- er cease."

[lyrics.chorus]
text = "Sing -- ing all the way, Sing -- ing ev -- ’ry day, Sing -- ing with a smile, Sing -- ing all the while."
