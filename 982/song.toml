[lyrics.1]
text = "The ra -- diant morn hath passed a -- way, and spent too soon her gold -- en store: the shad -- ows of de -- part -- ing day, creep on once more."

[lyrics.2]
text = "Our life is but an au -- tumn sun, its glo -- rious noon how quick -- ly past! Lead us O Christ, our life- -- work done, safe home at last."

[lyrics.3]
text = "Where light and life and joy and peace, in un -- di -- vid -- ed em -- pire reign, and throng -- ing an -- gels nev -- er cease their death -- less strain,"

[lyrics.4]
text = "Where saints are clothed in spot -- less white, and eve -- ning shad -- ows nev -- er fall; where Thou e -- ter -- nal Light of light, art Lord of all."
