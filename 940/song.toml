[lyrics.1]
text = "On Zi -- on’s glo -- rious sum -- mit stood A nu -- m’rous host re -- deemed by blood! They hymned their King in strains di -- vine; I heard the song, and strove to join, I heard the song, and strove to join."

[lyrics.2]
text = "Here all who suf -- fered sword or flame For truth, or Je -- sus’ love -- ly name, Shout vic -- t’ry now and hail the Lamb, And bow be -- fore the great I AM, And bow be -- fore the great I AM."

[lyrics.3]
text = "While ev -- er -- last -- ing a -- ges roll, E -- ter -- nal love shall feast their soul, And scenes of bliss, for -- ev -- er new, Rise in suc -- ces -- sion to their view, Rise in suc -- ces -- sion to their view."

[lyrics.coda]
text = "Ho -- ly, ho -- ly, ho -- ly Lord, God of hosts, on high a -- dored! Who like me Thy praise should sing, O Al -- might -- y King! Ho -- ly, ho -- ly, ho -- ly Lord, God of hosts, on high a -- dored! Ho -- ly, ho -- ly, ho -- ly."

