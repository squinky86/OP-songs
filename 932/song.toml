[lyrics.1]
text = "O _ safe to the Rock that is high -- er than I, My _ soul in its con -- flicts and sor -- rows would fly; So _ sin -- ful, so wea -- ry, Thine, Thine would I be; Thou _ blest “Rock of A -- ges,” I’m hid -- ing in Thee."

[lyrics.2]
text = "In the calm of the noon -- tide, in sor -- row’s lone hour, In _ times when tempt -- a -- tions casts o’er me its pow’r; In the tem -- pest of life, on its wide, heav -- ing sea, Thou _ blest “Rock of A -- ges,” I’m hid -- ing in Thee."

[lyrics.3]
text = "How _ oft in the con -- flict, when press’d by the foe, I have fled to my Ref -- uge and breathed out my woe; How _ oft -- en when tri -- als like sea- -- bil -- lows roll, Have I hid -- den in Thee, O Thou Rock of my soul."

[lyrics.chorus]
text = "Hid -- ing in Thee, Hid -- ing in Thee; Thou blest “Rock of A -- ges,” I’m hid -- ing in Thee."
