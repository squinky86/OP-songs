[lyrics.1]
text = "O -- pen my eyes, that I may see Glimps -- es of truth Thou hast for me; Place in my hands the won -- der -- ful key That shall un -- clasp and set me free."

[lyrics.2]
text = "O -- pen my ears, that I may hear Voic -- es of truth Thou send -- est clear; And while the wave notes fall on my ear, Ev -- ery -- thing false will dis -- ap -- pear."

[lyrics.3]
text = "O -- pen my mouth, and let me bear, Glad -- ly the warm truth ev -- ery -- where; O -- pen my heart and let me pre -- pare Love with Thy child -- ren thus to share."

[lyrics.chorus]
text = "Si -- lent -- ly now I wait for Thee, Rea -- dy my God, Thy will to see, O -- pen my eyes, il -- lum -- ine me, Spir -- it di -- vine!"
