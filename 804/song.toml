[lyrics.1]
text = "My Fa -- ther is rich in hous -- es and lands, He hold -- eth the wealth of the world in His hands! Of ru -- bies and dia -- monds, of sil -- ver and gold, His _ cof -- fers are full,— He has rich -- es un -- told."

[lyrics.2]
text = "My Fa -- ther’s own Son, the Sav -- ior of men, Once wan -- dered o’er earth as the poor -- est of them; But now He is reign -- ing for -- ev -- er on high, And will give me a home in _ heav’n by and by."

[lyrics.3]
text = "I once was an out -- cast stran -- ger on earth, A sin -- ner by choice, and an al -- ien by birth! But I’ve been a -- dopt -- ed, my name’s writ -- ten down,— An _ heir to a man -- sion, a robe and a crown."

[lyrics.4]
text = "A tent or a cot -- tage, why should I care? They’re build -- ing a pal -- ace for me o -- ver there! Tho’ ex -- iled from home, _ yet still I may sing: All _ glo -- ry to God, I’m the child of a King."

[lyrics.chorus]
text = "I’m the child of a King, The child of a King! With Je -- sus, my Sav -- ior, I’m the child of a King!"
