[lyrics.1]
text = "Praise to God, im -- mor -- tal praise, For the love that crowns our days; Boun -- teous Source of ev -- ’ry joy, Let Thy praise our tongues em -- ploy."

[lyrics.2]
text = "For the bless -- ings of the field, For the stores the gar -- dens yield; For the joy which har -- vests bring Grate -- ful prais -- es now we sing."

[lyrics.3]
text = "As Thy prosp’ -- ring hand hath blest, May we give Thee of our best; And by deeds of kind -- ly love For Thy mer -- cies grate -- ful prove."
