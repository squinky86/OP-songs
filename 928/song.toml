[lyrics.1]
text = "O my soul is filled with rap -- ture As I think of God’s great love; Love that pur -- chased my re -- demp -- tion, Fit -- ted up my home a -- bove."

[lyrics.2]
text = "I was lost in sin and sor -- row, Ne’er could I have seen His face; With His own life- -- blood He bought me, Saved me by His won -- drous grace."

[lyrics.3]
text = "Can I ev -- er cease to love Him, Ev -- er cease to sound His praise? O that ev -- ’ry soul might know Him, And in -- cline to right -- eous ways."

[lyrics.chorus]
text = "Love of Je -- sus, O how pre -- cious! Love that res -- cued e -- ven me; Lord, my soul looks up in glad -- ness, And my heart sings praise to Thee."
