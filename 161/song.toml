[lyrics.1]
text = "En -- camped a -- long the hills of light, Ye Chris -- tian sol -- diers, rise, And press the bat -- tle ere the night Shall veil the glow -- ing skies. A -- gainst the foe in vales be -- low Let all our strength be hurled; Faith is the vic -- to -- ry, we know, That o -- ver -- comes the world."

[lyrics.2]
text = "His ban -- ner o -- ver us is love, Our sword the Word of God; We tread the road the saints a -- bove With shouts of tri -- umph trod. By faith, they like a whirl -- wind’s breath, Swept on o’er ev -- ery field; The faith by which they con -- quered death Is still our shin -- ing shield."

[lyrics.3]
text = "On ev -- ery hand the foe we find Drawn up in dread ar -- ray; Let tents of ease be left be -- hind, And on -- ward to the fray. Sal -- va -- tion’s hel -- met on each head, With truth all girt a -- bout, The earth shall trem -- ble ’neath our tread, And ech -- o with our shout."

[lyrics.4]
text = "To him that o -- ver -- comes the foe, White rai -- ment shall be giv’n; Be -- fore the an -- gels he shall know His name con -- fessed in heav’n. Then on -- ward from the hills of light, Our hearts with love a -- flame, We’ll van -- quish all the hosts of night, In Je -- sus’ con -- qu’ring name."

[lyrics.chorus]
text = "Faith is the vic -- to -- ry! Faith is the vic -- to -- ry! O glo -- ri -- ous vic -- to -- ry, That o -- ver -- comes the world."
