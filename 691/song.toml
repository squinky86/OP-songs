[lyrics.1]
text = "Scat -- ter the mes -- sage of Je -- sus, O -- ver the land and the sea, Help -- ing the way -- ward to love Him, Free from their fet -- ters to be; Tell of His won -- der -- ful mer -- cy, Sing of His mar -- vel -- ous grace, Scat -- ter the mes -- sage of Je -- sus O -- ver each sin- -- dark -- ened place."

[lyrics.2]
text = "Scat -- ter the mes -- sage of Je -- sus, Com -- fort and cheer to be -- stow, Sing of the joy of sal -- va -- tion, Praise it wher -- ev -- er you go; Tell of the won -- der -- ful King, Who came for the lost to a -- tone, Scat -- ter it free -- ly and glad -- ly, Mak -- ing the Bless -- ed One known."

[lyrics.3]
text = "Scat -- ter it o -- ver the val -- leys, Scat -- ter it o -- ver the plains, Prais -- ing the won -- der -- ful Sav -- ior, Who in the Glo -- ry- -- Land reigns, Till in His mer -- cy He calls us Home to His man -- sion a -- bove, Joy -- ous -- ly, lov -- ing -- ly, ev -- er Scat -- ter the mes -- sage of love."

[lyrics.chorus]
text = "Scat -- ter the mes -- sage di -- vine, Tell of the Lead -- er a -- bove; Keep -- ing His glo -- ri -- ous ban -- ner, High in the sun -- light un -- furled, Scat -- ter the mes -- sage of Je -- sus O -- ver the sin- -- dark -- ened world."

[parts.Alto.lyrics.chorus]
text = "Scat -- ter the mes -- sage, the mes -- sage di -- vine, Scat -- ter the tid -- ings of love; Tell of the Lead -- er a -- bove; Keep -- ing His glo -- ri -- ous ban -- ner, High in the sun -- light un -- furled, Scat -- ter the mes -- sage of Je -- sus O -- ver the sin- -- dark -- ened world."

[parts.Tenor.lyrics.chorus]
text = "Scat -- ter the mes -- sage, the mes -- sage di -- vine, Scat -- ter the tid -- ings of love; Tell of the Lead -- er of men, the Lead -- er and Sav -- ior a -- bove; Keep -- ing His glo -- ri -- ous ban -- ner, High in the sun -- light un -- furled, Scat -- ter the mes -- sage of Je -- sus O -- ver the sin- -- dark -- ened world."

[parts.Bass.lyrics.chorus]
text = "Scat -- ter the mes -- sage, the mes -- sage di -- vine, Scat -- ter the tid -- ings of love; (and) Tell of the Lead -- er of men, the Lead -- er and Sav -- ior a -- bove; Keep -- ing His glo -- ri -- ous ban -- ner, High in the sun -- light un -- furled, Scat -- ter the mes -- sage of Je -- sus O -- ver the sin- -- dark -- ened world."
