[lyrics.1]
text = "Al -- though our lives be filled with bliss, With floods of joy and hap -- pi -- ness, There’ll be a bright -- er world than this, Aft -- er all, aft -- er all. @s1 There’ll be a bright -- er world than this, Aft -- er all, aft -- er all."

[lyrics.2]
text = "Our earth -- ly joys shall pass a -- way, Just like the fleet -- ing of a day, But we with Christ shall live for aye, Aft -- er all, aft -- er all. @s1 But we with Christ shall live for aye, Aft -- er all, aft -- er all."

[lyrics.3]
text = "Tho’ oft in sor -- row we be cast, Trust Christ our Lord, it can not last, For in yon clime ’twill all be past, Aft -- er all, aft -- er all. @s1 For in yon clime ’twill all be past, Aft -- er all, aft -- er all."

[lyrics.4]
text = "The dark -- est night shall turn to day, And sor -- row’s clouds shall pass a -- way, With Christ we’ll live an end -- less day, Aft -- er all, aft -- er all. @s1 With Christ we’ll live an end -- less day, Aft -- er all, aft -- er all."

[lyrics.s1]
text = "Aft -- er all, aft -- er all,"

