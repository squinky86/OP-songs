[lyrics.1]
text = "Pre -- cious mem -- 'ries, un -- seen an -- gels, Sent from some -- where to my soul; How they lin -- ger, ev -- er near me, And the sa -- cred past un -- fold."

[lyrics.2]
text = "Pre -- cious fa -- ther, lov -- ing moth -- er, Fly a -- cross the lone -- ly years; And old home scenes of my child -- hood In fond mem -- o -- ry ap -- pear."

[lyrics.3]
text = "As I trav -- el on life's path -- way, Know not what the years may hold; As I pon -- der, hope grows fond -- er, Pre -- cious mem -- 'ries flood my soul."

[lyrics.chorus]
text = "Pre -- cious mem -- 'ries, how they lin -- ger, How they ev -- er flood my soul; In the still -- ness of the mid -- night, Pre -- cious, sa -- cred scenes un -- fold."
