[lyrics.1]
text = "’Tis my hap -- pi -- ness be -- low, Not to live with -- out the cross, But the Sav -- ior’s pow’r to know, Sanc -- ti -- fy -- ing ev -- ’ry loss."

[lyrics.2]
text = "Tri -- als must and will be -- fall; But, with hum -- ble faith, to see Love in -- scribed up -- on them all— This is hap -- pi -- ness to me."

[lyrics.3]
text = "Tri -- als make the prom -- ise sweet; Tri -- als give new life to prayer; Tri -- als bring me to His feet, Lay me low, and keep me there."
