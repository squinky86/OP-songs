[lyrics.1]
text = "“Must I go and emp -- ty hand -- ed,” Thus my dear Re -- deem -- er meet? Not one day of ser -- vice give Him, Lay no tro -- phy at His feet."

[lyrics.2]
text = "Not at death I shrink nor fal -- ter, For my Sav -- ior saves me now; But to meet Him emp -- ty hand -- ed, Tho’t of that now clouds my brow."

[lyrics.3]
text = "Oh, the years of sin -- ning wast -- ed, Could I but re -- call them now; I would give them to my Sav -- ior, To His will I’d glad -- ly bow."

[lyrics.4]
text = "Oh, ye saints, a -- rouse, be earn -- est, Up and work while yet ’tis day; Ere the night of death o’er -- takes thee, Strive for souls while still you may."

