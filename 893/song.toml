[lyrics.1]
text = "Let ev -- ’ry heart re -- joice and sing, Let cho -- ral an -- thems rise; Ye a -- ged men, and chil -- dren, bring To God your sac -- ri -- fice."

[lyrics.2]
text = "He bids the sun to rise and set; In heav’n His pow’r is known; And earth, sub -- dued to Him, shall yet Bow low be -- fore His throne."

[lyrics.chorus]
text = "For He is good, the Lord is good, And kind are all His ways; With songs and hon -- ors sound -- ing loud, The Lord Je -- ho -- vah praise. While the rocks and the rills, While the vales and the hills, A glo -- rious an -- them raise; Let each pro -- long the grate -- ful song, And the God of our fa -- thers praise, And the God of our fa -- thers praise."

