[lyrics.1]
text = "There’s with -- in my heart a mel -- o -- dy Je -- sus whis -- pers sweet and low, Fear not, I am with thee, peace, be still, In all of life’s ebb and flow."

[lyrics.2]
text = "All my life was wrecked by sin and strife, Dis -- cord filled my heart with pain, Je -- sus swept across the brok -- en strings, Stir -- red the slum -- bering chords a -- gain."

[lyrics.3]
text = "Feast -- ing on the rich -- es of His grace, Rest -- ing ’neath His shel -- t'ring wing, Al -- ways look -- ing on His smil -- ing face, That is why I shout and sing."

[lyrics.4]
text = "Though some -- times He leads through wa -- ters deep, Tri -- als fall a -- cross the way, Though some -- times the path seems rough and steep, See His foot -- prints all the way."

[lyrics.5]
text = "Soon He’s com -- ing back to wel -- come me, Far be -- yond the star -- ry sky; I shall wing my flight to worlds un -- known, I shall reign with Him on high."

[lyrics.chorus]
text = "Je -- sus, Je -- sus, Je -- sus, Sweet -- est name I know, Fills my ev -- ery long -- ing, Keeps me sing -- ing as I go."
