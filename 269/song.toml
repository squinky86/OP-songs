[lyrics.1]
text = "Ho -- ly Spir -- it, Light di -- vine, Shine up -- on this heart of mine; Chase the shades of night a -- way, Turn my dark -- ness in -- to day."

[lyrics.2]
text = "Ho -- ly Spir -- it, Truth di -- vine, Dawn up -- on this soul of mine; Word of God and in -- ward light, Wake my spir -- it, clear my sight."

[lyrics.3]
text = "Ho -- ly Spir -- it, Love di -- vine, Glow with -- in this heart of mine; Kin -- dle ev -- ’ry high de -- sire; Per -- ish self in Thy pure fire."

[lyrics.4]
text = "Ho -- ly Spir -- it, Joy di -- vine, Cheer this sad -- dened heart of mine; Bid my man -- y woes de -- part, Heal my wound -- ed, bleed -- ing heart."

[lyrics.5]
text = "Ho -- ly Spir -- it, Pow’r di -- vine, Dwell with -- in this heart of mine; Cast down ev -- ’ry i -- dol throne; Reign su -- preme, and reign a -- lone."
