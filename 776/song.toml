g4 aes4 bes4 c'4 bes4 g4 | aes4 ees4 ees4 aes2( c'4) | bes4 bes4 bes4 f4 f4 aes4 | g4 r4 aes4 bes2! r4 |
ees4@c f4 g4 aes4 g4 f4 | ees4 ees4 ees4 ees2. | g4 aes4 bes4 g4 aes4 bes4 | bes4 bes4 aes4 g2. |
