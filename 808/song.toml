[lyrics.1]
text = "“All things are read -- y,” come to the feast! Come, for the ta -- ble now is spread; Ye fam -- ish -- ing, ye wea -- ry, come, And thou shalt be rich -- ly fed."

[lyrics.2]
text = "“All things are read -- y,” come to the feast! Come, for the door is o -- pen wide; A place of hon -- or is re -- serv’d For you at the Mas -- ter’s side."

[lyrics.3]
text = "“All things are read -- y,” come to the feast! Come, while He waits to wel -- come thee; De -- lay not while this day is thine, To -- mor -- row may nev -- er be."

[lyrics.4]
text = "“All things are read -- y,” come to the feast! Leave ev -- ’ry care and world -- ly strife; Come, feast up -- on the love of God, And drink ev -- er -- last -- ing life."

[lyrics.chorus]
text = "Hear the in -- vi -- ta -- tion, “Who -- so -- ev -- er will,” Hear the in -- vi -- ta -- tion, “Who -- so -- ev -- er will;” Praise God for full sal -- va -- tion For “who -- so -- ev -- er will,” For “who -- so -- ev -- er will.”"

[parts.Soprano.lyrics.chorus]
