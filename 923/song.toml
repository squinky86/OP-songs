[lyrics.1]
text = "O how kind -- ly hast Thou led me, Heav’n -- ly Fa -- ther, day by day; Found my dwell -- ing, clothed and fed me, Fur -- nished friends to cheer my way! Didst Thou bless me, didst Thou chas -- ten, With Thy smile or with Thy rod, ’Twas that still my step might has -- ten Home -- ward, heav’n -- ward, to my God."

[lyrics.2]
text = "O how slow -- ly have I oft -- en Fol -- lowed where Thy hand would draw! How Thy kind -- ness failed to soft -- en! How Thy chas -- t’ning failed to awe! Make me for Thy rest more read -- y, As Thy path is lon -- ger trod; Keep me in Thy friend -- ship stead -- y, Till Thou call me home, my God."
