[lyrics.1]
text = "Je -- sus, Thy bound -- less love to me No tho’t can reach, no tongue de -- clare; O knit my thank -- ful heart to Thee, And reign with -- out a ri -- val there. Thine whol -- ly, Thine a -- lone, I’d live, My -- self to Thee en -- tire -- ly give."

[lyrics.2]
text = "O Lord! how gra -- cious is Thy sway; All fear be -- fore Thy pres -- ence flies; Care, an -- guish, sor -- row, pass a -- way Wher -- e’er Thy heal -- ing beams a -- rise. O Je -- sus! noth -- ing may I see, Noth -- ing de -- sire, a -- part from Thee."

[lyrics.3]
text = "In suf -- f’ring be Thy love my peace, In weak -- ness be Thine arm my strength; And when the storms of life shall cease, And Thou from heav’n shalt come at length, O Je -- sus! then this heart shall be For -- ev -- er sat -- is -- fied with Thee."
