[lyrics.1]
text = "We are ev -- er on -- ward drift -- ing, O’er life’s o -- cean wide; Christ will be our friend and lead -- er, To the oth -- er side. Should we spurn the prof -- fered mer -- cy, As we drift a -- long, We will miss that home e -- ter -- nal, In that land of song."

[lyrics.2]
text = "We will need a friend to guide us, O’er the rest -- less sea; As the way is rough and rug -- ged, To that land of day. We can nev -- er make the land -- ing, On the oth -- er shore. With -- out Christ, our bless -- ed Sav -- ior, Safe -- ly guides us o’er."

[lyrics.3]
text = "As we’re tossed a -- bout by break -- ers, O’er the an -- gry waves; And dark clouds ob -- struct our vi -- sion, Of the Hand that saves. Look! ’tis Je -- sus that is beck’ -- ning, Far a -- cross the foam, For He’s left a light -- ed path -- way, To that heav’n -- ly home."

[lyrics.chorus]
text = "We are drift -- ing on and on, on and on, O’er life’s o -- cean wide; Trust -- ing Je -- sus as our guide, as our guide, To life’s oth -- er side."

[parts.Soprano.lyrics.chorus]
