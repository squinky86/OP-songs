[lyrics.1]
text = "Is it for me, dear Sav -- ior, Thy glo -- ry and Thy rest, For me, so weak and sin -- ful? O shall I be so blest?"

[lyrics.2]
text = "Is it for me, Thy wel -- come, Thy gra -- cious “En -- ter in,” For me Thy “Come, ye bless -- ed,” For me so full of sin?"

[lyrics.3]
text = "O Sav -- ior, pre -- cious Sav -- ior, My heart is at Thy feet; I bless Thee, and I love Thee, And Thee I long to meet."

[lyrics.4]
text = "I’ll be with Thee for -- ev -- er, And nev -- er grieve Thee more; Dear Sav -- ior, I must praise Thee, And love Thee ev -- er -- more."

[lyrics.chorus]
text = "O Sav -- ior, my Re -- deem -- er, What can I but a -- dore, And mag -- ni -- fy and praise Thee, And love Thee ev -- er -- more?"
