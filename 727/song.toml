[lyrics.1]
text = "There’s a won -- drous sto -- ry that thrills the soul, Turn -- ing dark -- est night to day; And its end -- less glo -- ry thro’ earth shall roll, Driv -- ing sor -- rows all a -- way."

[lyrics.2]
text = "’Tis the song of glad -- ness and joy su -- preme, Of the Day Spring Bright, the dawn; O -- ver -- com -- ing sad -- ness, the joy su -- preme Shall for -- ev -- er trav -- el on."

[lyrics.3]
text = "’Tis the hope of mor -- tals in bond -- age long, And the vic -- t’ry song’s re -- frain; When we pass death’s por -- tals, with heav -- en’s throng, We shall tell it o’er a -- gain."

[lyrics.chorus]
text = "It is sweet -- er, yes, ’tis sweet -- er ev -- ’ry time ’tis told, And the an -- gels, ho -- ly an -- gels sing the theme a -- bove; Oh, the mes -- sage, won -- drous mes -- sage nev -- er will grow old; ’Tis the sto -- ry of re -- deem -- ing love."

[parts.Soprano.lyrics.chorus]
text = "It is sweet -- er, sweet -- er ev -- ’ry time ’tis told, And the an -- gels, an -- gels sing the theme a -- bove; Oh, the mes -- sage, mes -- sage nev -- er will grow old; ’Tis the sto -- ry of re -- deem -- ing love."
