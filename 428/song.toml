[lyrics.1]
text = "O Love that wilt not let me go, I rest my wea -- ry soul in Thee; I give Thee back the life I owe, That in Thine o -- cean depths its flow May rich -- er, full -- er be."

[lyrics.2]
text = "O Light that fol -- low’st all my way, I yield my flick -- ’ring torch to Thee; My heart re -- stores its bor -- rowed ray, That in Thy sun -- shine’s blaze its day May bright -- er, fair -- er be."

[lyrics.3]
text = "O Joy that seek -- est me through pain, I can -- not close my heart to Thee; I trace the rain -- bow through the rain, And feel the prom -- ise is not vain, That morn shall tear -- less be."

[lyrics.4]
text = "O Cross that lift -- est up my head, I dare not ask to fly from Thee; I lay in dust life’s glo -- ry dead, And from the ground there blos -- soms red Life that shall end -- less be."
