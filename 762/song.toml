[lyrics.1]
text = "Ma -- ny years I’d squan -- dered and in dark -- ness wan -- dered, And no guid -- ing light could see; But my soul re -- joic -- ing, praise to God was voic -- ing, When re -- deem -- ing love saved me."

[lyrics.2]
text = "I in sin was liv -- ing, all to pleas -- ure giv -- ing, Yet as sad as one could be; But I lost all sad -- ness and was filled with glad -- ness, When re -- deem -- ing love saved me."

[lyrics.3]
text = "I for light was sigh -- ing and for com -- fort cry -- ing, Yet from sin I could not flee; But my bonds were brok -- en and for -- giv -- ness spok -- en, When re -- deem -- ing love saved me."

[lyrics.chorus]
text = "When re -- deem -- ing love saved me, saved me, Heav -- en’s path -- way I could see; From the foe it won me, Glo -- ry fell up -- on me When re -- deem -- ing love saved me."

[parts.Soprano.lyrics.chorus]
text = "When re -- deem -- ing love saved me, Heav -- en’s path -- way I could see; From the foe it won me, Glo -- ry fell up -- on me When re -- deem -- ing love saved me."
