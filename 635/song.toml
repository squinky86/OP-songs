[lyrics.1]
text = "There are paths just a -- head, as life’s jour -- ney we tread, Do they lead to that blest es -- tate? Must I climb the steep hill, must I yield Him my will? Does the path -- way for home lead straight?"

[lyrics.2]
text = "On the jour -- ney of life, ’mid the dan -- ger and strife, Must I choose now, or seal my fate? Must I al -- ways turn back to the heav -- en -- ward track? Does the path -- way for home lead straight?"

[lyrics.3]
text = "Is the way made so plain that I seek not in vain For the signs of my Ad -- vo -- cate? Must I ev -- er de -- tour from the way of the pure? Does the path -- way for home lead straight?"

[lyrics.chorus]
text = "Yes, the path -- way leads straight to the beau -- ti -- ful gate Of the cit -- y where dwell the blest; On that ev -- er -- green shore all their trou -- bles are o’er, And the wea -- ry shall find sweet rest."

[parts.Alto.lyrics.chorus]
text = "Yes, the path -- way leads straight to the beau -- ti -- ful gate Of the cit -- y where dwell the blest; (the blest;) On that ev -- er -- green shore all their trou -- bles are o’er, And the wea -- ry shall find sweet rest."

[parts.Tenor.lyrics.chorus]
text = "Yes, the path -- way leads straight to the beau -- ti -- ful gate Of the cit -- y where dwell the blest; (the blest;) On that ev -- er -- green shore all their trou -- bles are o’er, And the wea -- ry shall find sweet rest."
