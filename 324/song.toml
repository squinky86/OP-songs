[lyrics.1]
text = "Ho -- ly Spi -- rit, faith -- ful Guide, Ev -- er near the Chris -- tian’s side; Gent -- ly lead us by the hand, Pil -- grims in a de -- sert land; Wea -- ry souls fore -- ’er re -- joice, While they hear that sweet -- est voice, Whisp -- ’ring soft -- ly, “Wan -- d’rer, come, Fol -- low Me, I’ll guide thee home.”"

[lyrics.2]
text = "Ev -- er pre -- sent, tru -- est Friend, Ev -- er near Thine aid to lend, Leave us not to doubt and fear, Grop -- ing on in dark -- ness drear. When the storms are rag -- ing sore, Hearts grow faint, and hopes give o’er— Whis -- per soft -- ly, “Wan -- d’rer, come, Fol -- low Me, I’ll guide thee home.”"

[lyrics.3]
text = "When our days of toil shall cease, Wait -- ing still for sweet re -- lease, Noth -- ing left but heav’n and prayer, Wond -- ’ring if our names are there; Wad -- ing deep the dis -- mal flood, Plead -- ing naught but Je -- sus’ blood, Whis -- per soft -- ly, “Wan -- d’rer, come, Fol -- low Me, I’ll guide thee home.”"

