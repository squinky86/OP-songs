[lyrics.1]
text = "I gave My life for thee, My pre -- cious blood I shed, That thou might'st ran -- somed be, And quick -- ened from the dead; I gave, I gave My life for thee, What hast thou giv'n for Me? I gave, I gave My life for thee, What hast thou giv'n for Me?"

[lyrics.2]
text = "My Fa -- ther's home of light, My rain -- bow cir -- cled throne, I left for earth -- ly night, For wan -- d'rings sad and lone; I left, I left it all for thee, Hast thou left aught for Me? I left, I left it all for thee, Hast thou left aught for Me?"

[lyrics.3]
text = "I suf -- fered much for thee, More than My tongue may tell, Of bit -- t'rest a -- go -- ny, To res -- cue thee from hell; I've borne, I've borne it all for thee, What canst thou bear for Me? I've borne, I've borne it all for thee, What canst thou bear for Me?"

[lyrics.4]
text = "And I have brought to thee, Down from My home a -- bove, Sal -- va -- tion full and free, My par -- don and My love; I bring, I bring rich gifts to thee, What hast thou brought to Me? I bring, I bring rich gifts to thee, What hast thou brought to Me?"
