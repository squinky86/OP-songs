[lyrics.1]
text = "O Lord of heav’n, and earth, and sea, To Thee all praise and glo -- ry be; How shall we show our love to Thee, Who giv -- est all?"

[lyrics.2]
text = "The gold -- en sun -- shine, ver -- nal air, Sweet flow’rs and fruits Thy love de -- clare, Where har -- vests rip -- en, Thou art there, Who giv -- est all!"

[lyrics.3]
text = "For peace -- ful homes, and health -- ful days, For all the bless -- ings earth dis -- plays, We owe Thee thank -- ful -- ness and praise, Who giv -- est all!"

[lyrics.4]
text = "Thou didst not spare Thine on -- ly Son, But gav’st Him for a world un -- done, And free -- ly with that bless -- ed One Thou giv -- est all!"

[lyrics.5]
text = "For souls re -- deemed, for sins for -- giv’n, For means of grace and hopes of heav’n, O Lord, what can to Thee be giv’n Who giv -- est all?"

[lyrics.6]
text = "What -- ev -- er, Lord, we lend to Thee, Re -- paid a thou -- sand- -- fold will be; Then glad -- ly will we give to Thee, Who giv -- est all!"
