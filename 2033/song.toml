[lyrics.1]
text = "Would you live for Je -- sus and be al -- ways pure and good? Would you walk with Him with -- in the nar -- row road? Would you have Him bear your bur -- den, car -- ry all your load? Let Him have His way with thee."

[lyrics.2]
text = "Would you have Him make you free, and fol -- low at His call? Would you know the peace that comes by giv -- ing all? Would you have Him save you, so that you need nev -- er fall? Let Him have His way with thee."

[lyrics.3]
text = "Would you in His king -- dom find a place of con -- stant rest? Would you prove Him true each prov -- i -- den -- tial test? Would you in His serv -- ice la -- bor al -- ways at your best? Let Him have His way with thee."

[lyrics.chorus]
text = "His pow’r can make you what you ought to be; His blood can cleanse your heart and make you free; His love can fill your soul, and you will see ’Twas best for Him to have His way with thee."
