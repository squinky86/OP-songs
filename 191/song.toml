[parts.Soprano.lyrics.1]
text = "Guide me, O Thou great Je -- ho -- vah, Pil -- grim through this bar -- ren land; I am weak, but Thou art might -- y, Hold me with Thy pow’r -- ful hand. Bread of heav -- en, feed me till I want no more."
[parts.Soprano.lyrics.2]
text = "O -- pen now the crys -- tal foun -- tain, Whence the heal -- ing stream doth flow; Let the fire and cloud -- y pil -- lar Lead me all my jour -- ney through. Strong De -- liv -- ’rer, be Thou still my Strength and Shield."
[parts.Soprano.lyrics.3]
text = "Lord, I trust Thy might -- y pow -- er, Won -- drous are Thy works of old; Thou de -- liv -- er’st Thine from thrall -- dom, Who for naught them -- selves had sold: Thou didst con -- quer sin and Sa -- tan and the grave."
[parts.Soprano.lyrics.4]
text = "When I tread the verge of Jor -- dan, Bid my anx -- ious fears sub -- side; Death of death and hell’s De -- struc -- tion, Land me safe on Ca -- naan’s side. Songs of prais -- es, I will ev -- er give to Thee."

