[parts.Alto.lyrics.1]
text = "As I con -- tem -- plate life’s jour -- ney, Thro’ a world of sin and strife, There’s a thought that steals up -- on me, Whis -- p’ring joy aft -- er while. aft -- er while. @s1 Blest will be the way- -- worn pil -- grims, Some sweet day aft -- er while. aft -- er while."

[parts.Alto.lyrics.2]
text = "’Tis a thought of migh -- ty won -- der, Clad in forms of sac -- red style, To be -- hold the things e -- ter -- nal, That shall be aft -- er while. aft -- er while. @s1 We shall view e -- ter -- nal re -- gions, Some sweet day aft -- er while. aft -- er while."

[parts.Alto.lyrics.3]
text = "What shall be the scenes that greet us? Shall we view them with a smile? What shall be the joys and sor -- rows? O just think aft -- er while. aft -- er while. @s1 Bliss the Chris -- tian’s ha -- bi -- ta -- tion, Some sweet day aft -- er while. aft -- er while."

[parts.Alto.lyrics.4]
text = "Then we’ll know of high -- er great -- ness Than the world hath e’er com -- piled; Then we’ll rest from all our la -- bors, Some sweet day aft -- er while. aft -- er while. @s1 We shall rest from all our la -- bors, Some sweet day aft -- er while. aft -- er while."

[parts.Alto.lyrics.s1]
text = "Aft -- er while, aft -- er while, Some sweet day aft -- er while, aft -- er while,"

