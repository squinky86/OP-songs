[lyrics.1]
text = "I have a faith that can nev -- er be shak -- en, Faith that lays hold up -- on Je -- sus, the Son; And from my heart it can nev -- er be tak -- en— Faith in the name of the Cru -- ci -- fied One."

[lyrics.2]
text = "I have a hope that shines clear -- er and clear -- er, E'en as the stars in an un -- cloud -- ed night; And to my soul it grows dear -- er and dear -- er, Flood -- ing my soul with un -- fad -- ing de -- light."

[lyrics.3]
text = "I have a trust that grows bright -- er and bright -- er, Trust in the love of my Sav -- ior, my King; Mak -- ing the cross that I car -- ry the light -- er, As to the word of His prom -- ise I cling."

[lyrics.chorus]
text = "He is hold -- ing me, safe en -- fold -- ing me, And by His grace I from sin am made free! With me ev -- 'ry hour, in His sav -- ing pow'r, Je -- sus, the Sav -- ior, who died for me."
