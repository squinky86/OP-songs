[lyrics.1]
text = "Give me the Bi -- ble, star of glad -- ness gleam -- ing, To cheer the wan -- d’rer lone and tem -- pest tossed; No storm can hide that ra -- diance peace -- ful beam -- ing, Since Je -- sus came to seek and save the lost."

[lyrics.2]
text = "Give me the Bi -- ble, when my heart is bro -- ken, When sin and grief have filled my soul with fear; Give me the pre -- cious words by Je -- sus spo -- ken, Hold up faith’s lamp to show my Sav -- ior near."

[lyrics.3]
text = "Give me the Bi -- ble, all my steps en -- light -- en, Teach me the dan -- ger of these realms be -- low; That lamp of safe -- ty o’er the gloom shall bright -- en, That light a -- lone the path of peace can show."

[lyrics.4]
text = "Give me the Bi -- ble, lamp of life im -- mor -- tal, Hold up that splen -- dor by the o -- pen grave; Show me the light from Heav -- en’s shin -- ing por -- tal, Show me the glo -- ry gild -- ing Jor -- dan’s wave."

[lyrics.chorus]
text = "Give me the Bi -- ble, ho -- ly mes -- sage shin -- ing; Thy light shall guide me in the nar -- row way; Pre -- cept and prom -- ise, law and love com -- bin -- ing, Till night shall van -- ish in e -- ter -- nal day."
