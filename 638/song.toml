[lyrics.1]
text = "As I’m on the way to my home on high, There are pleas -- ure un -- told for me; As I press a -- long ’mid the bus -- y throng, That sweet home I by faith can see."

[lyrics.2]
text = "Broth -- er press a -- long with the blood -- washed throng, ’Till we’re called from this earth be -- low; Guid -- ed by God’s word we will serve the Lord, Then at last be pre -- pared to go."

[lyrics.3]
text = "Yes, I know I’m right in this gos -- pel fight, In the bat -- tle for God on high; For I use the word,— ’tis the Spir -- it’s sword, I shall win in the bye and bye."

[lyrics.4]
text = "Yes, I’m on my way prais -- ing God each day, Look -- ing un -- to the Christ up there; When He comes a -- gain I shall see Him then, I shall meet Him up in the air."

[lyrics.chorus]
text = "Trav’l -- ing home, trav’l -- ing home, Leav -- ing all the ways of sin; Trav’l -- ing home, trav’l -- ing home, Soon that home I’ll en -- ter in."

[parts.Alto.lyrics.chorus]
text = "Trav’l -- ing home, trav’l -- ing home, Leav -- ing all the ways of sin; Trav’l -- ing home, trav’l -- ing home, Soon that heav’n -- ly home I’ll en -- ter in."

[parts.Tenor.lyrics.chorus]
