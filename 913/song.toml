[lyrics.1]
text = "My stub -- born will at last hath yield -- ed; I would be Thine and Thine a -- lone; And this the prayer my lips are bring -- ing, “Lord, let in me Thy will be done.”"

[parts.Tenor.lyrics.1]
text = ""

[parts.Bass.lyrics.1]
text = ""

[lyrics.2]
text = "I’m tired of sin, foot -- sore and wear -- y, The dark -- some path hath drear -- y grown, But now a light has ris’n to cheer me; I find in Thee my Star, my Sun."

[parts.Tenor.lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "Thy pre -- cious will, O con -- qu’ring Sav -- ior, Doth now em -- brace and com -- pass me; All dis -- cords hushed, my peace a riv -- er, My soul a pris -- oned bird set free."

[parts.Tenor.lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = ""

[lyrics.4]
text = "Shut in with Thee, O Lord, for -- ev -- er, My way -- ward feet no more to roam; What pow’r from Thee my soul can sev -- er? The cen -- ter of God’s will my home."

[parts.Tenor.lyrics.4]
text = ""

[parts.Bass.lyrics.4]
text = ""

[lyrics.chorus]
text = "Sweet will of God, still fold me clo -- ser, Till I am whol -- ly lost in Thee; Sweet will of God, still fold me clo -- ser, Till I am whol -- ly lost in Thee."
