[lyrics.1]
text = "Sav -- ior, be with me ev -- ’ry hour, For oh! I need Thy sav -- ing pow’r; Hold Thou my hand, Lord, speak to me, And cause my blind -- ed eyes to see."

[lyrics.2]
text = "Rough was Thy way to Cal -- va -- ry, Where Thou was lift -- ed up for me; Yet in Thy mer -- cy hear my cry, For with -- out Thee, Lord, I must die."

[lyrics.3]
text = "Tho’ I have man -- y times de -- nied Thy name, yet still with me a -- bide; Purge me from sin! oh, make me pure, That I temp -- ta -- tion may en -- dure."

[lyrics.4]
text = "When I have reached the riv -- er side, Be with me thro’ the swell -- ing tide; Then with the ran -- somed on that shore I’ll praise Thy name for -- ev -- er -- more."

[lyrics.chorus]
text = "Sav -- ior, I plead with Thee! My Guide and Keep -- er be! Mer -- ci -- ful One, re -- ceive my cry, For with -- out Thee I must die!"

