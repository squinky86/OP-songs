[lyrics.1]
text = "O think of the home o -- ver there, By the side of the riv -- er of light, @s1 Where the saints, all im -- mor -- tal and fair, Are _ robed in their gar -- ments of light. @s2 O -- ver there, o -- ver there, O think of the home o -- ver there, @s2 O -- ver there, o -- ver there, @s3 O think of the home o -- ver there."

[lyrics.2]
text = "O think of the friends o -- ver there, Who be -- fore us the jour -- ney have trod, @s1 Of the songs that they breathe on the air, In their home in the pal -- ace of God. @s2 O -- ver there, o -- ver there, O think of the friends o -- ver there, @s2 O -- ver there, o -- ver there, @s3 O think of the friends o -- ver there."

[lyrics.3]
text = "My Sav -- ior is now o -- ver there, There my kin -- dred and friends are at rest, @s1 Then a -- way from my sor -- row and care, Let me fly to the land of the blest. @s2 O -- ver there, o -- ver there, My Sav -- ior is now o -- ver there, @s2 O -- ver there, o -- ver there, @s3 My Sav -- ior is now o -- ver there."

[lyrics.4]
text = "I’ll soon be at home o -- ver there, For the end of my jour -- ney I see; @s1 Ma -- ny dear to my heart, o -- ver there, Are _ watch -- ing and wait -- ing for me. @s2 O -- ver there, o -- ver there, I’ll soon be at home o -- ver there, @s2 O -- ver there, o -- ver there, @s3 I’ll soon be at home o -- ver there."

