[parts.Alto.lyrics.1]
text = "We want just the same re -- lig -- ion, That our fa -- thers used to know, (there,) In the old time, In the old time; And that they did car -- ry with them, Ev -- ’ry -- where that they did go, (there,) In the old time, In the old time!"

[parts.Alto.lyrics.2]
text = "They did preach and pray and sing it, In the home and all a -- broad, (there,) In the old time, In the old time; In the way that hear -- ing sin -- ners, Could dis -- cern the pow’r of God, (there,) In the old time, In the old time!"

[parts.Alto.lyrics.3]
text = "Moth -- ers to their sons and daugh -- ters Taught it, in its per -- fect way, (there,) In the old time, In the old time; As they talked it so they lived it, Out, be -- fore them day by day, (there,) In the old time, In the old time!"

[parts.Alto.lyrics.4]
text = "Then, ’twas not of fad or fan -- cy, Nor for fame, a preached ap -- peal, (there,) In the old time, In the old time; ’Twas re -- lig -- ion full of glo -- ry, From the heart, with burn -- ing zeal, (there,) In the old time, In the old time!"

[parts.Alto.lyrics.chorus]
text = "It made ev -- ’ry -- bod -- y hap -- py In the old time, Made them love and serve each oth -- er, In the old time, Yes, we want the same re -- lig -- ion, As was that of long a -- go, (there,) In the old time, In the old time!"

