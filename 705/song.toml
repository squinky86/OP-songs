[lyrics.1]
text = "How I long to be still more and more like Je -- sus, While up -- on this earth I stay, And I’m striv -- ing to re -- flect His love and mer -- cy All a -- long my pil -- grim way."

[lyrics.2]
text = "More and more like Him who left the courts of heav -- en, Earth -- ly sor -- rows all to share; That He might be -- come the au -- thor of sal -- va -- tion, All our sins and griefs to bear."

[lyrics.3]
text = "Yes, I want to be more like my bless -- ed Sav -- iour, Striv -- ing here His will to know; Do -- ing faith -- ful -- ly what -- ev -- er He com -- mands me, Walk -- ing where He bids me go."

[lyrics.chorus]
text = "Still more and more like my Sav -- iour I would be, His love, great love, re -- flect -- ing day by day; Yes, more and more, I would be like Him, All a -- long my pil -- grim way."

