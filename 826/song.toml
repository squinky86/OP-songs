[lyrics.1]
text = "Be -- yond the smil -- ing and the weep -- ing, I shall be soon; Be -- yond the wak -- ing and the sleep -- ing, I shall be soon; Be -- yond the bloom -- ing and the fad -- ing, Be -- yond the shin -- ing and the shad -- ing, Be -- yond the hop -- ing and the dread -- ing, I shall be soon."

[lyrics.2]
text = "Be -- yond the frost- -- chain and the fe -- ver, I shall be soon; Be -- yond the rock- -- waste and the riv -- er, I shall be soon; Be -- yond the pul -- se’s fe -- vered beat -- ing, Be -- yond the part -- ing and the meet -- ing, Be -- yond the fare -- well and the greet -- ing, I shall be soon."
