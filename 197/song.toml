[lyrics.2]
text = "I was lost, but Je -- sus found me, Found the sheep that went a -- stray, Threw His lov -- ing arms a -- round me, Drew me back in -- to His way."

[lyrics.3]
text = "I was bruised, but Je -- sus healed me, Faint was I from man -- y‿a fall, Sight was gone, and fears pos -- sessed me, But He freed me from them all."

[lyrics.4]
text = "Days of dark -- ness still come o’er me, Sor -- row’s paths I oft -- en tread, But the Sav -- ior still is with me; By His hand I’m safe -- ly led."

[lyrics.5]
text = "He will keep me till the riv -- er Rolls its wa -- ters at my feet; Then He’ll bear me safe -- ly o -- ver, Where the loved ones I shall meet."

