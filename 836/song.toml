[lyrics.1]
text = "Fight the good fight with all thy might; Christ is thy strength, and Christ thy right; Lay hold on life, and it shall be Thy joy and crown e -- ter -- nal -- ly."

[lyrics.2]
text = "Run the straight race thro’ God’s good grace, Lift up thine eyes, and seek His face; Life with its way be -- fore us lies: Christ is the path, and Christ the prize."

[lyrics.3]
text = "Cast care a -- side; up -- on thy Guide Lean, and His mer -- cy will pro -- vide; Lean, and the trust -- ing soul shall prove Christ is its life, and Christ its love."

[lyrics.4]
text = "Faint not, nor fear, His arms are near; He chang -- eth not, and thou art dear; On -- ly be -- lieve, and thou shalt see That Christ is all in all to thee."
