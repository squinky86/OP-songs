[lyrics.1]
text = "The God of A -- braham praise, Who reigns en -- throned a -- bove; An -- cient of ev -- er -- last -- ing days, And God of love; Je -- ho -- vah, great I AM, By earth and heav’n con -- fessed; I bow and bless the sa -- cred name, For -- ev -- er blest."

[lyrics.2]
text = "The God of A -- braham praise, At whose su -- preme com -- mand From earth I rise, and seek the joys, At His right hand: I all on earth for -- sake, Its wis -- dom, fame and pow’r; And Him my on -- ly por -- tion make, My shield and tow’r."

[lyrics.3]
text = "He by Him -- self hath sworn, I on His oath de -- pend; I shall, on an -- gel- -- wings up -- borne, To heav’n as -- cend; I shall be -- hold His face, I shall His pow’r a -- dore, And sing the won -- ders of His grace For -- ev -- er -- more."
