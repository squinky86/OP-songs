[lyrics.1]
text = "My hand is in the hand di -- vine, For I am His and He is mine; His glo -- ries o’er my path -- way shine; I’m hap -- py all the while."

[lyrics.2]
text = "He leads my soul in pas -- tures new And Ca -- naan’s land, by faith I view; With this dear Friend, so kind, so true, I’m hap -- py all the while."

[lyrics.3]
text = "He guides me t’ward the gates of gold Where, when my sto -- ry has been told, His match -- less face I shall be -- hold; I’m hap -- py all the time."

[lyrics.chorus]
text = "I’m hap -- py all the while, I’m sing -- ing free from guile; In life’s true way I walk to -- day; I’m hap -- py all the while."

