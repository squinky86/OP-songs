[lyrics.1]
text = "In the vine -- yard of my Mas -- ter, I would go and work to -- day, That I shall un -- to His hon -- or, Bear some pre -- cious fruit a -- way!"

[lyrics.2]
text = "Pray I for the strength and cour -- age, Fa -- ther, here to work for Thee; Grant to me this plead -- ed bless -- ing, I, Thy ser -- vant true, would be!"

[lyrics.3]
text = "Tho’ my morn -- ing life I’ve wast -- ed, Yea, the noon of it is on,— My re -- main -- ing mo -- ments, take them, Lord un -- til the last is gone!"

[lyrics.chorus]
text = "Toil -- ing here, for Him, my Lord, And O what joy ’twill be that day! Com -- ing from the har -- vest field, To bear some pre -- cious fruit a -- way!"

[parts.Alto.lyrics.chorus]
text = "Toil -- ing, toil -- ing here each day, for Him, for Him, my Lord, my Lord, And O, and O, what joy, what joy ’twill be, ’twill be, that day, that day! When com -- ing, com -- ing from the field, the har -- vest, har -- vest field of God To bear, to bear some pre -- cious, pre -- cious fruit for Him a -- way! a -- way!"

[parts.Tenor.lyrics.chorus]
text = "Toil -- ing, toil -- ing here each day, for Him, for Him, my Lord, my Lord, And O, and O, what joy, what joy ’twill be, ’twill be, that day, that day! com -- ing, com -- ing from the field, the har -- vest, har -- vest field of God To bear, to bear some pre -- cious, pre -- cious fruit for Him a -- way! a -- way!"

