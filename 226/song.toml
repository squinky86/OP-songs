[lyrics.1]
text = "Rock of A -- ges, cleft for me, Let me hide my -- self in Thee; Let the wa -- ter and the blood, From Thy wound -- ed side which flowed, Be of sin the dou -- ble cure, Save from wrath and make me pure."

[lyrics.2]
text = "Not the la -- bor of my hands Can ful -- fill Thy law’s de -- mands; Could my zeal no res -- pite know, Could my tears for -- ev -- er flow, All for sin could not a -- tone; Thou must save, and Thou a -- lone."

[lyrics.3]
text = "Noth -- ing in my hand I bring, Sim -- ply to Thy cross I cling; Na -- ked, come to Thee for dress; Help -- less, look to Thee for grace; Foul, I to the foun -- tain fly; Wash me, Sav -- ior, or I die."

[lyrics.4]
text = "While I draw this fleet -- ing breath, When my eyes shall close in death, When I rise to worlds un -- known, And be -- hold Thee on Thy throne, Rock of A -- ges, cleft for me, Let me hide my -- self in Thee."
