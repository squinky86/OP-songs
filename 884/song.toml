[lyrics.1]
text = "Je -- sus is com -- ing to earth a -- gain, What if it were to -- day? Com -- ing in pow -- er and love to reign, What if it were to -- day? Com -- ing to claim His cho -- sen Bride, All the re -- deemed and pu -- ri -- fied, O -- ver this whole earth scat -- tered wide, What if it were to -- day?"

[lyrics.2]
text = "Sa -- tan’s do -- min -- ion will then be o’er, O that it were to -- day! Sor -- row and sigh -- ing shall be no more, O that it were to -- day! Then shall the dead in Christ a -- rise, Caught up to meet Him in the skies, When shall these glo -- ries meet our eyes? What if it were to -- day?"

[lyrics.3]
text = "Faith -- ful and true would He find us here If He should come to -- day? Watch -- ing in glad -- ness and not in fear, If He should come to -- day? Signs of His com -- ing mul -- ti -- ply, Morn -- ing light breaks in east -- ern sky, Watch, for the time is draw -- ing nigh, What if it were to -- day?"

[lyrics.chorus]
text = "Glo -- ry! glo -- ry! Joy to my heart ’twill bring; Glo -- ry, glo -- ry! When we shall crown Him King; Glo -- ry, glo -- ry! Haste to pre -- pare the way; Glo -- ry, glo -- ry! Je -- sus will come some day."
