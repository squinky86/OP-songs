[lyrics.1]
text = "Bright -- est and best of the sons of the morn -- ing, Dawn on our dark -- ness, and lend us Thine aid; Star of the East, the ho -- ri -- zon a -- dorn -- ing, Guide where our in -- fant Re -- deem -- er is laid. Cold on His cra -- dle the dew- -- drops are shin -- ing, Low lies His head with the beasts of the stall; An -- gels a -- dore Him, in slum -- ber re -- clin -- ing, Mak -- er, and Mon -- arch, and Sav -- ior of all."

[lyrics.2]
text = "Say, shall we yield Him, in cost -- ly de -- vo -- tion, O -- dors of E -- dom, and of -- f’rings di -- vine? Gems of the moun -- tain, and pearls of the o -- cean, Myrrh from the for -- est, and gold from the mine? Vain -- ly we of -- fer earth’s rich -- est ob -- la -- tion, Vain -- ly with gifts would His fa -- vor se -- cure; Rich -- er by far is the heart’s ad -- o -- ra -- tion, Dear -- er to God are the pray’rs of the poor."
