[lyrics.1]
text = "O for the peace which flow -- eth like a riv -- er, Mak -- ing life’s des -- ert pla -- ces bloom and smile! O for the faith to grasp heav’n’s bright for -- ev -- er, A -- mid the shad -- ows of earth’s “lit -- tle while.”"

[lyrics.2]
text = "A lit -- tle while for pa -- tient vig -- il- -- keep -- ing, To face the storm, to bat -- tle with the strong; A lit -- tle while to sow the seed with weep -- ing, Then bind the sheaves and sing the har -- vest song!"

[lyrics.3]
text = "A lit -- tle while to keep the oil from fail -- ing, A lit -- tle while faith’s flick’ -- ring lamp to trim; And then, the Bride -- groom’s com -- ing foot -- steps hail -- ing, To haste to meet Him with the bri -- dal hymn!"

[lyrics.4]
text = "And He who is Him -- self the Gift and Giv -- er— The fu -- ture glo -- ry and the pres -- ent smile— With the bright prom -- ise of the glad “for -- ev -- er,” Will light the shad -- ows of the “lit -- tle while!”"
