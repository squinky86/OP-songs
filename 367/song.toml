[lyrics.1]
text = "Where cross the crowd -- ed ways of life, Where sound the cries of race and clan A -- bove the noise of self -- ish strife, We hear Your voice, O Son of Man."

[lyrics.2]
text = "In haunts of wretch -- ed -- ness and need, On shad -- owed thresh -- olds dark with fears, From paths where hide the lures of greed, We catch the vi -- sion of Your tears."

[lyrics.3]
text = "From ten -- der child -- hood's help -- less -- ness, From wom -- an's grief, man's bur -- dened toil, From fam -- ished souls, from sor -- row's stress, Your heart has nev -- er known re -- coil."

[lyrics.4]
text = "The cup of wa -- ter giv'n for You, Still holds the fresh -- ness of Your grace; Yet long these mul -- ti -- tudes to view The sweet com -- pas -- sion of Your face."

[lyrics.5]
text = "O Mas -- ter, from the moun -- tain -- side Make haste to heal these hearts of pain; A -- mong these rest -- less throngs a -- bide; O tread the cit -- y's streets a -- gain."

[lyrics.6]
text = "Till sons of men shall learn Your love And fol -- low where Your feet have trod, Till, glo -- rious from Your Heav'n a -- bove, Shall come the cit -- y of our God!"
