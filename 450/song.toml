[lyrics.1]
text = "Im -- mor -- tal Love, for -- ev -- er full, For -- ev -- er flow -- ing free, For -- ev -- er shared, for -- ev -- er whole, A nev -- er ebb -- ing sea!"

[lyrics.2]
text = "Our out -- ward lips con -- fess the name All oth -- er names a -- bove; Love on -- ly know -- eth whence it came, And com -- pre -- hend -- eth love."

[lyrics.3]
text = "Blow, winds of God, a -- wake and blow The mists of earth a -- way: Shine out, O light di -- vine, and show How wide and far we stray."

[lyrics.4]
text = "We may not climb the heav’n -- ly steeps To bring the Lord Christ down; In vain we search the low -- est deeps, For Him no depths can drown."

[lyrics.5]
text = "But warm, sweet, ten -- der, ev -- en yet, A pre -- sent help is He; And faith still has its Ol -- i -- vet, And love its Gal -- i -- lee."

[lyrics.6]
text = "The heal -- ing of His seam -- less dress Is by our beds of pain; We touch Him in life’s throng and press, And we are whole a -- gain."

[lyrics.7]
text = "Through Him the first fond prayers are said Our lips of child -- hood frame, The last low whis -- pers of our dead Are bur -- dened with His name."

[lyrics.8]
text = "O Lord and Mas -- ter of us all, What -- e’er our name or sign, We own Thy sway, we hear Thy call, We test our lives by Thine."

[lyrics.9]
text = "The let -- ter fails, the sys -- tems fall, And ev -- ery sym -- bol wanes; The Spir -- it o -- ver brood -- ing all, E -- ter -- nal love re -- mains."
