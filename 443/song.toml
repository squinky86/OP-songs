[lyrics.1]
text = "I come to the gar -- den a -- lone, While the dew is still on the ro -- ses; And the voice I hear, fall -- ing on my ear, The Son of God dis -- clo -- ses."

[lyrics.2]
text = "He speaks, and the sound of His voice Is so sweet the birds hush their sing -- ing, And the me -- lo -- dy that He gave to me With -- in my heart is ring -- ing."

[lyrics.3]
text = "I’d stay in the gar -- den with Him Though the night a -- round me be fal -- ling, But He bids me go; through the voice of woe His voice to me is cal -- ling."

[lyrics.chorus]
text = "And He walks with me, and He talks with me, And He tells me I am His own, And the joy we share, as we tar -- ry there, None o -- ther has e -- ver known."
