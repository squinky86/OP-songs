[lyrics.1]
text = "Will you come, will you come, with your poor brok -- en heart, Bur -- den’d and sin op -- press’d? Lay it down at the feet of your Sav -- ior and Lord, Je -- sus will give you rest."

[lyrics.2]
text = "Will you come, will you come? there is mer -- cy for you, Balm for your ach -- ing breast; On -- ly come as you are, and be -- lieve on His name, Je -- sus will give you rest."

[lyrics.3]
text = "Will you come, will you come, you have noth -- ing to pay; Je -- sus, who loves you best, By His death on the Cross pur -- chas’d life for your soul, Je -- sus will give you rest."

[lyrics.4]
text = "Will you come, will you come? how He pleads with you now! Fly to His lov -- ing breast, And what -- ev -- er your sin or your sor -- row may be, Je -- sus will give you rest."

[lyrics.chorus]
text = "Oh, hap -- py rest, sweet hap -- py rest! Je -- sus will give you rest, Oh, why won’t you come in sim -- ple, trust -- ing faith? Je -- sus will give you rest."

[parts.Bass.lyrics.chorus]
text = "Oh, hap -- py rest, sweet hap -- py rest! Je -- sus will give you rest, hap -- py rest. Oh, why won’t you come in sim -- ple, trust -- ing faith? Je -- sus will give you rest."
