[lyrics.1]
text = "From Cal -- va -- ry a cry was heard— A bit -- ter and heart- -- rend -- ing cry; My Sav -- ior, ev -- ’ry mourn -- ful word Be -- speaks Thy soul’s deep ag -- o -- ny."

[lyrics.2]
text = "A hor -- ror of great dark -- ness fell On Thee, Thou spot -- less, ho -- ly One, And all the swarm -- ing hosts of hell Con -- spired to tempt God’s on -- ly Son."

[lyrics.3]
text = "The scourge, the thorns, the deep dis -- grace, These Thou couldst bear, nor once re -- pine; But when Je -- ho -- vah veiled His face, Un -- ut -- ter -- a -- ble pangs were Thine."

[lyrics.4]
text = "Lord, on Thy cross I fix mine eye: If e’er I lose its strong con -- trol, O let that dy -- ing, pierc -- ing cry Melt and re -- claim my wand’ -- ring soul."
