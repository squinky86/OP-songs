[lyrics.1]
text = "Je -- sus, meek and gen -- tle, Son of God most high, Pity -- ing, lov -- ing Sav -- ior, Hear Thy chil -- dren’s cry."

[lyrics.2]
text = "Par -- don our of -- fen -- ses, Loose our cap -- tive chains, Break down ev -- ’ry i -- dol Which our soul de -- tains."

[lyrics.3]
text = "Give us ho -- ly free -- dom, Fill our hearts with love; Draw us, ho -- ly Je -- sus, To the realms a -- bove."

