[lyrics.1]
text = "When the ear -- ly morn -- ing break -- ing, Slum -- ber from my eye -- lids shak -- ing, Comes the bless -- ed tho’t with wak -- ing, I am in His keep -- ing. Day ad -- vanc -- es, la -- bor bring -- ing, Care, her man -- tle ’round me fling -- ing, Yet midst all my soul keeps sing -- ing, @s1"

[lyrics.2]
text = "Some -- _ -- times dark clouds hang o’er me, Not one step I see be -- fore me, Still, my Sav -- ior, I a -- dore Thee, I am in His keep -- ing. I can trust His hand to guide me, ’Neath His wings He’ll safe -- ly hide me, And no harm can e’er be -- tide me, @s1"

[lyrics.3]
text = "Gen -- tle e -- ven -- tide is near -- ing, Light from Heav -- en dis -- ap -- pear -- ing, Still the bless -- ed tho’t so cheer -- ing, I am in His keep -- ing. Now night’s cur -- tains gath -- er ’round me, Yet its dan -- gers have not found me, For His an -- gel guards sur -- round me, @s1"

[lyrics.chorus]
text = "I am in my Fa -- ther’s keep -- ing, I am in His ten -- der care; Wheth -- er wak -- ing, wheth -- er sleep -- ing, I am in His care."

[lyrics.s1]
text = "I am in His care."
