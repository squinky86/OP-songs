[lyrics.1]
text = "The spa -- cious fir -- ma -- ment on high, With all the blue, e -- the -- real sky, And span -- gled heav’ns, a shin -- ing frame, Their great O -- rig -- i -- nal pro -- claim: Th’un -- wea -- ried sun, from day to day, Does his Cre -- a -- tor’s pow’r dis -- play; And pub -- lish -- es to ev -- ’ry land The work of an al -- might -- y hand."

[lyrics.2]
text = "Soon as the eve -- ning shades pre -- vail, The moon takes up the won -- drous tale, And night -- ly to the list’ -- ning earth, Re -- peats the sto -- ry of her birth; While all the stars that round her burn, And all the plan -- ets in their turn, Con -- firm the ti -- dings as they roll, And spread the truth from pole to pole."

[lyrics.3]
text = "What tho’ in sol -- emn si -- lence, all Move round this dark ter -- res -- trial ball; What tho’ no re -- al voice nor sound A -- mid their ra -- diant orbs be found: In rea -- son’s ear they all re -- joice, And ut -- ter forth a glo -- rious voice, For -- ev -- er sing -- ing as they shine, “The hand that made us is di -- vine.”"
