text = "The light of the world you must be, To en -- light -- en and res -- cue man -- kind, That _ they your ex -- am -- ple may see, may see, Of _ wis -- dom and mer -- cy com -- bined."

[lyrics.2]
text = "The light of the world, may your life, (your life,) Trans -- _ -- par -- ent with ex -- cel -- lence shine, (yes, shine,) A re -- proach to cor -- rup -- tion and strife, and strife, As you fol -- low the Sav -- iour di -- vine."

[parts.Soprano.lyrics.2]
