[lyrics.1]
text = "Take time to be ho -- ly, Speak oft with thy Lord; A -- bide in Him al -- ways, And feed on His Word. Make friends of God’s chil -- dren; Help those who are weak; For -- get -- ting in noth -- ing His bless -- ing to seek."

[lyrics.2]
text = "Take time to be ho -- ly, The world rush -- es on, Spend much time in se -- cret With Je -- sus a -- lone. By look -- ing to Je -- sus, Like Him thou shalt be; Thy friends in thy con -- duct His like -- ness shall see."

[lyrics.3]
text = "Take time to be ho -- ly, Let Him be thy Guide; And run not be -- fore Him, What -- ev -- er be -- tide; In joy or in sor -- row, Still fol -- low thy Lord; And, look -- ing to Je -- sus, Still trust in His Word."

[lyrics.4]
text = "Take time to be ho -- ly, Be calm in thy soul; Each tho’t and each mo -- tive Be -- neath His con -- trol; Thus led by His Spir -- it To foun -- tains of love, Thou soon shalt be fit -- ted For serv -- ice a -- bove."
