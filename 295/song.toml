[lyrics.1]
text = "Praise Him! Praise Him! Je -- sus, our bless -- ed Re -- deem -- er, Sing, O earth, His won -- der -- ful love pro -- claim. Hail Him! hail Him! high -- est arch -- an -- gels in glo -- ry; Strength and hon -- or give to His ho -- ly name! Like a shep -- herd, Je -- sus will guard His chil -- dren, In His arms He car -- ries them all day long:"

[lyrics.2]
text = "Praise Him! Praise Him! Je -- sus, our bless -- ed Re -- deem -- er, For our sins He suf -- fered, and bled, and died; He our rock, our hope of e -- ter -- nal sal -- va -- tion, Hail Him, hail Him, Je -- sus the Cru -- ci -- fied. Lov -- ing Sav -- ior, meek -- ly en -- dur -- ing sor -- row, Crowned with thorns that cru -- el -- ly pierced His brow;"

[lyrics.3]
text = "Praise Him! Praise Him! Je -- sus, our bless -- ed Re -- deem -- er, Heav’n -- ly por -- tals loud with ho -- san -- nas ring, Je -- sus, Sa -- vior, reign -- eth for -- ev -- er and ev -- er. Crown Him! Crown Him— Pro -- phet, and Priest, and King! Death is van -- quished! Tell it with joy, ye faith -- ful. Where is now thy vic -- to -- ry, boast -- ing grave?"

[lyrics.chorus]
text = "Praise Him! Praise Him! Tell of His ex -- cel -- ent great -- ness; Praise Him, praise Him ev -- er in joy -- ful song."