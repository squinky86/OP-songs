[lyrics.1]
text = "Far a -- way the noise of strife up -- on my ear is fall -- ing, Then I know the sins of earth be -- set on ev -- 'ry hand; Doubt and fear and things of earth in vain to me are call -- ing, None of these shall move me from Beu -- lah Land."

[lyrics.2]
text = "Far be -- low the storm of doubt up -- on the world is beat -- ing, Sons of men in bat -- tle long the en -- e -- my with -- stand; Safe am I with -- in the cas -- tle of God's Word re -- treat -- ing, Noth -- ing then can reach me— 'tis Beu -- lah Land."

[lyrics.3]
text = "Let the storm -- y breez -- es blow, their cry can -- not a -- larm me; I am safe -- ly shel -- tered here, pro -- tect -- ed by God's hand; Here the sun is al -- ways shin -- ing, here there's naught can harm me, I am safe for -- ev -- er in Beu -- lah Land."

[lyrics.4]
text = "View -- ing here the works of God, I sink in con -- tem -- pla -- tion; Hear -- ing now His bless -- èd voice, I see the way He planned; Dwell -- ing in the Spir -- it, here I learn of full sal -- va -- tion, Glad -- ly I will tar -- ry in Beu -- lah Land."

[lyrics.chorus]
text = "I'm liv -- ing on the moun -- tain, un -- der -- neath a cloud -- less sky, I'm drink -- ing at the foun -- tain that nev -- er shall run dry; O yes! I'm feast -- ing on the man -- na from a boun -- ti -- ful sup -- ply, For I am dwell -- ing in Beu -- lah Land."

[parts.Tenor.lyrics.chorus]
text = "I'm liv -- ing on the moun -- tain, un -- der -- neath a cloud -- less sky, Praise God! I'm drink -- ing at the foun -- tain that nev -- er shall run dry; O yes! I'm feast -- ing on the man -- na from a boun -- ti -- ful sup -- ply, For I am dwell -- ing in Beu -- lah Land."

[parts.Bass.lyrics.chorus]
text = "I'm liv -- ing on the moun -- tain, un -- der -- neath a cloud -- less sky, Praise God! I'm drink -- ing at the foun -- tain that nev -- er shall run dry; O yes! I'm feast -- ing on the man -- na from a boun -- ti -- ful sup -- ply, For I am dwell -- ing in Beu -- lah Land."
