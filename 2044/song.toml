[lyrics.1]
text = "Won -- der -- ful Je -- sus! glo -- ri -- ous Friend! He will be with me un -- to the end, Cheer -- ing, up -- hold -- ing, keep -- ing me strong, Fear -- less and loy -- al, shield -- ing from wrong."

[lyrics.2]
text = "Won -- der -- ful Je -- sus! show -- ing the way In -- to the bless -- ed king -- dom of day; Guid -- ing my foot -- steps, hold -- ing con -- trol, Mak -- ing me hap -- py, keep -- ing me whole."

[lyrics.3]
text = "Won -- der -- ful Je -- sus! all thro’ the night He will en -- fold me, giv -- ing me light; Then when the morn -- ing breaks on the shore, This He will whis -- per, “Mine ev -- er -- more.”"

[lyrics.chorus]
text = "Won -- der -- ful Je -- sus! mar -- vel -- ous King! Ev -- er His praise my spir -- it shall sing, When I be -- hold His glo -- ri -- fied face, How I shall praise His won -- der -- ful grace!"
