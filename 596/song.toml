[lyrics.1]
text = "’Tis so sweet to trust in Je -- sus, And to take Him at His Word; Just to rest up -- on His prom -- ise, And to know, “Thus says the Lord!”"

[lyrics.2]
text = "O how sweet to trust in Je -- sus, Just to trust His cleans -- ing blood; And in sim -- ple faith to plunge me ’Neath the heal -- ing, cleans -- ing flood!"

[lyrics.3]
text = "Yes, ’tis sweet to trust in Je -- sus, Just from sin and self to cease; Just from Je -- sus sim -- ply tak -- ing Life and rest, and joy and peace."

[lyrics.4]
text = "I’m so glad I learned to trust Thee, Pre -- cious Je -- sus, Sav -- ior, Friend; And I know that Thou art with me, Wilt be with me to the end."

[lyrics.chorus]
text = "Je -- sus, Je -- sus, how I trust Him! How I’ve proved Him o’er and o’er; Je -- sus, Je -- sus, pre -- cious Je -- sus! O for grace to trust Him more!"
