[lyrics.1]
text = "My lat -- est sun is sink -- ing fast, My race is near -- ly run; My strong -- est tri -- als now are past, My tri -- umph is be -- gun."

[lyrics.2]
text = "I know I’m near the ho -- ly ranks Of friends and kin -- dred dear; I brush the dews on Jor -- dan’s banks: The cross -- ing must be near."

[lyrics.3]
text = "I’ve al -- most gained my heav’n -- ly home, My spir -- it loud -- ly sings; Thy ho -- ly ones, be -- hold, they come! I hear the noise of wings."

[lyrics.chorus]
text = "O come, an -- gel band, Come, and a -- round me stand; O bear me a -- way on your snow -- y wings To my im -- mor -- tal home; O bear me a -- way on your snow -- y wings To my im -- mor -- tal home."
