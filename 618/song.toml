[lyrics.1]
text = "Faith casts its an -- chor in Je -- sus’ love, When on the o -- cean of life Tem -- pests are rag -- ing and storm- -- winds move, Fright’ -- ning the soul with their strife. “Save or I per -- ish, O Lord,” I cry, “Save me from ship -- wreck and death,” And in that mo -- ment my fears pass by, Stilled is the storm in a breath."

[lyrics.2]
text = "If in the Sav -- ior I place my trust, Noth -- ing my soul can mo -- lest; Lean on His prom -- ise I sure -- ly must, Know -- ing that He know -- eth best. So to the Pi -- lot of souls I say, Voy -- ag -- ing o -- ver life’s sea, “In -- to the calm of the heav’n -- ly bay, Guide Thou the ves -- sel for me.”"

[lyrics.3]
text = "O -- ver and o -- ver my lips re -- peat— This is my song by the way— Trust in the Sav -- ior makes life so sweet, That earth is heav -- en to -- day. Trust -- ing the Pi -- lot who holds the helm, What is there for me to fear? Nev -- er a storm can the soul o’er -- whelm— Je -- sus, the Sav -- ior, is near!"

[lyrics.chorus]
text = "An -- chored fast, an -- chored fast, mat -- ters not, storm or gale; Storm -- y winds blow, may blow, they can -- not, not pre -- vail; Safe am I as a child on His breast, on His breast, An -- chored there, an -- chored there, An -- chored there, O my soul’s at rest."

[parts.Tenor.lyrics.chorus]
text = "An -- chored in Je -- sus, what mat -- ters the gale? Storm- -- winds may blow, but they can -- not pre -- vail; Safe as a child on the All- -- Fa -- ther’s breast, An -- chored in Je -- sus my soul is at rest."
