[lyrics.1]
text = "Safe in the arms of Je -- sus, Safe on His gen -- tle breast, There by His love o’er -- shad -- ed, Sweet -- ly my soul shall rest. Hark! ’tis the voice of an -- gels, Borne in a song to me. O -- ver the fields of glo -- ry, O -- ver the jas -- per sea."

[lyrics.2]
text = "Safe in the arms of Je -- sus, Safe from cor -- rod -- ing care, Safe from the world’s temp -- ta -- tions, Sin can -- not harm me there. Free from the blight of sor -- row, Free from my doubts and fears; On -- ly a few more tri -- als, On -- ly a few more tears!"

[lyrics.3]
text = "Je -- sus, my heart’s dear re -- fuge, Je -- sus has died for me; Firm on the Rock of A -- ges, Ev -- er my trust shall be. Here let me wait with pa -- tience, Wait till the night is over; Wait till I see the morn -- ing Break on the gold -- en shore."

[lyrics.chorus]
text = "Safe in the arms of Je -- sus, Safe on His gen -- tle breast There by His love o’er -- shad -- ed, Sweet -- ly my soul shall rest."
