[lyrics.1]
text = "Lov -- ing serv -- ice giv -- ing, for the Mas -- ter liv -- ing, La -- bor on, for sun -- set is nigh; Home the har -- vest bring -- ing, keep -- ing prais -- es ring -- ing, @s1"

[lyrics.2]
text = "Meet -- ing tri -- als sweet -- ly, trust -- ing grace com -- plete -- ly, Sure that He in spir -- it is nigh, In His foot -- steps keep -- ing, car -- ry on the reap -- ing, @s1"

[lyrics.3]
text = "In the home -- land yon -- der, nev -- er more to wan -- der, With the friends we love al -- ways nigh, Rest -- ing by the riv -- er, safe at home for -- ev -- er, @s1"

[lyrics.s1]
text = "We shall see the King by and by."

[lyrics.chorus]
text = "We shall see the King by and by, by and by. Prais -- es we shall sing, in the sky; in the sky; Home the har -- vest bring -- ing, keep -- ing prais -- es ring -- ing, We shall see the King by and by. by and by."

