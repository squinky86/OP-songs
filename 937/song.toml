[lyrics.1]
text = "O to be like Thee! bless -- ed Re -- deem -- er, This is my con -- stant long -- ing and pray’r; Glad -- ly I’ll for -- feit all of earth’s treas -- ures, Je -- sus, Thy per -- fect like -- ness to wear."

[lyrics.2]
text = "O to be like Thee! full of com -- pas -- sion, Lov -- ing, for -- giv -- ing, ten -- der and kind; Help -- ing the help -- less, cheer -- ing the faint -- ing, Seek -- ing the wan -- d’ring sin -- ner to find."

[lyrics.3]
text = "O to be like Thee! low -- ly in spir -- it, Ho -- ly and harm -- less, pa -- tient and brave; Meek -- ly en -- dur -- ing cru -- el re -- proach -- es, Will -- ing to suf -- fer, oth -- ers to save."

[lyrics.4]
text = "O to be like Thee! Lord, I am com -- ing, Now to re -- ceive th’a -- noint -- ing di -- vine; All that I am and have I am bring -- ing; Lord, from this mo -- ment all shall be Thine."

[lyrics.chorus]
text = "O to be like Thee! O to be like Thee! bless -- ed Re -- deem -- er, pure as Thou art; Come in Thy sweet -- ness, come in Thy full -- ness; Stamp Thine own im -- age deep on my heart."
