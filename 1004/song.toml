[lyrics.1]
text = "While Je -- sus whis -- pers to you, Come, sin -- ner, come! While we are pray -- ing for you, Come, sin -- ner, come! Now is the time to own Him, Come, sin -- ner, come! Now is the time to know Him, Come, sin -- ner, come!"

