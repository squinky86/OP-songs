[lyrics.1]
text = "Time is filled with swift tran -- si -- tion,— Naught of earth un -- moved can stand,— Build your hopes on things e -- ter -- nal,— Hold to God’s un -- chang -- ing hand."

[lyrics.2]
text = "Trust in Him who will not leave you,— What -- so -- ev -- er years may bring,— If by earth -- ly friends for -- sak -- en,— Still more close -- ly to Him cling."

[lyrics.3]
