[lyrics.1]
text = "There’s sun -- shine in my soul to -- day, More glo -- ri -- ous and bright; Than glows in an -- y earth -- ly skies, For Je -- sus is my light."

[lyrics.2]
text = "There’s mu -- sic in my soul to -- day, A car -- ol to the King; And Je -- sus, lis -- ten -- ing, can hear The songs I can -- not sing."

[lyrics.3]
text = "There’s spring -- time in my soul to -- day, For, when the Lord is near; The dove of peace sings in my heart, The flow’rs of grace ap -- pear."

[lyrics.4]
text = "There’s glad -- ness in my soul to -- day, And hope, and praise, and love; For bless -- ings which He gives me now, For joys “laid up” a -- bove."

[lyrics.chorus]
text = "O there’s sun -- shine, bless -- ed sun -- shine, When the peace -- ful, hap -- py mo -- ments roll; When Je -- sus shows His smil -- ing face, There is sun -- shine in the soul."

