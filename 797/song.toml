[lyrics.1]
text = "’Tis the Sav -- ior plead -- ing, Come, O come to Me; Wea -- ry, heav -- y- -- la -- den, Come, O come to Me. Je -- sus wait -- eth, O so pa -- tient -- ly, Je -- sus call -- eth, O so ten -- der -- ly, @s1"

[lyrics.2]
text = "With a heav -- y bur -- den Is my heart op -- pressed; But a soft voice call -- eth, Come to Me and rest. ’Tis the Sav -- ior speaks so gra -- cious -- ly, All ye heav -- y- -- la -- den, come to Me, @s1"

[lyrics.3]
text = "O I quick will has -- ten At His sum -- mons sweet; I will drop my bur -- den At His bless -- ed feet. O the love so great and won -- der -- ful, O the word so sweet and mer -- ci -- ful, @s1"

[lyrics.s1]
text = "Come to Me, come to Me, Come, O come to Me."
