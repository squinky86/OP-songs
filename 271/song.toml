[lyrics.1]
text = "Just a whis -- pered prayer, And the load of care From the bur -- dened heart is lift -- ed; And a gleam of light Makes the path -- way bright, For the heav -- y clouds are rift -- ed."

[lyrics.2]
text = "Just a whis -- pered prayer, And the load you bear And the dark -- ened path grow light -- er; Where -- so -- e'er thou art, With a lift -- ed heart You will find your skies grow bright -- er."

[lyrics.3]
text = "Just a whis -- pered prayer, And a Friend is there, Who can turn your grief to glad -- ness, Who can fill your days With the notes of praise, Who can give you song for sad -- ness."

[lyrics.chorus]
text = "Do not trav -- el on in dark -- ness, When you may walk in sun -- shine fair; You can find the light, And the path -- way bright, By the aid of a whis -- pered prayer."

