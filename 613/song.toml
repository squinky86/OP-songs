[lyrics.1]
text = "Je -- sus, Thou joy of lov -- ing hearts, Thou Fount of life, Thou Light of men, From all the bliss that earth im -- parts We turn un -- filled to Thee a -- gain."

[lyrics.2]
text = "Thy truth un -- changed has ev -- er stood, Thou sav -- est those who on Thee call; To them that seek Thee Thou art good, To them that find Thee all in all."

[lyrics.3]
text = "On Thee we feast, Thou Liv -- ing Bread, And here would feed up -- on Thee still, Here drink of Thee, Thou Foun -- tain Head, Whose streams each thirst -- ing soul can fill."

[lyrics.4]
text = "Our rest -- less spir -- its yearn for Thee, Wher -- e’er our change -- ful lot is cast; Glad when Thy gra -- cious smile we see, Blest when our faith can hold Thee fast."

[lyrics.5]
text = "O Je -- sus, ev -- er with us stay, Make all our mo -- ments calm and bright, Chase the dark night of sin a -- way, Shed o’er the world Thy ho -- ly light."
