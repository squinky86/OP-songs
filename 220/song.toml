[lyrics.1]
text = "Ev -- 'ry -- bod -- y ought to love my Sav -- ior, Some are stran -- gers to His lov -- ing care, There is room for all who seek His fa -- vor, There is hope for all who feel de -- spair."

[lyrics.2]
text = "Ev -- 'ry -- bod -- y ought to know His bless -- ing, His for -- give -- ness is for ev -- er -- more, Come to Him thy sin and shame con -- fess -- ing, Bro -- ken hearts His mer -- cy can re -- store."

[lyrics.3]
text = "Ev -- 'ry -- bod -- y ought to know His glad -- ness, There is joy for ev -- 'ry troub -- led heart, He will not for -- sake you in your sad -- ness, Let the bless -- ed Lord His joy im -- part."

[lyrics.4]
text = "Ev -- 'ry -- bod -- y ought to know His kind -- ness, O how ten -- der -- ly He deals with men, Tho' your sin- -- sick soul is dark with blind -- ness, He can make you see the light a -- gain."

[lyrics.chorus]
text = "Ev -- 'ry -- bod -- y, ev -- 'ry -- bod -- y, Ev -- 'ry -- bod -- y ought to love Him, Je -- sus died for you and the whole world too, Ev -- 'ry -- bod -- y ought to love Him."
