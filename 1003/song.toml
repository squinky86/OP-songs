[lyrics.1]
text = "When this pass -- ing world is done, When has sunk yon glar -- ing sun, When I stand with Christ on high, Look -- ing o’er life’s his -- to -- ry— Then, Lord, shall I ful -- ly know, Not till then, how much I owe."

[lyrics.2]
text = "When I stand be -- fore the throne, Dressed in beau -- ty not my own, When I see Thee as Thou art, Love Thee with un -- sin -- ning heart— Then, Lord, shall I ful -- ly know, Not till then, how much I owe."

[lyrics.3]
text = "When the praise of heav’n I hear, Loud as thun -- ders to the ear, Loud as ma -- ny wa -- ters’ noise, Sweet as harp’s me -- lo -- dious voice— Then, Lord, shall I ful -- ly know, Not till then, how much I owe."

[lyrics.4]
text = "E’en on earth, as thro’ a glass, Dark -- ly let Thy glo -- ry pass; Make for -- give -- ness feel so sweet; Make Thy Spir -- it’s help so meet; E’en on earth, Lord, make me know Some -- thing of how much I owe."
