[lyrics.1]
text = "When days of toil have all gone by, And I my dear Lord shall see, A word of wel -- come when we shall meet I know will make heav’n for me."

[lyrics.2]
text = "The Fa -- ther’s house, the man -- sions fair, My home shall for -- ev -- er be; But one sweet word from the Lord I love I know will make heav’n for me."

[lyrics.3]
text = "He saved me from my lost es -- tate, From sin He has set me free, And just to see Him when He shall come I know will be heav’n for me."

[lyrics.chorus]
text = "Heav -- en for me, O it will be! When Je -- sus whis -- pers a wel -- come to me, Heav -- en for me, O it will be! When Je -- sus whis -- pers a wel -- come to me."

[parts.Tenor.lyrics.chorus]
text = "Heav -- en for me, O it will be! Heav -- en for me, O it will be! When Je -- sus gives a wel -- come to me, a smile and a wel -- come to me, to me. Heav -- en for me, O it will be! Heav -- en for me, O it will be! When Je -- sus gives a wel -- come to me, a smile and a wel -- come to me."

