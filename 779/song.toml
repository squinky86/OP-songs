[lyrics.1]
text = "We have heard a joy -- ful sound, Je -- sus saves, Je -- sus saves; Spread the glad -- ness all a -- round, Je -- sus saves, Je -- sus saves; Bear the news to ev -- ’ry land, Climb the steeps and cross the waves; On -- ward, ’tis our Lord’s com -- mand, Je -- sus saves, Je -- sus saves."

[lyrics.2]
text = "Waft it on the roll -- ing tide, Je -- sus saves, Je -- sus saves; Tell to sin -- ners far and wide, Je -- sus saves, Je -- sus saves; Sing, ye is -- lands of the sea, Ech -- o back, ye o -- cean caves, Earth shall keep her ju -- bi -- lee, Je -- sus saves, Je -- sus saves."

[lyrics.3]
text = "Sing a -- bove the bat -- tle’s strife, Je -- sus saves, Je -- sus saves; By His death and end -- less life, Je -- sus saves, Je -- sus saves; Sing it soft -- ly thro’ the gloom, When the heart for mer -- cy craves, Sing in tri -- umph o’er the tomb, Je -- sus saves, Je -- sus saves."

[lyrics.4]
text = "Give the winds a might -- y voice, Je -- sus saves, Je -- sus saves; Let the na -- tions now re -- joice, Je -- sus saves, Je -- sus saves; Shout sal -- va -- tion full and free, High -- est hills and deep -- est caves; This our song of vic -- to -- ry, Je -- sus saves, Je -- sus saves."
