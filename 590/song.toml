[lyrics.1]
text = "O way -- ward one, stop now to think, Take time to count the cost; You soon may tot -- ter o’er the brink And be for -- ev -- er lost."

[lyrics.2]
text = "Your path to sure de -- struc -- tion leads, All hope may soon be gone; O why, while Je -- sus sweet -- ly pleads, Still press so blind -- ly on."

[lyrics.3]
text = "The plea -- sures wrong which sin af -- fords, In dark de -- spair will end; Place now your hand with -- in the Lord’s And on His love de -- pend."

[lyrics.4]
text = "Don’t risk your soul an -- oth -- er day— One hour might be too late; From sin and dark -- ness turn a -- way And face the gold -- en gate."

[lyrics.chorus]
text = "Take time to think, take time to -- day, Turn back, poor way -- ward soul; Get back to God, while yet you may, Let Christ your life con -- trol."
