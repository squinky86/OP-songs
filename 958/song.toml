[lyrics.1]
text = "Seek ye first the king -- dom, Not the things of earth; Price -- less are the treas -- ures Of im -- mor -- tal worth. Like a flit -- ting shad -- ow, Time will pass a -- way, But the heav’n -- ly rich -- es Change not, nor de -- cay."

