[lyrics.1]
text = "Oh the joy and peace that will fill ev -- ’ry soul, As they view that home a -- bove; When the wea -- ry pil -- grims of earth reach their goal, God’s e -- ter -- nal home of love."

[lyrics.2]
text = "There will be no death, pain, nor part -- ing a -- gain, But ce -- les -- tial joy and rest; When the saints of God reach the home of the soul, There to be for -- ev -- er blest."

[lyrics.3]
text = "Oh how sweet ’twill be if my friends I shall see, When I reach that home of peace; There to dwell for aye thro’ -- out e -- ter -- nal day, Where my joy shall nev -- er cease."

[lyrics.chorus]
text = "What a home that will be, when the Sav -- ior we see, As with saints and an -- gels we shall roam; Oh, the joys we shall see, sing the songs of the free, When we all reach our bless -- ed home. sweet home."

