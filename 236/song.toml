[lyrics.1]
text = "Some -- bod -- y knows when your heart aches, And ev -- ery -- thing seems to go wrong; Some -- bod -- y knows when the sha -- dows Need chas -- ing a way with a song; Some -- bod -- y knows when you're lone -- ly, Tir -- ed, dis -- cour -- aged and blue; Some -- bod -- y wants you to know Him, And know that He dear -- ly loves you."

[lyrics.2]
text = "Some -- bod -- y cares when you're tempt -- ed, And your mind grows diz -- zy and dim; Some -- bod -- y cares when you're weak -- est, And farth -- est a way _ from Him; Some -- bod -- y grieves when you're fall -- en, You are not lost from His sight; Some -- bod -- y waits for your com -- ing, And He'll drive the gloom from your night."

[lyrics.3]
text = "Some -- bod -- y loves you when wear -- y; 𝄾 Some -- bod -- y loves you when strong; Al -- ways is wait -- ing to help you, He watch -- es you— one of the throng Need -- ing His friend -- ship so ho -- ly, Need -- ing His watch -- care so true; His name? We call His Name Je -- sus; He loves ev -- ery -- one, He loves you."
