[lyrics.1]
text = "’Tis my Lord who knows all my griefs and woes, He, my shield and my ref -- uge, shall be; Naught can harm me here, while, to Him, I’m near, For His grace is suf -- fi -- cient for me!"

[lyrics.2]
text = "I will trust each hour in His sav -- ing power, And His pre -- cepts my coun -- sel shall be; Songs of praise I’ll sing to my Lord and King, For His grace is suf -- fi -- cient for me!"

[lyrics.3]
text = "He’s a faith -- ful Friend, ev -- en to the end, Yea, and like Him no oth -- er can be; He’s my hope, my all, on His name I call, For His grace is suf -- fi -- cient for me!"

[lyrics.4]
text = "When I’m bowed with care then I go in prayer, Un -- to Him, for He hear -- eth my plea, Giv -- ing com -- fort sweet, all my needs to meet, Yes, His grace is suf -- fi -- cient for me!"

[lyrics.chorus]
text = "His grace is suf -- fi -- cient for me, for me, His grace is suf -- fi -- cient for me; Naught can harm me here, while, to Him, I’m near, For His grace is suf -- fi -- cient for me!"
