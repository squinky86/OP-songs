[lyrics.1]
text = "Scat -- ter -- ing pre -- cious seed by the way -- side, Scat -- ter -- ing pre -- cious seed by the hill -- side; Scat -- ter -- ing pre -- cious seed o’er the field, wide, Scat -- ter -- ing pre -- cious seed by the way."

[lyrics.2]
text = "Scat -- ter -- ing pre -- cious seed for the grow -- ing, Scat -- ter -- ing pre -- cious seed, free -- ly sow -- ing, Scat -- ter -- ing pre -- cious seed, trust -- ing, know -- ing, Sure -- ly the Lord will send it the rain."

[lyrics.3]
text = "Scat -- ter -- ing pre -- cious seed, doubt -- ing nev -- er, Scat -- ter -- ing pre -- cious seed, trust -- ing ev -- er; Sow -- ing the word with prayer and en -- deav -- or, Trust -- ing the Lord for growth and for yield."

[lyrics.chorus]
text = "Sow -- ing in the morn -- ing, Sow -- ing at the noon -- tide; Sow -- ing in the even -- ing, Sow -- ing the pre -- cious seed by the way."
