[lyrics.1]
text = "Lord of all be -- ing, throned a -- far, Thy glo -- ry flames from sun and star; Cen -- tre and soul of ev -- 'ry sphere, Yet to each lov -- ing heart how near!"

[lyrics.2]
text = "Sun of our life, Thy quick -- 'ning ray Sheds on our path the glow of day; Star of our hope, Thy soft -- ened light Cheers the long watch -- es of the night."

[lyrics.3]
text = "Our mid -- night is Thy smile with -- drawn; Our noon -- tide is Thy gra -- cious dawn; Our rain -- bow arch Thy mer -- cy's sign; All, save the clouds of sin, are Thine!"

[lyrics.4]
text = "Lord of all life, be -- low, a -- bove, Whose light is truth, Whose warmth is love, Be -- fore Thy ev -- er- -- blaz -- ing throne We ask no lus -- tre of our own."

[lyrics.5]
text = "Grant us Thy truth to make us free, And kin -- dling hearts that burn for Thee, Till all Thy liv -- ing al -- tars claim One ho -- ly light, one heav -- 'nly flame."
