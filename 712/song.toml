text = "Send it out of His Son, make it heard by each one: Send it out, sing it out in all hearts im -- pearled. Tones of joy, voice em -- ploy, keep His flag un -- furled; Oh, for His glo -- ry, in song and sto -- ry, Send out the word to all the world."

