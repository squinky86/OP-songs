[lyrics.1]
text = "Sav -- ior, grant me rest and peace, Let my troub -- led dream -- ings cease; With the chim -- ing mid -- night bell, Teach my heart that “All is well.”"

[lyrics.2]
text = "I would trust my all with Thee, All my cares and sor -- rows flee, Till the break -- ing light shall tell, Night is past, and “All is well.”"

[lyrics.3]
text = "I would seek Thy serv -- ice, Lord, Lean -- ing on Thy prom -- ise- -- word; Let my hour -- ly la -- bors tell, I am Thine, and “All is well.”"
