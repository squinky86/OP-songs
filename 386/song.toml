[lyrics.1]
text = "My life, my love I give to Thee, Thou Lamb of God who died for me; O may I ev -- er faith -- ful be, My Sav -- ior and my God!"

[lyrics.2]
text = "I now be -- lieve Thou dost re -- ceive, For Thou hast died that I might live; And now hence -- forth I trust in Thee, My Sav -- ior and my God!"

[lyrics.3]
text = "O Thou who died on Cal -- va -- ry, To save my soul and make me free, I’ll con -- se -- crate my life to Thee, My Sav -- ior and my God!"

[lyrics.chorus]
text = "I’ll live for Him who died for me, How hap -- py then my life shall be! I’ll live for Him who died for me, My Sav -- ior and my God!"
