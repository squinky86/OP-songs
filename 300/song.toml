[lyrics.1]
text = "O some -- times the sha -- dows are deep, And rough seems the path to the goal, And sor -- rows, some -- times how they sweep Like tem -- pests down o -- ver the soul."

[lyrics.2]
text = "O some -- times how long seems the day, And some -- times how wear -- y my feet; But toil -- ing in life’s dust -- y way, The Rock’s bless -- èd sha -- dow, how sweet!"

[lyrics.3]
text = "O near to the Rock let me keep If bless -- ings or sor -- rows pre -- vail, Or climb -- ing the mount -- ain way steep, Or walk -- ing the sha -- dow -- y vale."

[lyrics.chorus]
text = "O then to the Rock let me fly, let me fly, To the Rock that is high -- er is high -- er than I; O then to the Rock let me fly, let me fly, To the Rock that is high -- er than I!"

[parts.Soprano.lyrics.chorus]
text = "O then to the Rock let me fly, To the Rock that is high -- er than I; O then to the Rock let me fly, To the Rock that is high -- er than I!"
