[lyrics.1]
text = "I’ve a home pre -- pared where the saints a -- bide, Just o -- ver in the glo -- ry- -- land; And I long to be by my Sav -- ior’s side, Just o -- ver in the glo -- ry- -- land."

[lyrics.2]
text = "I am on my way to those man -- sions fair, Just o -- ver in the glo -- ry- -- land; There to sing God’s praise, and His glo -- ry share, Just o -- ver in the glo -- ry- -- land."

[lyrics.3]
text = "What a joy -- ful tho’t, that my Lord I’ll see, Just o -- ver in the glo -- ry- -- land; And with kin -- dred saved, there for -- ev -- er be, Just o -- ver in the glo -- ry- -- land."

[lyrics.4]
text = "With the blood -- washed throng I will shout and sing, Just o -- ver in the glo -- ry- -- land; Glad ho -- san -- nas to Christ, the Lord and King, Just o -- ver in the glo -- ry- -- land."

