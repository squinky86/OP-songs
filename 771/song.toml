[lyrics.1]
text = "How sweet and hap -- py seem those days of which I dream, When mem -- o -- ry re -- calls them now and then! And with that rap -- ture sweet my wea -- ry heart would beat, If I could hear my moth -- er pray a -- gain."

[lyrics.2]
text = "She used to pray that I on Je -- sus would re -- ly, And al -- ways walk the shin -- ing gos -- pel way: So trust -- ing still His love I seek that home a -- bove, Where I shall meet my moth -- er some glad day."

[lyrics.3]
text = "With -- in the old home- -- place, her pa -- tient, smil -- ing face, Was al -- ways spread -- ing com -- fort, hope and cheer; And when she used to sing to her e -- ter -- nal King. It was the songs the an -- gels loved to hear."

[lyrics.4]
text = "Her work on earth is done, the life- -- crown has been won, And she will be at rest with Him a -- bove; And some glad morn -- ing, she I know will wel -- come me To that e -- ter -- nal home of peace and love."

[lyrics.chorus]
text = "If I could hear my moth -- er pray a -- gain, If I could hear her ten -- der voice as then! So glad I’d be, ’twould mean so much to me, If I could hear my moth -- er pray a -- gain."

[parts.Alto.lyrics.chorus]
text = "If I could on -- ly hear my moth -- er pray a -- gain, If I could on -- ly hear her ten -- der voice as then! So hap -- py I should be, ’twould mean so much to me, If I could hear my moth -- er pray a -- gain."

[parts.Tenor.lyrics.chorus]
text = "If I could hear my moth -- er pray a -- gain, If I could on -- ly hear her ten -- der voice as then! So glad I’d be, ’twould mean so much to me, If I could hear my moth -- er pray a -- gain."

[parts.Bass.lyrics.chorus]
text = "If I could on -- ly hear my moth -- er pray a -- gain, If I could hear her ten -- der voice as then! So hap -- py I should be, ’twould mean so much to me, If I could hear my moth -- er pray a -- gain."
