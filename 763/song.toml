[lyrics.1]
text = "There is naught to fear in the des -- ert drear, When Je -- ho -- vah leads the way; For He knows the road to the glad a -- bode In the land of fade -- less day, Tri -- als great to meet, but we still keep sweet, For He fills our man -- y needs; He will keep us true till the march is thro’, All is well when Je -- ho -- vah leads."

[lyrics.2]
text = "There are times when we scarce a home -- light see, But, by faith, we still trust on For the break of day is not far a -- way, And the night will soon be gone. Man -- y foes as -- sail, but they ev -- er fail,— None the call to wan -- der heeds; We have naught to dread in the days a -- head, All is well when Je -- ho -- vah leads."

[lyrics.3]
text = "Soon the lights of home, shin -- ing thro’ the gloom, Ver -- y clear -- ly we shall see: Soon the friends who wait at the pear -- ly gate Will be greet -- ing you and me. So let songs of joy heart and voice em -- ploy, While the time of dark -- ness speeds; For we soon shall rest in His king -- dom blest, All is well when Je -- ho -- vah leads."

[lyrics.chorus]
text = "All’s well all’s well Safe He keeps His own; Day by day clear to us His love is shown. So we’ll trav -- el on till we greet the dawn, Sure our plea and call He heeds; We shall reach the gates where our glo -- ry waits, All is well when Je -- ho -- vah sure -- ly leads."

[parts.Soprano.lyrics.chorus]
text = "All’s well all’s well Safe He keeps His own; Day by day clear to us His love is shown. Come the bright dawn, each call and plea He heeds; We shall reach the gates where our glo -- ry waits, All is well when Je -- ho -- vah leads."

[parts.Tenor.lyrics.chorus]
text = "All’s well all’s well Safe He keeps His own; Day by day clear to us His love is shown. Come the bright dawn, each call plea He heeds; We shall reach the gates where our glo -- ry waits, All is well when Je -- ho -- vah sure -- ly leads."

[parts.Bass.lyrics.chorus]
text = "All is well, we know, When Je -- ho -- vah leads, For He safe -- ly keeps His own; Day by day He fills all our man -- y needs And His love is clear -- ly shown. Come the bright dawn, each call heeds; We shall reach the gates where our glo -- ry waits, All is well when Je -- ho -- vah leads."
