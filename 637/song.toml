[lyrics.1]
text = ""

[parts.Bass.lyrics.1]
text = "Tho the sor -- rows of life press me sore, And the star of my hope seems to hide, Still I trust thru the dark -- ness and pain, For I know I shall be sat -- is -- fied."

[lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = "Help me, Lord, still in hope to re -- joice, And be pa -- tient when bit -- ter -- ly tried, And be faith -- ful e’en un -- to the end, And at last I shall be sat -- is -- fied."

[lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = "O how per -- fect the love, peace and home, Of the souls who with loved ones a -- bide ’Round the throne of the Sav -- ior and King, Thru whose blood they are all sat -- is -- fied."

[lyrics.chorus]
text = "Sat -- is -- fied, sat -- is -- fied, O my soul, thou shalt be sat -- is -- fied; Sat -- is -- fied, sat -- is -- fied, O my soul, thou shalt be sat -- is -- fied."

