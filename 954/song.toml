[lyrics.1]
text = "Sav -- ior, bless -- ed Sav -- ior, Lis -- ten while we sing; Hearts and voi -- ces rais -- ing Prais -- es to our King. All we have we of -- fer, All we hope to be; Bod -- y, soul, and spir -- it, All, we yield to Thee."

[lyrics.2]
text = "Near -- er, ev -- er near -- er, Christ, we draw to Thee, Deep in ad -- o -- ra -- tion— Bend -- ing low the knee: Thou for our re -- demp -- tion Cam’st on earth to die: Thou, that we might fol -- low, Hast gone up on high."

[lyrics.3]
text = "Great, and ev -- er great -- er Are Thy mer -- cies here; True and ev -- er -- last -- ing Are the glo -- ries there; Where no pain, or sor -- row, Toil, or care, is known, Where the an -- gel le -- gions Cir -- cle round Thy throne."
