[lyrics.1]
text = "I have a Pi -- lot to guide my bark Safe -- ly o'er the wave, tho' the night be dark; Track -- less the deep, He the course will mark, When my life with the tide goes out."

[lyrics.2]
text = "Pain there may be, and some sad fare -- wells Ere my boat starts out on the o -- cean swells; But with my Sav -- iour all hap -- piness dwells, When my life with the tide goes out."

[lyrics.3]
text = "O -- ver the wave on the far -- ther shore, I will have a man -- sion for ev -- er -- more; Mine it will be when earth days are o'er, When my life with the tide goes out."

[lyrics.chorus]
text = "When my life with the tide goes out; When my life with the tide goes out, goes out; Then my Sav -- ior I'll see, my Pi -- lot is He, When my life with the tide goes out."

[parts.Soprano.lyrics.chorus]
text = "When my life with the tide goes out; goes out, When my life with the tide goes out, goes out; Then my Sav -- ior I'll see, my Pi -- lot is He, with the tide goes out. goes out."

[parts.Tenor.lyrics.chorus]
text = "When my life with the tide goes out; goes out, When my life with the tide goes out, goes out; Then my Sav -- ior I'll see, my Pi -- lot is He, with the tide goes out. goes out."

[parts.Bass.lyrics.chorus]
text = "When my life with the tide goes out; When my life with the tide goes out, goes out; Then my Sav -- ior I'll see, my Pi -- lot is He, with the tide goes out."
