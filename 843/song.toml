[lyrics.1]
text = "Hail, morn -- ing known a -- mong the blest! Morn -- ing of hope and joy and love; Of heav’n -- ly peace and ho -- ly rest, The pledge of end -- less rest a -- bove."

[lyrics.2]
text = "Blest be the Fa -- ther of our Lord, Who from the dead has bro’t His Son! Hope to the lost was then re -- stored, And ev -- er -- last -- ing glo -- ry won."

[lyrics.3]
text = "Scarce morn -- ing twi -- light had be -- gun To chase the shades of night a -- way, When Christ a -- rose— un -- set -- ting Sun— The dawn of joy’s e -- ter -- nal day!"

[lyrics.4]
text = "Mer -- cy looked down with smil -- ing eye When our Im -- man -- uel left the dead; Faith marked His bright as -- cent on high, And Hope with glad -- ness raised her head."

[lyrics.5]
text = "God’s good -- ness let us bear in mind, Who to His saints this day has giv’n, For rest and se -- rious joy de -- signed, To fit us for the bliss of heav’n."
