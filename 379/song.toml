[lyrics.1]
text = "An -- gels, roll the rock a -- way, Death, yield up your might -- y prey. See, the Sav -- ior leaves the tomb, Glow -- ing with im -- mor -- tal bloom, Glow -- ing with im -- mor -- tal bloom."

[lyrics.2]
text = "’Tis the Sav -- ior. An -- gels, raise Fame’s e -- ter -- nal trump of praise. Let the earth’s re -- mot -- est bound Hear the joy in -- spir -- ing sound, Hear the joy in -- spir -- ing sound."

[lyrics.3]
text = "Now ye saints, lift up your eyes Now to glo -- ry see Him rise, In long tri -- umph up the sky, Up to wait -- ing worlds on high, Up to wait -- ing worlds on high."

[lyrics.4]
text = "Heav’n dis -- plays her por -- tals wide, Gra -- cious He -- ro, through them ride; King of glo -- ry, mount Thy throne, Bound -- less em -- pire is Thine own, Bound -- less em -- pire is Thine own."

[lyrics.5]
text = "Praise Him, all ye heav’n -- ly choirs, Praise, and sweep your gol -- den lyres, Shout, O earth, in rap -- t’rous song; Let the strains be sweet and strong, Let the strains be sweet and strong."

[lyrics.6]
text = "Ev -- ’ry note with won -- der swell, Sin o’er -- thrown, and cap -- tived hell, Where is hell’s once dread -- ed king? Where, O death, thy mor -- tal sting? Where, O death, thy mor -- tal sting?"
