commentary = "<p>In verse 3, this song may contain an archaic meaning of the word \"mansion\" or reflect a misunderstanding of its translation. In the chorus, the original song contained a consummational (rather than an ecclesiastical) reading of Revelation 21 which has been changed from \"The streets, I am told, are paved with pure gold,\" to \"My Shepherd will hold me close in His fold.\" See <a href=\"/blog/20261022-mansions-and-dwellings\">From Mansions to Dwellings</a>.</p>"

