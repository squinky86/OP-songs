# Transcribed by hand from a scan of the 1928 Rodeheaver plate (page 13).
# Layout: soprano + alto share the treble staff, tenor + bass the bass staff;
# the two voices on a staff share a stem, so all four parts share one rhythm
# (the only exception is the alto's slurred F#4-D4 on "love" in the last bar).
# Unisons are printed as a single notehead with stems both ways.
# The plate flags every eighth individually - there are no beams anywhere -
# and every note carries its own syllable, so there are no melismas either.

