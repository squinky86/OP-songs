[lyrics.1]
text = "Come, ev -- ery soul by sin op -- pressed; There’s mer -- cy with the Lord, And He will sure -- ly give you rest By trust -- ing in His Word."

[lyrics.2]
text = "For Je -- sus shed His pre -- cious blood Rich bless -- ings to be -- stow; Plunge now in -- to the crim -- son flood That wash -- es white as snow."

[lyrics.3]
text = "Yes, Je -- sus is the Truth, the Way, That leads you in -- to rest; Be -- lieve in Him with -- out de -- lay And you are full -- y blessed."

[lyrics.4]
text = "Come, then, and join this ho -- ly band, And on to glo -- ry go To dwell in that ce -- les -- tial land Where joys im -- mor -- tal flow."

[lyrics.5]
text = "O Je -- sus, bless -- èd Je -- sus, dear, I’m com -- ing now to Thee; Since Thou hast made the way so clear And full sal -- va -- tion free."

[lyrics.chorus]
text = "On -- ly trust Him, on -- ly trust Him, On -- ly trust Him now; He will save you, He will save you, He will save you now."
