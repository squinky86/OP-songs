[lyrics.1]
text = "What a fel -- low -- ship, what a joy di -- vine, Lean -- ing on the ev -- er -- last -- ing arms; What a bless -- ed -- ness, what a peace is mine, Lean -- ing on the ev -- er -- last -- ing arms."

[lyrics.2]
text = "Oh, how sweet to walk in this pil -- grim way, Lean -- ing on the ev -- er -- last -- ing arms; Oh, how bright the path grows from day to day, Lean -- ing on the ev -- er -- last -- ing arms."

[lyrics.3]
text = "What have I to dread, what have I to fear, Lean -- ing on the ev -- er -- last -- ing arms? I have bless -- ed peace with my Lord so near, Lean -- ing on the ev -- er -- last -- ing arms."

[lyrics.chorus]
text = "Lean -- ing, lean -- ing, Safe and se -- cure from all a -- larms; Lean -- ing, lean -- ing, Lean -- ing on the ev -- er -- last -- ing arms."

[parts.Tenor.lyrics.chorus]
text = "Lean -- ing on Je -- sus, lean -- ing on Je -- sus, Safe and se -- cure from all a -- larms; Lean -- ing on Je -- sus, lean -- ing on Je -- sus, Lean -- ing on the ev -- er -- last -- ing arms."

