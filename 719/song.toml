[lyrics.1]
text = "As I jour -- ney thro’ the land sing -- ing as I go, Point -- ing souls to Cal -- va -- ry— to the crim -- son flow, Ma -- ny ar -- rows pierce my soul from with -- out, with -- in; But my Lord leads me on, thro’ Him I must win."

[lyrics.2]
text = "When in ser -- vice for my Lord dark may be the night, But I’ll cling more close to Him, He will give me light; Sa -- tan’s snares may vex my soul, turn my tho’ts a -- side; But my Lord goes a -- head, leads what -- e’er be -- tide."

[lyrics.3]
text = "When in val -- leys low I look tow’rd the moun -- tain height, And be -- hold my Sav -- ior there, lead -- ing in the fight, With a ten -- der hand out -- stretched tow’rd the val -- ley low, Guid -- ing me, I can see, as I on -- ward go."

[lyrics.4]
text = "When be -- fore me bil -- lows rise from the migh -- ty deep, Then my Lord di -- rects my bark; He doth safe -- ly keep, And He leads me gent -- ly on thro’ this world be -- low; He’s a real Friend to me, O I love Him so."

[lyrics.chorus]
text = "O I want to see Him, look up -- on His face, There to sing for -- ev -- er of His sav -- ing grace; On the streets of Glo -- ry let me lift my voice; Cares all past, Home at last, ev -- er to re -- joice."

[parts.Tenor.lyrics.chorus]
text = "O I want to see Him, look up -- on His face, There to sing for -- ev -- er of His sav -- ing grace; His sav -- ing grace; On the streets of Glo -- ry let me lift my voice; Cares all past, Home at last, ev -- er to re -- joice."

[parts.Bass.lyrics.chorus]
text = "O I want to see Him, look up -- on His face, There to sing for -- ev -- er of His sav -- ing grace; His sav -- ing grace; On the streets of Glo -- ry let me lift my voice; Cares all past, Home at last, ev -- er to re -- joice."
