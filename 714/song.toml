[lyrics.1]
text = "Oft when the twi -- light gath -- ers a -- round me, Clear, in the shad -- ows, fa -- ces I see; Deep in the stil -- ness voic -- es are call -- ing, Loved ones are call -- ing, call -- ing for me."

