[lyrics.1]
text = "Thro' the mist of years I can seem to see The church of my child -- hood days; And it's mem -- 'ries sweet, so with joy re -- plete, Shall live in my heart al -- way."

[lyrics.2]
text = "And the old, old songs that we used to sing, I'm sing -- ing them o'er and o'er; They give strength and cheer, when the clouds draw near, And lead to the oth -- er shore."

[lyrics.3]
text = "At the place of pray'r, in that lit -- tle church, I knelt at my moth -- er's side, There the Lord I found, it is ho -- ly ground, The One who for sin -- ners died."

[lyrics.4]
text = "There's a hal -- lowed spot 'neath the old pine tree, Where moth -- er was laid to rest; What a joy 'twill be her dear face to see, With Him that I love the best."

[lyrics.chorus]
text = "Then on mem -- o -- ry's page I can see a -- gain, The church by the side of the road; And wher -- ev -- er I roam, it is guid -- ing me home, The church by the side of the road."
