[lyrics.1]
text = "Je -- sus calls us o'er the tu -- mult Of our life's wild, rest -- less sea; Day by day His sweet voice sound -- eth, Say -- ing, \"Chris -- tian, fol -- low Me.\""

[lyrics.2]
text = "Je -- sus calls us from the wor -- ship Of the vain world's gol -- den store, From each i -- dol that would keep us, Say -- ing, \"Chris -- tian, love Me more.\""

[lyrics.3]
text = "In our joys and in our sor -- rows, Days of toil and hours of ease, Still He calls, in cares and plea -- sures, \"Chris -- tian, love Me more than these.\""

[lyrics.4]
text = "Je -- sus calls us— by Thy mer -- cies, Sa -- vior, may we hear Thy call, Give our hearts to Thine o -- be -- dience, Serve and love Thee best of all."
