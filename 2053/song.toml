[lyrics.1]
text = "Is there a shad -- ow of sin on your heart? Take it to Je -- sus right now. He— and no oth -- er— can make it de -- part. Take it to Je -- sus right now."

[lyrics.2]
text = "Have you a bur -- den of sor -- row to bear? Take it to Je -- sus right now. Com -- fort most pre -- cious will come to you there. Take it to Je -- sus right now."

[lyrics.3]
text = "Have you a weak -- ness which caus -- es you pain? Take it to Je -- sus right now. Strength in a -- bun -- dance your soul shall ob -- tain. Take it to Je -- sus right now."

[lyrics.chorus]
text = "Take it to Je -- sus your Sav -- ior and friend; In His dear Pres -- ence your tri -- als shall end. Al -- ways on Him may His chil -- dren de -- pend. Take it to Je -- sus right now."
