[lyrics.1]
text = "Take Thou my hand and lead me, From day to day; “Not my will, but as Thou wilt,” Teach me to say; I can -- not walk with -- out Thee, One step, not one; Where Thou dost go or tar -- ry I fol -- low on."

[lyrics.2]
text = "Deep in Thy mer -- cy fold me, In joy or pain, With -- out Thy might to hold me I stray a -- gain; Thy word of peace and heal -- ing, Thy guid -- ance kind, Sur -- pass all sight or feel -- ing— I fol -- low, blind."

[lyrics.3]
text = "When dark -- ness is the deep -- est, The path un -- known, Thy watch Thou ev -- er keep -- est, Thou faith -- ful One; Take Thou my hand and lead me, Thro’ all my way, Un -- til at last I see Thee In end -- less day."
