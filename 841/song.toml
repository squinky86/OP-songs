[lyrics.1]
text = "From Green -- land’s i -- cy moun -- tains, From In -- dia’s cor -- al strand; Where Af -- ric’s sun -- ny foun -- tains Roll down their gold -- en sand; From many an an -- cient riv -- er, From man -- y'a palm -- y plain, They call us to de -- liv -- er Their land from er -- ror’s chain."

[lyrics.2]
text = "What tho’ the spi -- cy breez -- es Blow soft o’er Cey -- lon’s isle— Tho’ ev -- ’ry pros -- pect pleas -- es, And on -- ly man is vile! In vain, with lav -- ish kind -- ness, The gifts of God are strown; The hea -- then, in their blind -- ness, Bow down to wood and stone."

[lyrics.3]
text = "Shall we, whose souls are light -- ed With wis -- dom from on high— Shall we to man be -- night -- ed The lamp of life de -- ny? Sal -- va -- tion! O sal -- va -- tion! The joy -- ful sound pro -- claim, Till earth’s re -- mot -- est na -- tion Has heard Mes -- si -- ah’s name."

[lyrics.4]
text = "Waft, waft, ye winds, His sto -- ry; And you, ye wa -- ters, roll, Till, like a sea of glo -- ry, It spreads from pole to pole; And o’er our ran -- somed na -- ture, The Lamb for sin -- ners slain, Re -- deem -- er, King, Cre -- a -- tor, In bliss re -- turns to reign."
