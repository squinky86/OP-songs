[lyrics.1]
text = "The day of res -- ur -- rec -- tion, Earth, tell it out a -- broad, The pass -- o -- ver of glad -- ness, The pass -- o -- ver of God. From death to life e -- ter -- nal, From earth un -- to the sky, Our Christ hath brought us o -- ver, With hymns of vic -- to -- ry."

[lyrics.2]
text = "Our hearts be pure from e -- vil, That we may see a -- right The Lord in rays e -- ter -- nal Of res -- ur -- rec -- tion light; And list -- ’ning to His ac -- cents, May hear, so calm and plain, His own “All hail!” and, hear -- ing, May raise the vic -- tor strain."

[lyrics.3]
text = "Now let the heav’ns be joy -- ful! Let earth her song be -- gin! Let the round world keep tri -- umph, And all that is there -- in! Let all things seen and un -- seen Their notes in glad -- ness blend, For Christ the Lord hath ris -- en, Our joy that hath no end."
