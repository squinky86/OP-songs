[lyrics.1]
text = "There’s a place, a dear and hal -- lowed spot Which the eye of faith can see; And by saints it can ne’er be for -- got, ’Tis the place called Cal -- va -- ry."

[lyrics.2]
text = "What, oh what a scene was there dis -- played Of great love and ag -- o -- ny, When our dear Re -- deem -- er bowed His head, And there died on Cal -- va -- ry."

[lyrics.3]
text = "When I’m faint -- ing un -- der guilt’s great load, May this be my on -- ly plea; That I’ll trust the mer -- its of that blood Which poured out on Cal -- va -- ry."

[lyrics.4]
text = "When death’s dark scene comes— all tri -- als past, And the an -- gels call for me; I then with my dy -- ing eyes shall cast One more look at Cal -- va -- ry."

[lyrics.chorus]
text = "Oh Cal -- va -- ry, oh Cal -- va -- ry, Where Je -- sus shed His blood for me, To save my soul, how can it be, He gave His life to set me free."
