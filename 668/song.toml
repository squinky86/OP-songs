[lyrics.1]
text = "In ev’ -- ry -- thing you do or say, Put God first; Tho rough or smooth may be the way, Put God first; He see -- eth ev’ -- ry -- thing you do, Be care -- ful lest you prove un -- true, Put God first."

[parts.Tenor.lyrics.1]
text = "In ev’ -- ry -- thing you do or say, Put God first; Tho rough or smooth may be the way, Put God first; As swift life’s jour -- ney you pur -- sue, Be care -- ful lest you prove un -- true, Put God first."

[parts.Bass.lyrics.1]
text = "In ev’ -- ry -- thing you do or say, Put God first; Tho rough or smooth may be the way, Put God first; As swift life’s jour -- ney you pur -- sue, Be care -- ful lest you prove un -- true, Put God first."

[lyrics.2]
text = "When you are tempt -- ed to do wrong, Put God first; If sin -- ful men a -- round you throng, Put God first; It nev -- er pays right things to yield, Your strength for good be glad to wield, Put God first."

[parts.Tenor.lyrics.2]
text = "When you are tempt -- ed to do wrong, Put God first; If sin -- ful men a -- round you throng, Put God first; Tho Sa -- tan’s hordes may take the field, Your strength for good be glad to wield, Put God first."

[parts.Bass.lyrics.2]
text = "When you are tempt -- ed to do wrong, Put God first; If sin -- ful men a -- round you throng, Put God first; Tho Sa -- tan’s hordes may take the field, Your strength for good be glad to wield, Put God first."

[lyrics.3]
text = "When sor -- row’s winds a -- round you blow, Put God first; Tho all His plans you do not know, Put God first; “He holds the fu -- ture in His hands,” Your ver -- y soul be -- fore Him stands, Put God first."

[parts.Tenor.lyrics.3]
text = "When sor -- row’s winds a -- round you blow, Put God first; Tho all His plans you do not know, Put God first; The winds o -- bey His blest com -- mands, Your ver -- y soul be -- fore Him stands, Put God first."

[parts.Bass.lyrics.3]
