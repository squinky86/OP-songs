[lyrics.1]
text = "“Oth -- ers He saved, Him -- self He could not save,” So scoffed the priests, and up -- ward rolled the wave Of blas -- phe -- my a -- gainst the dy -- ing Lord, Un -- til it broke up -- on the throne of God."

[lyrics.2]
text = "“Oth -- ers He saved, Him -- self He did not save,” So sighed the mourn -- ers round the Sav -- ior’s grave; Their grief em -- bit -- tered by the mys -- ter -- y Why He, who Laz’ -- rus raised, Him -- self need die,"

[lyrics.3]
text = "“Oth -- ers to save, Him -- self He would not save,” There rests the truth, His life for us He gave: O ru -- ined heart! thy Sav -- ior had to choose, If He should die, or thou sal -- va -- tion lose."
