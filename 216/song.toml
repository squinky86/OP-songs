[lyrics.1]
text = "I must needs go home by the way of the cross, There’s no oth -- er way but this; I shall ne’er get sight of the Gates of Light, If the way of the cross I miss."

[lyrics.2]
text = "I must needs go on in the blood- -- sprin -- kled way, The path that the Sav -- ior trod, If I ev -- er climb to the heights sub -- lime, Where the soul is at home with God."

[lyrics.3]
text = "Then I bid fare -- well to the way of the world, To walk in it nev -- er -- more; For my Lord says, “Come,” and I seek my home, Where He waits at the o -- pen door."

[lyrics.chorus]
text = "The way of the cross leads home, The way of the cross leads home; It is sweet to know, as I on -- ward go, The way of the cross leads home."

# Refrain echo: while the soprano holds "home," / "home;" for three beats, the
# lower three voices answer "leads home," / "leads home;" on the repeated notes
# of measures 11 and 13. The printed engraving spells the echo out only on the
# lower lyric line; it is given to alto, tenor and bass here because all three
# re-articulate those notes.
[parts.Alto.lyrics.chorus]
text = "The way of the cross leads home, leads home, The way of the cross leads home; leads home; It is sweet to know, as I on -- ward go, The way of the cross leads home."

[parts.Tenor.lyrics.chorus]
text = "The way of the cross leads home, leads home, The way of the cross leads home; leads home; It is sweet to know, as I on -- ward go, The way of the cross leads home."

[parts.Bass.lyrics.chorus]
