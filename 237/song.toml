[lyrics.1]
text = "Bright -- ly gleams our ban -- ner, Point -- ing to the sky, Wav -- ing wand -- 'rers on -- ward To their home on high. Jour -- n'ying o'er the des -- ert, Glad -- ly thus we pray, And with hearts u -- nit -- ed Take our heav'n -- ward way."

[lyrics.2]
text = "Je -- sus, Lord and Mas -- ter, At Thy sa -- cred feet, Here with hearts re -- joic -- ing See Thy chil -- dren meet; Oft -- en have we left Thee, Oft -- en gone a -- stray; Keep us, might -- y Sav -- ior, In the nar -- row way."

[lyrics.3]
text = "All our days di -- rect us In the way we go; Lead us on vic -- to -- rious O -- ver ev -- 'ry foe; Bid Thine an -- gels shield us When the storm -- clouds low'r; Par -- don, Lord, and save us In the last dread hour."

[lyrics.4]
text = "Then with saints and an -- gels May we join a -- bove, Off -- 'ring prayers and prais -- es At Thy throne of love; When the toil is o -- ver, Then come rest and peace, Je -- sus in His beau -- ty, Songs that nev -- er cease."

[lyrics.chorus]
text = "Bright -- ly gleams our ban -- ner, Point -- ing to the sky, Wav -- ing wand -- 'rers on -- ward To their home on high."
