[lyrics.1]
text = "I ask not, Lord, for less to bear, Of bur -- dens here be -- low; Nor do I pray that I may share Earth’s pleas -- ures as I go."

[lyrics.2]
text = "I pray for naught that earth can give, Of wealth or fame or pow’r; Nor would I wish to ev -- er live In sin’s dark, try -- ing hour."

[lyrics.3]
text = "Give me a hum -- ble, peace -- ful heart, From pride and en -- vy free; From all im -- pu -- ri -- ties a -- part, And more, my God, like Thee."

[lyrics.chorus]
text = "Lord, this I pray: Make me to know Thy ho -- ly, sov -- ’reign will; And know -- ing, give me strength to do, And Thy be -- hests ful -- fil."
