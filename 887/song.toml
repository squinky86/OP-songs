[lyrics.1]
text = "Je -- sus, mer -- ci -- ful and mild, Lead me as a help -- less child; On no oth -- er arm but Thine Would my wea -- ry soul re -- cline; Thou art read -- y to for -- give, Thou canst bid the sin -- ner live— Guide the wan -- d’rer, day by day, In the straight and nar -- row way."

[lyrics.2]
text = "Thou canst fit me by Thy grace, For the heav’n -- ly dwell -- ing- -- place; All Thy prom -- is -- es are sure, Ev -- er shall Thy love en -- dure; Then what more could I de -- sire? How to great -- er bliss as -- pire? All I need in Thee I see; Thou art all in all to me."
