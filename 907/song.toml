[lyrics.1]
text = "Might -- y Rock, whose tow’ -- ring form Looks a -- bove the frown -- ing storm; Rock a -- mid the des -- ert waste, To Thy shad -- ow now I haste."

[lyrics.2]
text = "Of the springs that from Thee burst, Let me drink and quench my thirst; Wea -- ry, faint -- ing, toil op -- pressed, In Thy shad -- ow let me rest."

[lyrics.3]
text = "When I near the stream of death, When I feel its chill -- y breath, Rock where all my hopes a -- bide, In Thy shad -- ow let me hide."

[lyrics.chorus]
text = "Un -- to Thee, un -- to Thee, Pre -- cious Sav -- ior, now I flee; Rock of A -- ges, cleft for me, Let me hide my -- self in Thee."
