[lyrics.1]
text = "The Sav -- ior bought you with a price, So great that none can un -- der -- stand How deep His love for lost man -- kind, How just and right -- eous His de -- mand."

[lyrics.2]
text = "The Sav -- ior bought you with a price, No oth -- er one could set you free; His work of grace will ev -- er stand Through -- out a long e -- ter -- ni -- ty."

[lyrics.3]
text = "The Sav -- ior bought you with a price, And yet, re -- fus -- ing Him, you live; His claim is just, and of -- fers peace To all who will their whole life give."

[lyrics.4]
text = "Oh, doubt -- ing soul, why tar -- ry still? The sha -- dows length -- en in -- to night; ’Tis true, that who -- so -- ev -- er will May leave the dark -- ness for the light."

[lyrics.chorus]
text = "He bought you with His pre -- cious blood, And now He calls you through His Word; The blood- -- stained path of love He trod— Ac -- cept Him while His voice is heard."

