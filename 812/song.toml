[lyrics.1]
text = "Art thou wear -- y, art thou lan -- guid, Art thou sore dis -- tressed? “Come to Me,” saith One, “and com -- ing, Be at rest.”"

[lyrics.2]
text = "If I ask Him to re -- ceive me, Will He say me nay?— “Not till earth and not till heav -- en Pass a -- way.”"

[lyrics.3]
text = "If I still hold close -- ly to Him, What hath He at last?— “Sor -- row van -- ished, la -- bor end -- ed, Jor -- dan passed.”"

[lyrics.4]
text = "Find -- ing Him, and fol -- l’wing, keep -- ing, Is He sure to bless? Saints, a -- pos -- tles, proph -- ets, mar -- tyrs, An -- swer “Yes!”"
