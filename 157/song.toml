[lyrics.1]
text = "Of one the Lord has made the race, Thro' one has come the fall; Where sin has gone must go His grace; The Gos -- pel is for all."

[lyrics.2]
text = "Say not the hea -- then are at home, Be -- yond we have no call, For why should we be blest a -- lone? The Gos -- pel is for all."

[lyrics.3]
text = "Re -- ceived ye free -- ly, free -- ly give, From ev -- ery land they call; Un -- less they hear, they can -- not live: The Gos -- pel is for all."

[lyrics.chorus]
text = "The bless -- èd Gos -- pel is for all, The Gos -- pel is for all; Where sin has gone must go His grace: The Gos -- pel is for all."
