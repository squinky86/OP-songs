[lyrics.1]
text = "Near -- er to Thee, Lord, draw me to -- day; Near -- er to Thee each step of the way. Thou art my Sav -- ior. So I would be Dai -- ly and hour -- ly near -- er to Thee."

[lyrics.2]
text = "Tho’ Thou has saved me dan -- gers a -- bound. Pit -- falls are near me, foes are a -- round. Close to a -- bide, Lord, hold fast my hand, Till I have crossed this dan -- ger -- ous land."

[lyrics.3]
text = "Yon -- der where an -- gels sing near Thy throne, I shall be ev -- er whol -- ly Thine own. Free from temp -- ta -- tions there I shall be, Drawn by Thy love, Lord, close -- ly to Thee,"

[lyrics.chorus]
text = "Near -- er to Thee, Lord, nev -- er to roam; Near -- er to Thee, Lord, all the way home. Oft I am trou -- bled, tempt -- ed and tried. Draw me dear Je -- sus, close to Thy side."
