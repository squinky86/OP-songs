text = "Oh, what rap -- ture great in that blest es -- tate, @s1 What a song of praise all the throng will raise, @s1"

[lyrics.2]
text = "Faith will end in sight, in His glo -- ry bright, @s1 With the an -- gels fair we shall praise Him there, @s1"

