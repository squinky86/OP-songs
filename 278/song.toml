[lyrics.1]
text = "Je -- sus may come to -- day, Glad day, glad day! And I would see my Friend; Dan -- gers and trou -- bles would end If Je -- sus should come to -- day."

[lyrics.2]
text = "I may go home to -- day, Glad day, glad day! Seem -- eth I hear their song, Hail to the ra -- di -- ant throng, If I should go home to -- day."

[lyrics.3]
text = "Why should I anx -- ious be? Glad day, glad day! Lights ap -- pear on the shore, Storms will af -- fright nev -- er -- more, For He is “at hand” to -- day."

[lyrics.4]
text = "Faith -- ful I’ll be to -- day, Glad day, glad day! And I will free -- ly tell Why I should love Him so well, For He is my all to -- day."

[lyrics.chorus]
text = "Glad day, glad day! Is it the crown -- ing day? I’ll live for to -- day, nor anx -- ious be; Je -- sus, my Lord I soon shall see; Glad day, glad day! Is it the crown -- ing day?"
