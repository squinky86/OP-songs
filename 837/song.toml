[lyrics.1]
text = "Flee as a bird to your moun -- tain, Thou who art wea -- ry of sin; Go to the clear flow -- ing foun -- tain Where you may wash and be clean. Fly for th’a -- ven -- ger is near thee, Call, and the Sav -- ior will hear thee, He on His bo -- som will bear thee, O thou who art wea -- ry of sin, O thou who art wea -- ry of sin."

[lyrics.2]
text = "He will pro -- tect thee for -- ev -- er, Wipe ev -- ’ry fall -- ing _ tear; He will for -- sake thee, O nev -- er Shel -- tered so ten -- der -- ly there. Haste, then, the hours are _ fly -- ing, Spend not the mo -- ments in sigh -- ing, Cease from your sor -- row and cry -- ing: The Sav -- ior will wipe ev -- ’ry tear, The Sav -- ior will wipe ev -- ’ry tear."
