[lyrics.1]
text = "How pleas -- ant thus to dwell be -- low, In fel -- low -- ship of love! And tho’ we part, ’tis bliss to know That we shall meet a -- bove. That we shall meet a -- bove, That we shall meet a -- bove, And tho’ we part, ’tis bliss to know That we shall meet a -- bove."

[lyrics.2]
text = "Yes, hap -- py tho’t! when we are free From earth -- ly grief and pain, In heav’n we shall each oth -- er see, And nev -- er part a -- gain. And nev -- er part a -- gain, And nev -- er part a -- gain; In heav’n we shall each oth -- er see, And nev -- er part a -- gain."

[lyrics.3]
text = "Then let us each in strength di -- vine, Still walk in wis -- dom’s ways; That we, with those we love, may join In nev -- er -- end -- ing praise. In nev -- er -- end -- ing praise, In nev -- er -- end -- ing praise, That we, with those we love, may join In nev -- er -- end -- ing praise."
