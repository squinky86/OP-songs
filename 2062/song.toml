[lyrics.1]
text = "There’s a crown for your cross, when the tear -- drops that stray, Will be driv -- en for -- ev -- er a -- way; When the cares that op -- press will at last be laid down, You’ll be giv -- en a beau -- ti -- ful crown."

[lyrics.2]
text = "There’s a crown for your cross when the day -- light shall dawn, When the night’s drear -- y shad -- ow’s are gone; You will meet with glad smiles and _ nev -- er a frown, You’ll be giv -- en a beau -- ti -- ful crown."

[lyrics.3]
text = "There’s a crown for your cross where the sweet flow -- ers grow, On the banks where bright wa -- ters doth flow; With a robe and a harp when the cross is laid down, You’ll be giv -- en a beau -- ti -- ful crown."

[lyrics.4]
text = "There’s a crown for your cross and a pow -- er di -- vine, There’s a love all a -- round you will shine; When the cross for the crown is for -- ev -- er laid down, You’ll be giv -- en a beau -- ti -- ful crown."

[lyrics.chorus]
text = "There’s a crown for your cross, there is gain for your loss, You’ll be giv -- en a crown for your cross, There’s a beau -- ti -- ful crown when your cross is laid down, You’ll be giv -- en a beau -- ti -- ful crown."
