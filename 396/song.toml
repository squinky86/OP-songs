[lyrics.1]
text = "Pass me not, O gen -- tle Sav -- ior, Hear my hum -- ble cry; While on o -- thers Thou art call -- ing, Do not pass me by."

[lyrics.2]
text = "Let me at Thy throne of mer -- cy Find a sweet re -- lief, Kneel -- ing there in deep con -- tri -- tion; Help my un -- be -- lief."

[lyrics.3]
text = "Trust -- ing on -- ly in Thy mer -- it, Would I seek Thy face; Heal my wound -- ed, brok -- en spir -- it, Save me by Thy grace."

[lyrics.4]
text = "Thou the Spring of all my com -- fort, More than life to me, Whom have I on earth be -- side Thee? Whom in heav'n but Thee?"

[lyrics.chorus]
text = "Sav -- ior, Sav -- ior, Hear my hum -- ble cry; While on o -- thers Thou art call -- ing, Do not pass me by."
