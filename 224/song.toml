[lyrics.1]
text = "Just a few more days to be filled with praise, And to tell the old, old sto -- ry; Then, when twi -- light falls, and my Sav -- ior calls, I shall go to Him in glo -- ry."

[lyrics.2]
text = "Just a few more years with their toil and tears, And the jour -- ney will be end -- ed; Then I’ll be with Him, where the tide of time With e -- ter -- ni -- ty is blend -- ed."

[lyrics.3]
text = "Though the hills be steep and the val -- leys deep, With no flowers my way a -- dorn -- ing; Though the night be lone and my rest a stone, Joy a -- waits me in the morn -- ing."

[lyrics.4]
text = "What a joy ’twill be when I wake to see Him for Whom my heart is burn -- ing! Ne -- ver -- more to sigh, ne -- ver -- more to die, For that day my heart is yearn -- ing."

[lyrics.chorus]
text = "I’ll ex -- change my cross for a star -- ry crown, Where the gates swing out -- ward ne -- ver; At His feet I’ll lay ev -- ery bur -- den down, And with Je -- sus reign for -- ev -- er."
