[lyrics.1]
text = "The world is bright, the world is good, For by a Mas -- ter hand Its seas were spread, its moun -- tains built, And all its fit -- ness planned. That Mas -- ter Build -- er is our God! Om -- nip -- o -- tent, di -- vine is He, The might -- y One who was, and is, And shall for -- ev -- er be."

[lyrics.2]
text = "The fruit -- ful fields are from His grace; The har -- vest time He gives; The sea -- sons come at His com -- mand, In Him all na -- ture lives. He plant -- ed in the hu -- man breast A lat -- ent Broth -- er -- hood of love That, nur -- tured by good deeds, it might A fount of bless -- ing prove."

[lyrics.3]
text = "Be -- hold the flow -- ers of the field, The might -- y for -- est trees, The crea -- tures of the deep and wild, The birds and bus -- y bees! Life gave He un -- to all that is On earth, in sea, and in the sky; Yet more than life He gave to man— A soul that shall not die."

[lyrics.4]
text = "As His pro -- tect -- ing wings are thrown O'er us from day to day, So let us care for those who tread With us life's great high -- way. A word of cheer, a help -- ing hand Ex -- tend -- ed in a time of need, Will make some bur -- dened heart re -- joice, And God will bless the deed."

[lyrics.chorus]
text = "Thy name we mag -- ni -- fy! Thee, Lord, we glo -- ri -- fy! Great Build -- er, Thee we will a -- dore For -- ev -- er -- more."
