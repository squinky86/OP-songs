[lyrics.1]
text = "Lord, I hear of show’rs of bless -- ing Thou art scat -- t’ring full and free; Show’rs, the thirst -- y land re -- fresh -- ing: Let Thy mer -- cy fall on me. E -- ven me, E -- ven me, Let Thy mer -- cy fall on me."

[lyrics.2]
text = "Pass me not, O gra -- cious Sav -- ior, Let me live and cling to Thee; I am long -- ing for Thy fa -- vor, Whilst Thou’rt call -- ing, O call me. E -- ven me, E -- ven me, Whilst Thou’rt call -- ing, O call me."

[lyrics.3]
text = "Love of God, so pure and change -- less, Blood of Christ so rich, so free, Grace of God, so strong and bound -- less, Mag -- ni -- fy them all in me. E -- ven me, E -- ven me, Mag -- ni -- fy them all in me."
