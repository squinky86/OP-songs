[lyrics.1]
text = "O the bit -- ter pain and sor -- row That a time could ev -- er be, When I proud -- ly said to Je -- sus “All of self, and none of Thee,” All of self and none of Thee, All of self and none of Thee, When I proud -- ly said to Je -- sus “All of self and none of Thee.”"

[lyrics.2]
text = "Yet He found me; I be -- held Him Bleed -- ing on th’ac -- curs -- ed tree, And my wist -- ful heart said faint -- ly, “Some of self, and some of Thee,” Some of self and some of Thee, Some of self and some of Thee, And my wist -- ful heart said faint -- ly “Some of self and some of Thee.”"

[lyrics.3]
text = "Day by day His ten -- der mer -- cy Heal -- ing, help -- ing, full and free, Bro’t me low -- er while I whis -- pered “Less of self, and more of Thee,” Less of self and more of Thee, Less of self and more of Thee, Bro’t me low -- er while I whis -- pered, “Less of self and more of Thee.”"

[lyrics.4]
text = "High -- er than the high -- est heav -- ens, Deep -- er than the deep -- est sea, Lord, Thy love at last has con -- quered “None of self, and all of Thee,” None of self and all of Thee, None of self and all of Thee, Lord, Thy love at last has con -- quered “None of self and all of Thee.”"
