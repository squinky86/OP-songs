[lyrics.1]
text = "Sound the bat -- tle cry! See, the foe is nigh; Raise the stand -- ard high for the Lord; Gird your ar -- mor on, stand firm eve -- ry one; Rest your cause up -- on His ho -- ly Word."

[lyrics.2]
text = "Strong to meet the foe, march -- ing on we go, While our cause we know must pre -- vail; Shield and ban -- ner bright, gleam -- ing in the light, Bat -- tling for the right we ne’er can fail."

[lyrics.3]
text = "O Thou God of all, hear us when we call, Help us one and all by Thy grace; When the bat -- tle’s done, and the vic -- t’ry’s won, May we wear the crown be -- fore Thy face."

[lyrics.chorus]
text = "Rouse, then, sol -- diers, ral -- ly round the ban -- ner, Read -- y, stead -- y, pass the word a -- long; On -- ward, for -- ward, shout a -- loud, “Ho -- san -- na!” Christ is Cap -- tain of the might -- y throng."
