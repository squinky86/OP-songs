text = "Near -- er, still near -- er, noth -- ing I bring, Naught as an off’ -- ring to Je -- sus my King; On -- ly my sin -- ful, now con -- trite heart, Grant me the cleans -- ing Thy blood doth im -- part, Grant me the cleans -- ing Thy blood doth im -- part."

[lyrics.3]
text = "Near -- er, still near -- er, Lord, to be Thine, Sin, with its fol -- lies, I glad -- ly re -- sign; All of its pleas -- ures, pomp and its pride, Give me but Je -- sus, my Lord cru -- ci -- fied, Give me but Je -- sus, my Lord cru -- ci -- fied."

