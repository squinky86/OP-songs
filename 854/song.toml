[lyrics.1]
text = "Here, O my Lord, I see Thee face to face; Here would I touch and han -- dle things un -- seen; Here grasp with firm -- er hand th’e -- ter -- nal grace, And all my wear -- i -- ness up -- on Thee lean."

[lyrics.2]
text = "Here would I feed up -- on the bread of God; Here drink with Thee the roy -- al wine of heav’n; Here would I lay a -- side each earth -- ly load, Here taste a -- fresh the calm of sin for -- giv’n."

[lyrics.3]
text = "Too soon we rise; the sym -- bols dis -- ap -- pear; The feast, tho’ not the love, is past and gone; The bread and wine re -- move, but Thou art here— Near -- er than ev -- er— still my Shield and Sun."

[lyrics.4]
text = "Feast aft -- er feast thus comes and pass -- es by; Yet, pass -- ing, points to the glad feast a -- bove— Giv -- ing sweet fore -- taste of the fes -- tal joy, The Lamb’s great bri -- dal feast of bliss and love."
