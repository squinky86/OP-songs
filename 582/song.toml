[lyrics.1]
text = "Have you been to Je -- sus for the cleans -- ing pow’r? Are you washed in the blood of the Lamb? Are you ful -- ly trust -- ing in His grace this hour? Are you washed in the blood of the Lamb?"

[lyrics.2]
text = "Are you walk -- ing dai -- ly by the Sav -- ior’s side? Are you washed in the blood of the Lamb? Do you rest each mo -- ment in the Cru -- ci -- fied? Are you washed in the blood of the Lamb?"

[lyrics.3]
text = "When the Bride -- groom com -- eth will your robes be white? Are you washed in the blood of the Lamb? Will your soul be rea -- dy for the man -- sions bright, And be washed in the blood of the Lamb?"

[lyrics.4]
text = "Lay a -- side the gar -- ments that are stained with sin, And be washed in the blood of the Lamb; There’s a foun -- tain flow -- ing for the soul un -- clean, O be washed in the blood of the Lamb!"

[lyrics.chorus]
text = "Are you washed in the blood, In the soul cleans -- ing blood of the Lamb? Are your gar -- ments spot -- less? Are they white as snow? Are you washed in the blood of the Lamb?"

