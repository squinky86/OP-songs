[lyrics.1]
text = "I had long been far a -- stray, but I’m fac -- ing home to -- day, And to Christ I have giv -- en full con -- trol; For His ser -- vant I be -- came, nev -- er -- more to live in shame, @s1"

[lyrics.2]
text = "In the sun -- shine of His face, earth be -- came a bright -- er place, There was glad -- ness in be -- ing free and whole; For my life was safe from harm, sin -- ful pleas -- ures lost th’ir charm, @s1"

[lyrics.3]
text = "I am go -- ing home with Him, sing -- ing when the way is dim, For I know He will lead me to the goal; I shall see His face at last; for in love He hid my past, @s1"

[lyrics.chorus]
text = "When the joy of sal -- va -- tion filled my soul, yes, filled my soul. And I felt all my heav -- y bur -- den roll! bur -- den roll! I be -- gan to shout and sing hal -- le -- lu -- jahs to my King, When the joys of sal -- va -- tion filled my soul!"

