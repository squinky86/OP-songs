[lyrics.1]
text = "There's a gar -- den where Je -- sus is wait -- ing, There's a place that is won -- drous -- ly fair; For it glows with the light of His pres -- ence, 'Tis that beau -- ti -- ful gar -- den of prayer."

[lyrics.2]
text = "There's a gar -- den where Je -- sus is wait -- ing, And I go with my bur -- den and care, Just to learn from His lips words of com -- fort, In the beau -- ti -- ful gar -- den of prayer."

[lyrics.3]
text = "There's a gar -- den where Je -- sus is wait -- ing, And He bids you to come meet Him there; Just to bow, and re -- ceive a new bless -- ing, In the beau -- ti -- ful gar -- den of prayer."

[lyrics.chorus]
text = "Oh, the beau -- ti -- ful gar -- den, the gar -- den of prayer, Oh, the beau -- ti -- ful gar -- den of prayer; There my Sav -- ior a -- waits, and He o -- pens the gates To the beau -- ti -- ful gar -- den of prayer."
