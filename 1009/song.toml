[lyrics.1]
text = "Now the day is dy -- ing in the gold -- en west, Lit -- tle birds are fly -- ing home -- ward to their nest; Lit -- tle chil -- dren gath -- er round the hearth -- stone bright, Sweet -- ly they are say -- ing now, “Good- -- night, good- -- night.”"

[lyrics.2]
text = "In God’s care so ten -- der they will fall a -- sleep, For the Lord doth safe -- ly lit -- tle chil -- dren keep; Gives them sweet -- est slum -- bers, guards them in their bed, And from ev -- ’ry dan -- ger shields each lit -- tle head."

[lyrics.3]
text = "When the morn is break -- ing in the ros -- y east, They will thank the Fa -- ther for their pleas -- ant rest; Hap -- py, hap -- py chil -- dren in His lov -- ing care, They need fear no dan -- ger, God is ev -- ’ry -- where."
