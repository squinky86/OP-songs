[lyrics.1]
text = "If your own sor -- rows you want to for -- get, Make some -- bod -- y hap -- py to -- day; If in your heart you would know no re -- gret, Make some -- bod -- y hap -- py to -- day. Oth -- ers near by you may be in des -- pair, Strug -- gling ’neath cross -- es so heav -- y to bear; They may take heart, if you show that you care— Make some -- bod -- y hap -- py to -- day."

[lyrics.2]
text = "If you seek plea -- sure no trou -- ble can mar, Make some -- bod -- y hap -- py to -- day; You’ll find it wait -- ing you, right where you are, Make some -- bod -- y hap -- py to -- day. Is your life dark -- ened by hopes that were vain? Go help an -- oth -- er his goal to at -- tain! What you have lost, by your help he may gain— Make some -- bod -- y hap -- py to -- day."

[lyrics.3]
text = "Do not com -- plain that you’ve noth -- ing to give, Make some -- bod -- y hap -- py to -- day; Do your whole du -- ty, and preach as you live, Make some -- bod -- y hap -- py to -- day. Though you have on -- ly a smile, or a flower, Give it, and speak of His love, of His power; You may cheer ma -- ny a pain- -- wear -- y hour— Make some -- bod -- y hap -- py to -- day."

[lyrics.chorus]
text = "Make some -- bod -- y hap -- py to -- day. to -- day. O sing a glad song on your way; The good that you do brings bless -- ing to you, Make some -- bod -- y hap -- py to -- day."

[parts.Soprano.lyrics.chorus]
text = "Make some -- bod -- y hap -- py to -- day. O sing a glad song on your way; The good that you do brings bless -- ing to you, Make some -- bod -- y hap -- py to -- day."
