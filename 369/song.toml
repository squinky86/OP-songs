[lyrics.1]
text = "Hide me, Lord, in Thy pa -- vil -- ion! From proud men Thy serv -- ant hide; In Thy tab -- er -- na -- cle's se -- cret Let my soul by grace a -- bide. When my cords are strained to break -- ing, And my cur -- tains riv -- en far, Be my tent, and in Thy cov -- ert Keep me from the tem -- pest's war."

[lyrics.2]
text = "Hide me, Lord, in Thy pa -- vil -- ion! From men's tongues Thy serv -- ant hide; Still their strife and my con -- fu -- sion In love's calm and might -- y tide. When a -- cross my hush of won -- der Falls the ter -- ror of the flood, Stretch Thy love— a tent with cur -- tains Set for ev -- er -- last -- ing good."

[lyrics.3]
text = "Hide me, Lord, in Thy pa -- vil -- ion! From the glare of noon -- day hide; And from fear of cloud and dark -- ness With Thine hand of mer -- cy guide. When I may not go in safe -- ty, Thou shalt hov -- er where I stay; So at length, in Thee pa -- vil -- ioned, I shall tent on Love's High -- way."
