bes'4 aes'4 g'4 f'4 ees'4 des'4 | c'4 aes4 bes4 c'2( ees'4) | des'4 des'4 des'4 d'4 d'4 d'4 | ees'4 r4 c'4 des'2! r4 |
aes'4@c g'4 f'4 ees'4 des'4 c'4 | des'4 c'4 c'4 des'2. | bes'4 aes'4 g'4 f'4 ees'4 des'4 | d'4 d'4 d'4 ees'2. |
c''4 bes'4 aes'4 g'4 f'4 ees'4 | f'4 f'4 f'4 e'2!( ees'4!) | ees'4 g'4 f'4 ees'4 ees'4 des'4 | c'4 ees'4 des'4 c'2 r4
