[lyrics.1]
text = "“Who -- so -- ev -- er hear -- eth,” shout, _ shout the sound! Spread the bless -- ed tid -- ings all the world a -- round; Spread the joy -- ful news wher -- ev -- er man is found; “Who -- so -- ev -- er will may come.”"

[lyrics.2]
text = "Who -- so -- ev -- er com -- eth need _ not de -- lay, Now the door is o -- pen, en -- ter while you may; Je -- sus is the true, the on -- ly Liv -- ing Way; “Who -- so -- ev -- er will may come.”"

[lyrics.3]
text = "“Who -- so -- ev -- er will,” the prom -- ise is se -- cure, “Who -- so -- ev -- er will,” for -- ev -- er must en -- dure; “Who -- so -- ev -- er will,” ’tis life for -- ev -- er -- more: “Who -- so -- ev -- er will may come.”"

[lyrics.chorus]
text = "“Who -- so -- ev -- er will, who -- so -- ev -- er will,” Send the pro -- cla -- ma -- tion o -- ver vale and hill; ’Tis a lov -- ing Fa -- ther, calls the wan -- derer home: “Who -- so -- ev -- er will may come.”"
