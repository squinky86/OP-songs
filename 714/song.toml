[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "Ma -- ny are gone, who here were my kin -- dred, To the a -- bode of spir -- its made free; They, with my Lord and all His re -- deemed ones, Long -- ing -- ly wait and beck -- on for me."

