[lyrics.1]
text = "Saved by the blood of the Cru -- ci -- fied One! Now ran -- somed from sin and a new work be -- gun, Sing praise to the Fa -- ther and praise to the Son, Saved by the blood of the Cru -- ci -- fied One!"

[lyrics.2]
text = "Saved by the blood of the Cru -- ci -- fied One! The an -- gels re -- joic -- ing be -- cause it is done; A child of the Fa -- ther, joint heir with the Son, Saved by the blood of the Cru -- ci -- fied One!"

[lyrics.3]
text = "Saved by the blood of the Cru -- ci -- fied One! The Fa -- ther He spake, and His will it was done; Great price of my par -- don, His own pre -- cious Son; Saved by the blood of the Cru -- ci -- fied One!"

[lyrics.4]
text = "Saved by the blood of the Cru -- ci -- fied One! All hail to the Fa -- ther, all hail to the Son, All hail to the Spir -- it, the great Three in One! Saved by the blood of the Cru -- ci -- fied One!"

[lyrics.chorus]
text = "Glo -- ry, I’m saved! Glo -- ry, I’m saved! My sins are all par -- doned, my guilt is all gone! Glo -- ry, I’m saved! Glo -- ry, I’m saved! I am saved by the blood of the Cru -- ci -- fied One!"
