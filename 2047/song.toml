text = "Toil -- ing, toil -- ing here each day, for Him, for Him, my Lord, my Lord, And O, and O, what joy, what joy ’twill be, ’twill be, that day, that day! When com -- ing, com -- ing from the field, the har -- vest, har -- vest field of God To bear, to bear some pre -- cious, pre -- cious fruit for Him a -- way!"
