[lyrics.1]
text = "Come to the shel -- ter, safe re -- treat, Hide you in the blood of Je -- sus; Come, for the storms a -- round you beat, Hide you in the blood of Je -- sus."

[lyrics.2]
text = "Come, from the loath -- some ways of sin, Hide you in the blood of Je -- sus; Come, for the Lord will take you in, Hide you in the blood of Je -- sus."

[lyrics.3]
text = "Come, for the dan -- gers hov -- er near, Hide you in the blood of Je -- sus; Come, He’ll pro -- tect you from all fear, Hide you in the blood of Je -- sus."

[lyrics.4]
text = "Come for your sins the Lord has bled, Hide you in the blood of Je -- sus; Come, tho’ they be like crim -- son, red, Hide you in the blood of Je -- sus."

[lyrics.chorus]
text = "Hide you in the blood, Hide you in the blood, Storms are rag -- ing high, Storms are rag -- ing high; Hide you in the blood, Hide you in the blood, Till the dan -- gers pass you by."

[parts.Soprano.lyrics.chorus]
text = "Hide you in the blood, For the storms are rag -- ing high; Hide you in the blood, Till the dan -- gers pass you by."
