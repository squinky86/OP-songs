text = "His joy will glad -- den ev -- ery day, His bless -- ing shine a -- long the way, And you will share His prom -- ise true, When you know Je -- sus, too."

[lyrics.3]
text = "You’ll see His mer -- cy thro’ your tears, His peace will hal -- low all the years; The val -- ley holds no dread for you, When you know Je -- sus, too."

[lyrics.4]
text = "You’ll know His way is al -- ways best, And glad -- ly leave to Him the rest, And tell what He has done for you, When you know Je -- sus, too."

