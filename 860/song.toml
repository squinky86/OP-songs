[lyrics.1]
text = "I have heard of a land On a far a -- way strand, In the Bi -- ble the sto -- ry is told, Where _ cares nev -- er come, Nev -- er dark -- ness nor gloom, And noth -- ing shall ev -- er grow old."

[lyrics.2]
text = "There are ev -- er -- green trees That bend low in the breeze, And their fruit -- age is bright -- er than gold; There are harps for our hands, In that fair -- est of lands, And noth -- ing shall ev -- er grow old."

[lyrics.3]
text = "There’s a home in that land, At the Fa -- ther’s right hand, There are man -- sions whose joys are un -- told; And per -- en -- ni -- al spring, Where the birds ev -- er sing, And noth -- ing shall ev -- er grow old."

[lyrics.chorus]
text = "In that beau -- ti -- ful land, On the far a -- way strand, No storms with their blasts ev -- er frown; My Sheph -- erd will hold me close in His fold, And the sun, it shall nev -- er go down."
