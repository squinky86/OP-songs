[lyrics.1]
text = "When troub -- les or sor -- rows o’er -- take you, When man -- y and great are your cares; Tho’ seems all the world to for -- sake you, @s1"

[lyrics.2]
text = "When en -- e -- mies bold -- ly as -- sail you, Or try to en -- trap with their snares; Tho’ e -- ven your loved ones all fail you, @s1"

[lyrics.3]
text = "Re -- mem -- ber when tri -- als be -- tide you, The Sav -- ior will an -- swer your pray’rs; When help from the world is de -- nied you, @s1"

[lyrics.chorus]
text = "Yes, some -- one still cares some -- one still cares, All troub -- les and sor -- rows He will -- ing -- ly shares; When bil -- lows are swell -- ing, and heav -- y your cares, Re -- mem -- ber that some -- one— your Sav -- ior— still cares."

