[lyrics.1]
text = "Lead me gent -- ly home, Fa -- ther, lead me gent -- ly home, When life’s toils are end -- ed, And part -- ing days have come; Sin no more shall tempt me, Ne’er from Thee I’ll roam, If Thou’lt on -- ly lead me, Fa -- ther, Lead me gent -- ly home."

[lyrics.2]
text = "Lead me gent -- ly home, Fa -- ther, lead me gent -- ly home, In life’s dark -- est hours, Fa -- ther, When life’s trou -- bles come; Keep my feet from wan -- d’ring, Lest from Thee I’ll roam, Lest I fall up -- on the way -- side, Lead me gent -- ly home."

[lyrics.3]
text = "Lead me gent -- ly home, Fa -- ther, lead me gent -- ly home, In temp -- ta -- tion’s hour, Fa -- ther, when sore tri -- als come; Be Thou near to keep me, Take me as Thine own, For I can -- not live with -- out Thee, Lead me gent -- ly home."

[lyrics.chorus]
text = "Lead me gent -- ly home, Fa -- ther, lead me gent -- ly, Lest I fall up -- on the way -- side, Lead me gent -- ly home."

[parts.Alto.lyrics.chorus]
