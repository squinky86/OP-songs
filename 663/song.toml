[lyrics.1]
text = "O morn -- ing glad, when care shall cease And I shall have un -- end -- ing peace, At home with Him who died for me, One sad, dark day on Cal -- va -- ry!"

[lyrics.2]
text = "O morn -- ing glad, when on the strand With those I love, and Him I stand, And look -- ing on His match -- less face, Ex -- tol Him for His sav -- ing grace!"

[lyrics.3]
text = "O morn -- ing glad, when with His own, I stand be -- fore the glo -- ry throne; To wor -- ship Him, to shout and sing, While an -- gels crown Him Lord and King!"

[lyrics.chorus]
text = "O morn -- ing glad! O day su -- preme, When I have crost the si -- lent stream; To be at home, and to a -- dore. My Sav -- ior dear, for -- ev -- er -- more!"

