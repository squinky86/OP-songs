[lyrics.1]
text = "“He is a -- ble”— this my peace— Help -- less though I face the storm: “What -- so -- ev -- er God hath prom -- ised, He is a -- ble to per -- form.”"

[lyrics.2]
text = "“He is a -- ble”— this my trust— Word of words to cheer my way: “That which I’ve com -- mit -- ted to Him, He will keep a -- gainst That Day.”"

[lyrics.3]
text = "“He is a -- ble”— this my might— This the strength in which I stand: By His grace es -- tab -- lished, guard -- ed, Who can take me from His hand?"

[lyrics.4]
text = "“He is a -- ble”— this my faith— A -- ble all His own to bless, Far be -- yond all tho’t or ask -- ing, In un -- fail -- ing faith -- ful -- ness."

[lyrics.5]
text = "“He is a -- ble”— this my store— God shall ev -- ery want sup -- ply: Love en -- rich -- ing, grace a -- bound -- ing, In un -- end -- ing con -- stan -- cy."

[lyrics.6]
text = "“He is a -- ble”— this my hope— A -- ble e’en the dead to raise: O Al -- might -- y God and Fa -- ther, Thine be end -- less pow’r and praise!"
