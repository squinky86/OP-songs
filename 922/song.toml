[lyrics.1]
text = "O God of Beth -- el, by Whose hand Thy peo -- ple still are fed; Who thro’ this wea -- ry pil -- grim -- age Hast all our fa -- thers led."

[lyrics.2]
text = "Our vows, our pray’rs, we now pre -- sent Be -- fore Thy throne of grace; God of our fa -- thers, be the God Of their suc -- ceed -- ing race."

[lyrics.3]
text = "Thro’ each per -- plex -- ing path of life Our wand’ -- ring foot -- steps guide; Give us each day our dai -- ly bread, And rai -- ment fit pro -- vide."

[lyrics.4]
text = "O spread Thy cov’ -- ring wings a -- round, Till all our wand’ -- rings cease, And at our Fa -- ther’s loved a -- bode Our souls ar -- rive in peace."

[lyrics.coda]
text = "A -- men."
