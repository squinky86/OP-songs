[lyrics.1]
text = "Some time the bur -- den will be lift -- ed, Some time my pil -- grim -- age shall cease, Some time the dark cloud will be rift -- ed, And I shall en -- ter in -- to peace. Some time my foes will all be van -- quished, And I shall lay my ar -- mor down; Some time my task will be com -- plet -- ed, And I shall wear the vic -- tor’s crown."

[lyrics.2]
text = "Some time my sor -- row will be end -- ed, Some time with tear -- less eyes I’ll see The wear -- y path I have as -- cend -- ed, Though steep, was far the best for me. Some time my weep -- ing will be o -- ver, Like shin -- ing pearls my tears shall be, Like gems my di -- a -- dem a -- dorn -- ing, Each drop a jew -- el bright shall be."

[lyrics.3]
text = "Till then I’ll rest up -- on His prom -- ise, My Sav -- ior who re -- deems from sin; He knows, ah yes, He knows and guides me, And I will trust my way to Him; Till all my earth -- ly tasks are end -- ed, And I shall en -- ter in -- to rest, And meet a -- gain with friends long part -- ed, And with them join the saved and blest."
