[lyrics.1]
text = "Sweet is the work, my God, my King! To praise Thy name, give thanks and sing; To show Thy love by morn -- ing light, And talk of all Thy truth at night."

[lyrics.2]
text = "My heart shall tri -- umph in my Lord, And bless His works, and bless His word: Thy works of grace, how bright they shine! How deep Thy coun -- sels, how di -- vine!"

[lyrics.3]
text = "Lord, I shall share a glo -- rious part, When grace hath well re -- fined my heart, And fresh sup -- plies of joy are shed, Like ho -- ly oil up -- on my head."

[lyrics.4]
text = "Then shall I see, and hear, and know All I de -- sired or hoped be -- low; And ev -- ’ry pow’r find sweet em -- ploy In that e -- ter -- nal world of joy."
