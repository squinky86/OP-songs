[lyrics.1]
text = "Thou my ev -- er -- last -- ing por -- tion, More than friend or life to me, All a -- long my pil -- grim jour -- ney, Sav -- ior, let me walk with Thee. Close to Thee, close to Thee, Close to Thee, close to Thee, All a -- long my pil -- grim jour -- ney, Sav -- ior, let me walk with Thee."

[lyrics.2]
text = "Not for ease or world -- ly plea -- sure, Nor for fame my prayer shall be; Glad -- ly will I toil and suf -- fer, On -- ly let me walk with Thee. Close to Thee, close to Thee, Close to Thee, close to Thee, Glad -- ly will I toil and suf -- fer, On -- ly let me walk with Thee."

[lyrics.3]
text = "Lead me through the vale of sha -- dows, Bear me o’er life’s fit -- ful sea; Then the gate of life e -- ter -- nal May I en -- ter, Lord, with Thee. Close to Thee, close to Thee, Close to Thee, close to Thee, Then the gate of life e -- ter -- nal May I en -- ter, Lord, with Thee."
