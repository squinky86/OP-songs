[lyrics.1]
text = "I know that death a -- waits me, And I, ac -- count must give, To Him, who will re -- ward me,— Ac -- cord -- ing as I live!"

[lyrics.2]
text = "My day is fast de -- clin -- ing,— Life's sun is sink -- ing low, And I must to a judg -- ment All glad, or hope -- less go!"

[lyrics.3]
text = "Each morn -- ing, noon, and eve -- ning, Bring whisp' -- rings un -- to me, Which, say, not far out yon -- der, That I the grave, shall see!"

[lyrics.4]
text = "Shall I to it, go weep -- ing, 'Neath God's con -- demn -- ing frown, And know, that I, on wak -- ing, Shall wear no star -- ry crown?"

[lyrics.chorus]
text = "To think what it will be, To think what it will be! And my heart is sad, as I stop to -- night, To think what it will be!"
