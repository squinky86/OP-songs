[lyrics.1]
text = "Soft -- ly and ten -- der -- ly Je -- sus is call -- ing, Call -- ing for you and for me; See, on the por -- tals He's wait -- ing and watch -- ing, Watch -- ing for you and for me."

[lyrics.2]
text = "Why should we tar -- ry when Je -- sus is plead -- ing, Plead -- ing for you and for me? Why should we lin -- ger and heed not His mer -- cies, Mer -- cies for you and for me?"

[lyrics.3]
text = "O for the won -- der -- ful love He has prom -- ised, Prom -- ised for you and for me! Though we have sinned, He has mer -- cy and par -- don, Par -- don for you and for me."

[lyrics.chorus]
text = "Come home, come home, Ye who are wea -- ry, come home; Ear -- nest -- ly, ten -- der -- ly, Je -- sus is call -- ing, Call -- ing, O sin -- ner, come home!"
