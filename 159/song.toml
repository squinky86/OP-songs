[lyrics.1]
text = "Clos -- er to Thee, near to Thy side, Clos -- er, dear Lord, I would a -- bide; Hold me in Thy em -- brace, ’Neath ev -- ’ry smile of grace; Grant me, Thy child, a place Clos -- er to Thee."

[lyrics.2]
text = "Clos -- er to Thee, near to Thy breast, Clos -- er to Thee, Lord, let me rest; Guide me when I would stray, Keep me from sin each day, Draw me, dear Lord, I pray, Clos -- er to Thee."

[lyrics.3]
text = "Clos -- er to Thee, hap -- py and free, Grant me, O Lord, ev -- er to be; Hear me in ev -- ’ry cry, Stand near when I must die; Then take me home on high, Clos -- er to Thee."
