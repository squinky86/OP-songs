[lyrics.1]
text = "I have some friends and loved ones gone To joys o -- ver death’s si -- lent sea, For my com -- ing there they are watch -- ing now, They won’t have to wait long for me!"

[lyrics.2]
text = "Tho’ rug -- ged is my path -- way here, I soon shall be hap -- py and free, Where _ saints and an -- gels _ praise the Lord, They won’t have to wait long for me!"

[lyrics.3]
text = "Each day brings near -- er that sweet home Where friends re -- u -- nit -- ed shall be; O _ soon we’ll meet to _ part no more, They won’t have to wait long for me!"

[lyrics.chorus]
text = "O how it thrills my soul with joy, To know soon each dear one I’ll see! Be -- side the crys -- tal stream of life, They wont have to wait long for me!"
