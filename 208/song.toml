[lyrics.1]
text = "A -- wake, my tongue, thy trib -- ute bring To Him who gave thee pow'r to sing; Praise Him who is all praise a -- bove, The source of wis -- dom and of love."

[lyrics.2]
text = "How vast His knowl -- edge! How pro -- found! A deep where all our tho'ts are drowned; The stars He num -- bers and their names He gives to all those heav'n -- ly flames."

[lyrics.3]
text = "Thro' each bright world a -- bove, be -- hold, Ten thou -- sand thou -- sand charms un -- fold; Earth, air, and might -- y seas com -- bine To speak His wis -- dom all di -- vine."

[lyrics.4]
text = "But in re -- demp -- tion, O what grace! Its won -- ders, O what tho't can trace! Here wis -- dom shines for ev -- er bright: Praise Him, my soul, with sweet de -- light."
