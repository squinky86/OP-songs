[lyrics.1]
text = "Our blest Re -- deem -- er, ere He breathed His ten -- der, last fare -- well, A Guide, a Com -- fort -- er, be -- queathed With us to dwell."

[lyrics.2]
text = "He came sweet in -- fluence to im -- part, A gra -- cious, will -- ing Guest, While He can find one hum -- ble heart Where -- in to rest."

[lyrics.3]
text = "And His that gen -- tle voice we hear, Soft as the breath of ev’n, That checks each fault, that calms each fear, And speaks of heav’n."

[lyrics.4]
text = "O God of pur -- i -- ty and grace, Our weak -- ness, pity -- ing, see; O make our hearts Thy dwell -- ing -- place, And wor -- thier Thee."
