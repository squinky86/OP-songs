[lyrics.1]
text = "Not now, but in the com -- ing years, It may be in the bet -- ter land, We’ll read the mean -- ing of our tears. And there, some -- time, we’ll un -- der -- stand."

[lyrics.2]
text = "We’ll catch the bro -- ken thread a -- gain, And fin -- ish what we here be -- gan; Heav’n will the mys -- ter -- ies ex -- plain, And then, ah then, we’ll un -- der -- stand."

[lyrics.3]
text = "We’ll know why clouds in -- stead of sun Were o -- ver many a cher -- ished plan; Why song has ceased when scarce be -- gun; ’Tis there, some -- time, we’ll un -- der -- stand."

[lyrics.4]
text = "God knows the way, He holds the key, He guides us with un -- err -- ing hand; Some -- time with tear -- less eyes we’ll see; Yes, there, some -- time, we’ll un -- der -- stand."

[lyrics.chorus]
text = "Then trust in God thro’ all thy days; Fear not, for He doth hold thy hand; Tho’ dark thy way, still sing and praise; Some -- time, some -- time we’ll un -- der -- stand."

[parts.Alto.lyrics.chorus]
text = "Then trust in God thro’ all thy days; Fear not, for He doth hold doth hold thy hand; Tho’ dark thy way, still sing and praise; Some -- time, some -- time we’ll un -- der -- stand."
