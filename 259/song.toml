[lyrics.1]
text = "Thy Word, O Lord, is my de -- light, 'Tis man -- na to my hun -- gry soul; It is a nev -- er- -- fail -- ing light That marks the reef and rock -- y shoal."

[lyrics.2]
text = "Its pa -- ges teem with sa -- cred lore, From which all wis -- dom is con -- ferred; It grows in splen -- dor more and more, This Book of books, God's Ho -- ly Word."

[lyrics.3]
text = "It guards me from the temp -- ter's snare, And coun -- sels wis -- er than a friend; It com -- forts grief and light -- ens care, Its yield of rich -- es has no end."

[lyrics.4]
text = "It is a treas -- ure house of gold, From whose sup -- plies I would not part; It gives re -- turns a thou -- sand fold, When plant -- ed in the hu -- man heart."

[lyrics.5]
text = "O Book of Life, of Love and Truth, My hope of heav'n I find in thee; The on -- ly guide of age and youth, The Word of God— His gift to me."

[lyrics.chorus]
text = "“Ho -- ly Bi -- ble, Book di -- vine, Pre -- cious treas -- ure, thou art mine.”"
