[lyrics.1]
text = "Un -- der the blood of God’s own pre -- cious Son, Shed on the cross, for my sin to a -- tone; I have sweet peace, for my guilt is all gone, Un -- der the cleans -- ing blood."

[lyrics.2]
text = "Un -- der the blood I am kept so se -- cure, None of sin’s pleas -- ures can ev -- er al -- lure; Ful -- ly I’m cleansed, all my heart is made pure, Un -- der the cleans -- ing blood."

[lyrics.3]
text = "Un -- der the blood— O how hap -- py each day! Un -- der the blood let me ev -- er -- more stay; Joy -- ous -- ly liv -- ing for Him ev -- ’ry day, Un -- der the cleans -- ing blood."

[lyrics.chorus]
text = "Un -- der the blood, His pre -- cious blood, Je -- sus has saved me— I’m un -- der the blood; Free from all sin, Joy reigns with -- in! Glo -- ry to Je -- sus— I’m un -- der the blood."
