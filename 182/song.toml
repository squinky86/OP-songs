[lyrics.1]
text = "In heav'n -- ly love a -- bid -- ing, No change my heart shall fear; And safe is such con -- fid -- ing, For noth -- ing chang -- es here. The storm may roar with -- out me, My heart may low be laid, But God is round a -- bout me, And can I be dis -- mayed?"

[lyrics.2]
text = "Wher -- ev -- er He may guide me, No want shall turn me back; My Shep -- herd is be -- side me, And noth -- ing can I lack. His wis -- dom ev -- er wa -- keth; His sight is nev -- er dim. He knows the way He ta -- keth, And I will walk with Him."

[lyrics.3]
text = "Green pas -- tures are be -- fore me, Which yet I have not seen. Bright skies will soon be o'er me, Where dark -- est clouds have been. My hope I can -- not meas -- ure; My path to life is free. My Sav -- ior is my treas -- ure, And He will walk with me."
