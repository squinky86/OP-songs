[lyrics.1]
text = "How sweet, how heav'n -- ly is the sight, When those that love the Lord In one an -- oth -- er's peace de -- light, And so ful -- fill His Word."

[lyrics.2]
text = "When each can feel his bro -- ther's sigh And with him bear a part; When sor -- row flows from eye to eye, And joy from heart to heart."

[lyrics.3]
text = "When, free from en -- vy, scorn, and pride, Our wish -- es all a -- bove, Each can his bro -- ther's fail -- ings hide, And show a bro -- ther's love."

[lyrics.4]
text = "When love, in one de -- light -- ful stream, Through ev -- 'ry bo -- som flows; When un -- ion sweet, and dear es -- teem, In ev -- 'ry ac -- tion glows."

[lyrics.5]
text = "Love is the gold -- en chain that binds The hap -- py souls a -- bove; And he's an heir of Heav'n that finds His bo -- som glow with love."
