[lyrics.1]
text = "We are on life’s ship lead -- ing to our home, We are sail -- ing; Ev -- ’ry day brings us near -- er to the port, We are sail -- ing."

[lyrics.2]
text = "’Mid the roll -- ing seas, ’mid the dash -- ing waves, We are sail -- ing; But I found and know that my Pi -- lot saves, We are sail -- ing."

[lyrics.3]
text = "Oh each day brings us near to heav -- en’s shore, We are sail -- ing; Make your peace with God and His name a -- dore, We are sail -- ing."

[lyrics.chorus]
text = "Sail -- ing on life’s o -- cean wide, Drift -- ing on the roll -- ing tide; Soon we’ll be in sight of shore, Prais -- ing Him for -- ev -- er -- more."

