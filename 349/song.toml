[lyrics.1]
text = "O Word of God in -- car -- nate, O Wis -- dom from on high, O Truth, un -- changed, un -- chang -- ing, O Light of our dark sky, we praise Thee for the ra -- diance that from the hal -- lowed page, a lan -- tern to our foot -- steps, shines on from age to age."

[lyrics.2]
text = "The church from her dear Mas -- ter re -- ceived the gift di -- vine, and still that light she lift -- eth o'er all the earth to shine. It is the gold -- en cas -- ket, where gems of truth are stored; it is the heav'n- -- drawn pic -- ture Of Christ, the liv -- ing Word."

[lyrics.3]
text = "It float -- eth like a ban -- ner be -- fore God's host un -- furled; it shin -- eth like a bea -- con a -- bove the dark -- ling world. It is the chart and com -- pass that o'er life's surg -- ing sea, 'mid mists and rocks and quick -- sands, still guides, O Christ, to Thee."

[lyrics.4]
text = "O make Thy Church, dear Sav -- ior, a lamp of burn -- ished gold, to bear be -- fore the na -- tions Thy true light as of old. O teach Thy wand' -- ring pil -- grims by this, their path to trace, 'til, clouds and dark -- ness end -- ed, they see Thee face to face."
