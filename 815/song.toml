[lyrics.1]
text = "“Ask for the show -- ers of bless -- ing, Ye shall not seek Me in vain;” Aft -- er the voice of con -- fess -- ing, “Sound of a -- bun -- dance of rain.”"

[lyrics.2]
text = "“Bring all the tithes to My store -- house, Prove Me here -- with,” saith the Lord; Win -- dows of heav -- en shall o -- pen, Won -- der -- ful bless -- ings be poured."

[lyrics.3]
text = "“Mine all the gold and the sil -- ver, Mine all the hous -- es and lands; Blood- -- bo’t are ye and your chil -- dren, See the nail- -- prints in My hands.”"

[lyrics.chorus]
text = "“Ask for the rain,” Ask not in vain; “I will pour wa -- ter on him that is thirst -- y, And floods up -- on the dry ground.”"

[parts.Tenor.lyrics.chorus]
text = "“Ask for the rain,” life- -- giv -- ing rain, Look for the show’r, wait for the pow’r; “I will pour wa -- ter on him that is thirst -- y, And floods up -- on the dry ground.”"

[parts.Bass.lyrics.chorus]
