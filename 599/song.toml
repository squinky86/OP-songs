[lyrics.2]
text = "Je -- sus, weep -- ing, to your door has come, Won’t you let Him in your heart and home? Hear Him plead -- ing, let Him in to -- day, Do not turn your dear -- est Friend a -- way."

[lyrics.3]
text = "Hark -- en! sin -- ner, He is kock -- ing still, Do not treat your Heav’n -- ly Friend so ill; Has -- ten! bid Him en -- ter now your heart; Slight -- ed, weep -- ing, soon He may de -- part."

[lyrics.chorus]
