[lyrics.1]
text = "Fa -- ther, in the morn -- ing Un -- to Thee I pray; Let Thy lov -- ing- -- kind -- ness Keep me thro’ this day."

[lyrics.2]
text = "At the bus -- y noon -- tide, Press’d with work and care, Then I’ll wait with Je -- sus, Till He hear my pray’r."

[lyrics.3]
text = "When the eve -- ning shad -- ows Chase a -- way the light, Fa -- ther, then I’ll pray Thee, Bless Thy child to -- night."

[lyrics.4]
text = "Thus in life’s glad morn -- ing, In its bright noon -- day, In the shad -- owy eve -- ning, Ev -- er will I pray."

[lyrics.chorus]
text = "I will pray, I will pray, Ev -- er will I pray; Morn -- ing, noon and eve -- ning Un -- to Thee I’ll pray."
