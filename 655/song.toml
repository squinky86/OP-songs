[lyrics.1]
text = "There is no oth -- er way for the sin- -- bur -- dened soul, Than the blood pur -- chased way of the cross; Lead -- ing on to the life in the shel -- ter -- ing fold, Where the soul shall be free from all dross."

[lyrics.2]
text = "’Tis the true way of life, ’tis the one way of life, Oth -- er ways can but lead un -- to death; Seek the way of de -- light, crim -- son, though glo -- rious bright, Lead -- ing on to the home of the blest."

[lyrics.3]
text = "’Tis the way Je -- sus bought with His own pre -- cious blood, Free -- ly shed on the sin- -- curs -- ed tree; Since the stream trick -- led down, crim -- son col -- ored the ground, Mark -- ing life’s way for you and for me."

[lyrics.chorus]
text = "There is no oth -- er way, there is no oth -- er way, Than the way lead -- ing up by the cross; There is no oth -- er way, there is no oth -- er way, Than the blood- -- sprin -- kled way of the cross. of the cross."

