[lyrics.1]
text = "A -- wake, my soul, in joy -- ful lays, And sing the great Re -- deem -- er’s praise; He just -- ly claims a song from me— His lov -- ing- -- kind -- ness, O how free! Lov -- ing- -- kind -- ness, lov -- ing- -- kind -- ness, His lov -- ing- -- kind -- ness, O how free!"

[lyrics.2]
text = "He saw me ru -- ined in the fall, Yet lov’d me, not -- with -- stand -- ing all; He saved me from my lost es -- tate— His lov -- ing- -- kind -- ness, O how great! Lov -- ing- -- kind -- ness, lov -- ing- -- kind -- ness, His lov -- ing- -- kind -- ness, O how great!"

[lyrics.3]
text = "Tho’ num’ -- rous hosts of might -- y foes, Tho’ earth and hell my way op -- pose, He safe -- ly leads my soul a -- long— His lov -- ing- -- kind -- ness, O how strong! Lov -- ing- -- kind -- ness, lov -- ing- -- kind -- ness, His lov -- ing- -- kind -- ness, O how strong!"

[lyrics.4]
text = "When trou -- ble, like a gloom -- y cloud, Has gath -- ered thick and thun -- dered loud, He near my soul has al -- ways stood— His lov -- ing- -- kind -- ness, O how good! Lov -- ing- -- kind -- ness, lov -- ing- -- kind -- ness, His lov -- ing- -- kind -- ness, O how good!"
