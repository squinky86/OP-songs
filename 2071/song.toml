[lyrics.1]
text = "Broth -- er, if you love the Lord and be -- lieve His bless -- ed word, @s1 Do not work for Him to -- day, then to -- mor -- row hide a -- way, @s2"

[lyrics.2]
text = "Friend, there is no mid -- dle ground, if for glo -- ry you are bound, @s1 If the blood has made you whole, from the win -- dow of your soul @s2"

[lyrics.3]
text = "Where the drear -- y shad -- ows creep, where the bro -- ken- -- heart -- ed weep, @s1 For the souls who lin -- ger near, long -- ing for a word of cheer, @s2"

[lyrics.4]
text = "Be the same each pass -- ing day, as you walk the nar -- row way, @s1 Till your work on earth is done, and the vict’ -- ry has been won, @s2"

[lyrics.chorus]
text = "Let your light shine out, shine out, Let your light shine out, shine out; Do not keep it hid from view, For some lost soul is watch -- ing you, Let your light, yes, let your light shine out."

