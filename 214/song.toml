[lyrics.1]
text = "Stand up, stand up for Je -- sus, ye sol -- diers of the cross; Lift high His roy -- al ban -- ner, it must not suf -- fer loss. From vic -- tory un -- to vic -- tory His ar -- my shall He lead, Till ev -- ery foe is van -- quished, and Christ is Lord in -- deed."

[lyrics.2]
text = "Stand up, stand up for Je -- sus, the sol -- emn watch -- word hear; If while ye sleep He suf -- fers, a -- way with shame and fear; Wher -- e’er ye meet with e -- vil, with -- in you or with -- out, Charge for the God of bat -- tles, and put the foe to rout."

[lyrics.3]
text = "Stand up, stand up for Je -- sus, the trum -- pet call o -- bey; Forth to the might -- y con -- flict, in this His glo -- rious day. Ye that are brave now serve Him a -- gainst un -- num -- bered foes; Let cour -- age rise with dan -- ger, and strength to strength op -- pose."

[lyrics.4]
text = "Stand up, stand up for Je -- sus, stand in His strength a -- lone; The arm of flesh will fail you, ye dare not trust your own. Put on the Gos -- pel ar -- mor, each piece put on with prayer; Where du -- ty calls or dan -- ger, be nev -- er want -- ing there."

[lyrics.5]
text = "Stand up, stand up for Je -- sus, each sol -- dier to his post, Close up the brok -- en col -- umn, and shout through all the host: Make good the loss so heav -- y, in those that still re -- main, And prove to all a -- round you that death it -- self is gain."

[lyrics.6]
text = "Stand up, stand up for Je -- sus, the strife will not be long; This day the noise of bat -- tle, the next the vic -- tor’s song. To him who o -- ver -- com -- eth a crown of life shall be; They with the King of Glo -- ry shall reign e -- ter -- nal -- ly."
