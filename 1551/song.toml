[lyrics.1]
text = "O -- ver Jor -- dan we shall meet, By and by, by and by; In the hap -- py land so sweet, By and by, by and by; We shall gath -- er on the shore, With our kin -- dred gone be -- fore, And the Sav -- iour’s name a -- dore, By and by, by and by."

[lyrics.2]
text = "All our sor -- rows shall be past, By and by, by and by; We shall reach our home at last, By and by, by and by; With the ran -- somed we shall stand, There a ho -- ly, hap -- py band, Crown’d with glo -- ry in that land, By and by, by and by."

[lyrics.3]
text = "We shall join the heav’n -- ly choir, By and by, by and by; We shall strike the gold -- en lyre, By and by, by and by; In our home so bright and fair, Where the hap -- py an -- gels are, We shall praise for -- ev -- er there, By and by, by and by."

[lyrics.4]
text = "There we’ll join the ran -- somed throng, By and by, by and by; Chant -- ing love’s re -- deem -- ing song, By and by, by and by; There we’ll meet be -- fore the throne, Then we’ll lay our tro -- phies down, And re -- ceive a shin -- ing crown, By and by, by and by."
