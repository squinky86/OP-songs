[lyrics.1]
text = "Songs of praise a -- woke the morn When the Prince of Peace was born; Songs of praise a -- rose when He Cap -- tive led cap -- tiv -- i -- ty."

[lyrics.2]
text = "Heav’n and earth must pass a -- way— Songs of praise shall crown the day; God will make new heav’ns and earth— Songs of praise shall hail their birth."

[lyrics.3]
text = "Saints be -- low, with heart and voice, Still in songs of praise re -- joice; Learn -- ing here, by faith and love, Songs of praise to sing a -- bove."

[lyrics.4]
text = "Borne up -- on the lat -- est breath, Songs of praise shall con -- quer death; Then, a -- midst e -- ter -- nal joy, Songs of praise their pow’rs em -- ploy."
