[lyrics.1]
text = "Hark! the her -- ald an -- gels sing, “Glo -- ry to the new -- born King: Peace on earth, and mer -- cy mild, God and sin -- ners rec -- on -- ciled!” Joy -- ful, all ye na -- tions, rise, join the tri -- umph of the skies; With th'an -- gel -- ic hosts pro -- claim, “Christ is born in Beth -- le -- hem!”"

[lyrics.2]
text = "Christ, by high -- est heav'n a -- dored, Christ, the ev -- er -- last -- ing Lord, Late in time be -- hold Him come, Off -- spring of the Vir -- gin's womb: Veiled in flesh the God -- head see; Hail th'in -- car -- nate De -- i -- ty, Pleased with us in flesh to dwell, Je -- sus, our Im -- man -- u -- el."

[lyrics.3]
text = "Hail the heav'n- -- born Prince of Peace! Hail the Sun of Right -- eous -- ness! Light and life to all He brings, Ris'n with heal -- ing in His wings. Mild He lays His glo -- ry by, Born that we no more may die, Born to raise us from the earth, Born to give us sec -- ond birth."

[lyrics.chorus]
text = "Hark! the her -- ald an -- gels sing, “Glo -- ry to the new -- born King!”"
