[lyrics.1]
text = "My Re -- deem -- er has gone to pre -- pare (in the sky,) Bless -- ed man -- sions of rest by and by (by and by,) Soon He’ll call me home to rest with the ran -- somed and the best, For it all will be glo -- ry by and by (o -- ver there.)"

