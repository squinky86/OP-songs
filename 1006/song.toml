[lyrics.1]
text = "I washed my hands this morn -- ing, O ver -- y clean and white; And lent them both to Je -- sus, To work for Him till night."

[lyrics.2]
text = "I told my ears to lis -- ten Quite close -- ly all day thro’, For an -- y act of kind -- ness Such lit -- tle hands can do."

[lyrics.3]
text = "My eyes are set to watch them A -- bout their work or play, To keep them out of mis -- chief, For Je -- sus’ sake all day."

[lyrics.chorus]
text = "Lit -- tle feet, be care -- ful, Where you take me to; An -- y -- thing for Je -- sus On -- ly let me do."
