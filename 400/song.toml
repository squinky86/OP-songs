[lyrics.1]
text = "O hap -- py day that fixed my choice On Thee, my Sav -- ior and my God! Well may this glow -- ing heart re -- joice, And tell its rap -- tures all a -- broad."

[lyrics.2]
text = "'Tis done, the great trans -- ac -- tion's done; I am my Lord's, and He is mine: He drew me and I fol -- lowed on, Re -- joiced to own the call di -- vine."

[lyrics.3]
text = "Now rest, my long- -- di -- vid -- ed heart, Fixed on this bliss -- ful cen -- ter, rest; Here have I found a no -- bler part, Here heav'n -- ly plea -- sures fill my breast."

[lyrics.4]
text = "High heav'n that hears the sol -- emn vow, That vow re -- newed shall dai -- ly hear; Till in life's lat -- est hour I bow, And bless, in death, a bond so dear."

[lyrics.chorus]
text = "Hap -- py day, hap -- py day, When Je -- sus washed my sins a -- way! He taught me how to watch and pray, And live re -- joic -- ing ev -- 'ry day; Hap -- py day, hap -- py day, When Je -- sus washed my sins a -- way!"
