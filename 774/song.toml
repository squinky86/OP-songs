[lyrics.1]
text = "A man -- sion in glo -- ry where bright an -- gels a -- bide, Where saints of all a -- ges with the Lord glo -- ri -- fied; Will sing with re -- joic -- ing ’round His beau -- ti -- ful throne, Oh! will you be read -- y when He comes for His own?"

[lyrics.2]
text = "With ten -- der com -- pas -- sion He is call -- ing for Thee, If sin- -- sick and wea -- ry, to His arms quick -- ly flee; He pleads with the Fa -- ther your poor soul to re -- deem, He’ll wash you and cleanse you in the life giv -- ing stream."

[lyrics.3]
text = "He pur -- chased re -- demp -- tion with His own pre -- cious blood, Then why not be -- lieve Him and o -- bey all His word? Pre -- pare now to meet Him when He comes for His own, Be read -- y to greet Him in that heav -- en -- ly home."

[lyrics.4]
text = "The dark shades of ev’ -- ning soon will come to us all, The judge -- ment is com -- ing, we must an -- swer the call; Oh why not be read -- y, be pre -- pared then to go, And dwell with the Sav -- ior free from sor -- row and woe?"

[lyrics.chorus]
text = "Then why are you wait -- ing yet, Oh why long -- er roam? The Bride and the Spir -- it now in -- vites you to come; The Sav -- ior is plead -- ing there be -- fore the Fa -- ther’s throne, The an -- gels are wait -- ing now to wel -- come you home."
