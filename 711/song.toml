[lyrics.2]
text = "Are you ev -- er bur -- dened with a load of care? Does the cross seem heav -- y you are called to bear? Count your man -- y bless -- ings, ev -- ’ry doubt will fly, And you will be sing -- ing as the days go by."

[lyrics.3]
text = "When you look at oth -- ers with their lands and gold, Think that Christ has prom -- ised you His wealth un -- told; Count your man -- y bless -- ings, mon -- ey can -- not buy Your re -- ward in heav -- en, nor your home on high."

[lyrics.4]
text = "So, a -- mid the con -- flict, wheth -- er great or small, Do not be dis -- cour -- aged, God is o -- ver all: Count your man -- y bless -- ings an -- gels will at -- tend, Help and com -- fort give you to your jour -- ney’s end."

