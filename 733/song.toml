[lyrics.1]
text = "Fare -- well, dear friends, for we have gleaned The har -- vest great and small And gath -- ered in the gol -- den grain To bless the Mas -- ter’s call."

[lyrics.2]
text = "And in that land of pure de -- light Where sor -- row is un -- known; We’ll sing the ev -- er -- last -- ing songs A -- round the great white throne."

[lyrics.3]
text = "Oh, grave where is thy vic -- to -- ry? Oh, death where is thy sting? We’ll clasp the hands of those we love, While rap -- tured an -- gels sing."

[lyrics.4]
text = "Oh, won’t that be a hap -- py time, When we the King shall see; We’ll dwell in that sweet land su -- blime, Thro -- out e -- ter -- ni -- ty."

[lyrics.chorus]
text = "Fare -- well, for we shall meet in glo -- ry A -- round the Fa -- ther’s great white throne; And we shall know the old, old sto -- ry, Christ the Sav -- ior, King doth reign. the King doth reign."

