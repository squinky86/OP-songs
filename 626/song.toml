[lyrics.1]
text = "We will sing the old, old sto -- ry, By and by when we get home, And a -- dore the King of glo -- ry, By and by when we get home."

[lyrics.2]
text = "With the saved gone on be -- fore us, By and by when we get home, We will sing re -- demp -- tion’s cho -- rus, By and by when we get home."

[lyrics.3]
text = "In that life that’s nev -- er end -- ing, By and by when we get home, God we’ll praise with voic -- es blend -- ing, By and by when we get home."

[lyrics.4]
text = "’Mid the scenes of bliss su -- per -- nal, By and by when we get home, O our joy will be e -- ter -- nal, By and by when we get home."

[lyrics.5]
text = "There we’ll rest in peace for -- ev -- er, By and by when we get home, Pain to feel a -- gain, no, nev -- er, By and by when we get home."

[lyrics.chorus]
text = "By and by when we get home, By and by when we get home; We will live with God for -- ev -- er, By and by when we get home!"
