[lyrics.2]
text = "Seek ye first the king -- dom; Ev -- er -- last -- ing love Woos you to the bless -- ings From the land a -- bove. Par -- don and re -- new -- al, Right -- eous -- ness and peace, Grace for ev -- ’ry tri -- al, Joys that nev -- er cease."

[parts.Tenor.lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "Seek ye first the king -- dom, Seek the “Gift of God”; ’Tis the Sav -- ior’s of -- fer, Pur -- chased by His blood. Seek ye first His glo -- ry; Be it life’s sweet aim Him to serve and hon -- or, Trust -- ing in His name."

[parts.Tenor.lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = ""

[lyrics.chorus]
text = "“Seek ye first the king -- dom:” ’Tis the Mas -- ter’s voice; In His pre -- cious prom -- ise Ev -- er -- more re -- joice. “All things else,” His word is true, “Shall be add -- ed un -- to you,” In His pre -- cious prom -- ise Ev -- er -- more re -- joice."
