[lyrics.1]
text = "Com -- ing, com -- ing, yes, they are, Com -- ing, com -- ing, from a -- far: From the wild and scorch -- ing des -- ert, Af -- ric’s sons of col -- or deep; Je -- sus’ love has drawn and won them, At His cross they bow and weep."

[lyrics.2]
text = "Com -- ing, com -- ing, yes, they are, Com -- ing, com -- ing, from a -- far: From the fields and crowd -- ed cit -- ies, Chi -- na gath -- ers to His feet; In His love Shem’s gen -- tle chil -- dren Now have found a safe re -- treat."

[lyrics.3]
text = "Com -- ing, com -- ing, yes, they are, Com -- ing, com -- ing, from a -- far: From the In -- dus, and the Gan -- ges, Stead -- y flows the liv -- ing stream, To love’s o -- cean, to love’s bos -- om, Cal -- va -- ry their wond’ -- ring theme."

[lyrics.4]
text = "Com -- ing, com -- ing, yes, they are, Com -- ing, com -- ing, from a -- far: From the fro -- zen realms of mid -- night, O -- ver many a wear -- y mile, To ex -- change their soul’s long win -- ter For the sum -- mer of His smile."

[lyrics.5]
text = "Com -- ing, com -- ing, yes, they are, Com -- ing, com -- ing, from a -- far: All to meet in plains of glo -- ry, All to sing His prais -- es sweet; What a cho -- rus, what a meet -- ing, With the fam -- i -- ly com -- plete!"
