[lyrics.1]
text = "O! my friends so dear, clus -- tered ’round me here, I’ll reach heav -- en some glad day; To that land of song I am press -- ing on, I’ll reach heav -- en some glad day."

[lyrics.2]
text = "Friends un -- true while here, do not make me fear, I’ll reach heav -- en some glad day; Then they’ll un -- der -- stand. God holds to my hand, I’ll reach heav -- en some glad day."

[lyrics.3]
text = "Je -- sus’ saint -- ed face, in that ho -- ly place, I’ll reach heav -- en some glad day; With a wel -- come smile, cheers me all the while, I’ll reach heav -- en some glad day."

[lyrics.4]
text = "Thro’ the pearl -- y gates, where my moth -- er waits. I’ll reach heav -- en some glad day; With her smile so sweet, wait -- ing me to greet, I’ll reach heav -- en some glad day."

[lyrics.chorus]
text = "O! I’m glad that I can say, I’ll reach heav -- en some glad day! When God sends for me, O! what joy ’twill be,— I’ll reach heav -- en some glad day."
