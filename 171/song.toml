[lyrics.3]
text = "More pur -- i -- ty give me, more strength to o'er -- come, More free -- dom from earth -- stains, more long -- ings for home. More fit for the king -- dom, more use -- ful I'd be, More bless -- èd and ho -- ly, more, Sav -- ior, like Thee."
