[lyrics.1]
text = "O Thou Rock of my sal -- va -- tion, Hide me now from life’s sad woes; In Thy cleft made on Mount Calv -- ’ry, Hide me safe -- ly from all foes."

[lyrics.2]
text = "Ref -- uge sweet, O Rock of A -- ges, Let me now Thy pres -- ence claim; Let me seek when tem -- pests gath -- er Shel -- ter on -- ly in Thy name."

[lyrics.3]
text = "Thou, my ev -- er -- last -- ing com -- fort, Thou, my life, my joy, my stay; By Thy coun -- sel ev -- er guide me, Lead and keep me all the way."

