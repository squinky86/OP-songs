[lyrics.1]
text = "This is my Fa -- ther’s world, And to my lis -- t’ning ears All na -- ture sings, and round me rings The mu -- sic of the spheres. This is my Fa -- ther’s world: I rest me in the thought Of _ rocks and trees, of _ skies and seas— His hand the won -- ders _ wrought."

[lyrics.2]
text = "This is my Fa -- ther’s world: The birds their car -- ols raise, The morn -- ing light, the lil -- y white, De -- clare their Ma -- ker’s praise. This is my Fa -- ther’s world: He shines in all that’s fair; In the rust -- ling grass I _ hear Him pass, He speaks to me ev' -- ry -- where."

[lyrics.3]
text = "This is my Fa -- ther’s world: Oh, let me ne’er for -- get That though the wrong seems oft so strong, God is the ru -- ler yet. This is my Fa -- ther’s world, The bat -- tle is not done: Je -- _ -- sus Who died shall be sat -- is -- fied, And earth and Heav’n be _ one."
