[lyrics.1]
text = "I know that my Re -- deem -- er liv -- eth, And on His throne a -- gain shall stand; I know e -- ter -- nal life He giv -- eth, That grace and pow'r are in His hand."

[lyrics.2]
text = "I know His prom -- ise nev -- er fail -- eth, The Word He speaks, it can -- not die; Though cru -- el death my flesh as -- sail -- eth, Yet I shall see Him by and by."

[lyrics.3]
text = "I know my man -- sion He pre -- par -- eth, That where He is there I may be; O won -- drous thought, for me He car -- eth, And He at last will come for me."

[lyrics.chorus]
text = "I know, I know, that Je -- sus liv -- eth, And on the earth a -- gain shall stand; I know, I know, that life He giv -- eth, That grace and pow'r are in His hand."
