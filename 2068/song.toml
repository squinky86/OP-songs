[lyrics.1]
text = "On -- ly once can we jour -- ney thro’ this vain world be -- low, Let us make pre -- par -- a -- tion ere the time comes to go; Just a -- while to make read -- y,— How the time swift -- ly flies,— For that heav -- en -- ly coun -- try Where the soul nev -- er dies."

[lyrics.2]
text = "When, from heav -- en de -- scend -- ing, we the Sav -- ior shall see, Time will not be ex -- tend -- ed, but pre -- pared we must be; For the souls who re -- ject Him, And de -- ny His dear name, There’ll be weep -- ing and wail -- ing, Dis -- ap -- point -- ment and shame."

[lyrics.3]
text = "If we go to the judg -- ment, un -- pre -- pared, for our fate, We shall meet con -- dem -- na -- tion,— O, why lon -- ger then wait? If we’ll go to the Sav -- ior, Clad in gar -- ments of white, We shall find a glad wel -- come To that cit -- y of light."

[lyrics.chorus]
text = "Once, once my broth -- er, just once, To pre -- pare for the end of life’s way; Yield while the Spir -- it doth plead, O, we pray you get read -- y to -- day."
