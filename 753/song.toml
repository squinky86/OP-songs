[lyrics.1]
text = "All a -- long on the road to the souls true a -- bode, @s1 Ev -- ’ry step that you take this great Eye is a -- wake, @s2"

[lyrics.2]
text = "As you make life’s great fight, keep the path -- way of right, @s1 God will warn not to go in the path of the foe, @s2"

[lyrics.3]
text = "Fix your mind on the goal that sweet home of the soul. @s1 Nev -- er turn from the way to the king -- dom of day, @s2"

[lyrics.chorus]
text = "Watch -- ing you, watch -- ing you, Ev -- ’ry day mind the course you pur -- sue; Watch -- ing you, watch -- ing you, There’s an all- -- see -- ing Eye watch -- ing you."

[lyrics.s1]
text = "There’s an Eye watch -- ing you;"

[lyrics.s2]
text = "There’s an Eye watch -- ing you."
