[lyrics.1]
text = "I know not why God’s won -- drous grace To me He hath made known, Nor why— un -- wor -- thy— Christ in love, Re -- deemed me for His own."

[lyrics.2]
text = "I know not how the Spir -- it moves, Con -- vinc -- ing men of sin, Re -- veal -- ing Je -- sus thro’ the Word, Cre -- at -- ing faith in Him."

[lyrics.3]
text = "I know not what of good or ill May be re -- served for me, Of wea -- ry ways or gold -- en days, Be -- fore His face I see."

[lyrics.4]
text = "I know not when my Lord may come, At night or noon -- day fair, Nor if I’ll walk the vale with Him, Or “meet Him in the air.”"

[lyrics.chorus]
text = "But “I know Whom I have be -- liev -- ed, And am per -- suad -- ed that He is a -- ble To keep that which I’ve com -- mit -- ted Un -- to Him a -- gainst that day.”"
