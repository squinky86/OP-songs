[lyrics.1]
text = "Have thine af -- fec -- tions been nailed to the cross? Is thy heart right with God? Dost thou count all things for Je -- sus but loss? Is thy heart right with God?"

[lyrics.2]
text = "Hast thou do -- min -- ion o’er self and o’er sin? Is thy heart right with God? O -- ver all e -- vil with -- out and with -- in? Is thy heart right with God?"

[lyrics.3]
text = "Is there no more con -- dem -- na -- tion for sin? Is thy heart right with God? Does Je -- sus rule in the tem -- ple with -- in? Is thy heart right with God?"

[lyrics.4]
text = "Are all thy pow’rs un -- der Je -- sus’ con -- trol? Is thy heart right with God? Does He each mo -- ment a -- bide in thy soul? Is thy heart right with God?"

[lyrics.chorus]
text = "Is thy heart right with God, Washed in the crim -- son flood, Cleansed and made ho -- ly, hum -- ble and low -- ly, Right in the sight of God?"

[parts.Alto.lyrics.chorus]
text = "Is thy heart right with God, Washed in the crim -- son flood, Cleansed and made ho -- ly, hum -- ble and low -- ly, Right in the sight of God? of God?"

[parts.Tenor.lyrics.chorus]
