[lyrics.3]
text = "The light of the world, ev -- ’ry day, (each day,) Let your light on your fel -- low- -- man shine, (yes, shine,) That be -- hold -- ing your up -- right -- ness, they, that they, By your works to the good may in -- cline."

[parts.Soprano.lyrics.3]
