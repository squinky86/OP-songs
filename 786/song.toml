[lyrics.1]
text = "“I am the vine and ye are the branch -- es,” Bear pre -- cious fruit for Je -- sus to -- day; Branch -- es in Him no fruit ev -- er bear -- ing, Je -- sus hath said, “He tak -- eth a -- way.”"

[lyrics.2]
text = "“Now ye are clean thro’ words I have spo -- ken, Liv -- ing in Me, much fruit ye shall bear; Dwell -- ing in you, My prom -- ise un -- bro -- ken, Glo -- ry in heav’n with Me ye shall share.”"

[lyrics.3]
text = "Yes, by your fruits the world is to know you, Walk -- ing in love as chil -- dren of day; Fol -- low your Guide, He pass -- eth be -- fore you, Lead -- ing to realms of glo -- ri -- ous day."

[lyrics.chorus]
text = "“I am the vine and ye are the branch -- es; I am the vine, be faith -- ful and true; Ask what ye will, your pray’r shall be grant -- ed, The Fa -- ther loved Me, so I have loved you.”"
