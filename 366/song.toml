[lyrics.1]
text = "In Christ there is no East or West, In Him no South or North; But one great fel -- low -- ship of love Through -- out the whole wide earth."

[lyrics.2]
text = "In Him shall true hearts ev -- ery -- where Their high com -- mun -- ion find; His ser -- vice is the gold -- en cord, Close bind -- ing hu -- man -- kind."

[lyrics.3]
text = "Join hands, then, mem -- bers of the faith, What -- e'er your race may be! Who serves my Fa -- ther as His child Is sure -- ly kin to me."

[lyrics.4]
text = "In Christ now meet both East and West, In Him meet North and South; All Christ -- ly souls are one in Him Through -- out the whole wide earth."
