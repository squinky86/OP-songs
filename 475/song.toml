[lyrics.1]
text = "Tho' far a -- way, you've gone a -- stray, God's ho -- ly law trans -- gress -- ing, Yield to the right, come back to -- night, His won -- drous love con -- fess -- ing!"

[lyrics.2]
text = "Where thou art, there, of peace 'tis bare, You have no prom -- ised bless -- ing, There's naught to gain, save spir -- it- -- pain, And woe, be -- yond ex -- press -- ing!"

[lyrics.3]
text = "Let not, the tempt -- er you, de -- ceive, With his all vain ca -- ress -- ing, 'Twill leave you there in dark de -- spair, And grief, thy soul dis -- tress -- ing!"

[lyrics.4]
text = "Be -- hold the love of Christ, a -- bove! And come, to Him, re -- pent -- ing, He knows thy needs, and in -- ter -- cedes, To hush thy soul's la -- ment -- ing!"

[lyrics.5]
text = "Come back, come back, come back to -- night, It is thy God's ad -- dress -- ing! Come back, come back, come back to -- night, His won -- drous love con -- fess -- ing!"

[lyrics.chorus]
text = "Come back, come back, come back to -- night, Come back from thy trans -- gress -- ing! Come back, come back, come back to -- night, His won -- drous love con -- fess -- ing!"
