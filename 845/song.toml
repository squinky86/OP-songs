[lyrics.1]
text = "Hail to the bright -- ness of Zi -- on’s glad morn -- ing, Joy to the lands that in dark -- ness have lain! Hushed be the ac -- cents of sor -- row and mourn -- ing, Zi -- on in tri -- umph be -- gins her mild reign."

[lyrics.2]
text = "Hail to the bright -- ness of Zi -- on’s glad morn -- ing, Long by the proph -- ets of Is -- rael fore -- told; Hail to the mil -- lions from bond -- age re -- turn -- ing! Gen -- tiles and Jews the blest vi -- sion be -- hold."

[lyrics.3]
text = "Lo, in the des -- ert rich flow -- ers are spring -- ing, Streams ev -- er co -- pious are glid -- ing a -- long; Loud from the moun -- tain- -- tops ech -- oes are ring -- ing, Wastes rise in ver -- dure and min -- gle in song."

[lyrics.4]
text = "See, from all lands, from the isles of the o -- cean, Praise to Je -- ho -- vah as -- cend -- ing on high; Fall’n are the en -- gines of war and com -- mo -- tion, Shouts of sal -- va -- tion are rend -- ing the sky."
