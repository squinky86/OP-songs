[lyrics.1]
text = "Je -- sus shall reign wher -- e'er the sun Does its suc -- ces -- sive jour -- neys run, His king -- dom stretch from shore to shore, Till moons shall wax and wane no more."

[lyrics.2]
text = "To Him shall end -- less prayer be made, And prais -- es throng to crown His head. His name like sweet per -- fume shall rise With ev -- ery morn -- ing sac -- ri -- fice."

[lyrics.3]
text = "Peo -- ple and realms of ev -- ery tongue Dwell on His love with sweet -- est song, And in -- fant voic -- es shall pro -- claim Their ear -- ly bless -- ings on His name."

[lyrics.4]
text = "Bless -- ings a -- bound wher -- e'er He reigns: The pris -- oners leap to lose their chains, The wea -- ry find e -- ter -- nal rest, And all who suf -- fer want are blest."

[lyrics.5]
text = "Let ev -- ery crea -- ture rise and bring The high -- est hon -- ors to our King, An -- gels des -- cend with songs a -- gain, And earth re -- peat the loud a -- men."
