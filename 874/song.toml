[lyrics.1]
text = "In the land of fade -- less day Lies the “cit -- y four- -- square;” It shall nev -- er pass a -- way, And there is “no night there.”"

[lyrics.2]
text = "All the gates of pearl are made In the “cit -- y four- -- square;” All the streets with gold are laid, And there is “no night there.”"

[lyrics.3]
text = "And the gates shall nev -- er close To the “cit -- y four- -- square;” There life’s crys -- tal riv -- er flows, And there is “no night there.”"

[lyrics.4]
text = "There they need no sun -- shine bright, In the “cit -- y four- -- square;” For the Lamb is all the light, And there is “no night there.”"

[lyrics.chorus]
text = "God shall “wipe a -- way all tears;” There’s no death, no pain, nor fears; And they count not time by years, For there is “no night there.”"

[parts.Alto.lyrics.chorus]
text = "God shall “wipe a -- way all tears;” There’s no death, no pain, nor fears; And they count not time by years, by years, For there is “no night there.”"

[parts.Tenor.lyrics.chorus]
text = "God shall “wipe a -- way all tears;” There’s no death, no pain, nor fears; And they count not time by years, by years, For there is “no night there.”"

[parts.Bass.lyrics.chorus]
text = "God shall “wipe a -- way all tears;” There’s no death, no pain, nor fears; And they count not time by years, by years, For there is “no night there.”"
