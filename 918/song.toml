[lyrics.1]
text = "O could I speak the match -- less worth, O could I sound the glo -- ries forth, Which in my Sav -- ior shine! I’d soar and touch the heav’n -- ly strings, And vie with Ga -- briel while he sings In notes al -- most di -- vine, In notes al -- most di -- vine."

