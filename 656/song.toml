[lyrics.1]
text = "Some day the cares of life will pass, We’ll meet our friends in par -- a -- dise; ’Tis there we’ll sing the glad new song, Oh! praise the Lord, ’twill not be long."

[lyrics.2]
text = "The Lord is com -- ing back a -- gain, He’ll take us home with Him to reign; The toils of life will then be o’er, We’ll live with Him on heav -- en’s shore."

[lyrics.3]
text = "How soon the time we do not know, Then be pre -- pared with Him to go; Or you, up -- on the judg -- ment day, With sin -- ners will be turned a -- way."

[lyrics.4]
text = "A few more days to strug -- gle on, And then the life- -- crown will be won; Oh! saints of God, the tho’t so sweet, Our bless -- ed Sav -- ior then we’ll meet."

[lyrics.chorus]
