[lyrics.1]
text = "No mat -- ter what your sta -- tion in life, God will pro -- vide for you, Trust -- ing in Him thro’ bat -- tle and strife, God will pro -- vide for you."

[lyrics.2]
text = "Tho’ bur -- dens press as on -- ward you go, God will pro -- vide for you; Walk -- ing with Him one thing you shall know, He will pro -- vide for you."

[lyrics.3]
text = "Take cour -- age, friend, just pray and pre -- vail, God will pro -- vide for you; Liv -- ing by faith you nev -- er can fail, God will pro -- vide for you."

[lyrics.4]
text = "On to the goal! no mat -- ter the test, God will pro -- vide for you; Fight -- ing all o’er, in heav -- en you’ll rest, God will pro -- vide for you."

[lyrics.chorus]
text = "God will pro -- vide for you, my friend; God will pro -- vide for you, In ev -- ’ry test, lean on His breast, God will pro -- vide for you."
