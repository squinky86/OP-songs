[lyrics.2]
text = "Here be -- fell the trag -- ic sto -- ry, Fan -- cy paint the scene to me, Faith, light up the cen -- tral glo -- ry, Je -- sus in Geth -- sem -- a -- ne. In the dust Thy blood- -- drops moist -- ened, ’Neath the trees that saw Thy woe, Let me meet Thee, “Man of Sor -- rows,” Thou who knelt here long a -- go."

