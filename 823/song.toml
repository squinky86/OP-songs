[lyrics.1]
text = "Beau -- ti -- ful Zi -- on, built a -- bove, Beau -- ti -- ful cit -- y that I love; Beau -- ti -- ful gates of pearl -- y white, Beau -- ti -- ful tem -- ple— God its light; He who was slain on Cal -- va -- ry O -- pens those pearl -- y gates to me."

[lyrics.2]
text = "Beau -- ti -- ful heav’n, where all is light, Beau -- ti -- ful an -- gels, clothed in white; Beau -- ti -- ful strains that nev -- er tire, Beau -- ti -- ful harps thro’ all the choir; There shall I join the cho -- rus sweet, Wor -- ship -- ing at the Sav -- ior’s feet."

[lyrics.3]
text = "Beau -- ti -- ful throne for Christ our King, Beau -- ti -- ful songs the an -- gels sing; Beau -- ti -- ful rest— all wand’ -- rings cease, Beau -- ti -- ful home of per -- fect peace; There shall my eyes the Sav -- ior see: Haste to this heav’n -- ly home with me."

[lyrics.chorus]
text = "Zi -- on, Zi -- on, love -- ly Zi -- on! Beau -- ti -- ful Zi -- on, cit -- y of our God!"
