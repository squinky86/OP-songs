# Bass rests through the melody's "on" in m4 (as the tenor does) and also through
# "Just re-" in m11, where the plate gives it two eighth rests under the tenor's
# two beamed eighths.
[lyrics.1]
text = "There are shad -- ows of sor -- row that dark -- en life's way, They are on -- ly shad -- ows, But be -- hind the dark shad -- ows shines love's kind -- ly ray, They are on -- ly shad -- ows."

[lyrics.2]
text = "There are shad -- ows of fear bring -- ing tho'ts that dis -- may, They are on -- ly shad -- ows, If we walk in His love they will all pass a -- way, They are on -- ly shad -- ows."

[lyrics.3]
text = "There are shad -- ows of doubt that steal in -- to our mind, They are on -- ly shad -- ows, If we look to the cross blest as -- sur -- ance we find, They are on -- ly shad -- ows."

[lyrics.4]
text = "There are shad -- ows of death that are black with de -- spair, They are on -- ly shad -- ows, For Christ Je -- sus, the Light of the world, will be there, They are on -- ly shad -- ows."

[lyrics.chorus]
text = "Do not doubt, do not fear, When the shad -- ows ap -- pear, Just re -- mem -- ber that dark lone -- ly shad -- ows Can -- not hide God's dear face, If we trust in His grace, They are on -- ly shad -- ows."
