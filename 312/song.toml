[parts.Bass.lyrics.chorus]
text = "Bright -- en the cor -- ner Shine for Je -- sus where you are! Bright -- en the cor -- ner where you are! Some -- one far from har -- bor you may guide a -- cross the bar; Bright -- en the cor -- ner where you are!"

[lyrics.1]
text = "Do not wait un -- til some deed of great -- ness you may do, Do not wait to shed your light a -- far, To the ma -- ny du -- ties ev -- er near you now be true, Bright -- en the cor -- ner where you are."

[lyrics.2]
text = "Just a -- bove are cloud -- ed skies that you may help to clear, Let not nar -- row self your way de -- bar; Though in -- to one heart a -- lone may fall your song of cheer, Bright -- en the cor -- ner where you are."

[lyrics.3]
text = "Here for all your tal -- ent you may sure -- ly find a need, Here re -- flect the bright and Morn -- ing Star; Ev -- en from your hum -- ble hand the Bread of Life may feed, Bright -- en the cor -- ner where you are."

[lyrics.chorus]
