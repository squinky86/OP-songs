[lyrics.1]
text = "I heard the voice of Je -- sus say, “Come un -- to Me and rest; Lay down, thou wea -- ry one, lay down Thy head up -- on My breast.” I came to Je -- sus as I was, Wea -- ry and worn and sad; I found in Him a rest -- ing- -- place, And He has made me glad."

[lyrics.2]
text = "I heard the voice of Je -- sus say, “Be -- hold, I free -- ly give The liv -- ing wa -- ter; thirst -- y one, Stoop down, and drink and live.” I came to Je -- sus and I drank Of that life- -- giv -- ing stream: My thirst was quenched, my soul re -- vived, And now I live in Him."

[lyrics.3]
text = "I heard the voice of Je -- sus say, “I am this dark world’s light: Look un -- to Me, thy morn shall rise, And all thy day be bright!” I looked to Je -- sus and I found In Him my Star, my Sun; And in that light of life I’ll walk Till trav’ -- ling days are done."
