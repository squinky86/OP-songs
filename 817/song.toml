[lyrics.1]
text = "Sing Al -- le -- lu -- ia to the Lord, By saints in heav’n and earth a -- dored! Raise once a -- gain the glo -- rious song Of praise, e -- ter -- nal, deep and strong!"

[lyrics.2]
text = "His wis -- dom planned the whole wide earth, At His great word the stars had birth! Each one, o -- be -- dient, fills its place Be -- cause His will per -- vades all space!"

[lyrics.3]
text = "His mer -- cy sent a Sav -- iour down, The Son of God, for man to crown! O sad in -- deed would this world be With -- out His grace, di -- vine and free!"

[lyrics.4]
text = "By His un -- err -- ing love sent forth, One last sweet bless -- ing came to earth, The Com -- fort -- er, the Spir -- it blest, In Whom a -- bid -- ing, all may rest."

[lyrics.5]
text = "All glo -- ry, hon -- or, pow’r and praise, To God, the Three- -- in- -- One, we raise, To Him Who sits up -- on the throne, In glo -- rious state, one God a -- lone!"

[lyrics.chorus]
text = "Al -- le -- lu -- ia! Al -- le -- lu -- ia! Al -- le -- lu -- ia!"
