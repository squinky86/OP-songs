[lyrics.1]
text = "E -- ter -- nal King, all hail to Thee! Be -- fore Thy throne we bend! Thy man -- dates shall be our de -- light, Thy reign we will de -- fend. Our pray'rs to Thee as -- cend from hearts Trans -- formed to meet Thy laws; Our joy, our pride, our boast is of Thy just and right -- eous cause."

[lyrics.2]
text = "Lead on, O King! a le -- gion waits The beck -- on of Thy hand; The strong -- holds of the en -- e -- my Shall fall at Thy com -- mand. Not through the strat -- e -- gy of man, Or car -- nal weap -- ons, may The gates of sin be bat -- tered down, And e -- vil swept a -- way."

[lyrics.3]
text = "The cross, the em -- blem of Thy love, Is gleam -- ing in the van! We fol -- low, a de -- ter -- mined host, The broth -- er -- hood of man. Soon will a glo -- rious dawn of peace Break to our long -- ing eyes, And songs of might -- y vic -- to -- ry Re -- ech -- o thro' the skies!"

[lyrics.chorus]
text = "Lead on, lead on, we'll fol -- low Thee to vic -- to -- ry! E -- ter -- nal King, lead on!"

