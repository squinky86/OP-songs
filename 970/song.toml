[lyrics.1]
text = "Down in the val -- ley with my Sav -- ior I would go, Where the flow’rs are bloom -- ing and the sweet wa -- ters flow; Ev -- ’ry -- where He leads me I would fol -- low, fol -- low on, Walk -- ing in His foot -- steps till the crown be won."

[lyrics.2]
text = "Down in the val -- ley with my Sav -- ior I would go, Where the storms are sweep -- ing and the dark wa -- ters flow; With His hand to lead me I will nev -- er, nev -- er fear, Dan -- ger can -- not fright me if my Lord is near."

[lyrics.3]
text = "Down in the val -- ley, or up -- on the moun -- tain steep, Close be -- side my Sav -- ior would my soul ev -- er keep; He will lead me safe -- ly in the path that He has trod, Up to where they gath -- er on the hills of God."

[lyrics.chorus]
text = "Fol -- low! fol -- low! I would fol -- low Je -- sus! An -- y -- where, ev -- ’ry -- where, I would fol -- low on! Fol -- low! fol -- low! I would fol -- low Je -- sus! Ev -- ’ry -- where He leads me I would fol -- low on!"
