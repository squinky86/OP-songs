[lyrics.1]
text = "Up -- on a wide and storm -- y sea, Thou’rt sail -- ing to e -- ter -- ni -- ty, And thy great Ad -- m'ral or -- ders thee: “Sail on! Sail on! Sail on!”"

[lyrics.2]
text = "Art far from shore, and wear -- y worn, The sky o’er -- cast, thy can -- vas torn? Hark ye! a voice to thee is borne: “Sail on! Sail on! Sail on!”"

[lyrics.3]
text = "Do com -- rades trem -- ble and re -- fuse To fur -- ther dare the taunt -- ing hues? No oth -- er course is thine to choose, “Sail on! Sail on! Sail on!”"

[lyrics.4]
text = "Do snarl -- ing waves thy craft as -- sail? Art power -- less, drift -- ing with the gale? Take heart! God’s Word shall ne -- ver fail. “Sail on! Sail on! Sail on!”"

[lyrics.chorus]
text = "Sail on! Sail on! The storms will soon be past, The dark -- ness will not al -- ways last; Sail on! Sail on! God lives and He com -- mands: “Sail on! Sail on!”"

[parts.Tenor.lyrics.chorus]
text = "Sail on! Sail on! The storms will soon be past, The dark -- ness will not al -- ways last; Sail on! sail on! Sail on! sail on! God lives and He com -- mands: “Sail on! Sail on!” sail on! sail on! sail on!"

