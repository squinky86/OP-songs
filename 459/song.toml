[parts.Bass.lyrics.chorus]
text = "'Twas love, 'twas match -- less love, That caused my Sav -- iour there Up -- on the cru -- el cross to choose A death death of shame for e -- ven me; How can I e'er re -- pay The debt of love I owe, For His sal -- va -- tion full and free, Giv'n thro' love, won -- der -- ful love, match -- less love?"

[lyrics.1]
text = "It was match -- less love that found me, When the bands of sin had bound me, It was love that planned es -- _ -- cape for me When I was lost, un -- done; It was love in sad plight saw me, It was love that reached out for me, 'Twas the pre -- cious love of Je -- sus Christ The might -- y, ho -- ly One."

[lyrics.2]
text = "What a ten -- der lov -- ing- -- kind -- ness, That _ sought me in my blind -- ness, And a mar -- vel -- ous re -- _ -- demp -- tion wrought That mor -- tals might be free! What an act in its com -- plete -- ness! What a love in ten -- der sweet -- ness! What a won -- der -- ful sal -- va -- tion now A -- bounds for you and me!"

[lyrics.3]
text = "What a won -- der -- ful re -- la -- tion That _ I, in low -- ly sta -- tion, Am _ called a “son un -- to God,” what more Could hu -- man heart de -- sire? By His ten -- der love o'er -- shad -- ed, I'll be kept till earth has fad -- ed From my sight, and I shall en -- ter in To join the heav'n -- ly choir."

[lyrics.chorus]
text = "Love, 'twas love, match -- less love, Love, 'twas love, match -- less love, Up -- on the cru -- el cross to choose A death of shame for me; Love, 'twas love, match -- less love, Love, 'twas love, love I owe, For His sal -- va -- tion full and free, Giv'n thro' love, love, match -- less love?"
