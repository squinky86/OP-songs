[lyrics.1]
text = "I’m sing -- ing of Je -- sus my won -- der -- ful Sav -- ior, Who gives me new bless -- ings each day; I know I am kept in His won -- der -- ful fav -- or, For love is my song all the way."

[lyrics.2]
text = "I praise Him be -- cause of His life giv -- ing pow -- er And won -- der -- ful good -- ness to me; His bless -- ings are fall -- ing on me like a show -- er, And keep -- ing me hap -- py and free."

[lyrics.3]
text = "I soon shall be -- hold Him in man -- sions of glo -- ry, And join there the glo -- ri -- fied throng; Where all thro’ the a -- ges we’ll sing the glad sto -- ry, There love will be al -- ways the song."

[lyrics.chorus]
text = "His love is my song, love is my song, I joy -- ful -- ly sing it each day, ev -- ’ry day; He leads me a -- long, leads me a -- long, The beau -- ti -- ful, beau -- ti -- ful heav -- en -- ly way."

