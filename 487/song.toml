# Lyrics transcribed from the plate (stanza rows 1-4, chorus row, and the D.S. row).
[lyrics.1]
text = "O I’m so glad I have a Friend Who know -- eth my ev -- ’ry care ’Tis God, on whom I can de -- pend To hear and to an -- swer pray’r."

[lyrics.2]
text = "I’m glad He’s prom -- ised in His word, That noth -- ing He will de -- ny; But my pe -- ti -- tions shall be heard, If on Him I will re -- ly."

[lyrics.3]
text = "He is a gra -- cious Friend in -- deed, Whose mer -- cies a -- bound for all; He’ll nev -- er fail in time of need, If on Him in faith I call."

[lyrics.4]
text = "The prom -- ise of this Friend of mine, Is giv -- en to ev -- ’ry soul; Who bends his will to that di -- vine, And yields to His full con -- trol."

[lyrics.chorus]
text = "His prom -- ise to love, to com -- fort and cheer, Grows sweet -- er to me each day. It drives a -- way all doubt and fear, And bright -- ens my home -- ward way."
