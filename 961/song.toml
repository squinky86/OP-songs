text = "Sing it o’er and o’er a -- gain; Christ re -- ceiv -- eth sin -- ful men, Christ re -- ceiv -- eth sin -- ful men; Make the mes -- sage clear and plain: Christ re -- ceiv -- eth sin -- ful men."

[parts.Tenor.lyrics.chorus]
