[lyrics.1]
text = "The sands of time are sink -- ing, The dawn of heav -- en breaks; The sum -- mer morn I’ve sighed for, The fair sweet morn a -- wakes. Dark, dark hath been the mid -- night, But day- -- spring is at hand, And glo -- ry, glo -- ry dwell -- eth In Im -- man -- uel’s land."

[lyrics.2]
text = "O Christ, He is the foun -- tain, The deep sweet well of love, The streams on earth I’ve tast -- ed, More deep I’ll drink a -- bove. There to an o -- cean full -- ness His mer -- cy doth ex -- pand, And glo -- ry, glo -- ry dwell -- eth In Im -- man -- uel’s land."

[lyrics.3]
text = "With mer -- cy and with judg -- ment My web of time He wove, And aye the dews of sor -- row Were bright -- ened by His love. I’ll bless the hand that guid -- ed, I’ll bless the heart that planned, When throned where glo -- ry dwell -- eth In Im -- man -- uel’s land."

[lyrics.4]
text = "The King there in His beau -- ty With -- out a veil is seen; It were a well- -- spent jour -- ney, Tho’ sev’n deaths lay be -- tween. The Lamb with His fair ar -- my Doth on Mount Zi -- on stand, And glo -- ry, glo -- ry dwell -- eth In Im -- man -- uel’s land."
