[lyrics.1]
text = "Free from the law, O hap -- py con -- di -- tion, Je -- sus has bled and there is re -- mis -- sion, Cursed by the law and bruised by the fall, Grace hath re -- deemed us once for all."

[lyrics.2]
text = "Now we are free, there’s no con -- dem -- na -- tion, Je -- sus pro -- vides a per -- fect sal -- va -- tion. “Come un -- to Me,” O hear His sweet call, Come, and He saves us once for all."

[lyrics.3]
text = "“Chil -- dren of God,” O glo -- ri -- ous call -- ing, Sure -- ly His grace will keep us from fall -- ing; Pass -- ing from death to life at His call; Bless -- èd sal -- va -- tion once for all."

[lyrics.chorus]
text = "Once for all, O sin -- ner, re -- ceive it, Once for all, O bro -- ther, be -- lieve it; Cling to the cross, the bur -- den will fall, Christ hath re -- deemed us once for all."
