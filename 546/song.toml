[parts.Alto.lyrics.1]
text = "My Sav -- iour is call -- ing, His voice I hear, I’ll go, glad -- ly go; His love will sus -- tain me, I have no fear, I’ll go, I’ll go, glad -- ly go, glad -- ly go."

[parts.Alto.lyrics.2]
text = "Tho’ rug -- ged and steep be my path each day, I’ll go, glad -- ly go; To bring back the lost ones to Christ, the way, I’ll go, I’ll go, glad -- ly go, glad -- ly go."

[parts.Alto.lyrics.3]
text = "To fight in the bat -- tles of Christ my Lord, I’ll go, glad -- ly go; The vic -- tor to be thro’ His bless -- ed word, I’ll go, I’ll go, glad -- ly go, glad -- ly go."

[parts.Alto.lyrics.chorus]
text = "I’ll go, glad -- ly go, glad -- ly go, I’ll go, glad -- ly go; glad -- ly go, Wher -- ev -- er He leads, by His hand di -- vine, I’ll go, I’ll go, glad -- ly go. glad -- ly go."

