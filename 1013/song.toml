[lyrics.1]
text = "Will He, Who sees each spar -- row fall, For -- get to care for me? Oh, no! He’ll hear my fee -- blest call, His love is full and free."

[parts.Tenor.lyrics.1]
text = ""

[parts.Bass.lyrics.1]
text = ""

[lyrics.2]
text = "He sees what griefs I have to bear, And whis -- pers words of cheer, He al -- ways will my sor -- rows share, My heart need have no fear."

[parts.Tenor.lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "He watch -- es o’er me day by day, Stands ev -- er by my side, Thro’ storm and sun -- shine all the way, He is my on -- ly guide."

[parts.Tenor.lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = ""

[lyrics.4]
text = "He nev -- er will for -- get His child, I can -- not well de -- spair; Se -- cure I’ll rest when storms grow wild, I’ll trust my Fa -- ther’s care."

[parts.Tenor.lyrics.4]
text = ""

[parts.Bass.lyrics.4]
text = ""

[lyrics.chorus]
text = "He loves me so, my Fa -- ther, dear, To Him I car -- ry all my woes, Why should I fear when He is near, He loves me so, He loves me so"

