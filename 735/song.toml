[lyrics.1]
text = "In the heav -- en -- ly way I am walk -- ing to -- day In the Pres -- ence of Je -- sus my King; And, in praise of His love which is all else a -- bove Songs of glo -- ry and glad -- ness I sing."

[lyrics.2]
text = "There is noth -- ing to fear with the Bless -- ed One near, For He keeps me by pow -- er di -- vine; Might -- y bil -- lows may roll, clouds be hid -- ing the goal, Sweet -- est safe -- ty will ev -- er be mine."

[lyrics.3]
text = "In His love I’ll a -- bide, what -- so -- e’er may be -- tide, Till no lon -- ger a pil -- grim I roam; In His love I shall rest ev -- er -- more with the blest, When I’ve en -- tered my beau -- ti -- ful home."

[lyrics.chorus]
text = "Songs of glo -- ry I sing to my heav -- en -- ly King, As I trav -- el a -- long ’tward the bless -- ed es -- tate; For I know that at last when my tri -- als are past, We shall meet at the “Beau -- ti -- ful gate.”"
