[lyrics.1]
text = "Mas -- ter, the tem -- pest is rag -- ing! The bil -- lows are toss -- ing high! The sky is o’er -- sha -- dowed with black -- ness, No shel -- ter or help is nigh; Car -- est Thou not that we per -- ish? How canst Thou lie a -- sleep, When each mo -- ment so mad -- ly is threaten -- ing A grave in the ang -- ry deep?"

[lyrics.2]
text = "Mas -- ter, with an -- guish of spir -- it I bow in my grief to -- day; The depths of my sad heart are trou -- bled Oh, wak -- en and save, I pray! Tor -- rents of sin and of ang -- uish Sweep o’er my sink -- ing soul; And I per -- ish! I per -- ish! dear Mas -- ter Oh, hast -- en, and take con -- trol."

[lyrics.3]
text = "Mas -- ter, the ter -- ror is o -- ver, The el -- e -- ments sweet -- ly rest; Earth’s sun in the calm lake is mir -- rored, And heav -- en’s with -- in my breast; Ling -- er, O bless -- èd Re -- deem -- er! Leave me a -- lone no more; And with joy I shall make the blest har -- bor, And rest on the bliss -- ful shore."

