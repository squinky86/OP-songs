[lyrics.1]
text = "Ris -- en with Christ! O bound -- less joy! Seek -- ing the things which are a -- bove; Free from the cares that would an -- noy, Walk -- ing in bonds of per -- fect love. We who are dead and not our own; Hid -- den with Christ, who is our life; Heirs of the Fa -- ther at the throne, Free from all ha -- tred, sin and strife."

[lyrics.2]
text = "Ris -- en with Christ! O peace sub -- lime! Wrought for the world, let saints pro -- claim; Je -- sus, the Lamb of Da -- vid’s line, Of -- fered, con -- demned, for sin -- ners slain; Raised from the dead and set on high, Peace from our God, so rich and free, Rules in our hearts as we draw nigh, Bless -- ing His grace e -- ter -- nal -- ly."

[lyrics.3]
text = "Ris -- en with Christ! O bless -- ed hope! Let all His saints with glad hearts sing Tri -- um -- phant -- ly in won -- drous note Mel -- o -- dies sweet for Christ our King. Elect -- ed of God, cre -- at -- ed new; Bear -- ing the fruits of right -- eous -- ness: Grace doth a -- bound, fears are sub -- dued, Trust -- ing His word in thank -- ful -- ness."

[lyrics.chorus]
text = "Ris -- en with Christ! O won -- drous grace! Soon we shall meet Him face to face. Ris -- en with Christ! O won -- drous grace! Soon we shall meet Him face to face."
