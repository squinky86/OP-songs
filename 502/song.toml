[lyrics.1]
text = "My life will shine with love di -- vine, If I but do my part; The Lord will keep when storms shall sweep, If I but do my part."

[lyrics.2]
text = "The foe will flee a -- way from me, If I but do my part; For Christ will shield me on the field, If I but do my part."

[lyrics.3]
text = "Some, lost in night, will see the light, If I but do my part; And some will plead, “Dear Sav -- iour lead,” If I but do my part."

[lyrics.4]
text = "At heav -- en’s gate my Lord will wait, If I but do my part; And He will say, “Well done,” that day, If I but do my part."

[lyrics.chorus]
text = "If I but do my part, Keep Je -- sus in my heart, A crown will be be -- stowed on me, If I but do my part."
