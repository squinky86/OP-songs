# = S+A, P2 bass = T+B). <divisions>480, <fifths>1 = G major, 6/4, 11 measures, a
# one-quarter pickup, no invisible barlines. Every bar tiles 6/4 exactly (2880 divisions)
# except m1 (480, the pickup) and m11 (2400, short by the pickup's quarter).
#
# THE WHOLE CYBER HYMNAL SOURCE CHAIN WAS RECOVERED, so essentially nothing below is an
# inference. Both still live on Wayback via the `if_` route:
#   .../tch/pdf/o/r/t/Ortonville.pdf      (the engraved plate, snapshot 20191104100544)
#   .../tch/nwc/o/r/t/o/Ortonville.nwc    (the NWC the XML was exported from, 20230609015042)
# NOTE THE ASYMMETRIC PATHS: the .nwc is under the expected four-letter fan-out o/r/t/o/,
# but the PDF is under a THREE-letter one, o/r/t/ — the four-letter pdf path 404s. Found
# by CDX search, not by guessing.
# The .nwc is an [NWZ] zlib container; inflating from byte offset 6 yields plain nwctxt.
# Its |Chord|Pos: values are ABSOLUTE staff positions, so they settle the NWC layer
# pathology outright instead of by inference. nwctxt == supplied XML on all 30 onsets,
# with no disagreement, and the plate (read at 900-1200 dpi with a staff-line ruler)
# confirms them. FINDINGS REST ON PRINT: read directly off the plate were the pickup,
# treble m2-m5 and m7-m11, and bass m2 (partial m3), m4-m11. Only treble m6 (note-for-
# note identical to m2) and bass m3 beats 3-6 were left to the nwctxt/XML agreement.
#
# PROVENANCE RECORDED IN THE .nwc: |SongInfo| carries
#   Copyright1:"Public Domain"
#   Copyright2:"Courtesy of the Cyber Hymnal™"
#   Comments:"Source: The Book of Hymns (Nashville, Tennessee: United Methodist
#             Publishing House, 1966), # 83."
# That names the edition this arrangement was taken from. The courtesy line below is
# therefore confirmed THREE independent ways (XML <credit>, nwctxt |Copyright2|, and the
# plate footer, which prints "Public Domain / Courtesy of the Cyber Hymnal™").
#
# TEMPO. Printed on the plate as a metronome mark, quarter = 150, and |Tempo|Tempo:150
# in the nwctxt agrees. Adopted as-is. Unlike song 330 this needs no caveat: the tune
# moves in half+quarter pairs, so 150 quarter = 0.8 s on each stressed syllable and
# 0.4 s on each weak one — a normal hymn pace, not a brisk one.
#
# VOICE EXTRACTION — inverted chord members, as flagged. In BOTH staves the XML's
# <note> is the LOWER voice and its <chord/> partner is the UPPER voice, so Alto and
# Bass come from the base notes and Soprano and Tenor from the chord members. The
# nwctxt |Chord|Pos: pairs confirm it directly (m1 treble "Pos:-7,-5" = B3 below, D4
# above; m1 bass "Pos:-4,3" = G2 below, G3 above). No mid-measure layer role swapping
# in this file. Checked afterwards: no S/A or T/B crossings anywhere.
#
# TENOR/BASS SING IN UNISON IN FOUR PLACES, and this is the one thing a stock import
# would have flattened. NWC cannot write a unison as a chord, so it writes the second
# voice as a layered note — "|Chord|Dur:Half|Pos:3|Opts:Stem=Down|Dur2:Half|Pos2:3",
# i.e. both voices at staff position 3. The XML export turns each of these into a bare
# voice-1 note plus a <backup> voice-2 note, which is why those bars look like they have
# a missing chord member. They do not. The unisons are:
#   m3 beats 1-2   G3     m7 beats 1-2   G3
#   m8 beats 4-6   D3     m10 beats 1-3  G3
# On the plate each prints as a SINGLE notehead with a single stem (verified at 1200 dpi
# — NWC merges the stems when duration and pitch match), so print cannot distinguish
