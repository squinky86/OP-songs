[lyrics.1]
text = "Tho migh -- ty storms are sweep -- ing And souls are filled with dread, I’m in my Shep -- herd’s keep -- ing, By qui -- et wa -- ters led."

[lyrics.2]
text = "In pas -- tures green He leads me And I have joy com -- plete. When naught I ask He heeds me And gives the bless -- ing sweet."

[lyrics.3]
text = "My cup is run -- ning o -- ver, With Him I face the goal; He’s my un -- fail -- ing Lov -- er, The Shep -- herd of my soul."

[lyrics.4]
text = "To heav -- en gent -- ly guid -- ing, My trust -- ing hand He’ll hold Till I am safe a -- bid -- ing In His e -- ter -- nal fold."

[lyrics.chorus]
text = "My Shep -- herd leads and keeps me In shad -- ow and in shine; Tho migh -- ty storms may sweep me The sweet -- est peace is mine."
