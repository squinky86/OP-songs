[lyrics.1]
text = "I’m on the road to heav’n a -- bove, To sing the songs of joy and love; And I by faith can al -- most see, the home my Lord pre -- pared for me."

[lyrics.2]
text = "Oh, bless -- ed tho’t when I shall stand, Re -- deemed by grace in that fair land; I then shall kneel at Je -- sus’ feet, And wor -- ship Him with joy com -- plete."

[lyrics.3]
text = "Oh, hap -- py time, oh, bless -- ed day! When sor -- rows all have passed a -- way, There with the saints I then shall sing, A -- round the throne, oh, bless His name."

[lyrics.4]
text = "What joy ’twill be, in that great day, When sor -- rows all have passed a -- way; I’ll go with Je -- sus to a -- bide; My soul shall then be sat -- is -- fied."

[lyrics.chorus]
text = "I’m on the road to my home up there, The glo -- rious home -- land of the soul; I’ll sing, while here, of the grand old sto -- ry, There live with Christ while a -- ges roll."

[parts.Alto.lyrics.chorus]
text = "I’m on the road to my home in heav -- en, The glo -- rious home -- land of the soul; I’ll sing, while here, of the grand old sto -- ry, There live with Christ while a -- ges roll. (while a -- ges roll.)"

[parts.Tenor.lyrics.chorus]
