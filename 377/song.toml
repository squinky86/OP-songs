[lyrics.1]
text = "Shall I cru -- ci -- fy my Sav -- ior, When for me He bore such loss? Shall I put to shame my Sav -- ior? Can I nail Him to the cross?"

[lyrics.2]
text = "Are temp -- ta -- tions so al -- lur -- ing? Do earth pleas -- ures so en -- thrall That I can -- not love my Sav -- ior Well e -- nough to leave them all?"

[lyrics.3]
text = "'Twas my sins that cru -- ci -- fied Him— Shall they cru -- ci -- fy Him yet? Black -- est day of name -- less an -- guish, Can my thank -- less soul for -- get?"

[lyrics.4]
text = "Oh, the kind -- ly hands of Je -- sus, Pour -- ing bless -- ings on all men! Bleed -- ing, nail- -- scarred hands of Je -- sus! Can I nail them once a -- gain?"

[lyrics.chorus]
text = "Shall I cru -- ci -- fy my Sav -- ior? Cru -- ci -- fy my Lord a -- gain? Once! oh, once! I cru -- ci -- fied Him! Shall I cru -- ci -- fy a -- gain?"
