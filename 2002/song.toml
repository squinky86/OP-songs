[lyrics.1]
text = "Who at the door is stand -- ing, Pa -- tient -- ly draw -- ing near, En -- trance with -- in de -- mand -- ing? Whose is the voice I hear?"

[lyrics.2]
text = "Lone -- ly with -- out He’s stay -- ing: Lone -- ly with -- in am I; While I am still de -- lay -- ing, Will He not pass me by?"

[lyrics.3]
text = "All thro’ the dark hours drear -- y, Knock -- ing a -- gain is He; Je -- sus, art Thou not wear -- y, Wait -- ing so long for me?"

[lyrics.4]
text = "Door of my heart, I has -- ten! Thee will I o -- pen wide; Tho’ He re -- buke and chas -- ten, He shall with me a -- bide."

[lyrics.chorus]
text = "Sweet -- ly the tones are fall -- ing: “O -- pen the door for me! If thou wilt heed my call -- ing, I will a -- bide with thee.”"
