[lyrics.1]
text = "O for a faith that will not shrink, Tho’ pressed by ev -- ’ry foe; That will not trem -- ble on the brink Of an -- y earth -- ly woe."

[lyrics.2]
text = "That will not mur -- mur or com -- plain Be -- neath the chast’ -- ning rod; But, in the hour of grief or pain, Will lean up -- on its God."

[lyrics.3]
text = "A faith that shines more bright and clear When tem -- pests rage with -- out; That, when in dan -- ger, knows no fear, In dark -- ness, feels no doubt!"

[lyrics.4]
text = "Lord, give us such a faith as this; And then, what -- e’er may come, We’ll taste, e’en here, the hal -- lowed bliss Of an e -- ter -- nal home."
