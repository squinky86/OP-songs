[lyrics.1]
text = "When we’re called to go to the great be -- yond, There to meet our Sav -- iour dear, May we all so live e’re the sum -- mons comes, That we’ll meet Him with -- out a fear."

[lyrics.2]
text = "When the sum -- mons comes from the Lord on high, And our work on earth is o’er; May we ev -- er dwell in that man -- sion fair, On that bright and e -- ter -- nal shore."

[lyrics.3]
text = "Earth -- ly cares and sor -- rows will soon be past, For our Lord has gone be -- fore,— He will call us home in the by and by, And we’ll dwell there for ev -- er -- more."

[lyrics.4]
text = "We are wait -- ing now for the call to come, When our joy shall be com -- plete; When we’ll meet a -- gain with our bless -- ed Lord, And the saved of all a -- ges greet."

[lyrics.chorus]
text = "When the sum -- mons comes in the last great day, And the Lord shall bid us come; May we rise to sing of His love su -- preme, In that joy e -- ter -- nal home."
