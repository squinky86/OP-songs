[lyrics.1]
text = "I hear Thy wel -- come voice That calls me, Lord, to Thee, For cleans -- ing in Thy pre -- cious blood That flowed on Cal -- va -- ry."

[lyrics.2]
text = "’Tis Je -- sus calls me on To per -- fect faith and love, To per -- fect hope and peace and trust, For earth and heav’n a -- bove."

[lyrics.3]
text = "’Tis Je -- sus who con -- firms The bless -- ed work with -- in, By add -- ing grace to wel -- comed grace, Where reigned the pow’r of sin."

[lyrics.4]
text = "And He as -- sur -- ance gives To loy -- al hearts and true, That ev’ -- ry prom -- ise is ful -- filled, To those who hear and do."

[lyrics.chorus]
text = "I am com -- ing, Lord, Com -- ing now to Thee: Wash me, cleanse me in the blood That flowed on Cal -- va -- ry."
