[lyrics.1]
text = "’Tis the hand of my Lord that is lead -- ing my way, Thro’ the world with its sor -- row and care; Here my feet it will guide, till my home I shall reach, And the joys that are mine to be there!"

[lyrics.2]
text = "Not a tear nor a sigh shall be mine all a -- lone, For He’ll give un -- to me of His grace; He will drive from my heart ev -- ’ry sad -- ness and gloom, By the show and the light of His face!"

[lyrics.3]
text = "And when there I have come, to the riv -- er of death, Not a cloud o’er my spir -- it shall roll, He the waves will di -- vide and a -- cross I shall go To my home, hap -- py home of the soul!"

[lyrics.chorus]
text = "’Tis the hand might -- y hand, of my Lord, bless -- ed Lord, That is lead -- ing, is lead -- ing my way! ’Tis the hand might -- y hand of the Lord, bless -- ed Lord, That is guid -- ing my feet ev -- ’ry day."

[parts.Soprano.lyrics.chorus]
text = "’Tis the hand of my Lord, That is lead -- ing, is lead -- ing my way! ’Tis the hand of the Lord, That is guid -- ing my feet ev -- ’ry day."
