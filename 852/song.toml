[lyrics.1]
text = "Hear the sweet voice of Je -- sus say, “Come un -- to me, I am the way;” Heark -- en, the lov -- ing call o -- bey, Come, for He loves you so."

[lyrics.2]
text = "Cast -- ing your heav -- y bur -- den down, Come to the cross, the world may frown; Yet you shall wear a glo -- rious crown, When He makes up His own."

[lyrics.3]
