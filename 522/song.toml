[parts.Soprano.lyrics.1]
text = "All glo -- ry and hon -- or to Je -- sus, my King, A won -- der -- ful Sav -- iour is He, Who came to this low -- land, sal -- va -- tion to bring, My sin cap -- tive soul to set free; In sor -- row and shame up -- on cal -- va -- ry’s mount, His life as a ran -- som He gave, Through death He there o -- pened a sin- -- cleans -- ing fount, My soul to save."

[parts.Soprano.lyrics.2]
text = "’Twas Je -- sus who left His fair home in the sky, And came to this sad world be -- low, The heart- -- aches and pains of this earth- -- life to try, That He all our yearn -- ings might know; He bore ev -- ’ry tri -- al, with -- stood ev -- ’ry care, Was tempt -- ed and yet knew no sin, That ev -- ’ry lost soul, in that hav -- en so fair, A home might win."

[parts.Soprano.lyrics.3]
text = "I’ll sing to the world of the won -- der -- ful grace, Por -- trayed by His death on the cross, Up -- on Him was laid all the guilt of the race, That He might re -- deem us from loss; No oth -- er has shown such com -- pas -- sion and love, Like Je -- sus, our Sav -- iour and Lord, That we might in -- her -- it, in heav -- en a -- bove, A rich re -- ward."

