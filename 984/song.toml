[lyrics.1]
text = "The Son of God goes forth to war, A king -- ly crown to gain; His blood- -- red ban -- ner streams a -- far: Who fol -- lows in His train? Who best can drink his cup of woe, Tri -- um -- phant o -- ver pain, Who pa -- tient bears his cross be -- low— He fol -- lows in His train."

[lyrics.2]
text = "The mar -- tyr first, whose ea -- gle eye Could pierce be -- yond the grave, Who saw his Mas -- ter in the sky, And called on Him to save; Like Him, with par -- don on his tongue, In midst of mor -- tal pain, He prayed for them that did the wrong: Who fol -- lows in His train?"

[lyrics.3]
text = "A glo -- rious band, the cho -- sen few On whom the Spir -- it came, Twelve val -- iant saints, their hope they knew, And mocked the cross and flame. They climbed the steep as -- cent of heav’n Thro’ per -- il, toil, and pain; O God, to us may grace be giv’n To fol -- low in their train!"
