[lyrics.1]
text = "Faith of our fa -- thers! liv -- ing still In spite of dun -- geon, fire and sword; O how our hearts beat high with joy, When -- e’er we hear that glo -- rious word:"

[lyrics.2]
text = "Our fa -- thers, chained in pris -- ons dark, Were still in heart and con -- science free; How sweet would be their chil -- dren’s fate If they, like them, could die for thee!"

[lyrics.3]
text = "Faith of our fa -- thers! we will love Both friend and foe in all our strife; And preach thee too, as love knows how, By kind -- ly words and vir -- tuous life."

[lyrics.chorus]
text = "Faith of our fa -- thers, ho -- ly faith! We will be true to thee till death."
