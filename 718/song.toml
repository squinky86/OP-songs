[lyrics.1]
text = "Je -- sus found me wand’ -- ring, far from Him a -- stray, Ten -- der -- ly He leads me to the shin -- ing way; Thro’ His bless -- ed word He bade my fears de -- part, Oh! ’twas sweet to hear Him, speak -- ing to my heart."

[lyrics.2]
text = "When my soul is wea -- ry with the toil and strife, And my heart is bur -- dened with the cares of life; Oh the joy and glad -- ness just to be a -- part, With the lov -- ing Sav -- ior speak -- ing to my heart."

[lyrics.3]
text = "Would you hear the Sav -- ior’s gen -- tle voice to -- day, Call -- ing you to ser -- vice will you now o -- bey? Peace that pass -- eth knowl -- edge He will then im -- part, Oh the joy to hear Him, speak -- ing to your heart,"

