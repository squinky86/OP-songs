[lyrics.1]
text = "Gone from my heart the world and all its charms; Now through the blood I’m saved from all a -- larms; Down at the cross my heart is bend -- ing low; The pre -- cious blood of Je -- sus cleans -- es white as snow."

[lyrics.2]
text = "Once I was lost, and way down deep in sin; Once was a slave to pas -- sions fierce with -- in; Once was a -- fraid to meet an an -- gry God But now I’m cleansed from ev -- ’ry stain through Je -- sus’ blood."

[lyrics.3]
text = "Once I was bound, but now I am set free; Once I was blind, but now the light I see; Once I was dead, but now in Christ I live, To tell the world a -- round the peace that He doth give."

[lyrics.chorus]
text = "I love Him, I love Him, Be -- cause He first loved me, And pur -- chased my sal -- va -- tion On Cal -- v’ry’s tree."
