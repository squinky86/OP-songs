[lyrics.1]
text = "There was One Who was will -- ing to die in my stead, That a soul so un -- wor -- thy might live, And the path to the cross He was will -- ing to tread, All the sins of my life to for -- give."

[parts.Alto.lyrics.1]
text = ""

[parts.Bass.lyrics.1]
text = ""

[lyrics.2]
text = "He is ten -- der and lov -- ing and pa -- tient with me, While He cleans -- es my heart of its dross, But “there’s no con -- dem -- na -- tion”— I know I am free, For my sins are all nail’d to the cross."

[parts.Alto.lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "I will cling to my Sav -- iour and nev -- er de -- part— I will joy -- ful -- ly jour -- ney each day, With a song on my lips and a song in my heart, That my sins have been tak -- en a -- way."

[parts.Alto.lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = ""

[lyrics.chorus]
text = "They are nail’d to the cross, They are nail’d to the cross, O how much He was will -- ing to bear! With what an -- guish and loss, Je -- sus went to the cross! But He car -- ried my sins with Him there."
