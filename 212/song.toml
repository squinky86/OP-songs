[lyrics.1]
text = "More a -- bout Je -- sus would I know, More of His grace to oth -- ers show; More of His sav -- ing full -- ness see, More of His love Who died for me."

[lyrics.2]
text = "More a -- bout Je -- sus let me learn, More of His ho -- ly will dis -- cern; Spir -- it of God, my Teach -- er be, Show -- ing the things of Christ to me."

[lyrics.3]
text = "More a -- bout Je -- sus; in His Word, Hold -- ing com -- mun -- ion with my Lord; Hear -- ing His voice in ev -- ery line, Mak -- ing each faith -- ful say -- ing mine."

[lyrics.4]
text = "More a -- bout Je -- sus; on His throne, Rich -- es in glor -- y all His own; More of His king -- dom’s sure in -- crease; More of His com -- ing, Prince of Peace."

[lyrics.chorus]
text = "More, more a -- bout Je -- sus; More, more a -- bout Je -- sus; More of His sav -- ing full -- ness see, More of His love Who died for me."
