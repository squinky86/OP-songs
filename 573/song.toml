[lyrics.1]
text = "Why did my Sav -- ior come to earth And to the hum -- ble go? Why did He choose a low -- ly birth? Be -- cause He loved me so!"

[lyrics.2]
text = "Why did He drink the bit -- ter cup Of sor -- row, pain and woe? Why on the cross be lift -- ed up? Be -- cause He loved me so!"

[lyrics.3]
text = "Till Je -- sus comes I’ll sing His praise And then to glo -- ry go, And reign with Him thro’ end -- less days, Be -- cause He loved me so!"

[lyrics.chorus]
text = "He loved, me so, He loved, me so, He gave His pre -- cious life for me, for me, Be -- cause He loved me so."
