[lyrics.1]
text = "My Je -- sus, as Thou wilt! Oh, may Thy will be mine; In -- to Thy hand of love I would my all re -- sign. Thro’ sor -- row, or thro’ joy, Con -- duct me as Thine own, And help me still to say, My Lord, Thy will be done."

[lyrics.2]
text = "My Je -- sus, as Thou wilt! If need -- y here and poor, Give me Thy peo -- ple’s bread, Their por -- tion rich and sure; The man -- na of Thy word, Let my soul feed up -- on, And, if all else should fail, My Lord, Thy will be done."

[lyrics.3]
text = "My Je -- sus, as Thou wilt! Tho’ seen thro’ man -- y‿a tear, Let not my star of hope Grow dim or dis -- ap -- pear. Since Thou on earth hast wept, And sor -- rowed oft a -- lone, If I must weep with Thee, My Lord, Thy will be done."

[lyrics.4]
text = "My Je -- sus, as Thou wilt! All shall be well with me; Each chang -- ing fu -- ture scene I glad -- ly trust with Thee. Straight to my home a -- bove I trav -- el calm -- ly on, And sing, in life or death, My Lord, Thy will be done."
