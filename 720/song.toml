[lyrics.1]
text = "I know my heav’n -- ly Fa -- ther knows The storms that would my way op -- pose; But He can drive the clouds a -- way, And turn my dark -- ness in -- to day, And turn my dark -- ness in -- to day."

[lyrics.2]
text = "I know my heav’n -- ly Fa -- ther knows The balm I need to soothe my woes, And with His touch of love di -- vine, He heals this wound -- ed soul of mine, He heals this wound -- ed soul of mine."

[lyrics.3]
text = "I know my heav’n -- ly Fa -- ther knows How frail I am to meet my foes, But He my cause will e’er de -- fend, Up -- hold and keep me to the end, Up -- hold and keep me to the end,"

[lyrics.4]
text = "I know my heav’n -- ly Fa -- ther knows The hour my jour -- ney here will close, And may that hour, O faith -- ful Guide Find me safe shel -- tered by Thy side, Find me safe shel -- tered by Thy side."

