[lyrics.1]
text = "I am com -- ing to the cross; I am poor and weak and blind; I am count -- ing all but dross, I shall full sal -- va -- tion find."

[lyrics.2]
text = "Here I give my all to Thee, Friends and time, and earth -- ly store; Soul and bod -- y, Thine to be,— Whol -- ly Thine for ev -- er -- more."

[lyrics.3]
text = "Je -- sus comes! He fills my soul! Per -- fect -- ed in love I am; I am ev -- ’ry whit made whole; Glo -- ry, glo -- ry to the Lamb."

[lyrics.chorus]
text = "I am trust -- ing, Lord, in Thee, Dear Lamb of Cal -- va -- ry; Hum -- bly at Thy cross I bow, Je -- sus, saves me, saves me now."
