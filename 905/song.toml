[lyrics.1]
text = "Love for all! and can it be? Can I hope it is for me— I, who strayed so long a -- go; Strayed so far, and fell so low."

[lyrics.2]
text = "I, the dis -- o -- be -- dient child, Way -- ward, pas -- sion -- ate, and wild; I, who left my Fa -- ther’s home, In for -- bid -- den ways to roam."

[lyrics.3]
text = "I, who spurned His lov -- ing hold; I, who would not be con -- trolled; I, who would not hear His call; I, the will -- ful prod -- i -- gal."

[lyrics.4]
text = "To my Fa -- ther can I go! At His feet my -- self I’ll throw; In His house there yet may be Place— a serv -- ant’s place— for me."

[lyrics.5]
text = "See! my Fa -- ther wait -- ing stands; See! He reach -- es out His hands: God is love, I know, I see, Love for me— yes, e -- ven me."
