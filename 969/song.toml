[lyrics.1]
text = "Speed a -- way, speed a -- way on your mis -- sion of light, To the lands that are ly -- ing in dark -- ness and night; ’Tis the Mas -- ter’s com -- mand; go ye forth in His name, The _ won -- der -- ful Gos -- pel of Je -- sus pro -- claim; Take your lives in your hand, to the work while ’tis day; @s1"

[lyrics.2]
text = "Speed a -- way, speed a -- way with the life- -- giv -- ing word, To the na -- tions that know not the voice of the Lord; Take the wings of the morn -- ing and fly o’er the wave, In the strength of your Mas -- ter the lost ones to save; He is call -- ing once more, not a mo -- ment’s de -- lay; @s1"

[lyrics.3]
text = "Speed a -- way, speed a -- way with the mes -- sage of rest, To the souls by the tempt -- er in bond -- age op -- pressed; For the Sav -- ior has pur -- chased their ran -- som from sin, And the ban -- quet is read -- y, O gath -- er them in; To the res -- cue make haste, there’s no time for de -- lay; @s1"

