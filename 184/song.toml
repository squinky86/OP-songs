[lyrics.1]
text = "God be with you till we meet a -- gain, By His coun -- sels guide, up -- hold you, With His sheep se -- cure -- ly fold you, God be with you till we meet a -- gain."

[lyrics.2]
text = "God be with you till we meet a -- gain, ’Neath His wings se -- cure -- ly hide you, Dai -- ly man -- na still pro -- vide you, God be with you till we meet a -- gain."

[lyrics.3]
text = "God be with you till we meet a -- gain, When life’s per -- ils thick con -- found you, Put His arms un -- fail -- ing round you, God be with you till we meet a -- gain."

[lyrics.4]
text = "God be with you till we meet a -- gain, Keep love’s ban -- ner float -- ing o’er you, Smite death’s threat -- ’ning wave be -- fore you, God be with you till we meet a -- gain."

[lyrics.chorus]
text = "Till we meet, till we meet, till we meet at Je -- sus' feet; Till we meet, till we meet, God be with you till we meet a -- gain!"

[parts.Tenor.lyrics.chorus]
text = "Till we meet, till we meet, till we meet, till we meet at Je -- sus' feet; Till we meet, till we meet, till we meet a -- gain, God be with you till we meet a -- gain!"

