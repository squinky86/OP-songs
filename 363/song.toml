[lyrics.1]
text = "O Zi -- on, haste, thy mis -- sion high ful -- fill -- ing, To tell to all the world that God is light, That He who made all na -- tions is not will -- ing One soul should per -- ish, lost in shades of night."

[lyrics.2]
text = "Be -- hold how ma -- ny thou -- sands still are ly -- ing Bound in the dark -- some pri -- son house of sin, With none to tell them of the Sav -- ior’s dy -- ing, Or of the life He died for them to win."

[lyrics.3]
text = "Pro -- claim to ev -- ery peo -- ple, tongue, and na -- tion That God, in Whom they live and move, is love; Tell how He stooped to save His lost cre -- a -- tion, And died on earth that we might live a -- bove."

[lyrics.4]
text = "Give of thy sons to bear the mes -- sage glor -- ious; Give of thy wealth to speed them on their way; Pour out thy soul for them in prayer vic -- tor -- ious; O Zi -- on, haste to bring the bright -- er day."

