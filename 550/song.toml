[lyrics.1]
text = "Once I was stray -- ing, with trou -- bles in -- creas -- ing, Giv -- ing no thought to the One a -- bove; Now I am sing -- ing His praise with -- out ceas -- ing, Hav -- ing been touched by re -- deem -- ing love."

[lyrics.2]
text = "Then each new morn -- ing bro’t on -- ly new sad -- ness, Find -- ing me far -- ther a -- way from Him; Now ev -- ’ry hour has an in -- crease of glad -- ness, Gone is my bur -- den and shad -- ows dim."

[lyrics.3]
text = "When I des -- paired it was then He o’er -- toook me, Or then I knew that He bent a -- bove, For thro’ my wan -- d’rings He nev -- er for -- sook me, Ev -- er He fol -- lowed to show His love."

[lyrics.chorus]
text = "Touched by His love, Touched by His love, By the great love of my Fa -- ther a -- bove, Heart- -- bells are ring -- ing, I’m joy -- ous -- ly sing -- ing, I’m touched by my Sav -- iour’s love."
