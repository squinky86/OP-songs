[lyrics.1]
text = "The morn -- ing light is break -- ing, The dark -- ness dis -- ap -- pears; The sons of earth are wak -- ing, To pen -- i -- ten -- tial tears; Each breeze that sweeps the o -- cean Brings tid -- ings from a -- far Of na -- tions in com -- mo -- tion, Pre -- pared for Zi -- on's war."

[lyrics.2]
text = "Rich dews of grace come o'er us, In man -- y'a gen -- tle show'r, And bright -- er scenes be -- fore us, Are op -- 'ning ev -- 'ry hour; Each cry to Heav -- en go -- ing, A -- bun -- dant an -- swers brings, And heav'n -- ly winds are blow -- ing, With peace up -- on their wings."

[lyrics.3]
text = "See hea -- then na -- tions bend -- ing Be -- fore the God we love, And thou -- sand hearts as -- cend -- ing In gra -- ti -- tude a -- bove: While sin -- ners, now con -- fess -- ing, The Gos -- pel call o -- bey, And seek the Sav -- ior's bless -- ing, A na -- tion in a day."

[lyrics.4]
text = "Blest ri -- ver of sal -- va -- tion, Pur -- sue thy on -- ward way; Flow thou to ev -- 'ry na -- tion, Nor in thy rich -- es stay: Stay not till all the low -- ly Tri -- umph -- ant reach their home; Stay not till all the ho -- ly Pro -- claim, \"The Lord is come.\""
