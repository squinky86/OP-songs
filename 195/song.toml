[lyrics.1]
text = "Je -- sus is ten -- der -- ly call -- ing thee home— Call -- ing to -- day, call -- ing to -- day; Why from the sun -- shine of love wilt thou roam Far -- ther and far -- ther a -- way?"

[lyrics.2]
text = "Je -- sus is call -- ing the wea -- ry to rest— Call -- ing to -- day, call -- ing to -- day; Bring Him thy bur -- den and thou shalt be blest; He will not turn thee a -- way."

[lyrics.3]
text = "Je -- sus is wait -- ing; oh, come to Him now— Wait -- ing to -- day, wait -- ing to -- day; Come with thy sins, at His feet low -- ly bow; Come, and no long -- er de -- lay."

[lyrics.4]
text = "Je -- sus is plead -- ing; oh, list to His voice: Hear Him to -- day, hear Him to -- day; They who be -- lieve on His name shall re -- joice; Quick -- ly a -- rise and a -- way."

[lyrics.chorus]
text = "Call -- ing to -- day! Call -- ing to -- day! Je -- sus is call -- ing, Is ten -- der -- ly call -- ing to -- day."

[parts.Tenor.lyrics.chorus]
text = "Call -- ing, call -- ing to -- day, to -- day! Call -- ing, call -- ing to -- day, to -- day! Je -- sus is ten -- der -- ly call -- ing to -- day, Is ten -- der -- ly call -- ing to -- day."

[parts.Bass.lyrics.chorus]
