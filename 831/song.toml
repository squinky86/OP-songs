[lyrics.1]
text = "Ear -- ly, my God, with -- out de -- lay, I haste to seek Thy face; My thirst -- y spir -- it faints a -- way, My thirst -- y spir -- it faints a -- way, With -- out Thy cheer -- ing grace."

[lyrics.2]
text = "So pil -- grims on the scorch -- ing sand, Be -- neath a burn -- ing sky, Long for a cool -- ing stream at hand, Long for a cool -- ing stream at hand; And they must drink or die."

[lyrics.3]
text = "Not life it -- self, with all its joys, Can my best pas -- sions move, Or raise so high my cheer -- ful voice, Or raise so high my cheer -- ful voice, As Thy for -- giv -- ing love."

[lyrics.4]
text = "Thus, till my last, ex -- pir -- ing day, I’ll bless my God and King; Thus will I lift my hands to pray, Thus will I lift my hands to pray, And tune my lips to sing."
