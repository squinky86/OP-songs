[lyrics.1]
text = "Rich -- ly blest is the soul that re -- lies on the Lord And is free from the stains of the past; It is glo -- ry to live in the light of His word With as -- sur -- ance of heav -- en at last."

[lyrics.2]
text = "Oh, what com -- fort it is to be led by His hand. And be cheered day by day by His voice! He will lead me, I know, to the heav -- en -- ly land Where my soul will for -- ev -- er re -- joice."

[lyrics.3]
text = "There is glo -- ry that comes to the fa -- vored of earth Who the praise of the na -- tions have won; But the glo -- ry I have is of far great -- er worth, For it brings my Re -- deem -- er’s “Well done.”"

[lyrics.chorus]
text = "It is glo -- ry to know such a Sav -- ior, It is glo -- ry to have such a King; ’Twill be glo -- ry to serve Him for -- ev -- er, End -- less glo -- ry His praise to sing."
