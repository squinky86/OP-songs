[lyrics.1]
text = "Do you seek re -- lief for your sin- -- sick soul? You to Christ, then, must make ap -- peal, There’s no o -- ther One who can make you whole, You must come where the blood can heal!"

[lyrics.2]
text = "Vain are all your hopes of a -- no -- ther cure, Be per -- suad -- ed, you now, to feel, Help a -- lone, thro’ Christ, that you can se -- cure, You must come where the blood can heal!"

[lyrics.3]
text = "O -- ther prof -- fered aids can but you de -- ceive, At your will, un -- to life, they steal! You must look to Christ if you’d hope re -- ceive, You must come where the blood can heal!"

[lyrics.4]
text = "Hear you not? ’tis there a de -- coy -- ing voice, Striv -- ing ev -- er, to quench thy zeal, Would you from Him turn, re -- fuge safe to find, You must come where the blood can heal!"

[lyrics.5]
text = "If you would a -- rise from your bed of pain, To the coun -- sel of Christ then kneel, ’Tis pre -- scribed by Him, and your on -- ly hope, You must come where the blood can heal!"

[lyrics.chorus]
text = "You must come where the blood can heal, You must come where the blood can heal, There’s no o -- ther One who can make you whole, You must come where the blood can heal!"
