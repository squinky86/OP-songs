[lyrics.1]
text = """One day when heav -- en was filled with His prais -- es,
One day when sin was as black as could be,
Je -- sus came forth to be born of a vir -- gin—
Dwelt a -- mongst men, my ex -- am -- ple is He!"""

[lyrics.2]
text = """One day they led Him up Cal -- va -- ry’s moun -- tain,
One day they nailed Him to die on the tree;
Suf -- fer -- ing an -- guish, de -- spised and re -- ject -- ed:
Bear -- ing our sins, my Re -- deem -- er is He!"""

[lyrics.3]
text = """One day they left Him a -- lone in the gar -- den,
One day He rest -- ed, from suf -- fer -- ing free;
An -- gels came down o’er His tomb to keep vig -- il;
Hope of the hope -- less, my Sav -- ior is He!"""

[lyrics.4]
text = """One day the grave could con -- ceal Him no lon -- ger,
One day the stone rolled a -- way from the door;
Then He a -- rose, o -- ver death He had con -- quered;
Now is as -- cend -- ed, my Lord ev -- er -- more!"""

[lyrics.5]
text = """One day the trump -- et will sound for His com -- ing,
One day the skies with His glo -- ry will shine;
Won -- der -- ful day, my be -- lov -- ed ones bring -- ing;
Glo -- ri -- ous Sav -- ior, this Je -- sus is mine!"""

[lyrics.chorus]
text = """Liv -- ing, He loved me; dy -- ing, He saved me;
Bur -- ied, He car -- ried my sins far a -- way;
Ris -- ing, He jus -- ti -- fied free -- ly for -- ev -- er:
One day He’s com -- ing— O glo -- ri -- ous day!"""
