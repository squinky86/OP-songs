[lyrics.1]
text = "My faith looks up to thee, Thou Lamb of Cal -- va -- ry, Sa -- vior di -- vine! Now hear me while I pray, Take all my guilt a -- way; O let me from this day Be whol -- ly thine!"

[lyrics.2]
text = "May thy rich grace im -- part Strength to my faint -- ing heart, My zeal in -- spire; As thou hast died for me, O may my love to thee Pure, warm, and change -- less be, A liv -- ing fire!"

[lyrics.3]
text = "While life's dark maze I tread, And griefs a -- round me spread, Be thou my guide; Bid dark -- ness turn to day, Wipe sor -- row's tears a -- way, Nor let me e -- ver stray From thee a -- side."

[lyrics.4]
text = "When ends life's tran -- sient dream, When death's cold, sul -- len stream, Shall o'er me roll; Blest Sa -- vior, then, in love Fear and dis -- trust re -- move; O bear me safe a -- bove, A ran -- somed soul!"
