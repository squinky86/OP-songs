[lyrics.1]
text = "Lord, we come be -- fore Thee now; At Thy feet we hum -- bly bow: O do not our suit dis -- dain; Shall we seek Thee, Lord, in vain? Shall we seek Thee, Lord, in vain?"

[lyrics.2]
text = "Lord, on Thee our souls de -- pend: In com -- pas -- sion now de -- scend; Fill our hearts with Thy rich grace, Tune our lips to sing Thy praise, Tune our lips to sing Thy praise."

[lyrics.3]
text = "In Thine own ap -- point -- ed way, Now we seek Thee, here we stay; Lord, we know not how to go, Till a bless -- ing Thou be -- stow, Till a bless -- ing Thou be -- stow."

[lyrics.4]
text = "Grant that all may seek and find Thee a God su -- preme -- ly kind; Heal the sick, the cap -- tive free; Let us all re -- joice in Thee, Let us all re -- joice in Thee."
