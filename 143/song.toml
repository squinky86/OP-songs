text = """
“Come un -- to Me, all ye that la -- bor and are heav -- y -- la -- den,
and I will give you rest. Take My yoke up -- on you, and learn of Me: for I am meek and low -- ly in heart: and ye shall find rest un -- to your souls.”
"""

