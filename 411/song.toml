[lyrics.1]
text = "Ring the bells of Hea -- ven! There is joy to -- day, For a soul, re -- turn -- ing from the wild! See, the Fa -- ther meets him out up -- on the way, Wel -- com -- ing His wear -- y, wan -- dering child."

[lyrics.2]
text = "Ring the bells of Hea -- ven! There is joy to -- day, For the wan -- derer now is re -- con -- ciled; Yes, a soul is res -- cued from his sin -- ful way, And is born a -- new a ran -- somed child."

[lyrics.3]
text = "Ring the bells of Hea -- ven! Spread the feast to -- day! An -- gels, swell the glad tri -- umph -- ant strain! Tell the joy -- ful tid -- ings, bear it far a -- way! For a pre -- cious soul is born a -- gain."

[lyrics.chorus]
text = "Glor -- y! Glor -- y! How the an -- gels sing: Glor -- y! Glor -- y! How the loud harps ring! ’Tis the ran -- somed ar -- my, like a might -- y sea, Peal -- ing forth the an -- them of the free."
