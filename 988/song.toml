[lyrics.1]
text = "To us a Child of hope is born, To us a Son is giv’n; Him shall the tribes of earth o -- bey; Him, all the hosts of heav’n; Him shall the tribes of earth o -- bey, Him, all the hosts of heav’n."

[lyrics.2]
text = "His name shall be the Prince of Peace, For -- ev -- er -- more a -- dored, The Won -- der -- ful, the Coun -- sel -- lor, The great and might -- y Lord! The Won -- der -- ful, the Coun -- sel -- lor, The great and might -- y Lord!"

[lyrics.3]
text = "His pow’r, in -- creas -- ing, still shall spread, His reign no end shall know; Jus -- tice shall guard His throne a -- bove, And peace a -- bound be -- low. Jus -- tice shall guard His throne a -- bove, And peace a -- bound be -- low."
