[lyrics.1]
text = "Pur -- er yet and pur -- er, I would be in mind; Dear -- er yet and dear -- er, Ev’ -- ry du -- ty find; Hop -- ing still, and trust -- ing God with -- out a fear; Pa -- tient -- ly be -- liev -- ing He will make all clear."

[lyrics.2]
text = "Calm -- er yet and calm -- er, Tri -- al bear and pain; Sur -- er yet and sur -- er, Peace at last to gain; Suff’ -- ring still and do -- ing, To His will re -- signed, And to God sub -- du -- ing Heart and will and mind."

[lyrics.3]
text = "High -- er yet and high -- er, Out of clouds and night; Near -- er yet and near -- er, Ris -- ing to the light; Oft these ear -- nest long -- ings Swell with -- in my breast; Yet their in -- ner mean -- ing Ne’er can be ex -- pressed."
