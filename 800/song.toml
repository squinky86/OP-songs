[lyrics.1]
text = "A beau -- ti -- ful land by faith I see, A land of rest, from sor -- row free, The home of the ran -- somed bright and fair, And beau -- ti -- ful an -- gels, too, are there."

[lyrics.2]
text = "That beau -- ti -- ful land, the Home of Light, It ne’er has known the shades of night; The glo -- ry of God, the Light of Day, Hath driv -- en the dark -- ness far a -- way."

[lyrics.3]
text = "In vis -- ions I see its streets of gold, Its pearl -- y gates I too be -- hold; The riv -- er of life, the crys -- tal sea, Th’am -- bro -- si -- al fruits of life’s fair tree."
[lyrics.4]
text = "The heav -- en -- ly throng, arr -- ayed in white, In rap -- ture range the plains of light, In one har -- mon -- i -- ous choir they praise Their glor -- i -- ous Sav -- iour’s match -- less grace."


[lyrics.chorus]
text = "Will you go? Will you go? Go to that beau -- ti -- ful home with me? Will you go? Will you go? Go to that beau -- ti -- ful home with me?"
