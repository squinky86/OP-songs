[lyrics.1]
text = "I was far a -- way from God, Far from the liv -- ing springs, For the path of sin I trod In search of un -- ho -- ly things; Lights of home I could not see, Hope de -- creased each day, But the Lord has res -- cued me, Love found the way."

[lyrics.2]
text = "Wea -- ried out by sin -- ful years, Need -- ing a guid -- ing hand, All a -- lone with doubts and fears; I lived in a bar -- ren land; Joy and peace had tak -- en flight, Friends re -- fused to stay, But to save me from my plight, Love found the way."

[lyrics.3]
text = "If your soul is lost in sin, Call on your on -- ly Friend, Let His cheer -- ing love- -- light in, And tru -- ly on Him de -- pend. Hope -- less tho’ your heart may be, Night shall change to day, Love, to make you pure and free, Will find a way."

[lyrics.chorus]
text = "Love found the way As bright as day When all things else had failed to help me, Love found the way, Love found the way, Seek it to -- day; When all things else had failed to help, Love found the way."
