[lyrics.1]
text = "O would you be a bless -- ing true, As on thro’ life you go? Be con -- stant in God’s serv -- ice here, Don’t let your light burn low."

[lyrics.2]
text = "The world is grop -- ing in de -- spair, God’s love they do not know, So live to guide them to the right, Don’t let your light burn low."

[lyrics.3]
text = "The lov -- ing Sav -- ior needs your aid, In let -- ting sin -- ners know, Sal -- va -- tion’s free, who will may come, Don’t let your light burn low."

[lyrics.chorus]
text = "Don’t let your light burn low, burn low, Don’t let your light burn low; burn low; Be con -- stant in God’s serv -- ice here, Don’t let your light burn low."
