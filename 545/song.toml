[lyrics.1]
text = "All ye saints of light pro -- claim, Je -- sus, the Light of the world; Life and mer -- cy in His name, Je -- sus, the Light of the world."

[lyrics.2]
text = "Hear the Sav -- ior’s ear -- nest call, Je -- sus, the Light of the world; Send the Gos -- pel truth to all, Je -- sus, the Light of the world."

[lyrics.3]
text = "Why not seek Him then to -- day, Je -- sus, the Light of the world; Go with truth the nar -- row way, Je -- sus, the Light of the world."

[lyrics.4]
text = "Come, con -- fess Him as your King, Je -- sus, the Light of the world; Then the bells of Heav’n will ring, Je -- sus, the Light of the world."

[lyrics.chorus]
text = "We’ll walk in the light, beau -- ti -- ful light, Come where the dew -- drops of mer -- cy are bright; Shine all a -- round us by day and by night, Je -- sus, the Light of the world."
