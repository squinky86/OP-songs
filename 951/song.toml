[lyrics.1]
text = "Prince of Peace! con -- trol my will, Bid this strug -- gling heart be still; Bid my fears and doubt -- ings cease— Hush my spir -- it in -- to peace."

[lyrics.2]
text = "Thou hast bo’t me with Thy blood, O -- pened wide the gate of God; Peace I ask— but peace must be, Lord, in be -- ing one with Thee."

[lyrics.3]
text = "May Thy will, not mine, be done; May Thy will and mine be one; Chase these doubt -- ings from my heart, Now Thy per -- fect peace im -- part."

[lyrics.4]
text = "Sav -- ior, at Thy feet I fall; Thou my Life, my God, my All; Let Thy hap -- py serv -- ant be One for -- ev -- er -- more with Thee."
