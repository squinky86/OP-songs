[lyrics.1]
text = "A -- long the way to realms of day And peace and joy sub -- lime; My Sav -- ior dear, my soul to cheer, Is with me all the time."

[lyrics.2]
text = "My yoke is light, my path is bright, And I am sat -- is -- fied; For, bless His name, since first He came He has not left my side."

[lyrics.3]
text = "I shall not fear when death is near; Sup -- port -- ed I shall be; For He who died my sins to hide, Will still com -- pan -- ion me."

[lyrics.4]
text = "That I may rest a -- mong the blest, In yon -- der sun- -- bright clime; My Lord and King whose praise I sing Is with me all the time."

[lyrics.chorus]
text = "He is with me all the time, That high -- er I may climb; He walks with me and talks with me, He is with me all the time."

