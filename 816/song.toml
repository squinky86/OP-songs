[lyrics.1]
text = "All you that have con -- fessed That Je -- sus is the Lord, And to His peo -- ple joined your -- selves, Ac -- cord -- ing to His word, In Zi -- on you must dwell, Her al -- tar ne’er for -- sake; Must come to all her sol -- emn feasts, Of all her joys par -- take."

[lyrics.2]
text = "She must em -- ploy your thoughts, And your un -- ceas -- ing care; Her wel -- fare be your con -- stant wish, And her in -- crease your prayer. With hum -- ble -- ness of mind A -- mong her sons re -- joice— A meek and qui -- et spir -- it is, With God, of high -- est price."

[lyrics.3]
text = "Nev -- er of -- fend nor grieve Your breth -- ren by the way; But shun the dark a -- bodes of strife, Like chil -- dren of the day. In all your Sav -- iour’s ways With will -- ing foot -- steps move; Be faith -- ful un -- to death, and then You’ll reign with Him a -- bove."
