[lyrics.1]
text = """
How pre -- cious is the Book di -- vine, By in -- spi -- ra -- tion giv'n!
Bright as a lamp its pre -- cepts shine, To guide my soul to heav'n.
"""

[lyrics.2]
text = """
It sweet -- ly cheers my droop -- ing heart, In this dark vale of tears;
Light to my life it still im -- parts, And quells my ris -- ing fears.
"""

[lyrics.3]
text = """
This lamp, thro' all the te -- dious night Of life, shall guide my way,
Till I be -- hold the clear -- er light Of an e -- ter -- nal day.
"""

[lyrics.chorus]
text = """
Ho -- ly Book di -- vine! Pre -- cious treas -- ure mine!
Lamp to my feet and a light to my way To guide me safe -- ly home.
"""

[parts.Alto.lyrics.chorus]
text = """
