[lyrics.1]
text = "“A -- rise and shine! thy light is come!” The Lord hath made thee free! The chains of dark -- ness bind no more, Go forth in lib -- er -- ty!"

[lyrics.2]
text = "“A -- rise and shine! thy light is come!” Let sin and sor -- row hide; Go forth and show to all the world That Light and Life a -- bide."

[lyrics.3]
text = "“A -- rise and shine! thy light is come!” Thy God thy glo -- ry is; Show forth the won -- ders of His love, And let all praise be His."

[lyrics.4]
text = "“A -- rise and shine! thy light is come!” And night shall be no more; Shine till the glo -- ry of the Lord Is known from shore to shore."

[lyrics.chorus]
text = "“A -- rise and shine! thy light is come!” A -- rise, a -- rise and shine! With love's bright a -- dorn -- ing, Shine forth as the morn -- ing: A -- rise, a -- rise and shine!"
