[lyrics.1]
text = "No -- bod -- y knows but Je -- sus: ’Tis but an old re -- frain, But it is new to my heart, Now as it comes a -- gain."

[lyrics.2]
text = "No -- bod -- y knows but Je -- sus: ’Tis mu -- sic for to -- day; And thro’ the hard -- est tri -- als, Helps me a -- long the way."

[lyrics.3]
text = "Bur -- dens might be so heav -- y That dear ones could not bear To know the bit -- ter heart- -- aches; They could not come and share."

[lyrics.4]
text = "No -- bod -- y knows but Je -- sus: My Lord, I bless Thee now For the great gift of sor -- row, That no one knows but Thou."

[lyrics.chorus]
text = "No -- bod -- y knows but Je -- sus: Is it not bet -- ter so? That no one else but Je -- sus, My own dear Lord, shall know."
