[lyrics.1]
text = "O for a clos -- er walk with God, A calm and heav’n -- ly frame; A light to shine up -- on the road That leads me to the Lamb! That leads me to the Lamb!"

[lyrics.2]
text = "Re -- turn, O ho -- ly Dove, re -- turn, Sweet mes -- sen -- ger of rest! I hate the sins that made Thee mourn, And drove Thee from my breast, And drove Thee from my breast."

[lyrics.3]
text = "The dear -- est i -- dol I have known, What -- e’er that i -- dol be, Help me to tear it from Thy throne, And wor -- ship on -- ly Thee, And wor -- ship on -- ly Thee."

[lyrics.4]
text = "So shall my walk be close with God, Calm and se -- rene my frame; So pur -- er light shall mark the road That leads me to the Lamb, That leads me to the Lamb."
