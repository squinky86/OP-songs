[lyrics.1]
text = "The Ho -- ly Spir -- it speaks to -- day, In God’s e -- ter -- nal word, Ye sin -- ners, take the liv -- ing way, And trav -- el on to God."

[lyrics.2]
text = "The Ho -- ly Spir -- it speaks to -- day, In God’s e -- ter -- nal word, Ye saints, keep in the liv -- ing way, ’Twill lead you on to God."

[lyrics.3]
text = "The Ho -- ly Spir -- it’s pow’r for aye Is in the gos -- pel word; He shows there -- in the liv -- ing way, That leads us on to God."

[lyrics.4]
text = "How bright and sweet the liv -- ing way, ’Tis strewn with fra -- grant flow’rs, That nev -- er with -- er nor de -- cay, But crown im -- mor -- tal brows."
