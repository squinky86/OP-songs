# Source: Great Songs of the Church (1926), No. 80 (hymnary GSoC1926 page 52, lower
#   half), seven-shape notes, low-res scan (~500 px wide). No 1921-edition printing.
# Lyrics transcribed from the plate's five stanzas (plate spellings kept: bro’t,
#   Im-man-uel, giv’n, heav’n).
# Plate credits: "R. Wardlaw." / "William Knapp." / tune printed "(WAREHAM.)".
# Lyrics date: Julian, Dictionary of Hymnology, New Supplement (via hymnary person
#   page Wardlaw_R): "Hail, morning known amongst the blest" is in Wardlaw's
#   Selection of Hymns, 1803. Ralph Wardlaw, 1779-1853.
# Music date: hymnary tune page wareham_knapp: Knapp, A Set of New Psalm Tunes and
#   Anthems, 1738.
# Public domain: published in the US before 1930.
# Melody: matches WAREHAM as printed in the Timeless Truths edition (Eternal Father,
#   When to Thee, B-flat, 3/4) note for note; no plate differences in the melody.
# Harmony read from the plate with a pitch ruler and shape checks (bar numbers
#   count full bars after the pickup). It differs from the Timeless Truths harmony:
#   bars 1-2 tenor repeated B-flat and bass G on beat 3 of bar 2; bar 6 tenor
#   c' d' c'; bars 9-13 tenor bes2 c' / d'2 c' / bes2 a / bes2 a / bes2 a; bar 10
#   alto f'4 (TT f'8 ees'8); bar 11 alto d'2; bass B-flat 3 in bar 11 and F in
#   bar 12; alto f' on beat 3 of bars 13 and 15 and in bar 16.
#   Low-res guesses: bar 1 alto g' (could be f'); bar 11 bass B-flat 3 shares the
#   tenor's notehead (TT has G3); bar 12 bass f2 (open head hidden by the staff line).
# Tempo: none printed; 92 is a guess.
