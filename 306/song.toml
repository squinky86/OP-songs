[lyrics.1]
text = "There's a wide -- ness in God's mer -- cy, Like the wide -- ness of the sea; There's a kind -- ness in His jus -- tice, Which is more than lib -- er -- ty."

[lyrics.2]
text = "There is wel -- come for the sin -- ner, And more grac -- es for the good; There is mer -- cy with the Sav -- ior; There is heal -- ing in His blood."

[lyrics.3]
text = "For the love of God is broad -- er Than the meas -- ure of our mind; And the heart of the E -- ter -- nal Is most won -- der -- ful -- ly kind."

[lyrics.4]
text = "If our love were but more sim -- ple, We should take Him at His word; And our lives would be all sun -- shine In the sweet -- ness of our Lord."
