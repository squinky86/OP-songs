[lyrics.1]
text = "If you want to live at peace with God And _ safe -- ly pass thro’ the vale; You must find the way He has made so plain, Just fol -- low the blood -- stained trail."

[lyrics.2]
text = "There is on -- ly one true way, that’s found It _ nev -- er, on earth, shall fail; And ’twill lead you straight to _ God’s white throne, Just fol -- low the blood -- stained trail."

[lyrics.3]
text = "If you heed Je -- ho -- vah’s will each day, When He calls you ’twill all be well; You can close your eyes with a smile and say, I’ve fol -- low the blood -- stained trail."

[lyrics.chorus]
text = "Just fol -- low the blood -- stain trail O -- ver moun -- tain and hill and dale; If your faith grows weak turn the search -- light on, And fol -- low the blood -- stained trail."

[parts.Alto.lyrics.chorus]
text = "Just fol -- low the Sa -- vior’s blood -- stain trail, O -- ver moun -- tain and hill and dale; If your faith grows weak turn the search -- light on, And fol -- low the blood -- stained trail."

[parts.Tenor.lyrics.chorus]
text = "Just fol -- low the Sa -- vior’s blood -- stain trail, O -- ver moun -- tain and hill and dale; If your faith grows weak turn the search -- light on, And fol -- low the blood -- stained trail."

[parts.Bass.lyrics.chorus]
text = "Just fol -- low the Sa -- vior’s blood -- stain trail, O -- ver moun -- tain and hill and dale; If your faith grows weak turn the search -- light on, And fol -- low the blood -- stained trail."
