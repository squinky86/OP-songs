[lyrics.1]
text = "Sound, sound the truth a -- broad; Bear ye the word of God Thro’ the wide world; Tell what our Lord has done, Tell how the day is won, Tell from his loft -- y throne Sa -- tan is hurled."

[lyrics.2]
text = "Far o -- ver sea and land, Go at your Lord’s com -- mand; Bear ye His name; Bear it to ev -- ’ry shore, Re -- gions un -- known ex -- plore, En -- ter at ev -- ’ry door: Si -- lence is shame."

[lyrics.3]
text = "Speed on the wings of love: Je -- sus, Who reigns a -- bove, Bids us to fly; They who His mes -- sage bear Should nei -- ther doubt nor fear; He will their Friend ap -- pear, He will be nigh."
