[parts.Soprano.lyrics.1]
text = "In His rude man -- ger- -- bed sleep -- ing See Him, the heav -- en -- ly Child; O’er Him her si -- lent watch keep -- ing, Ma -- ry, the moth -- er, so mild; Round Him the zeph -- yrs are sigh -- ing, O’er Him the bright ha -- los shine; Moth -- er in won -- der re -- ply -- ing, Ba -- by, O Ba -- by di -- vine."

[parts.Soprano.lyrics.2]
text = "Moth -- er, a star now is ris -- ing, Clear on the lis -- ten -- ing night; See how its beau -- ty sur -- pris -- ing, Makes all the heav -- ens so bright; Moth -- er, it comes and is stand -- ing O -- ver thy poor man -- ger- -- bed; Wise men the way now are find -- ing, By it they hith -- er are led."

[parts.Soprano.lyrics.3]
text = "See them, their treas -- ures out -- pour -- ing, Gold, with their in -- cense so sweet; See them, in wor -- ship a -- dor -- ing, Low at the lit -- tle One’s feet; Moth -- er, so poor and so low -- ly, Take the glad gifts that we bring; He is the bless -- ed and ho -- ly, He is the Sav -- ior and King."

