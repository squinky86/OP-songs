[lyrics.1]
text = "Go work for Je -- sus, ’tis the Lord’s com -- mand, En -- ter His vine -- yard, do not stand; Man -- y are work -- ing, while oth -- ers are shirk -- ing Oh, broth -- er get read -- y, do the work that’s now at hand."

[lyrics.2]
text = "Sad -- ness will ban -- ish from the Chris -- tian man, Great joy and glad -- ness, oh, how grand; There’ll be sweet sing -- ing, and love ev -- er cling -- ing, Be read -- y to join Him, in the bless -- ed prom -- ised land."

[lyrics.3]
text = "Soon we’ll cross o -- ver, to the oth -- er shore, Pass thro’ death’s val -- ley die no more; Join in the sing -- ing, where joy- -- bells are ring -- ing, Be read -- y to join Him, in the bless -- ed prom -- ised land."

[lyrics.chorus]
text = "Read -- y to go, read -- y to go, read -- y to go, when Je -- sus gives com -- mand, Read -- y to go, read -- y to go, read -- y to join Him In the bless -- ed prom -- ised land."
