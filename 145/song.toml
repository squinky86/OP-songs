[lyrics.1]
text = "While shep -- herds watched their flocks by night, All seat -- ed on the ground, an an -- gel of the Lord came down, And glo -- ry shone a -- round."

[lyrics.2]
text = "\"Fear not,\" said he (for might -- y dread Had seized their trou -- bled mind) \"glad ti -- dings of great joy I bring To you and all man -- kind."

[lyrics.3]
text = "\"To you, in Da -- vid's town, this day Is born of Da -- vid's line a Sav -- ior who is Christ the Lord; And this shall be the sign:"

[lyrics.4]
text = "\"The heav'n -- ly babe you there shall find To hu -- man view dis -- played, All sim -- ply wrapped in swad -- dling clothes And in a man -- ger laid.\""

[lyrics.5]
text = "\"All glo -- ry be to God on high, And to the earth be peace; Good -- will hence -- forth from heav'n to men Be -- gin and nev -- er cease.\""
