[parts.Soprano.lyrics.1]
text = "When I went to the home of my child -- hood so dear, Where I once loved so well _ to roam, How sad _ and drear, no _ voice could I hear, There was no one to wel -- come me home. No one to wel -- come me home, No one to wel -- come me home, When I went to the place where I once loved to roam, There was no one to wel -- come me home."

[parts.Soprano.lyrics.2]
text = "I _ there could not see my _ moth -- er’s sweet face, Nor my fa -- ther’s kind voice could I hear, How sad did I feel in that lone -- ly “old place,” Find -- ing no one to wel -- come me there. No one to wel -- come me home, No one to wel -- come me home, When I went to the place where I once loved to roam, There was no one to wel -- come me home."

[parts.Soprano.lyrics.3]
text = "I _ went to the spring that was flow -- ing so free, And I drank of its wa -- ters so clear, But lone -- _ -- ly a voice would whis -- per to me, “There is no one to wel -- come you here.” No one to wel -- come me home, No one to wel -- come me home, When I went to the place where I once loved to roam, There was no one to wel -- come me home."

[parts.Soprano.lyrics.4]
text = "Then I went to the place where I once loved to play, But my play -- mates had ev -- ’ry one gone, And sad -- _ -- ly a voice would whis -- per and say, “There is no one to wel -- come you home.” No one to wel -- come me home, No one to wel -- come me home, When I went to the place where I once loved to roam, There was no one to wel -- come me home."

[parts.Soprano.lyrics.5]
text = "But _ when I shall reach that _ heav -- en -- ly place, The _ beau -- ti -- ful cit -- y so fair, Where I shall be -- hold my Re -- deem -- _ -- er’s face, There’ll be some one to wel -- come me there. Some one to wel -- come me there, In -- to that cit -- y so fair, When _ I shall be -- hold those _ man -- sions of gold, There’ll be some one to wel -- come me there."

