[lyrics.1]
text = "O -- ver and o -- ver His prais -- es I’ll sing, Joy ev -- er -- last -- ing to me He doth bring; Stoop -- ing to save me in glo -- ry a -- bove, Je -- sus the Sav -- ior I love."

