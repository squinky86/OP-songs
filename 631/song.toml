[lyrics.1]
text = "Will you lis -- ten to Je -- sus as He pleads for your ser -- vice? He is call -- ing for help -- ers, who will work all the day? See, the grain now is fall -- ing while the Mas -- ter is call -- ing, Why not an -- swer the call and has -- ten on your way?"

[lyrics.2]
text = "There’s a place in His ser -- vice for the ones who will la -- bor, There is work in His vine -- yard that you sure -- ly can do; You can tell the sweet sto -- ry of the Sav -- ior in glo -- ry. Yes, the Mas -- ter is wait -- ing now and He needs you."

[lyrics.3]
text = "Count -- less thou -- sands are hun -- gry for the mes -- sage of Je -- sus, Will you go out and tell them of His won -- der -- ful love? If you’re loy -- al and faith -- ful while you toil in His vine -- yard, He will give you a man -- sion in that home a -- bove."

[lyrics.chorus]
text = "He is call -- ing for reap -- ers who will work, work, work He wants men who have cour -- age, men who will not shirk, Will you an -- swer the call and go and work for the Mas -- ter, Go and reap the rip’ -- ning grain to -- day?"

[parts.Alto.lyrics.chorus]
text = "He is call -- ing for reap -- ers who will al -- ways be at work, He wants men who have cour -- age, He wants men who will not shirk, Will you an -- swer the call and go and work for the Mas -- ter, Go and reap the rip’ -- ning grain to -- day? go work to -- day?"

[parts.Tenor.lyrics.chorus]
text = "He is call -- ing for reap -- ers who will work, work, work He wants men who have cour -- age, men who will not shirk, Will you an -- swer the call and go and work for the Mas -- ter, Go and reap the rip’ -- ning grain, to -- day? go work to -- day?"

[parts.Bass.lyrics.chorus]
