[lyrics.1]
text = "In the name of the Lord you love, Scat -- ter life’s gold -- en grain; Boun -- teous har -- vests the seed will yield, In ev -- ’ry vale and plain."

[lyrics.2]
text = "“In His name” speak a lov -- ing word, Speak it to some sad heart; Spo -- ken kind -- ly, per -- chance it may Com -- fort and cheer im -- part."

[lyrics.3]
text = "“In His name” do a kind -- ly deed, Help -- ing a strug -- gling soul; Faith and cour -- age you may in -- spire, New strength to reach the goal."

[lyrics.4]
text = "“In His name” seek to make the world Bright -- er with love and cheer, Blest in do -- ing the Mas -- ter’s will, Check -- ing the flow -- ing tear."

[lyrics.chorus]
text = "Speak “in His name” a lov -- ing word, Do “in His name” a kind -- ly deed, Be un -- to oth -- ers, as was your Lord, A friend in time of need."
