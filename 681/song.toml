[lyrics.1]
text = "When the Lord in clouds shall come, when all works be -- low are done, Are you sure you’ll love the bless -- ed Lord’s ap -- pear -- ing? When the graves shall o -- pened be And the right -- eous dead be free, Are you sure you’ll love the bless -- ed Lord’s ap -- pear -- ing."

[lyrics.2]
text = "What an aw -- ful hour to meet, when the earth shall melt with heat, Are you sure you’ll love the bless -- ed Lord’s ap -- pear -- ing? Should He come as thieves of night will He find your gar -- ments white, Are you sure you’ll love the bless -- ed Lord’s ap -- pear -- ing."

[lyrics.3]
text = "No one knows the day nor hour, when He’ll come with might -- y pow’r, Are you sure you’ll love the bless -- ed Lord’s ap -- pear -- ing? When that aw -- ful day we see, and the earth shall pass a -- way, Are you sure you’ll love the bless -- ed Lord’s ap -- pear -- ing."

[lyrics.4]
text = "Let us ev -- er watch and pray, trust -- ing Je -- sus ev -- ’ry day, All be read -- y for the bless -- ed Lord’s ap -- pear -- ing; Then we’ll live with that blest throng, o -- ver in the land of song If we’re read -- y for the bless -- ed Lord’s ap -- pear -- ing."

[lyrics.chorus]
text = "Christ the Lord is com -- ing soon, yes, He is com -- ing back a -- gain, He is com -- ing in the glo -- ry of His pow’r; Yes, we’ll with the Sav -- ior reign, yes, on that bright and gold -- en plain, If we’re faith -- ful at the bless -- ed Lord’s ap -- pear -- ing."

[parts.Soprano.lyrics.chorus]
text = "He is com -- ing back a -- gain, He is com -- ing in the glo -- ry of His pow’r; We with Him shall ev -- er reign, If we’re faith -- ful at the bless -- ed Lord’s ap -- pear -- ing."
