[lyrics.1]
text = "I am look -- ing a -- way to that cloud -- less shore, With a faith that is bright and fond; There, no sor -- row nor sin com -- eth ev -- er -- more, @s1"

[lyrics.2]
text = "In that world there is free -- dom from care and pain, And my spir -- it feels sweet re -- spond, In the hope that is mine, there, that home to gain, @s1"

[lyrics.3]
text = "'Tis that glo -- ri -- ous place where no shade can dim, Where e -- ter -- ni -- ty's light has dawned, That I'll see my dear Lord, and will live with Him, @s1"

[lyrics.4]
text = "Tho' the bur -- dens are great that I oft must bear, Trust -- ing Je -- sus, I'll ne'er de -- spond Heav -- en's won -- der -- ful bless -- ings, my soul shall share, @s1"

[lyrics.s1]
text = "In the beau -- ti -- ful life be -- yond."

