[lyrics.1]
text = "Je -- sus, the lov -- ing Shep -- herd, Call -- eth thee now to come In -- to the fold of safe -- ty, Where there is rest and room; Come in the strength of man -- hood, Come in the morn of youth, En -- ter the fold of safe -- ty, En -- ter the way of truth."

[lyrics.2]
text = "Je -- sus, the lov -- ing Shep -- herd, Gave His dear life for thee; Ten -- der -- ly now He’s call -- ing, “Wan -- der -- er, come to Me;” Haste! for with -- out is dan -- ger, “Come,” cries the Shep -- herd blest; En -- ter the fold of safe -- ty, En -- ter the place of rest."

[lyrics.3]
text = "Lin -- ger -- ing is but fol -- ly, Wolves are a -- broad to -- day, Seek -- ing the sheep who’re stray -- ing, Seek -- ing the lambs to slay; Je -- sus, the lov -- ing Shep -- herd, Call -- eth thee now to come; En -- ter the fold of safe -- ty, Where there is rest and room."

[lyrics.chorus]
text = "Lov -- ing -- ly, ten -- der -- ly call -- ing is He, “Wan -- der -- er, wan -- der -- er, come un -- to Me;” Pa -- tient -- ly wait -- ing, there stand -- ing I see Je -- sus, my Shep -- herd di -- vine."
