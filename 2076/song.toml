[lyrics.1]
text = "Lov -- ing Sav -- iour, hear my cry, hear my cry, hear my cry; Trem -- bling, to Thy arms I fly, O save me at the cross."

[lyrics.2]
text = "I have sinned, but Thou hast died, Thou hast died, Thou hast died; In Thy mer -- cy let me hide, O save me at the cross."

[lyrics.3]
text = "Tho’ I per -- ish, I will pray, I will pray, I will pray; Thou of life the liv -- ing way, O save me at the cross."

[lyrics.4]
text = "Thou hast said Thy grace is free, grace is free, grace is free; Have com -- pas -- sion, Lord, on me, O save me at the cross."

[lyrics.5]
text = "Wash me in Thy cleans -- ing blood, cleans -- ing blood, cleans -- ing blood; Plunge me now be -- neath the flood, O save me at the cross."

[lyrics.6]
text = "On -- ly faith will par -- don bring, par -- don bring, par -- don bring; In that faith to Thee I cling, O save me at the cross."

[lyrics.chorus]
text = "Dear Je -- sus, re -- ceive me, No more would I grieve Thee; Now, bless -- ed Re -- deem -- er, O save me at the cross; Dear Je -- sus, re -- ceive me, No more would I grieve Thee; Now, bless -- ed Re -- deem -- er, O save me at the cross."
