[lyrics.1]
text = "There’s a beau -- ti -- ful cit -- y far be -- yond the blue sky, And I long its bright por -- tals to see; ’Tis the home of our Fa -- ther whom we’ll see by and by, And, dear Sav -- ior, I’m look -- ing to Thee."

[lyrics.2]
text = "While I roam on this earth here there’ll be sor -- rows and cares, Re -- al plea -- sures but few I shall see; But I’ll live for the right and try to shun Sa -- tan’s snares, While I’m look -- ing, dear Sav -- ior, to Thee."

[lyrics.3]
text = "There are man -- y sad tri -- als thro’ the path -- way of life, Man -- y bur -- dens and cross -- es there’ll be; All my bur -- dens I’ll bear and I’ll push on thro’ the strife, Still _ look -- ing, dear Sav -- ior, to Thee."

[lyrics.chorus]
text = "Look -- ing to Thee, I’m look -- ing to Thee, Dear Sav -- ior, I’m look -- ing, I’m look -- ing to Thee."

[parts.Alto.lyrics.chorus]
