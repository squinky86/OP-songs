[lyrics.1]
text = "Dear Fa -- ther, to Thy mer -- cy- -- seat My soul for shel -- ter flies; ’Tis here I find a safe re -- treat When storms and tem -- pests rise."

[lyrics.2]
text = "My cheer -- ful hope can nev -- er die, If Thou, my God, art near; Thy grace can raise my com -- forts high, And ban -- ish ev -- ’ry fear."

[lyrics.3]
text = "My great Pro -- tect -- or, and my Lord, Thy con -- stant aid im -- part; O, let Thy kind, Thy gra -- cious word Sus -- tain my trem -- bling heart."

[lyrics.chorus]
text = "O, nev -- er let my soul re -- move From this di -- vine re -- treat; Still let me trust Thy pow’r and love, And dwell be -- neath Thy feet."
