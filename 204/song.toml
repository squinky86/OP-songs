[lyrics.1]
text = "He lead -- eth me: O bless -- ed thought! O words with heav -- enly com -- fort fraught! What -- e'er I do, wher -- e're I be, still 'tis God's hand that lead -- eth me. He lead -- eth me, he lead -- eth me; by his own hand he lead -- eth me: his faith -- ful fol -- lower I would be, for by his hand he lead -- eth me."

[lyrics.2]
text = "Some -- times mid scenes of deep -- est gloom, some -- times where E -- den's flow -- ers bloom, by wa -- ters calm, o'er trou -- bled sea, still 'tis God's hand that lead -- eth me. He lead -- eth me, he lead -- eth me; by his own hand he lead -- eth me: his faith -- ful fol -- lower I would be, for by his hand he lead -- eth me."

[lyrics.3]
text = "Lord, I would clasp thy hand in mine, nor ev -- er mur -- mur nor re -- pine; con -- tent, what -- ev -- er lot I see, since 'tis my God that lead -- eth me. He lead -- eth me, he lead -- eth me; by his own hand he lead -- eth me: his faith -- ful fol -- lower I would be, for by his hand he lead -- eth me."

[lyrics.4]
text = "And when my task on earth is done, when, by thy grace, the vic -- tory's won, e'en death's cold wave I will not flee, since God through Jor -- dan lead -- eth me. He lead -- eth me, he lead -- eth me; by his own hand he lead -- eth me: his faith -- ful fol -- lower I would be, for by his hand he lead -- eth me."
