[lyrics.1]
text = "Near -- er the cross, my heart can say, I am com -- ing near -- er; Near -- er the cross from day to day, I am com -- ing near -- er; Near -- er the cross where Je -- sus died, Near -- er the foun -- tain’s crim -- son tide, Near -- er my Sav -- ior’s wound -- ed side, I am com -- ing near -- er, I am com -- ing near -- er."

[lyrics.2]
text = "Near -- er the Chris -- tian’s mer -- cy- -- seat, I am com -- ing near -- er; Feast -- ing my soul on man -- na sweet, I am com -- ing near -- er; Strong -- er in faith, more clear I see Je -- sus, who gave Him -- self for me; Near -- er to Him I still would be, Still I’m com -- ing near -- er, Still I’m com -- ing near -- er."

[lyrics.3]
text = "Near -- er in pray’r my hope as -- pires, I am com -- ing near -- er; Deep -- er the love my soul de -- sires, I am com -- ing near -- er; Near -- er the end of toil and care, Near -- er the joy I long to share, Near -- er the crown I soon shall wear, I am com -- ing near -- er, I am com -- ing near -- er."
