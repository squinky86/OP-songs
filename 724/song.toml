[lyrics.1]
text = "Some one touched my heart with love, It was Je -- sus, It was Je -- sus; Some one bade me look a -- bove, It was Je -- sus, bless -- ed Je -- sus."

[lyrics.2]
text = "Some one changed my sigh to song, It was Je -- sus, It was Je -- sus; Led me right in -- stead of wrong, It was Je -- sus, bless -- ed Je -- sus."

[lyrics.3]
text = "Some one gave my soul new life, It was Je -- sus, It was Je -- sus; Some one helped me in the strife, It was Je -- sus, bless -- ed Je -- sus."

[lyrics.chorus]
text = "It was Je -- sus my dear Friend, my dear Friend, On whose love I could de -- pend; could de -- pend; Some one caused my grief to end, It was Je -- sus, bless -- ed Je -- sus."

[parts.Soprano.lyrics.chorus]
