[lyrics.1]
text = "Love di -- vine, all loves ex -- cell -- ing, Joy of heaven to earth come down, fix in us thy hum -- ble dwell -- ing, all thy faith -- ful mer -- cies crown. Je -- sus, thou art all com -- pas -- sion, pure, un -- bound -- ed love thou art; vi -- sit us with thy sal -- va -- tion, en -- ter ev -- ery trem -- bling heart."

[lyrics.2]
text = "Breathe, O breathe thy lov -- ing Spir -- it in -- to ev -- ery trou -- bled breast; let us all in thee in -- her -- it, let us find the prom -- ised rest. Take a -- way the love of sin -- ning, Al -- pha and O -- me -- ga be; end of faith, as its be -- gin -- ning, set our hearts at lib -- er -- ty."

[lyrics.3]
text = "Come, al -- might -- y to de -- liv -- er, let us all thy life re -- ceive; sud -- den -- ly re -- turn, and nev -- er, nev -- er -- more thy tem -- ples leave. Thee we would be al -- ways bless -- ing, serve thee as thy hosts a -- bove, pray and praise thee with -- out ceas -- ing, glo -- ry in thy per -- fect love."

[lyrics.4]
text = "Fi -- nish then thy new cre -- a -- tion, pure and spot -- less let us be; let us see thy great sal -- va -- tion per -- fect -- ly re -- stored in thee: changed from glo -- ry in -- to glo -- ry, till in heaven we take our place, till we cast our crowns be -- fore thee, lost in won -- der, love, and praise."
