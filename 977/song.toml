[lyrics.1]
text = "The heav’ns de -- clare Thy glo -- ry, Lord, In ev -- ’ry star Thy wis -- dom shines: But when our eyes be -- hold Thy word, We read Thy name in fair -- er lines."

[lyrics.2]
text = "The roll -- ing sun, the chang -- ing light, And nights and days Thy pow’r con -- fess; But the blest vol -- ume Thou didst write Re -- veals Thy jus -- tice and Thy grace."

[lyrics.3]
text = "Great Sun of right -- eous -- ness, a -- rise, Bless the dark world with heav’n -- ly light: Thy Gos -- pel makes the sim -- ple wise, Thy laws are pure, Thy judg -- ments right."

[lyrics.4]
text = "Thy no -- blest won -- ders here we view, In souls re -- newed and sins for -- giv’n: Lord, cleanse our sins, our souls re -- new, And make Thy word our guide to heav’n."
