[lyrics.1]
text = "Lord God om -- nip -- o -- tent, we lift our hearts to Thee For bless -- ings man -- i -- fold, that can -- not num -- bered be; Our self -- ish -- ness de -- stroy, our hearts with wis -- dom fill; A spir -- it more like Thine give us to do Thy will."

[lyrics.2]
text = "On ev -- 'ry hand be -- hold the fields with reap -- ers few; Lord, give us great -- er zeal Thy work of love to do! En -- due us to up -- build the broth -- er -- hood of man By liv -- ing clos -- er to the wis -- er, broad -- er plan."

[lyrics.3]
text = "Didst Thou not do for us a might -- y work of love? Then give us grace, O God, our grat -- i -- tude to prove; For oth -- ers help us live, nor count our du -- ty done To God and fel -- low man, un -- til the set of sun."

