# Source: Tidings of Joy (1928), TJ #173, page 174 (plate prints "No." with no number):
# seven-shape closed-score SATB. Notes and all lyrics read from that plate scan.
# Plate credits: words "LIZZIE DeARMOND.", music "C. C. STAFFORD."; footer "C. C. Stafford, owner."
# No copyright year on the plate. 1916 is hymnary's earliest instance of the text
# (The Eureka Song Climax #136, 1916); used for both words and music.
# Key A-flat (4 flats), 6/4, as printed. No tempo printed: 108 bpm is a guess.
# Form: 3 stanzas + refrain, written straight through (no repeats).
# Stanza echo: Alto and Tenor answer each stanza's last word "(I love.)" /
# "(complete.)" / "(and King.)" in bar 8 while Soprano and Bass hold. The plate prints no
# rest on the Alto/Tenor beat 2 of bar 8; one is written to fill the bar.
# Refrain: the Soprano holds "Joy…", "Je…", "Ev…" (top lyric row); Alto, Tenor
# and Bass sing the lower row in quarters ("Joy to my heart He doth ev-er more bring…").
# In bars 14-16 the plate's lower row prints only "sing," and "re-deemed me for aye!".
# Editorial inference: Alto/Tenor sing "He hath re-deemed me, re-deemed me for aye!"
# ("re-" printed before the last barline, under bar 15 beat 6). The Bass holds the
# final note with the Soprano, so it sings "He hath re-deemed me for aye!"
# Plate misprint fixed: bar 13 Soprano beat 4 (tied Eb5) prints a hollow head. Read as
# a quarter, like the parallel bars 9 and 11, so the bar adds up.
# Bar 14: a small arc joins the Soprano's C5 and Db5. The lyric "He" is printed under
# the Db5, so it is sung, not slurred.
title = "Joy To My Heart"
copyrights = [
  "Lyrics: Lizzie DeArmond, 1916 (public domain)",
  "Music: C. C. Stafford, 1916 (public domain)",
  "Arrangement by OpenPsalm, 2026 and released under the CC-BY 4.0 license",
]
key_signature = "Ab"
time_sig_numerator = 6
time_sig_denominator = 4
tempo_bpm = 108
verse_count = 3
phrase_breaks = ["2:96", "4:96", "8:96", "12:96"]
optional_phrase_breaks = ["6:96", "10:96"]
non_breaking_phrase_breaks = ["8:32", "13:80", "14:96", "15:80", "16:16"]
non_breaking_format_resets = ["14:96"]

