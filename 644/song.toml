[lyrics.1]
text = "I love to tell the sto -- ry of my Sav -- ior’s match -- less love And try to lead the lost to seek the mer -- cy- -- seat a -- bove; Yet, if I used a thou -- sand tongues for all e -- ter -- ni -- ty, I nev -- er could tell half of all my Sav -- ior is to me."

[lyrics.2]
text = "A -- maze -- ment thrills my soul each time I think of what He’s done— The cross He bore, the thorns He wore, the bat -- tles He has won; So tho’ I praised Him all my days, of help to Him to be, I nev -- er could tell half of all my Sav -- ior is to me."

[lyrics.3]
text = "But this I know: when I reach home, my joy and glo -- ry there Will be in tell -- ing what He did to make my rec -- ord fair; But, tho’ I praise Him ev -- er -- more be -- side the crys -- tal sea, I nev -- er shall tell half of all my Sav -- ior is to me."

[lyrics.chorus]
text = "Oh, all yes, all He is to me Made known to man could nev -- er be; I nev -- er could tell half of all my Sav -- ior is to me."

