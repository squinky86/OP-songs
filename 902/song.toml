[lyrics.1]
text = "Lord of our high -- est love! Let now Thy peace be giv’n; Fix all our tho’ts on things a -- bove, Our hearts on Thee in heav’n."

[lyrics.2]
text = "Then, dear -- est Lord, draw near, Whilst we Thy ta -- ble spread; And crown the feast with heav’n -- ly cheer, Thy -- self the liv -- ing bread."

[lyrics.3]
text = "Then as the loaf we break, Thine own rich bless -- ing give; May all with lov -- ing hearts par -- take, And all new strength re -- ceive."

[lyrics.4]
text = "Dear Lord! what mem -- ’ries crowd A -- round the sa -- cred cup! The up -- per room! Geth -- sem -- a -- ne! Thy foes! Thy lift -- ing up!"

[lyrics.5]
text = "O scenes of suf -- f’ring love, E -- nough our souls to win— E -- nough to melt our hearts and prove The an -- ti -- dote of sin."
