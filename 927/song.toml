[lyrics.1]
text = "O moth -- er dear, Je -- ru -- sa -- lem, When shall I come to thee? When shall my sor -- rows have an end? Thy joys when shall I see? O hap -- py har -- bor of the saints! O sweet and pleas -- ant soil! In thee no sor -- row may be found, No grief, no care, no toil."

[lyrics.2]
text = "No murk -- y cloud o’er -- shad -- ows thee, Nor gloom, nor dark -- some night; But ev -- ’ry soul shines as the sun, For God Him -- self gives light. O my sweet home, Je -- ru -- sa -- lem, Thy joys when shall I see? The King that sit -- teth on thy throne In His fe -- lic -- i -- ty?"

[lyrics.3]
text = "Thy gar -- dens and thy good -- ly walks Con -- tin -- ual -- ly are green; There grow such sweet and pleas -- ant flow’rs As no -- where else are seen. Right thro’ the streets, with sil -- ver sound, The liv -- ing wa -- ters flow; And on the banks, on ei -- ther side, The tree of life doth grow."

[lyrics.4]
text = "There trees for ev -- er -- more bear fruit, And ev -- er -- more do spring; And all the na -- tions of the earth To thee their hon -- ors bring. Je -- ru -- sa -- lem, my hap -- py home, When shall I come to thee? When shall my sor -- rows have an end? Thy joys when shall I see?"
