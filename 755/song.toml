[lyrics.1]
text = "Once I bore a bur -- den great, Was wea -- ry and sad; But no more I bear its weight, I’m par -- doned and glad. Love di -- vine, at last, I know, No lon -- ger I stray; On with -- out a stain I go— Love took it a -- way."

[lyrics.2]
text = "Once a crav -- ing great had I For pleas -- ures that stain; Now I pass those pleas -- ures by,— They tempt me in vain. I am un -- der His con -- trol, Re -- joic -- ing each day; Gone the bur -- den from my soul— Love took it a -- way."

[lyrics.3]
text = "Once my rec -- ord was un -- clean, My spir -- it was worn; Now my name on high is seen As fair as the morn. Oh, what hap -- pi -- ness is mine, With Je -- sus I stay; Sin no more makes me re -- pine,— Love took it a -- way."

[lyrics.chorus]
text = "Love took it a -- way, One won -- der -- ful day; Made me free and lift -- ed me, In the light to stay, Love took it a -- way, One won -- der -- ful day, Gone at last my sin -- ful past— Love took it a -- way."

[parts.Alto.lyrics.chorus]
text = "Love took it a -- way, One won -- der -- ful day; Made me free and lift -- ed me, In the light of God to stay, Love took it a -- way, One won -- der -- ful day, Gone at last my sin -- ful past— Love took it a -- way."

[parts.Tenor.lyrics.chorus]
text = "Love took it a -- way, One won -- der -- ful day; Made me free and lift -- ed me, In the light of God to stay, Love took it a -- way, One won -- der -- ful day, Gone at last my sin -- ful past— Love took it a -- way."
