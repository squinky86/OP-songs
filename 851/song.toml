[lyrics.1]
text = "Have you heard the glo -- rious ti -- dings, Je -- sus saves from doubt and fear? Have you heard the glo -- rious ti -- dings, Je -- sus saves from doubt and fear? Sal -- va -- tion, sal -- va -- tion, Thro’ the pre -- cious blood Of the Son of God; Sal -- va -- tion, sal -- va -- tion, Thro’ the pre -- cious blood Of the Son of God."

[lyrics.2]
text = "Since I met Thee, O my Sav -- ior, Earth has lost its charm for me; Since I met Thee, O my Sav -- ior, Earth has lost its charm for me. Thy glo -- ry, Thy glo -- ry, O re -- flect in me: I am one with Thee; Thy glo -- ry, Thy glo -- ry, O re -- flect in me: I am one with Thee."

[lyrics.3]
text = "Thou hast sought, and drawn and won me, Bless -- ed Bride -- groom of my soul; Thou hast sought, and drawn and won me, Bless -- ed Bride -- groom of my soul. I love Thee, I love Thee, All I have is Thine; All Thou hast is mine; I love Thee, I love Thee, All I have is Thine; All Thou hast is mine."

