text = "When the arm -- y of e -- vil be -- sets us, And in weak -- ness we fear we shall fall, Christ the Bless -- ed One nev -- er for -- gets us,— @s1"

[lyrics.3]
text = "When at last strength re -- fus -- es to ral -- ly, When the an -- gel of death sends the call, We shall know, as we en -- ter the val -- ley, @s1"

[lyrics.chorus]
