[lyrics.1]
text = "O sa -- cred Head, now wound -- ed, With grief and shame weighed down; How scorn -- ful -- ly sur -- round -- ed, With thorns, Thine on -- ly crown! What lan -- guage shall I bor -- row To thank Thee, dear -- est Friend, For this Thy dy -- ing sor -- row, Thy pi -- ty with -- out end?"

[lyrics.2]
text = "What Thou, my Lord, hast suf -- fered, Was all for sin -- ners’ gain; Mine, mine was the trans -- gres -- sion, But Thine the dead -- ly pain. Lo, here I fall, my Sav -- ior! ’Tis I de -- serve Thy place; Look on me with Thy fa -- vor, Vouch -- safe to me Thy grace."
