[lyrics.1]
text = "A charge to keep I have, A God to glo -- ri -- fy; A nev -- er- -- dy -- ing soul to save, And fit it for the sky."

[lyrics.2]
text = "To serve the pres -- ent age, My call -- ing to ful -- fil— O may it all my pow'rs en -- gage To do my Mas -- ter's will!"

[lyrics.3]
text = "Arm me with jeal -- ous care, As in Thy sight to live; And O Thy serv -- ant, Lord, pre -- pare A strict ac -- count to give!"

