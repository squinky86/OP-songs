[lyrics.1]
text = "Up -- on the walls of mem -- o -- ry One face, one form I ev -- er see; A -- bove all men he seems to me, My fa -- ther, my dear fa -- ther."

[lyrics.2]
text = "I loved to stand by fa -- ther’s knee, And hear him read God’s Word to me; Most pre -- cious will they ev -- er be, Those pag -- es read by fa -- ther."

[lyrics.3]
text = "But bet -- ter far than print -- ed page, Or mes -- sage from se -- er or sage, Is this most price -- less her -- it -- age, The life of my dear fa -- ther."

[lyrics.4]
text = "What tho’ the world knew not his worth, Nor halls of fame re -- cord his birth, It can -- not per -- ish from the earth, The good work done by fa -- ther."

[lyrics.5]
text = "His pre -- cepts I will still o -- bey, And as he fol -- lowed Christ each day, I’ll fol -- low in the same old way, Un -- til I join my fa -- ther."

[lyrics.chorus]
text = "O how it makes my heart re -- joice When I re -- call that lov -- ing voice; Yes, sweet to me will ev -- er be The mem -- ’ry of my fa -- ther."
