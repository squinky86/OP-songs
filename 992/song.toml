[lyrics.1]
text = "We saw Thee not when Thou didst come To this poor world of sin and death; Nor yet be -- held Thy cot -- tage home, In that de -- spis -- ed Naz -- a -- reth; But we be -- lieve Thy foot -- steps trod Its streets and plains, Thou Son of God: But we be -- lieve Thy foot -- steps trod Its streets and plains, Thou Son of God."

[lyrics.2]
text = "We saw Thee not when lift -- ed high, A -- mid that wild and sav -- age crew; Nor heard we that im -- plor -- ing cry, “For -- give, they know not what they do!” But we be -- lieve the deed was done, That shook the earth and veiled the sun; But we be -- lieve the deed was done, That shook the earth and veiled the sun;"

[lyrics.3]
text = "We gazed not in the o -- pen tomb, Where once Thy man -- gled bod -- y lay; Nor saw Thee in that “up -- per room,” Nor met Thee on the o -- pen way; But we be -- lieve that an -- gels said, “Why seek the liv -- ing with the dead?” But we be -- lieve that an -- gels said, “Why seek the liv -- ing with the dead?”"

[lyrics.4]
text = "We walked not with the cho -- sen few, Who saw Thee from the earth as -- cend; Who raised to heav’n their wond’ -- ring view, Then low to earth all pros -- trate bend; But we be -- lieve that hu -- man eyes Be -- held that jour -- ney to the skies; But we be -- lieve that hu -- man eyes Be -- held that jour -- ney to the skies."
