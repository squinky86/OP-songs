[lyrics.1]
text = "There is ne -- ver a day so drear -- y, There is ne -- ver a night so long, But the soul that is trusting in Je -- sus Will some -- where find a song."

[parts.Alto.lyrics.1]
text = "There is ne -- ver a day so drear -- y, There is ne -- ver a night so long, But the soul that is trusting in Je -- sus Will some -- where find a song. (a song.)"

[parts.Tenor.lyrics.1]
text = "There is ne -- ver a day so drear -- y, There is ne -- ver a night so long, But the soul that is trusting in Je -- sus Will some -- where find a song. (a song.)"

[parts.Bass.lyrics.1]
text = "There is ne -- ver a day so drear -- y, There is ne -- ver a night so long, (so long,) But the soul that is trusting in Je -- sus Will some -- where find a song."

[lyrics.2]
text = "There is ne -- ver a cross so hea -- vy, There is ne -- ver a weight of woe, But that Je -- sus will help to car -- ry Be -- cause He lov -- eth so."

[parts.Alto.lyrics.2]
text = "There is ne -- ver a cross so hea -- vy, There is ne -- ver a weight of woe, But that Je -- sus will help to car -- ry Be -- cause He lov -- eth so. (loves so.)"

[parts.Tenor.lyrics.2]
text = "There is ne -- ver a cross so hea -- vy, There is ne -- ver a weight of woe, But that Je -- sus will help to car -- ry Be -- cause He lov -- eth so. (loves so.)"

[parts.Bass.lyrics.2]
text = "There is ne -- ver a cross so hea -- vy, There is ne -- ver a weight of woe, (of woe,) But that Je -- sus will help to car -- ry Be -- cause He lov -- eth so."

[lyrics.3]
text = "There is ne -- ver a care or bur -- den, There is ne -- ver a grief or loss, But that Je -- sus in love will light -- en When car -- ried to the cross."

[parts.Alto.lyrics.3]
text = "There is ne -- ver a care or bur -- den, There is ne -- ver a grief or loss, But that Je -- sus in love will light -- en When car -- ried to the cross. (the cross.)"

[parts.Tenor.lyrics.3]
text = "There is ne -- ver a care or bur -- den, There is ne -- ver a grief or loss, But that Je -- sus in love will light -- en When car -- ried to the cross. (the cross.)"

[parts.Bass.lyrics.3]
text = "There is ne -- ver a care or bur -- den, There is ne -- ver a grief or loss, (or loss,) But that Je -- sus in love will light -- en When car -- ried to the cross."

[lyrics.4]
text = "There is ne -- ver a guilt -- y sin -- ner, There is ne -- ver a wan -- d'ring one, But that God can in mer -- cy par -- don Through Je -- sus Christ, His Son."

[parts.Alto.lyrics.4]
text = "There is ne -- ver a guilt -- y sin -- ner, There is ne -- ver a wan -- d'ring one, But that God can in mer -- cy par -- don Through Je -- sus Christ, His Son. (His Son.)"

[parts.Tenor.lyrics.4]
text = "There is ne -- ver a guilt -- y sin -- ner, There is ne -- ver a wan -- d'ring one, But that God can in mer -- cy par -- don Through Je -- sus Christ, His Son. (His Son.)"

[parts.Bass.lyrics.4]
text = "There is ne -- ver a guilt -- y sin -- ner, There is ne -- ver a wan -- d'ring one, (not one,) But that God can in mer -- cy par -- don Through Je -- sus Christ, His Son."

[lyrics.chorus]
text = "Won -- der -- ful, won -- der -- ful Je -- sus, In the heart He im -- plant -- eth a song: A song of de -- liv -- erance, of cour -- age, of strength, In the heart He im -- plant -- eth a song."

