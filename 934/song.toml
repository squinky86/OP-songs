[lyrics.1]
text = "O Sav -- ior mine, so full, so free, Thy pard’ -- ning love has been to me; Were I pos -- sessed of bound -- less store, My heart would long to yield Thee more."

[parts.Tenor.lyrics.1]
text = ""

[parts.Bass.lyrics.1]
text = ""

[lyrics.2]
text = "O Sav -- ior mine, Thy feet to kiss In serv -- ice low is high -- est bliss; O give to me one glance of Thine, And pain for Thee is joy di -- vine."

[parts.Tenor.lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "O Sav -- ior mine, can I with -- hold The tri -- fling deed, the pal -- try gold? Nay, low -- ly at Thy feet I fall, O Sav -- ior mine, I give Thee all."

[parts.Tenor.lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = ""

[lyrics.chorus]
text = "The world is naught a -- part from Thee, O Sav -- ior mine, And crusts are king -- ly fare for me since I am Thine; My life, my all, to Thee I give, O Sav -- ior mine, for Thee to live. My life, my all, to Thee I give, O Sav -- ior mine, for Thee to live."

