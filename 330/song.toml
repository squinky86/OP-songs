[lyrics.1]
text = "Je -- sus, and shall it ev -- er be, A mor -- tal man a -- shamed of thee? A -- shamed of thee, whom an -- gels praise, Whose glo -- ries shine through end -- less days?"

[lyrics.2]
text = "A -- shamed of Je -- sus! soon -- er far Let eve -- ning blush to own a star; He sheds the beams of light di -- vine O'er this be -- night -- ed soul of mine."

[lyrics.3]
text = "A -- shamed of Je -- sus! just as soon Let mid -- night be a -- shamed of noon; 'Twas mid -- night with my soul till he, Bright Morn -- ing Star, bade dark -- ness flee."

[lyrics.4]
text = "A -- shamed of Je -- sus! that dear Friend On whom my hopes of heav'n de -- pend! No; when I blush, be this my shame, That I no more re -- vere his name."

[lyrics.5]
text = "A -- shamed of Je -- sus! yes, I may When I've no guilt to wash a -- way; No tear to wipe, no good to crave, No fears to quell, no soul to save."

[lyrics.6]
text = "Till then, nor is my boast -- ing vain, Till then I boast a Sav -- ior slain; And O, may this my glo -- ry be, That Christ is not a -- shamed of me!"
