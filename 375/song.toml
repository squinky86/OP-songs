[lyrics.chorus]
text = "The Lord a -- rose! from death He came A might -- y Vic -- tor, praise His name. He lives! be -- hold the emp -- ty bed That pil -- lowed once His sa -- cred head; He lives, our Lord who once was dead."

[lyrics.1]
text = "Bro -- ken is the seal of death that bound The tomb where Je -- sus lay; For, lo, the an -- gel of the Lord came down And rolled the stone a -- way."

[lyrics.2]
text = "Gone from death for -- ev -- er is its sting; To life 'tis now the door; The grave had not the pow'r to hold our King— He lives for -- ev -- er -- more."

[lyrics.3]
text = "He in tri -- umph from the grave a -- rose, And thro' the grace He gives, We, too, may rise a -- bove the last of foes, And live as now He lives."
