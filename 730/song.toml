[lyrics.1]
text = "In the day -- time’s gold -- en light, Lis -- ten to the voice of Je -- sus; In the sol -- emn gloom of night, Lis -- ten to the voice of Je -- sus."

[lyrics.2]
text = "While in down -- ward paths you roam, Lis -- ten to the voice of Je -- sus; He is bid -- ding you come home, Lis -- ten to the voice of Je -- sus."

[lyrics.3]
text = "Long -- ing for a pur -- er life, Lis -- ten to the voice of Je -- sus; Seek -- ing rest from e -- vil strife, Lis -- ten to the voice of Je -- sus."

[lyrics.4]
text = "Find -- ing par -- don for your soul, Lis -- ten to the voice of Je -- sus; Yield -- ing all to His con -- trol, Lis -- ten to the voice of Je -- sus."

[lyrics.chorus]
text = "He is call -- ing, ev -- er call -- ing, Clear and sweet His words are fall -- ing, Wea -- ry one, by sin un -- done, Lis -- ten to the voice of Je -- sus."
