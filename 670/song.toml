[parts.Soprano.lyrics.1]
text = "My home on earth is dear to me, It’s full of joy and lib -- er -- ty; At night I love to kneel and pray, To God to lead me on life’s way."

[parts.Soprano.lyrics.2]
text = "There is a home, far up a -- bove, Where all is peace, where all is love, That home some day, I hope to see; And with my Sav -- ior ev -- er be."

[parts.Soprano.lyrics.3]
text = "Each day and night, dear Lord I pray, To keep me in the nar -- row way; And when my work on earth is o’er, I’ll dwell with Thee, on Ca -- naan’s shore."

