[lyrics.1]
text = "The Lord my Shep -- herd is; I shall be well sup -- plied; Since He is mine, and I am His, What can I want be -- side? What can I want be -- side?"

[lyrics.2]
text = "He leads me to the place Where heav’n -- ly pas -- ture grows, Where liv -- ing wa -- ters gen -- tly pass, And full sal -- va -- tion flows, And full sal -- va -- tion flows."

[lyrics.3]
