[lyrics.1]
text = "Wel -- come, de -- light -- ful morn, Thou day of sa -- cred rest! I hail thy kind re -- turn: Lord, make these mo -- ments blest. From the low train of mor -- tal toys, I soar to reach im -- mor -- tal joys, I soar to reach im -- mor -- tal joys."

[lyrics.2]
text = "To spend one sa -- cred day Where God and saints a -- bide, Af -- fords di -- vin -- er joy, Than thou -- sand days be -- side; I love it more where God re -- sorts, To keep the door than shine in courts, To keep the door than shine in courts."

[lyrics.3]
text = "Now may the King de -- scend And fill His throne with grace; The scep -- ter, Lord, ex -- tend, While saints ad -- dress Thy face; Let sin -- ners feel Thy quick -- ’ning word And learn to know and fear the Lord, And learn to know and fear the Lord."
