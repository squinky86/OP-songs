[lyrics.1]
text = "All the way my Lord is lead -- ing me; @s1 With His heav’n -- ly man -- na feed -- ing me; @s2"

[lyrics.2]
text = "When I faint, His grace up -- hold -- eth me; @s1 When I fear, His arms en -- fold -- eth me; @s2"

[lyrics.3]
text = "Cares of life have o -- ver -- tak -- en me, @s1 Yet He nev -- er has for -- sak -- en me, @s2"

[lyrics.s1]
text = "Praise His name, praise His name!"

[lyrics.s2]
text = "Praise His ho -- ly name."

[parts.Tenor.lyrics.s1]
text = "Praise ​His ​name!"

[parts.Tenor.lyrics.s2]
text = "Praise ​His ​name."

[parts.Bass.lyrics.s2]
