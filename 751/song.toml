[lyrics.1]
text = "O ran -- somed souls, with joy -- ous song Press a -- long Press a -- long to Glo -- ry- -- land; Ex -- tol -- ling grace that saves the race, Press a -- long Press a -- long to Glo -- ry- -- land."

