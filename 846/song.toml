[lyrics.1]
text = "Hal -- le -- lu -- jah, praise Je -- ho -- vah! From the heav -- ens praise His name; Praise Je -- ho -- vah in the high -- est, All His an -- gels praise pro -- claim. All His hosts to -- geth -- er praise Him, Sun and moon and stars on high; Praise Him, O ye heav’n of heav -- ens, And ye floods a -- bove the sky."

[lyrics.2]
text = "Let them prais -- es give Je -- ho -- vah! They were made at His com -- mand; Them for -- ev -- er He es -- tab -- lished, His de -- cree shall ev -- er stand. From the earth, O praise Je -- ho -- vah, All ye floods, ye drag -- ons all; Fire and hail and snow and va -- pors, Storm -- y winds that hear Him call."

[lyrics.3]
text = "All ye fruit -- ful trees and ce -- dars, All ye hills and moun -- tains high, Creep -- ing things and beasts and cat -- tle, Birds that in the heav -- ens fly; Kings of earth and all ye peo -- ple, Prin -- ces great, earth’s judg -- es all; Praise His name, young men and maid -- ens, A -- ged men, and chil -- dren small."

[lyrics.chorus]
text = "Let them prais -- es give Je -- ho -- vah, For His name a -- lone is high, And His glo -- ry is ex -- alt -- ed, And His glo -- ry is ex -- alt -- ed, And His glo -- ry is ex -- alt -- ed Far a -- bove the earth and sky."
