[lyrics.1]
text = "O Thou who in Jor -- dan didst bow Thy meek head, And whelmed in our sor -- row, didst sink to the dead. Then rose from the dark -- ness to glo -- ry a -- bove, And claimed for Thy chos -- en the king -- dom of love. Then rose from the dark -- ness to glo -- ry a -- bove, And claimed for Thy chos -- en the king -- dom of love."

[lyrics.2]
text = "Thy foot -- steps we fol -- low, we bow in the tide, We’re bur -- ied with Thee in the death Thou hath died. We rise in Thy like -- ness to walk in the way That bright -- ens and bright -- ens to shad -- ow -- less day. We rise in Thy like -- ness to walk in the way That bright -- ens and bright -- ens to shad -- ow -- less day."

[lyrics.3]
text = "Till crowned with Thy glo -- ry and wav -- ing the palm, Our gar -- ments all white from the blood of the Lamb. We join the bright mil -- lions of saints gone be -- fore, And bless Thee, and won -- der and praise ev -- er -- more. We join the bright mil -- lions of saints gone be -- fore, And bless Thee, and won -- der and praise ev -- er -- more."
