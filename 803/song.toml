[lyrics.1]
text = "I'd like to wan -- der back a -- gain to days of long a -- go, To sit with -- in the cir -- cle there and watch the fire -- light glow Up -- on fa -- mil -- iar fac -- es of the ones I used to know; I'd like to list -- en to their foot -- steps pass -- ing to and fro."

[lyrics.2]
text = "I'd like to wan -- der back to child -- hood joys up -- on the farm, And feel that I was safe a -- gain from ev -- 'ry pass -- ing harm, Se -- cure a -- gainst all fol -- lies and temp -- ta -- tion's lur -- ing charm, And rest a -- gain with -- in the shel -- ter of my moth -- er's arm."

[lyrics.3]
text = "I'd like to be a child a -- gain with -- in the walls of home, And live in peace and hap -- pi -- ness, nor wish to stray or roam, For though I climb o'er moun -- tains grand or sail the o -- cean's foam, I'll nev -- er find, in all this world, my moth -- er or my home."

[lyrics.4]
text = "I'd like to kneel be -- side my bed and to my Fa -- ther pray, And trust to Him my wish -- es in the old- -- time child -- ish way, For He is still my Fa -- ther, and I hear Him gen -- tly say, That He will ev -- er guide and guard His child by night and day."

[lyrics.chorus]
text = "I'd like to be a -- gain at moth -- er's knee, I'd like to hear her words of sym -- pa -- thy, I'd like to feel her arms en -- cir -- cle me, I'd like to be a child at moth -- er's knee."

[parts.Alto.lyrics.chorus]
text = "I'd like to be (a lit -- tle child) a -- gain at moth -- er's knee, I'd like to List -- en to her words of lov -- ing sym -- pa -- thy, I'd like to feel her lov -- ing arms a -- gain, en -- cir -- cle me, I'd like to be a child at moth -- er's knee."

[parts.Tenor.lyrics.chorus]
text = "I'd like to be (a lit -- tle child) a -- gain at moth -- er's knee, I'd like to List -- en to her words of lov -- ing sym -- pa -- thy, I'd like to feel her lov -- ing arms a -- gain, en -- cir -- cle me, I'd like to be a child at moth -- er's knee."
