[lyrics.1]
text = "Shall we meet be -- yond the riv -- er, Where the sur -- ges cease to roll; Where in all the bright for -- ev -- er, Sor -- row ne’er shall press the soul?"

[lyrics.2]
text = "Shall we meet be -- yond the riv -- er, When our storm -- y voyage is o’er? Shall we meet and cast the an -- chor By the bright ce -- les -- tial shore?"

[lyrics.3]
text = "Shall we meet in yon -- der cit -- y, Where the tow’rs of crys -- tal shine; Where the walls are all of jas -- per, Built by work -- man -- ship di -- vine?"

[lyrics.4]
text = "Shall we meet with Christ, our Sav -- ior, When He comes to claim His own? Shall we know His bless -- ed fa -- vor, And sit down up -- on His throne?"

[lyrics.chorus]
text = "Shall we meet, shall we meet, Shall we meet be -- yond the riv -- er? Shall we meet be -- yond the riv -- er, Where the sur -- ges cease to roll?"
