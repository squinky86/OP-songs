[lyrics.1]
text = "On -- ly in Thee, O Sav -- ior mine, Dwell -- eth my soul in peace di -- vine, Peace that the world, tho’ all com -- bine, Nev -- er can take from me. Plea -- sures of earth, so seem -- ing -- ly sweet, Fail at the last my long -- ings to meet; On -- ly in Thee my bliss is com -- plete, On -- ly, dear Lord, in Thee!"

[lyrics.2]
text = "On -- ly in Thee a ra -- diance bright, Shines like a bea -- con in the night, Guid -- ing my pil -- grim bark a -- right, O -- ver life’s track -- less sea. On -- ly in Thee, when troub -- les mo -- lest, When with temp -- ta -- tion I am op -- pressed, There is a sweet pa -- vil -- ion of rest, On -- ly, dear Lord, in Thee!"

[lyrics.3]
text = "On -- ly in Thee, when days are drear, When nei -- ther sun nor stars ap -- pear, Still I can trust and feel no fear, Sing when I can -- not see. On -- ly in Thee, what -- ev -- er be -- tide, All of my need is free -- ly sup -- plied; There is no hope or help -- er be -- side, On -- ly, dear Lord, in Thee!"

[lyrics.4]
text = "On -- ly in Thee, dear Sav -- ior, slain, Los -- ing Thy life my own to gain, Trust -- ing, I’m cleansed from ev -- ’ry stain, Thou art my on -- ly plea. On -- ly in Thee my heart will de -- light, Till in that land where com -- eth no night, Faith will be lost in heav -- en -- ly sight, On -- ly, dear Lord, in Thee!"
