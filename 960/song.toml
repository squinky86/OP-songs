[lyrics.1]
text = "Sing on, ye joy -- ful pil -- grims, Nor think the mo -- ments long; My faith is heav’n -- ward ris -- ing With ev -- ’ry tune -- ful song; Lo! on the mount of bless -- ing, The glo -- rious mount, I stand; And look -- ing o -- ver Jor -- dan, I see the prom -- ised land."

[lyrics.2]
text = "Sing on, ye joy -- ful pil -- grims, While here on earth we stay; Let songs of home and Je -- sus Be -- guile each fleet -- ing day; Sing on the grand old sto -- ry Of His Re -- deem -- ing love, The ev -- er -- last -- ing cho -- rus That fills the realms a -- bove."

[lyrics.3]
text = "Sing on, ye joy -- ful pil -- grims, The time will not be long, Till in our Fa -- ther’s king -- dom We swell a no -- bler song, Where those we love are wait -- ing To greet us on the shore, We’ll meet be -- yond the riv -- er, Where surg -- es roll no more."

[lyrics.chorus]
text = "Sing on, O bliss -- ful mu -- sic! With ev -- ’ry note you raise My heart is filled with rap -- ture, My soul is lost in praise; Sing on, O bliss -- ful mu -- sic! With ev -- ’ry note you raise My heart is filled with rap -- ture, My soul is lost in praise."

