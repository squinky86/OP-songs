[lyrics.1]
text = "O soul a -- rise and work for God to -- day, Go la -- bor in His vine -- yard while you may, He gen -- tly calls the work -- ers great and small, Then to the har -- vest field a -- way, On moun -- tain hill and plain we’ll glad -- ly go, And bring the lost to Christ from far and wide, Tell sin -- ners of God’s love, Spread the gos -- pel light, We’ll heed our bless -- ed Lord’s com -- mand."

[lyrics.2]
text = "My broth -- er will you heed the Mas -- ter’s call, And take the bless -- ed light to one and all, Go tell them of the Sav -- iour’s won -- drous love, He’ll lead them to that home a -- bove; Be read -- y with the words of God to -- day, To cheer the sad and lone -- ly on their way, For just a -- head sweet rest is a -- wait -- ing you, Then fol -- low where the light leads on."

[lyrics.3]
text = "If we will fol -- low Christ a -- long the way, He’ll guide us to that home where an -- gels stay, When pain and sor -- rows here have all been passed, The bless -- ed light will lead us on; Then let us work to -- day with pow’r and might, That souls a -- stray may see the gos -- pel light, And then the Lord will say un -- to us “well done” We’ll en -- ter in the soul’s bright home."

[lyrics.chorus]
text = "The light of God leads on To that sweet land of song, The light of God leads on, Leads to the soul’s bright home; We’ll fol -- low where He leads And fight a -- gainst the wrong, Re -- joic -- ing in the Lord to -- day, The bless -- ed light of God leads on,"

[parts.Alto.lyrics.chorus]
text = "The light of God leads on To that sweet land of song, Light of God leads on, bless -- ed word leads on, Leads to the soul’s bright home, soul’s e -- ter -- nal home, Fol -- low where He leads, where the Sav -- iour leads And fight a -- gainst the wrong, the wrong, Re -- joic -- ing in the Lord to -- day, The bless -- ed light of God leads on, and on."

[parts.Tenor.lyrics.chorus]
text = "Light of God leads on, bless -- ed light leads on, Yes, to that land of song, that bless -- ed land of song, Light of God leads on, bless -- ed word leads on, Leads to the soul’s bright home, the soul’s e -- ter -- nal home, Fol -- low where He leads, where the Sav -- iour leads And fight a -- gainst the wrong, the wrong, Re -- joic -- ing in the Lord, the Lord to -- day, The bless -- ed light of God leads on, and on."

