[lyrics.1]
text = "In the vine -- yard of the Mas -- ter Is there an -- y work for me? Lord, ac -- cept my grate -- ful serv -- ice, I would be of use to Thee."

[lyrics.2]
text = "I would serve Thee, bless -- ed Je -- sus, At Thy feet I fain would be, Hum -- bly learn -- ing wis -- dom’s les -- son,— I would be of use to Thee."

[lyrics.3]
text = "Win -- ning souls for Thy dear king -- dom; Un -- de -- serv -- ing tho’ I be, Let me ev -- er be found faith -- ful, I would be of use to Thee."

[lyrics.4]
text = "O the joy of such a serv -- ice,— Soon my Mas -- ter’s face I’ll see, Till Thou call’st me, bless -- ed Je -- sus, I would be of use to Thee."

[lyrics.chorus]
text = "I would be of use to Thee, I would be of use to Thee; Lord, ac -- cept my grate -- ful serv -- ice, I would be of use to Thee."

