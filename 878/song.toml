[lyrics.1]
text = """
Is not this the land of Beu -- lah, Bless -- ed, bless -- ed land of light;
Where the flow -- ers bloom for -- ev -- er, And the sun is al -- ways bright?
I am dwell -- ing on the moun -- tain,
Where the gold -- en sun -- light gleams
O’er a land whose won -- drous beau -- ty Far ex -- ceeds my fond -- est dreams.
"""

[lyrics.2]
text = """
I am drink -- ing at the foun -- tain, Where I ev -- er would a -- bide;
