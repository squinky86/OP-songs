[lyrics.1]
text = "I've had a car -- ol in my soul To sing a -- long the way, Since the Re -- deem -- er made me whole One hap -- py, bless -- ed day; The path that leads to glo -- ry land Has not been hard to see, And one has led me by the hand, Since Je -- sus came to me."

[lyrics.2]
text = "I've told the sto -- ry o'er and o'er To oth -- ers lost in sin, I've told them how He doth re -- store And make men pure with -- in; I've found de -- light in help -- ing men The gos -- pel light to see, And praised Him o'er and o'er a -- gain, Since Je -- sus came to me."

[lyrics.3]
text = "I've had my eyes on things a -- bove, Since God has had con -- trol, And I have sung a -- bout His love With free and hap -- py soul; I've faced the gates of pearl and gold, Which some time I shall see, And then the home -- land to be -- hold, Since Je -- sus came to me."

[lyrics.chorus]
