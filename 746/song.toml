[lyrics.1]
text = "There’s a Rose that blooms for me, And this Rose I long to see; It is bloom -- ing now, with a frag -- rance sweet, And it blooms in e -- ter -- ni -- ty."

[lyrics.2]
text = "Love -- ly Rose that blooms for aye, And will with -- er not a -- way; Love -- ly Rose sweet Rose that will al -- ways bloom, And it blooms in e -- ter -- ni -- ty."

[lyrics.3]
text = "O, this Rose I long to see, And like it I hope to be; It is bloom -- ing now on the shores of time, And ’twill bloom thro’ e -- ter -- ni -- ty."

[lyrics.chorus]
text = "There’s a Rose that blooms o’er the sea, And it blooms for you and for me; Love -- ly Rose, sweet Rose, once it bloom’d on earth, Now it blooms in e -- ter -- ni -- ty."
