[lyrics.1]
text = "Twi -- light is steal -- ing o -- ver the sea, Sha -- dows are fall -- ing dark on the lea; Borne on the night winds, voic -- es of yore Come from the far off shore."

[lyrics.2]
text = "Voic -- es of loved ones, songs of the past, Still lin -- ger round me while life shall last; Lone -- ly I wan -- der, sad -- ly I roam, Seek -- ing that far off home."

[lyrics.3]
text = "Come in the twi -- light, come, come to me! Bring -- ing some mes -- sage o -- ver the sea, Cheer -- ing my path -- way while here I roam, Seek -- ing that far off home."

[lyrics.chorus]
text = "Far a -- way be -- yond the star -- lit skies, Where the love- -- light ne -- ver, ne -- ver dies, Gleam -- eth a dwell -- ing, filled with de -- light, Sweet hap -- py home so bright!"
