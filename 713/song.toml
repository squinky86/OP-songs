[lyrics.1]
text = "Sigh not to la -- bor in fields that are wide, @s1 Sure that the Lord will be close to your side, @s2"

[lyrics.2]
text = "God needs a can -- dle as well as the sun, @s1 Right in your cor -- ner the crown may be won, @s2"

[lyrics.3]
text = "Do what you can ev -- ’ry day and be true, @s1 Oh, be as -- sured He will bless all you do; @s2"

[lyrics.chorus]
text = "Work where you are, Work where you are; Just where you live serv -- ice true you may give; Work where you are."

