[lyrics.1]
text = "Lord, speak to me, that I may speak In liv -- ing ech -- oes of Thy tone; As Thou hast sought, so let me seek Thy err -- ing chil -- dren, lost and lone."

[lyrics.2]
text = "O strength -- en me, that while I stand Firm on the Rock, and strong in Thee, I may stretch out a lov -- ing hand To wres -- tlers with the trou -- bled sea."

[lyrics.3]
text = "O teach me, Lord, that I may teach The pre -- cious things Thou dost im -- part; And wing my words, that they may reach The hid -- den depths of many a heart."

[lyrics.4]
text = "O fill me with Thy full -- ness, Lord, Un -- til my ver -- y heart o’er -- flow In kin -- dling tho’t and glow -- ing word, Thy love to tell, Thy praise to show."
