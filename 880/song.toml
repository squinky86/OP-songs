[lyrics.1]
text = ""

[parts.Soprano.lyrics.1]
text = "I’ve found a Friend who is all to me, His love is ev -- er true; I love to tell how He lift -- ed me, And what His grace can do for you."

[lyrics.2]
text = ""

[parts.Soprano.lyrics.2]
text = "He saves me from ev -- ’ry sin and harm, Se -- cures my soul each day; I’m lean -- ing strong on His might -- y arm; I know He’ll guide me all the way."

[lyrics.3]
text = ""

[parts.Soprano.lyrics.3]
text = "When poor and need -- y and all a -- lone, In love He said to me, “Come un -- to Me and I’ll lead you home, To live with Me e -- ter -- nal -- ly.”"

[lyrics.chorus]
text = "Saved by His pow’r di -- vine, Saved to new life sub -- lime! Life now is sweet and my joy is com -- plete, for I’m Saved, saved, saved!"

[parts.Alto.lyrics.chorus]
text = "Saved by His pow’r, by His pow’r di -- vine, Saved to new life, to new life sub -- lime! Life now is sweet and my joy is com -- plete, for I’m Saved, saved, saved!"
