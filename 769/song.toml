[lyrics.1]
text = "Sa -- cred shore! Gal -- i -- lee! Fierce -- ly raged! Dark and wild! Peace be still! Ev -- en me; Je -- sus speaks! Trust in me."

[parts.Soprano.lyrics.1]
text = "Up from the shore of far Gal -- i -- lee, Where the storm raged so dark and wild, Gos -- pel waves roll a mes -- sage to me, Fear not, ’tis I, O, wa -- ver -- ing child."

[lyrics.2]
text = "Where a -- lone, Je -- sus wept! Je -- sus wept! Pros -- trate lay! Ev -- er roll! Here be -- low, Trust His love, Praise His name"

[parts.Soprano.lyrics.2]
text = "Out of Geth -- sem -- ’na’s gar -- den of woe, Where the Lord wept in pain and grief, Gos -- pel waves roll to all here be -- low, Bear -- ing sweet com -- fort, bring -- ing re -- lief."

[lyrics.3]
text = "Earth, be -- hold! Hear Him cry! Won -- drous grace! Bound -- less love! Ev -- er roll! Sound His praise, Might -- y pow’r! Je -- sus reigns."

[parts.Soprano.lyrics.3]
text = "From the dread scene on Cal -- va -- ry’s height, When Je -- sus died the world to save, Gos -- pel waves roll in splen -- dor and might, Roll on in pow’r o’er death and the grave."

[lyrics.chorus]
text = "Ev -- er roll Pow’r and might! O’er the earth! Won -- drous light! Swift -- ly roll! Cal -- v’ry’s stream! He’ll re -- deem, The Lord will re -- deem. re -- deem."

[parts.Soprano.lyrics.chorus]
text = "Gos -- pel waves roll in pow’r and might, Bear o’er the earth the mes -- sage of light, Gos -- pel waves roll on Cal -- v’ry’s stream! Sing, O my soul, The Lord will re -- deem."

[parts.Bass.lyrics.chorus]
text = "Ev -- er roll Pow’r and might! O’er the earth! Won -- drous light! Swift -- ly roll! Cal -- v’ry’s stream! He’ll re -- deem, The Lord will re -- deem."
