[lyrics.1]
text = "O Je -- sus, I have prom -- ised To serve Thee to the end; Be Thou for -- ev -- er near me, My Mas -- ter and my Friend; I shall not fear the bat -- tle If Thou art by my side, Nor wan -- der from the path -- way If Thou wilt be my Guide."

[lyrics.2]
text = "O let me feel Thee near me! The world is ev -- er near; I see the sights that daz -- zle, The tempt -- ing sounds I hear; My foes are ev -- er near me, A -- round me and with -- in; But Je -- sus, draw Thou near -- er, And shield my soul from sin."

[lyrics.3]
text = "O let me hear Thee speak -- ing In ac -- cents clear and still, A -- bove the storms of pas -- sion, The mur -- murs of self will. O speak to re -- as -- sure me, To has -- ten or con -- trol; O speak, and make me lis -- ten, Thou guard -- ian of my soul."

[lyrics.4]
text = "O Je -- sus, Thou hast prom -- ised To all who fol -- low Thee That where Thou art in glo -- ry There shall Thy serv -- ant be. And Je -- sus, I have prom -- ised To serve Thee to the end; O give me grace to fol -- low, My Mas -- ter and my Friend."

[lyrics.5]
text = "O let me see Thy foot -- prints, And in them plant mine own; My hope to fol -- low du -- ly Is in Thy strength a -- lone. O guide me, call me, draw me, Up -- hold me to the end; And then in Heav'n re -- ceive me, My Sav -- ior and my Friend."
