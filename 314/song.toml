[parts.Soprano.lyrics.chorus]
text = "Take Thou my heart, I would be Thine a -- lone; Take Thou my heart, and make it all Thine own. Purge me from sin, O Lord, I now im -- plore, Wash me and keep me Thine for -- ev -- er -- more."

