[lyrics.1]
text = "O won -- der -- ful cit -- y! I long to be there, Thy mar -- vel -- ous glad -- ness and glo -- ry to share; I long for a stroll on thy glo -- ri -- fied shore, With dear ones and friends who have gone on be -- fore."

[lyrics.2]
text = "O won -- der -- ful cit -- y! where pleas -- ures a -- bound, Where sad -- ness and sor -- row and sin are not found! I long to be -- hold thy bright pave -- ments of gold, And walk with the mar -- tyrs and sag -- es of old."

[lyrics.3]
text = "O won -- der -- ful cit -- y! ere long I may see The man -- sion my Lord is pre -- par -- ing for me; Where I shall for -- ev -- er re -- joic -- ing -- ly sing The heav -- en -- ly songs to my glo -- ri -- ous King."

[lyrics.chorus]
text = "O won -- der -- ful cit -- y! O mar -- vel -- ous place, Where I shall be -- hold Him who saves me by grace! For “That will be glo -- ry” and joy ev -- er -- more To see the Re -- deem -- er I love and a -- dore."
