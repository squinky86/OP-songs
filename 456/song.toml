[lyrics.1]
text = "Death holds no ter -- rors for those who are read -- y, Who have pre -- pared for that day; Sweet -- ly they wel -- come the King of all ter -- rors, Bear -- ing them o -- ver the way."

[lyrics.2]
text = "Soon we shall jour -- ney a -- cross the dark riv -- er, Oth -- ers have jour -- neyed be -- fore; Ter -- rors and sor -- rows will van -- ish for -- ev -- er, When the long jour -- ney is o'er."

[lyrics.3]
text = "May we be read -- y when death calls us home -- ward, To the e -- ter -- nal bright shore; Know -- ing that yon -- der in heav -- en with Je -- sus, We shall dwell ev -- _ er -- more."

[lyrics.chorus]
text = "Christ on the oth -- er side, Call -- ing us o -- ver the tide, Bid -- ding us wel -- come to man -- sion's e -- ter -- nal, Who in the soul a -- bide."
