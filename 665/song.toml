[lyrics.1]
text = "Death has called thee, lit -- tle dar -- ling, From our side and earth -- ly home; And we know that thou art wait -- ing For thy dear ones here to come, To be with thee up in heav -- en, With that bright im -- mor -- tal throng; Where we’ll dwell with thee for -- ev -- er, In that hap -- py land of song."

[lyrics.2]
text = "Death has called thee lit -- tle dar -- ling, Called thee in thy ear -- ly bloom; Now thy lit -- tle form is ly -- ing, In the cold and si -- lent tomb, Lit -- tle hands are gent -- ly fold -- ed, Qui -- et now thy dain -- ty feet; Bright -- est eyes are closed for -- ev -- er, Gone are smiles that were so sweet."

[lyrics.3]
text = "“I will wait for you, dear mam -- ma, Some day pa -- pa, you’ll come too; To the realms of joy e -- ter -- nal, For I love you, yes, I do!” Yes, my dar -- ling, we will meet you, In a bright -- er world than this; Won’t that be a hap -- py meet -- ing, In that home of per -- fect bliss!"

[lyrics.chorus]
text = "Sweet -- est, fair -- est, bright -- est flow -- er, love -- ly flow -- er, How we loved thee, none can tell, no one can tell, But we’ll meet thee up in heav -- en up in heav -- en, Where we’ll nev -- er say, “Fare -- well,” no sad fare -- well!"

[parts.Bass.lyrics.chorus]
text = "Sweet -- est, fair -- est, bright -- est flow -- er, love -- ly flow -- er, How we loved thee, none can tell, no one can tell, But we’ll meet thee up in heav -- en up in heav -- en, Where we’ll nev -- er say, “Fare -- well,”"
