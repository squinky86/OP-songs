[lyrics.1]
text = "We read of a place that’s called Hea -- ven, It’s made for the pure and the free; These truths in God’s word He has giv -- en, How beau -- ti -- ful Hea -- ven must be."

[lyrics.2]
text = "In Hea -- ven, no droop -- ing nor pin -- ing, No wish -- ing for else -- where to be; God’s light is for -- ev -- er there shin -- ing, How beau -- ti -- ful Hea -- ven must be."

[lyrics.3]
text = "Pure wa -- ters of life there are flow -- ing, And all who will drink may be free; Rare jew -- els of splen -- dor are glow -- ing, How beau -- ti -- ful Hea -- ven must be."

[lyrics.4]
text = "The an -- gels so sweet -- ly are sing -- ing, Up there by the beau -- ti -- ful sea; The song of re -- demp -- tion is ring -- ing, How beau -- ti -- ful Hea -- ven must be."

[lyrics.chorus]
text = "How beau -- ti -- ful Hea -- ven must be, Sweet home of the hap -- py and free; Fair ha -- ven of rest for the wea -- ry, How beau -- ti -- ful Hea -- ven must be."
