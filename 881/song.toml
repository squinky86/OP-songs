[lyrics.1]
text = "Je -- ru -- sa -- lem, the gold -- en, With milk and hon -- ey blest, Be -- neath thy con -- tem -- pla -- tion Sink heart and voice op -- pressed: I know not, O I know not, What so -- cial joys are there, What ra -- dian -- cy of glo -- ry, What light be -- yond com -- pare."

[lyrics.2]
text = "They stand, those halls of Zi -- on, All ju -- bi -- lant with song, And bright with many an an -- gel, And all the mar -- tyr throng; The Prince is ev -- er in them, The day -- light is se -- rene; The pas -- tures of the bless -- ed Are decked in glo -- rious sheen."

[lyrics.3]
text = "There is the throne of Da -- vid; And there from care re -- leased, The shout of them that tri -- umph, The song of them that feast; And they, who, with their Lead -- er, Have con -- quered in the fight, For -- ev -- er and for -- ev -- er Are clad in robes of white."
