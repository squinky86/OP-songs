[lyrics.1]
text = "Our friends are pass -- ing one by one, In -- to a land un -- known; Yet we are told in God’s own word That they are go -- ing home."

[lyrics.2]
text = "Each year we dec -- o -- rate the mound, O -- ver the ones who’ve fled; The rose you wear on moth -- er’s day, Will it be white or red."

[lyrics.3]
text = "The debt of death our Sav -- ior paid And so you shall and I; He’s gone a -- head, a home He’s made, In realms be -- yond the sky."

[lyrics.chorus]
text = "They’re gone, they’re gone, We will go too; To -- mor -- row He may call for you."

[parts.Alto.lyrics.chorus]
text = "They’re gone, yes, they’re gone with Je -- sus to be, Some day we will all go too; The Spir -- it that calls each mo -- ment for friends, To -- mor -- row may call, may call for you."
