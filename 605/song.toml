[lyrics.1]
text = "O love, sur -- pass -- ing knowl -- edge! O grace, so full and free! I know that Je -- sus loves me, And that’s e -- nough for me."

[lyrics.2]
text = "O won -- der -- ful sal -- va -- tion! From sin He makes me free! I feel the sweet as -- sur -- ance, And that’s e -- nough for me."

[lyrics.3]
text = "O blood of Christ, so pre -- cious, Poured out on Cal -- va -- ry! I feel its cleans -- ing pow -- er, And that’s e -- nough for me."

[lyrics.chorus]
text = "And that’s e -- nough for me! And that’s e -- nough for me! I know that Je -- sus loves me, And that’s e -- nough for me."
