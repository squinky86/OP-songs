[lyrics.1]
text = "Heav -- en is a ho -- ly place, Filled with glo -- ry and with grace, Sin can nev -- er en -- ter there; All with -- in its gates are pure, From de -- fil -- ment kept se -- cure, Sin can nev -- er en -- ter there."

[lyrics.2]
text = "If you hope to dwell at last, When your life on earth is past, In that home so bright and fair; You must here be cleans’d from sin, Have the life of Christ with -- in, Sin can nev -- er en -- ter there."

[lyrics.3]
text = "You may live in sin be -- low, Heav -- en’s grace re -- fuse to know, But you can -- not en -- ter there; It will stop you at the door, Bar you out for -- ev -- er -- more, Sin can nev -- er en -- ter there."

[lyrics.4]
