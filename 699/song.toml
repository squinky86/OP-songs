[lyrics.1]
text = "I’ve wan -- dered far a -- way from God, Now I’m com -- ing home; The paths of sin too long I’ve trod, Lord, I’m com -- ing home."

[lyrics.2]
text = "I’ve wast -- ed ma -- ny pre -- cious years, Now I’m com -- ing home; I now re -- pent with bit -- ter tears, Lord, I’m com -- ing home."

[lyrics.3]
text = "I’m tired of sin and stray -- ing, Lord, Now I’m com -- ing home; I’ll trust Thy love, be -- lieve Thy word, Lord, I’m com -- ing home."

[lyrics.4]
text = "My soul is sick, my heart is sore, Now I’m com -- ing home; My strength re -- new, my hope re -- store, Lord, I’m com -- ing home."

[lyrics.5]
text = "My on -- ly hope, my on -- ly plea, Now I’m com -- ing home; That Je -- sus died, and died for me, Lord, I’m com -- ing home."

[lyrics.6]
text = "I need His cleans -- ing blood I know, Now I’m com -- ing home; O wash me whit -- er than the snow, Lord, I’m com -- ing home."

[lyrics.chorus]
text = "Com -- ing home, com -- ing home, Nev -- er -- more to roam; O -- pen wide Thine arms of love, Lord, I’m com -- ing home."
