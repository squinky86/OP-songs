[lyrics.1]
text = "Speak to my soul, dear Je -- sus, Speak now in ten -- d’rest tone; Whis -- per in lov -- ing kind -- ness, “Thou art not left a -- lone.” O -- pen my heart to hear Thee, Quick -- ly to hear Thy voice, Fill Thou my soul with prais -- es, Let me in Thee re -- joice."

[lyrics.2]
text = "Speak to Thy chil -- dren ev -- er, Lead in the ho -- ly way; Fill them with joy and glad -- ness, Teach them to watch and pray; May they in con -- se -- cra -- tion Yield their whole lives to Thee; Has -- ten Thy com -- ing king -- dom, Till our dear Lord we see."

[lyrics.3]
text = "Speak now as in the old time Thou didst re -- veal Thy will; Let me know all my du -- ty, Let me Thy law ful -- fill. Lead me to glo -- ri -- fy Thee, Help me to show Thy praise, Glad -- ly to do Thy bid -- ding, Hon -- or Thee all my days."

[lyrics.chorus]
