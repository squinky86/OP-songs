[lyrics.1]
text = "“By this sign we con -- quer!” Bless -- ed cross of Christ! Where -- up -- on they nail’d Him, When He was sac -- ri -- ficed."

[lyrics.2]
text = "He for our trans -- gres -- sions Came from heav’n a -- bove, Meek -- ly died to save us, So won -- der -- ful His love."

[lyrics.3]
text = "Scorn’d and bruis’d, for -- sak -- en, Much our Sav -- iour bore, All for our re -- demp -- tion; O what could He do more?"

[lyrics.4]
text = "Great is this sal -- va -- tion! Haste, the sto -- ry tell! By this sign to con -- quer, The cross we love so well."

[lyrics.5]
text = "“By this sign we con -- quer!” Where -- so -- e’er we go; Bear it on your ban -- ner, Till all the na -- tions know:"

[lyrics.chorus]
text = "The cross means love, The cross means love; “By this sign we con -- quer,” The cross that means love; The cross means love, The cross means love; “By this sign we con -- quer,” The cross that means love."
