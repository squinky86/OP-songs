[lyrics.1]
text = """
O heart bowed down with sor -- row! O eyes that long for sight!
There's glad -- ness in be -- liev -- ing; In Je -- sus there is light.
"""

[lyrics.2]
text = """
Earth's fleet -- ing gain and pleas -- ure Can nev -- er sat -- is -- fy:
'Tis love our joy doth meas -- ure, For love can nev -- er die.
"""

[lyrics.3]
text = """
His peace is like a riv -- er, His love is like a song;
His yoke's a bur -- den nev -- er; 'Tis eas -- y all day long.
"""

