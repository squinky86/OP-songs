[lyrics.1]
text = "Sav -- ior, a -- gain to Thy dear name we raise, With one ac -- cord, our part -- ing hymn of praise; We stand to bless Thee ere our wor -- ship cease, Then, low -- ly bow -- ing, wait Thy word of peace."

[lyrics.2]
text = "Grant us Thy peace up -- on our home -- ward way; With Thee be -- gan, with Thee shall end the day; Guard Thou the lips from sin, the hearts from shame, That in this house have called up -- on Thy name."

[lyrics.3]
text = "Grant us Thy peace through -- out our earth -- ly life, Our balm in sor -- row, and our stay in strife; Then, when Thy voice shall bid our con -- flict cease, Call us, O Lord, to Thine e -- ter -- nal peace."
