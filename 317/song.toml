[lyrics.1]
text = "Oh, how well I re -- mem -- ber in the old- -- fash -- ioned days, When some old- -- fash -- ioned peo -- ple had some old- -- fash -- ioned ways; In the old- -- fash -- ioned meet -- ings, as they tar -- ried there, In the old- -- fash -- ioned man -- ner, how God an -- swered their pray'r."

[lyrics.2]
text = "There was sing -- ing, such sing -- ing, of those old- -- fash -- ioned airs! There was pow -- er, such pow -- er in those old- -- fash -- ioned pray'rs, An old- -- fash -- ioned con -- vic -- tion made the sin -- ner pray, And the Lord heard and saved Him, in the old- -- fash -- ioned way."

[lyrics.3]
text = "Well, they say it is bet -- ter, \"Things have changed, don't you know,\" And the peo -- ple in gen' -- ral, seem to think it is so; And they call me old- -- fash -- ioned when I dare to say, That I like it far bet -- ter in the old- -- fash -- ioned way."

[lyrics.4]
text = "If the Lord nev -- er chang -- es, as the fash -- ions of men, If He's al -- ways the same, why, He is old- -- fash -- ioned, then! As an old- -- fash -- ioned sin -- ner saved thro' old- -- time grace, Oh, I'm sure He will take me to an old- -- fash -- ioned place."

[lyrics.chorus]
text = "'Twas an old- -- fash -- ioned meet -- ing, in an old- -- fash -- ioned place, Where some old- -- fash -- ioned peo -- ple had some old- -- fash -- ioned grace: As an old- -- fash -- ioned sin -- ner I prayed and o -- beyed, And God heard me, and saved me in the old- -- fash -- ioned way."

