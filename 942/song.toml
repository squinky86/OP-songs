[lyrics.1]
text = "One step at a time, dear Sav -- ior, I can not take an -- y -- more; The flesh is so weak and hope -- less, I know not what is be -- fore."

[lyrics.2]
text = "One step at a time, dear Sav -- ior, I am not walk -- ing by sight; Keep step with my soul, dear Sav -- ior, I walk by faith in Thy might."

[lyrics.3]
text = "One step at a time, dear Sav -- ior, O guard my fal -- ter -- ing feet! Keep hold of my hand, dear Sav -- ior, Till I my jour -- ney com -- plete."

[lyrics.chorus]
text = "One step at a time, dear Sav -- ior, Till faith grows strong -- er in Thee; One step at a time, dear Sav -- ior, Till hope grows strong -- er in me."

[parts.Tenor.lyrics.chorus]
text = "One step at a time, dear Sav -- ior, Till faith grows strong -- er in Thee; in Thee; One step at a time, dear Sav -- ior, Till hope grows strong -- er in me."

[parts.Bass.lyrics.chorus]
text = "One step at a time, dear Sav -- ior, Till faith grows strong -- er in Thee; in Thee; One step at a time, dear Sav -- ior, Till hope grows strong -- er in me."
