[lyrics.1]
text = "Here we are but stray -- ing pil -- grims; Here our path is oft -- en dim; But to cheer us on our jour -- ney, Still we sing this way -- side hymn:"

[lyrics.2]
text = "Here our feet are oft -- en wea -- ry On the hills that throng our way; Here the tem -- pest dark -- ly gath -- ers, But our hearts with -- in us say:"

[lyrics.3]
text = "Here our souls are oft -- en fear -- ful Of the pil -- grim’s lurk -- ing foe; But the Lord is our De -- fend -- er, And He tells us we may know:"

[lyrics.chorus]
text = "Yon -- der o -- ver the roll -- ing riv -- er, Where the shin -- ing man -- sions rise, Soon will be our home for ev -- er, And the smile of the bless -- èd Giv -- er Glad -- dens all our long -- ing eyes."
