[lyrics.1]
text = "In the sun -- light of His pres -- ence, I would ev -- ’ry mo -- ment live, And in ev -- ’ry word and ac -- tion, Je -- sus, hon -- or, all I’d give!"

[lyrics.2]
text = "In the sun -- light of His pres -- ence, All my bos -- om is at rest, For there are no fears and doubt -- ings, My con -- tent -- ment, to mo -- lest!"

[lyrics.3]
text = "In the sun -- light of His pres -- ence, I can ev -- er go a -- long, Thro’ each try -- ing trib -- u -- la -- tion, Sing -- ing there, a joy -- ful song!"

[lyrics.4]
text = "In the sun -- light of His pres -- ence, There is peace be -- yond com -- pare, Which is mine to claim for -- ev -- er, Ev -- ’ry day and ev -- ’ry -- where!"

[lyrics.chorus]
text = "In the sun -- light, yes, ’tis In the sun -- light, In the sun -- light of His pres -- ence would I stay; In the sun -- light, ev -- er in the sun -- light, In the sun -- light of His pres -- ence all the way!"
