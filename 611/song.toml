[lyrics.1]
text = "There is a foun -- tain filled with blood, Drawn from Im -- man -- uel’s veins; And sin -- ners, plunged be -- neath that flood, Lose all their guilt -- y stains. Lose all their guilt -- y stains, Lose all their guilt -- y stains; And sin -- ners, plunged be -- neath that flood, Lose all their guilt -- y stains."

[lyrics.2]
text = "The dy -- ing thief re -- joiced to see That foun -- tain in his day; And there have I, tho’ vile as he, Washed all my sins a -- way. Washed all my sins a -- way, Washed all my sins a -- way; And there have I, tho’ vile as he, Washed all my sins a -- way."

[lyrics.3]
text = "Thou dy -- ing Lamb, Thy pre -- cious blood Shall nev -- er lose its pow’r, Till all the ran -- somed Church of God Be saved to sin no more. Be saved to sin no more, Be saved to sin no more; Till all the ran -- somed Church of God Be saved to sin no more."

[lyrics.4]
text = "E’er since, by faith, I saw the stream Thy flow -- ing wounds sup -- ply, Re -- deem -- ing love has been my theme, And shall be till I die. And shall be till I die, And shall be till I die; Re -- deem -- ing love has been my theme, And shall be till I die."

[lyrics.5]
text = "And when this fee -- ble, fal -- t’ring tongue Lies si -- lent in the grave, Then, in a no -- bler, sweet -- er song, I’ll sing Thy pow’r to save. I’ll sing Thy pow’r to save, I’ll sing Thy pow’r to save; Then, in a no -- bler, sweet -- er song, I’ll sing Thy pow’r to save."
