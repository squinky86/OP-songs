[lyrics.1]
text = "The night is fast pass -- ing, The day is at hand, day is at hand; We’ve sight -- ed the moun -- tains of Beu -- lah land, Sweet Beu -- lah land."

[lyrics.2]
text = "With harps and with trum -- pets, The glo -- ri -- fied band, glo -- ri -- fied band, Are sound -- ing their wel -- come to Beu -- lah land, Sweet Beu -- lah land."

[lyrics.3]
text = "The Lamb on Mount Zi -- on With nail- -- pierc -- ed hand, nail- -- pierc -- ed hand, Has o -- pened the por -- tals of Beu -- lah land, Sweet Beu -- lah land."

[lyrics.4]
text = "Then sing, wear -- y pil -- grims, You’re near -- ing the strand, near -- ing the strand, Where loved ones a -- wait you in Beu -- lah land, Sweet Beu -- lah land."

[lyrics.chorus]
text = "We’ll say good morn -- ing in glo -- ry, good morn -- ing in glo -- ry, We’ll say good morn -- ing in glo -- ry, When the dark -- ness has turned to day."
