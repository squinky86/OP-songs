[lyrics.1]
text = "All for Je -- sus, all for Je -- sus! All my be -- ing’s ran -- somed pow’rs: All my tho’ts and words and do -- ings, All my days and all my hours. All for Je -- sus! all for Je -- sus! All my days and all my hours; All for Je -- sus! all for Je -- sus! All my days and all my hours."

[lyrics.2]
text = "Let my hands per -- form His bid -- ding, Let my feet run in His ways, Let my eyes see Je -- sus on -- ly, Let my lips speak forth His praise. All for Je -- sus! all for Je -- sus! Let my lips speak forth His praise; All for Je -- sus! all for Je -- sus! Let my lips speak forth His praise."

[lyrics.3]
text = "Since my eyes were fixed on Je -- sus, I’ve lost sight of all be -- side; So en -- chained my spir -- it’s vis -- ion, Look -- ing at the Cru -- ci -- fied. All for Je -- sus! all for Je -- sus! Look -- ing at the Cru -- ci -- fied; All for Je -- sus! all for Je -- sus! Look -- ing at the Cru -- ci -- fied."

[lyrics.4]
text = "O what won -- der! how a -- maz -- ing! Je -- sus, glo -- rious King of kings— Deigns to call me His be -- lov -- ed, Lets me rest be -- neath His wings. All for Je -- sus! all for Je -- sus! Rest -- ing now be -- neath His wings; All for Je -- sus! all for Je -- sus! Rest -- ing now be -- neath His wings."
