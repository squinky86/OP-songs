[lyrics.2]
text = "Thou, bless -- èd Son of God, Hast bought me with Thy blood, Je -- sus, my Lord: O how great is Thy love, All oth -- er loves a -- bove, Love that I dai -- ly prove, Je -- sus, my Lord."

