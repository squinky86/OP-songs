[lyrics.1]
text = "Re -- joice, O pure in heart, Re -- joice, give thanks, and sing; Your fes -- tal ban -- ner wave on high, The cross of Christ your King."

[lyrics.2]
text = "Bright youth and snow- -- crowned age, Both men and wom -- en, Raise on high your free, ex -- ult -- ing song, De -- clare God's won -- drous praise."

[lyrics.3]
text = "Still lift your stan -- dard high, Still chant -- ing as you go, From youth to age, by night and day, In glad -- ness and in woe."

[lyrics.4]
text = "At last the march shall end; The wea -- ried ones shall rest, The pil -- grims reach their home at last, Je -- ru -- sa -- lem the blest."

[lyrics.5]
text = "Praise God, Who reigns on high, The Lord Whom we a -- dore: The Fa -- ther, Son, and Ho -- ly Ghost, One God for -- ev -- er -- more."

[lyrics.chorus]
text = "Re -- joice, re -- joice, re -- joice, give thanks, and sing!"

