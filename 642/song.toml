[lyrics.1]
text = "I nev -- er knew that there could be A friend who tho’t so much of me so much of me That He His head in shame could bow Be -- neath my sin— I know it now. I know it now."

[parts.Soprano.lyrics.1]
text = "I nev -- er knew that there could be A friend who tho’t so much of me That He His head in shame could bow Be -- neath my sin— I know it now."

[parts.Bass.lyrics.1]
text = "I nev -- er knew that there could be A friend who tho’t so much of me so much of me That He His head in shame could bow Be -- neath my sin— I know it now."

[lyrics.2]
text = "I nev -- er knew that one could bear My troub -- le, grief and pain and care; and pain and care; And dai -- ly fill my ev -- ’ry need. I know it now O, yes, in -- deed. O, yes, in -- deed."

[parts.Soprano.lyrics.2]
text = "I nev -- er knew that one could bear My troub -- le, grief and pain and care; And dai -- ly fill my ev -- ’ry need. I know it now O, yes, in -- deed."

[parts.Bass.lyrics.2]
text = "I nev -- er knew that one could bear My troub -- le, grief and pain and care; and pain and care; And dai -- ly fill my ev -- ’ry need. I know it now O, yes, in -- deed."

[lyrics.3]
text = "I nev -- er knew that there would be A home pre -- pared a -- bove for me; a -- bove for me; By One who long my love im -- plored, Yet was for years by me ig -- nored! by me ig -- nored!"

[parts.Soprano.lyrics.3]
text = "I nev -- er knew that there would be A home pre -- pared a -- bove for me; By One who long my love im -- plored, Yet was for years by me ig -- nored!"

