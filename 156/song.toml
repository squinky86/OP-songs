[lyrics.1]
text = "Just to know that Je -- sus loves me With a ten -- der -- ness so great; Noth -- ing ev -- er shall be a -- ble, From His love to sep -- a -- rate."

[lyrics.2]
text = "Just to know He hath for -- giv -- en All my sins of all the years; In the book of life e -- ter -- nal, That my worth -- less name ap -- pears."

[lyrics.3]
text = "Just to know that He is with me, Just to have His prom -- ise true; That He nev -- er will for -- sake me, All my earth -- ly jour -- ney through."

[lyrics.4]
text = "Just to know that up in heav -- en There's a place pre -- pared for me; That a glo -- rious day is com -- ing, When my Sav -- ior I shall see."

[lyrics.chorus]
text = "This is all I need to know, This my cup doth o -- ver -- flow; All things else I can re -- sign, Since I know that Christ is mine!"
