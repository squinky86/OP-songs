[lyrics.1]
text = "I shall not bear the cross thro’ yon cit -- y When the bur -- dens of life are laid down, When I knock on the por -- tals of heav -- en I will trade the old cross for a crown."

[lyrics.2]
text = "Tho’ the cross of -- ten -- times has been heav -- y And oft, for -- tune on me seems to frown But how hap -- py I’ll be o -- ver yon -- der When I trade the old cross for a crown."

[lyrics.3]
text = "Oft, my bark has been tossed on life’s bil -- lows And each wave tried my ves -- sel to drown But no storm- -- cloud can harm me for -- ev -- er When I trade the old cross for a crown."

[lyrics.4]
text = "Ev -- ’ry cross that I bear for my Sav -- ior Will at last, when He calls be laid down And my sor -- rows will all be for -- got -- ten When I trade the old cross for a crown."

[lyrics.chorus]
text = "Yes, I’ll trade the old cross for a crown When the bur -- dens of life are laid down; When the pearl gates for me shall swing o -- pen I will trade the old cross for a crown."

