[lyrics.1]
text = "Je -- sus, keep me near the cross, There a pre -- cious foun -- tain— Free to all, a heal -- ing stream— Flows from Cal -- v’ry’s moun -- tain."

[lyrics.2]
text = "Near the cross, a trem -- bling soul, Love and Mer -- cy found me; There the bright and morn -- ing star Sheds its beams a -- round me."

[lyrics.3]
text = "Near the cross! O Lamb of God, Bring its scenes be -- fore me; Help me walk from day to day, With its shad -- ows o’er me."

[lyrics.4]
text = "Near the cross I’ll watch and wait, Hop -- ing, trust -- ing ev -- er, Till I reach the gold -- en strand, Just be -- yond the riv -- er."

[lyrics.chorus]
text = "In the cross, in the cross, Be my glo -- ry ev -- er; Till my rap -- tured soul shall find Rest be -- yond the riv -- er."
