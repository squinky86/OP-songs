[lyrics.1]
text = "Come home, poor sin -- ner, Why long -- er roam? Thy Sav -- ior’s call -- ing: “Come home, come home.”"

[lyrics.2]
text = "He died to save you On Cal -- va -- ry; Be -- hold what suff -- ering! ’Twas all for thee."

[lyrics.3]
text = "Oh, come to Je -- sus, Do not de -- lay; Come, and He’ll save you, Come while you may."

[lyrics.4]
text = "Oh, come to Je -- sus, He’s wait -- ing still With His sal -- va -- tion Thy soul to fill."

[lyrics.5]
text = "Oh, come to Je -- sus, How can you stay? He’s plead -- ing, plead -- ing, Come, come to -- day."

[lyrics.chorus]
text = "Je -- sus is plead -- ing, He’s in -- ter -- ced -- ing; Yes, plead -- ing, plead -- ing For thee to come; Come home, poor sin -- ner, Come home, come home."
