[lyrics.1]
text = "In the hush of ear -- ly morn -- ing, When the breeze is whis -- p'ring low, There's a voice that gent -- ly calls me, And its ac -- cents well I know; Here I am, O Sav -- ior, wait -- ing, For Thy will a -- lone is mine; This is all my crown and glo -- ry: I am Thine, and on -- ly Thine."

[lyrics.2]
text = "When the noon -- tide falls up -- on me, With its fer -- vid light -- 'ning ray, There's a voice di -- vine -- ly ear -- nest, Bids me work while it is day; O -- pen, Sav -- ior, now be -- fore me All Thy will for me to do; On -- ly help me, watch -- ing, work -- ing, Still to keep my Lord in view."

[lyrics.3]
text = "As the dew -- y shades steal down -- ward O'er the earth at ev' -- ning mild, There's a voice I love that whis -- pers, \"Af -- ter la -- bor, rest, my child;\" O my Sav -- ior, lov -- ing, ten -- der, Help me to ac -- count it blest Thus to work with -- in Thy vine -- yard, Till Thou call -- est me to rest."
