[lyrics.1]
text = "When I need some -- one in time of grief, Some -- one my cheer to be, Je -- sus I choose, for He gives re -- lief, He is the best for me."

[lyrics.2]
text = "When I need some -- one to guide my soul O -- ver the storm -- y sea, Al -- ways to Je -- sus I give con -- trol, He is the best for me."

[lyrics.3]
text = "When I need help to de -- feat the foe, Some -- one my shield to be, Al -- ways to Je -- sus in faith I go, He is the best for me."

[lyrics.4]
text = "When all my tri -- als on earth are o’er, And the dark stream I see, Je -- sus shall bear me to yon -- der shore, He is the best for me."

[lyrics.chorus]
text = "I choose Je -- sus when I need a friend, What I need I know that He will send; I have proved Him, good and true is He; I choose Je -- sus, He is the best for me."
