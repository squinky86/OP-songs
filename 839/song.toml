[lyrics.1]
text = "For all the saints who from their la -- bors rest, Who Thee by faith be -- fore the world con -- fessed, Thy name, O Je -- sus, be for -- ev -- er bless’d: @s1"

[lyrics.2]
text = "Thou wast their Rock, their Fort -- ress and their Might; Thou, Lord, their Cap -- tain in the well- -- fought fight; Thou in the dark -- ness drear their one true Light: @s1"

[lyrics.3]
text = "O may Thy sol -- diers, faith -- ful, true and bold, Fight as the saints who no -- bly fought of old, And win, with them, the vic -- tor’s crown of gold: @s1"

[lyrics.4]
text = "And when the strife is fierce, the war -- fare long, Steals on the ear the dis -- tant tri -- umph- -- song, And hearts are brave a -- gain, and arms are strong: @s1"

[lyrics.5]
text = "The gold -- en eve -- ning bright -- ens in the west, Soon, soon to faith -- ful war -- riors com -- eth rest; Sweet is the calm of Par -- a -- dise the blest: @s1"

[lyrics.6]
text = "But lo! there breaks a yet more glo -- rious day: The saints tri -- um -- phant rise in bright ar -- ray; The King of glo -- ry pass -- es on His way: @s1"

[lyrics.s1]
text = "Hal -- le -- lu -- jah!"

