[lyrics.1]
text = "When Je -- sus comes to re -- ward His ser -- vants, Wheth -- er it be noon or night, Faith -- ful to Him, will He find us watch -- ing, With our lamps all trimmed and bright?"

[lyrics.2]
text = "If at the dawn of the ear -- ly morn -- ing, He shall call us one by one, When to the Lord we re -- store our tal -- ents, Will He an -- swer thee, “Well done?”"

[lyrics.3]
text = "Have we been true to the trust He left us? Do we seek to do our best? If in our hearts there is naught con -- demns us, We shall have a glo -- rious rest."

[lyrics.4]
text = "Bless -- ed are those whom the Lord finds watch -- ing; In His glo -- ry they shall share; If He shall come at the dawn or mid -- night, Will He find us watch -- ing there?"

[lyrics.chorus]
text = "Oh, can we say we are read -- y, broth -- er? Read -- y for the soul’s bright home? Say, will He find you and me still watch -- ing, Wait -- ing, wait -- ing when the Lord shall come?"
