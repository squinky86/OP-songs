[lyrics.1]
text = "In sor -- row I wan -- dered, my spir -- it op -- pressed, But now I am hap -- py— se -- cure -- ly I rest; From morn -- ing till eve -- ning glad car -- ols I sing, And this is the rea -- son— I walk with the King."

[lyrics.2]
text = "For years in the fet -- ters of sin I was bound, The world could not help me— no com -- fort I found; But now like the birds and the sun -- beams of spring, I’m free and re -- joic -- ing— I walk with the King."

[lyrics.3]
text = "O soul near de -- spair in the low -- lands of strife, Look up and let Je -- sus come in -- to your life; The joy of sal -- va -- tion to you He would bring— Come in -- to the sun -- light and walk with the King."

[lyrics.chorus]
text = "I walk with the King, hal -- le -- lu -- jah! I walk with the King, praise His Name! No long -- er I roam, my soul fac -- es home, I walk and I talk with the King."
