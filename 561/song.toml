[lyrics.1]
text = "O would you be num -- bered as one of His fold? Be spot -- less with -- in; Be watch -- ing and wait -- ing that sight to be -- hold, He’s com -- ing a -- gain!"

[lyrics.2]
text = "Not known is the mo -- ment when He shall ap -- pear, To gath -- er them in; The souls who have fol -- lowed Him faith -- ful -- ly here; He’s com -- ing a -- gain!"

[lyrics.3]
text = "The voice of His Spir -- it says, read -- y, then be, O will you be -- gin? If peace in His pres -- ence you hope then to see; He’s com -- ing a -- gain!"

[lyrics.4]
text = "Risk not, an ac -- cept -- ance of Him in that day, All cov -- ered with sin, Be robed and all read -- y, the Spir -- it doth say, He’s com -- ing a -- gain!"

