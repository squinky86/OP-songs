[lyrics.1]
text = "All things praise Thee, Lord most high, Heav’n and earth, and sea and sky; All were for Thy glo -- ry made, That Thy great -- ness, thus dis -- played, Should all wor -- ship bring to Thee; All things praise Thee— Lord, may we!"

[lyrics.2]
text = "All things praise Thee— night to night Sings in si -- lent hymns of light; All things praise Thee— day by day Chants Thy pow’r in burn -- ing ray; Time and space are prais -- ing Thee, All things praise Thee— Lord, may we!"

[lyrics.3]
text = "All things praise Thee, heav’n’s high shrine Rings with mel -- o -- dy di -- vine; Low -- ly bend -- ing at Thy feet, Ser -- aph and arch -- an -- gel meet; This their high -- est bliss, to be Ev -- er prais -- ing— Lord, may we!"
