[lyrics.1]
text = "Sing to me of heav -- en, sing that song of peace, From the toils that bind me it will bring re -- lease; Bur -- dens will be lift -- ed that are press -- ing so, Show -- ers of great bless -- ing o’er my heart will flow."

[lyrics.2]
text = "Sing to me of heav -- en, as I walk a -- lone, Dream -- ing of the com -- rades that so long have gone; In a fair -- er re -- gion, ’mong the an -- gel throng, They are hap -- py as they sing that old, sweet song."

[lyrics.3]
text = "Sing to me of heav -- en, ten -- der -- ly and low, Till the shad -- ows o’er me rise and swift -- ly go; When my heart is wea -- ry, when the day is long, Sing to me of heav -- en, sing that old, sweet song."

[lyrics.chorus]
text = "Sing to me of heav -- en, let me fond -- ly dream Of its gold -- en glo -- ry, of its pearl -- y gleam; Sing to me when shad -- ows of the ev’n -- ing fall, Sing to me of heav -- en, sweet -- est song of all."

[parts.Alto.lyrics.chorus]
text = "Sing to me of heav -- en, let me fond -- ly dream Of its gold -- en glo -- ry, of its pearl -- y gleam; Sing to me when shad -- ows of the ev’n -- ing fall, Sing to me of heav -- en, Sing the sweet -- est song of all."

[parts.Tenor.lyrics.chorus]
text = "Sing to me of heav -- en, let me fond -- ly dream Of its gold -- en glo -- ry, of its pearl -- y gleam; Sing to me when shad -- ows of the ev’n -- ing fall, Sing to me of heav -- en, Sing the sweet -- est song of all."

