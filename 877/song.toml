[lyrics.1]
text = "In weak -- ness, Lord, Thou art our power, In bonds, our per -- fect lib -- er -- ty; Our ref -- uge in temp -- ta -- tion’s hour, In want, our plen -- ti -- ful sup -- ply."

[lyrics.2]
text = "Thou art our for -- tress, rock di -- vine, Our trust and por -- tion, our re -- pose; Our light, in deep -- est gloom to shine, Our strength to quell the proud -- est foes."

[lyrics.3]
text = "Our Com -- fort -- er, O Lord, Thou art, Our rest in toil, our ease in pain; Our balm to heal each brok -- en heart, In storms our peace, in loss our gain."

[lyrics.4]
text = "Our joy, be -- neath the world -- ling’s frown, Our com -- fort, ’midst all grief and thrall; In shame, our glo -- ry and our crown, Our life in death, our all in all."
