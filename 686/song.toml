[lyrics.1]
text = "When your heart is sad From the grief it bears, Do not be dis -- mayed, Je -- sus knows and cares."

[lyrics.2]
text = "When the tempt -- er spreads O’er your way His snares, There’s a hand to save, There is One who cares."

[lyrics.3]
text = "When the might -- y foe Takes you un -- a -- wares, In your deep -- est woe, Je -- sus knows and cares."

[lyrics.4]
text = "In the dark -- est night, Fill the gloom with prayers, Put your trust in Him Je -- sus knows and cares."

[lyrics.chorus]
text = "Je -- sus know and cares Ev -- ’ry sor -- row He shares; When you’re sad He can make you glad, Je -- sus knows and cares."

