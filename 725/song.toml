[lyrics.1]
text = "Throw out the Life -- Line a -- cross the dark wave, There is a broth -- er whom some one should save; Some -- bod -- y’s broth -- er! oh, who then, will dare To throw out the Life -- Line, his per -- il to share?"

[lyrics.2]
text = "Throw out the Life -- Line with hand quick and strong, Why do you tar -- ry, why lin -- ger so long? See! He is sink -- ing, oh, hast -- en to -- day And out with the Life -- Boat, a -- way, then, a -- way!"

[lyrics.3]
text = "Throw out the Life -- Line to dan -- ger- -- fraught men, Sink -- ing in an -- guish where you’ve nev -- er been; Winds of temp -- ta -- tion and bil -- lows of woe, Will soon hurl them out where the dark wa -- ters flow."

[lyrics.4]
text = "Soon will the sea -- son of res -- cue be o’er, Soon will they drift to e -- ter -- ni -- ty’s shore; Haste, then, my broth -- er, no time for de -- lay, But throw out the Life -- Line and save them to -- day."

[lyrics.chorus]
text = "Throw out the Life -- Line! throw out the Life -- Line! Some one is drift -- ing a -- way; Throw out the Life -- Line! throw out the Life -- Line! Some one is sink -- ing to -- day."
