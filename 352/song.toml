[lyrics.1]
text = "Give of your best to the Mas -- ter; Give of the strength of your youth. Throw your soul’s fresh, glow -- ing ar -- dor In -- to the bat -- tle for truth. Je -- sus has set the ex -- am -- ple, Daunt -- less was He, young and brave. Give Him your loy -- al de -- vo -- tion; Give Him the best that you have."

[lyrics.2]
text = "Give of your best to the Mas -- ter; Give Him first place in your heart. Give Him first place in your ser -- vice; Con -- se -- crate ev -- er -- y part. Give, and to you will be giv -- en; God His be -- lov -- ed Son gave. Grate -- ful -- ly seek -- ing to serve Him, Give Him the best that you have."

[lyrics.3]
text = "Give of your best to the Mas -- ter; Naught else is wor -- thy His love. He gave Him -- self for your ran -- som, Gave up His glo -- ry a -- bove. Laid down His life with -- out mur -- mur, You from sin’s ru -- in to save. Give Him your heart’s ad -- o -- ra -- tion; Give Him the best that you have."

[lyrics.chorus]
text = "Give of your best to the Mas -- ter; Give of the strength of your youth. Clad in sal -- va -- tion’s full ar -- mor, Join in the bat -- tle for truth."
