[lyrics.1]
text = "Thine arm, O Lord, in days of old Was strong to heal and save; It tri -- umphed o'er dis -- ease and death, O'er dark -- ness and the grave. To Thee they went, the blind, the dumb, The pal -- sied and the lame, The lep -- er with his taint -- ed life, The sick with fe -- vered frame."

[lyrics.2]
text = "And lo! Thy touch brought life and health, Gave speech, and strength, and sight; And youth re -- newed and fear re -- lieved Owned Thee, the Lord of light; And now, O Lord, be near to bless, Al -- might -- y as of yore, In crowd -- ed street, by rest -- less couch, As by Gen -- nes' -- ret's shore."

[lyrics.3]
text = "Be Thou our great De -- liv' -- rer still, Thou Lord of life and death; Re -- store and quick -- en, soothe and bless, With Thine al -- might -- y breath. To hands that work and eyes that see, Give wis -- dom's heav'n -- ly lore, That whole and sick, and weak and strong, May praise Thee ev -- er -- more."
