[lyrics.1]
text = "I was lost in sin, was bur -- dened and sad, Yet wand’ -- ring from God each day: But I’m safe at last— I’m par -- doned and glad And walk -- ing the gos -- pel way."

[lyrics.2]
text = "Not a friend had I tho’ near -- ing de -- spair, No com -- fort the world could give; Now a friend I have my tri -- als to share And teach me the way to live."

[lyrics.3]
text = "“Glo -- ry to His name!” I’m sing -- ing to -- day, While seek -- ing the home a -- bove Where I hope to sing the a -- ges a -- way, Ex -- tol -- ling His match -- less love."

[lyrics.chorus]
text = "Yes, Je -- sus has found me and is bend -- ing a -- bove, His arms are a -- round me, I’m prais -- ing His love; Safe un -- der the pin -- ions of heav -- en’s own Dove, I’m walk -- ing the gos -- pel way."
