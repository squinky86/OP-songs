[lyrics.1]
text = "Your life is o’er -- shad -- owed with troub -- le, Your spir -- it no more has a song; Good for -- tune no long -- er is with you And ev’ -- ry -- thing seems to go wrong. Look up! there’s a Sav -- ior a -- bove you Who cour -- age and hope would re -- new; In ev’ -- ry dark cloud there is shin -- ing A bright sil -- ver lin -- ing for you."

[parts.Alto.lyrics.1]
text = ""

[parts.Bass.lyrics.1]
text = ""

[lyrics.2]
text = "Old friends have grown cold and de -- part -- ed, Your life is so drear -- y and lone; The cloud that has long been a -- bove you Both dark -- er and larg -- er has grown. Oh, do not de -- spair for a mo -- ment— One Friend who will ev -- er be true; In ev’ -- ry dark cloud there is shin -- ing A bright sil -- ver lin -- ing for you."

[parts.Alto.lyrics.2]
text = ""

[parts.Bass.lyrics.2]
text = ""

[lyrics.3]
text = "Still won -- der -- ful days are be -- fore you, Still glo -- ri -- ous years you may know. Your sky shall be blue and un -- cloud -- ed, Your spir -- it with rapt -- ure shall glow. Look up to the Sav -- ior that loves you, He’ll tell you just what you should do; In ev’ -- ry dark cloud there is shin -- ing A bright sil -- ver lin -- ing for you."

[parts.Alto.lyrics.3]
text = ""

[parts.Bass.lyrics.3]
text = ""

[lyrics.chorus]
text = "Each cloud has a lin -- ing of sil -- ver! Look up! there is One now in view! The light of God’s love thro’ the storm- -- cloud a -- bove Is the lin -- ing of sil -- ver for you."

[parts.Alto.lyrics.chorus]
text = "Each cloud has a lin -- ing of sil -- ver for you Look up! there is One now in view! One in view! The light of God’s love thro’ the storm- -- cloud a -- bove Is the lin -- ing of sil -- ver for you."

[parts.Tenor.lyrics.chorus]
text = "Each cloud has a lin -- ing of sil -- ver for you Look up! there is One now in view! One in view! The light of God’s love thro’ the storm- -- cloud a -- bove Is the lin -- ing of sil -- ver for you."

[parts.Bass.lyrics.chorus]
