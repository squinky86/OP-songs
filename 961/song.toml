[lyrics.1]
text = "Sin -- ners Je -- sus will re -- ceive: Sound this word of grace to all Who the heav’n -- ly path -- way leave, All who lin -- ger, all who fall."

[lyrics.2]
text = "Come, and He will give you rest; Trust Him, for His word is plain; He will take the sin -- ful -- est; Christ re -- ceiv -- eth sin -- ful men."

[lyrics.3]
text = "Now my heart con -- demns me not, Pure be -- fore the law I stand; He who cleansed me from all spot, Sat -- is -- fied its last de -- mand."

[lyrics.4]
text = "Christ re -- ceiv -- eth sin -- ful men, E -- ven me with all my sin; Purged from ev -- ’ry spot and stain, Heav’n with Him I en -- ter in."

[lyrics.chorus]
text = "Sing it o’er and o’er a -- gain; Christ re -- ceiv -- eth sin -- ful men; Make the mes -- sage clear and plain: Christ re -- ceiv -- eth sin -- ful men."

