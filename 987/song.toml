[lyrics.1]
text = "There are days so dark that I seek in vain For the face of my Friend Di -- vine; But tho’ dark -- ness hide, He is there to guide @s1"

[lyrics.2]
text = "There are times, when tired of the toil -- some road, That for ways of the world I pine; But He draws me back to the up -- ward track @s1"

[lyrics.3]
text = "When the way is dim, and I can -- not see Thro’ the mist of His wise de -- sign, How my glad heart yearns and my faith re -- turns @s1"

[lyrics.4]
text = "In the last sad hour, as I stand a -- lone Where the pow -- ers of death com -- bine, While the dark waves roll He will guide my soul @s1"

[lyrics.chorus]
text = "Oh, the touch of His hand on mine, Oh, the touch of His hand on mine! There is grace and pow’r, in the try -- ing hour, In the touch of His hand on mine."

[parts.Alto.lyrics.chorus]
text = "Oh, the touch of His hand on mine, on mine, Oh, the touch of His hand on mine! on mine! There is grace and pow’r, in the try -- ing hour, In the touch of His hand on mine."

[parts.Tenor.lyrics.chorus]
text = "Oh, the touch of His hand on mine, on mine, Oh, the touch of His hand on mine! on mine! There is grace and pow’r, in the try -- ing hour, In the touch of His hand on mine."

[lyrics.s1]
text = "By the touch of His hand on mine."
