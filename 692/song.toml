[lyrics.1]
text = "I would not give my faith in Je -- sus For all the world may give; I would not slight His ten -- der mer -- cies,— With Him I’ll ev -- er live."

[lyrics.2]
text = "I would not spurn the love of Je -- sus, Which thrills my soul each day; For all the world can give in plea -- sure,— He is the liv -- ing way."

[lyrics.3]
text = "I would not give my hope in Je -- sus, To man -- sions in the sky; For all the wealth and all the trea -- sures, This world can ev -- er buy."

