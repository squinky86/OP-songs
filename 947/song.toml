[lyrics.1]
text = "Our day of praise is done, The eve -- ning shad -- ows fall; But pass not from us with the sun, True Light that light -- est all."

[lyrics.2]
text = "A -- round the throne on high, Where night can nev -- er be, The white- -- robed harp -- ers of the sky Bring cease -- less hymns to Thee."

[lyrics.3]
text = "Too faint our an -- thems here, Too soon of praise we tire; But O the strains how full and clear Of that e -- ter -- nal choir!"

[lyrics.4]
text = "’Tis Thine each soul to calm, Each way -- ward tho’t re -- claim, And make our life a dai -- ly psalm Of glo -- ry to Thy name."
