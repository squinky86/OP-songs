[lyrics.1]
text = "When I'm bur -- dened with care and dark clouds of dis -- pair. Hide the beau -- ties of heav -- en a -- bove; I look up thro' God's grace, to the Sav -- ior's sweet face, And re -- joice in His won -- der -- ful love."

[lyrics.2]
text = "By His word I have known of that beau -- ti -- ful home. And by faith I shall reach it some day; So I'll trav -- el a -- long, with a bright cheer -- ful song, Tell -- ing sin -- ners of Christ on my way."

[lyrics.3]
text = "When I'm lone -- ly and sad, and no one makes me glad, While I toil up the hill on life's road; Yet from day un -- to day I will fer -- vent -- ly pray, For my Sav -- ior will car -- ry my load."

[lyrics.4]
text = "When the jour -- ney is o'er, we shall meet on that shore, All the faith -- ful who've toiled here be -- low; And we'll join in the song of the glo -- ri -- fied throng, Sing -- ing prais -- es to Christ ev -- er -- more."

[lyrics.chorus]
text = "He's my ref -- uge and stay as from day un -- to day, I must trav -- el the path -- way of life; There's no friend I can find like the Sav -- ior di -- vine, Who will keep me thro' sor -- row and strife."
