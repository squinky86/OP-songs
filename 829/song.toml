[lyrics.1]
text = "Come, _ let us a -- new Our _ jour -- ney pur -- sue— Roll _ round with the year, And _ nev -- _ -- er stand still till the Mas -- ter ap -- pear; His a -- dor -- a -- ble will Let us glad -- ly ful -- fill, And our tal -- ents im -- prove By the pa -- tience of hope, and the la -- bor of love, By the pa -- tience of hope, and the la -- bor of love."

[lyrics.2]
text = "Our _ life is a dream: Our _ time, as a stream, Glides _ swift -- ly a -- way, And the fu -- _ -- gi -- tive mo -- ment re -- fus -- es to stay; The _ ar -- row is flown, The _ mo -- ment is gone, The mil -- len -- ni -- al year Rush -- es on to our view, and e -- ter -- ni -- ty’s near, Rush -- es on to our view, and e -- ter -- ni -- ty’s near."

[lyrics.3]
text = "O that each, in the day Of His com -- ing, may say, “I have fought my way thro’, I _ have fin -- ished the work Thou didst give me to do!” O that each from his Lord May re -- ceive the glad word, “Well and faith -- ful -- ly done; En -- ter in -- to My joy, and sit down on My throne, En -- ter in -- to My joy, and sit down on My throne!”"
