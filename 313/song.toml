[lyrics.1]
text = "There are ma -- ny trou -- bles that will burst like bub -- bles, There are ma -- ny sha -- dows that will dis -- ap -- pear, When you learn to meet them, with a smile to greet them, For a smile is bet -- ter than a frown or tear."

[lyrics.2]
text = "Tho' the world for -- sake you, joy will o -- ver -- take you, Hope will soon a -- wake you, if you smile to -- day; Don't pa -- rade your sor -- row, wait un -- til to -- mor -- row, For your joy and hope will drive the clouds a -- way."

[lyrics.3]
text = "When the clouds are rain -- ing, don't be -- gin com -- plain -- ing, What the earth is gain -- ing should not make you sad; Do not be a fret -- ter, smil -- ing is much bet -- ter, And a smile will help to make the whole world glad."

[lyrics.chorus]
text = "You can smile when you can't say a word, You can smile when you can -- not be heard, You can smile when its cloud -- y or fair, You can smile a -- ny time, a -- ny -- where."
