[lyrics.1]
text = "O the pre -- cious love of Je -- sus, How it glows and shines with -- in! How it cheers us, how it frees us From the gall -- ing chains of sin!"

[lyrics.2]
text = "In the try -- ing hour of sor -- row Com -- fort it al -- ways im -- parts; Love di -- vine we all may bor -- row Till it o -- ver -- flows our hearts."

[lyrics.3]
text = "Some de -- light -- ful morn in glo -- ry With the hap -- py throng a -- bove, How our souls will tell the sto -- ry Of our Sav -- iour’s pre -- cious love!"

[lyrics.chorus]
text = "Pre -- cious love, pre -- cious love, Theme of all the throng a -- bove! Noth -- ing can be half so pre -- cious As our dear Re -- deem -- er’s love."
