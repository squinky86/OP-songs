[lyrics.1]
text = "God’s won -- der -- ful love is pre -- cious to me, It an -- swers my ev -- er -- y need; ’Tis of -- fered to all, a gift that is free, ’Tis heav -- en -- ly love in -- deed."

[lyrics.2]
text = "God’s won -- der -- ful love flows down like a stream, It comes from the Fa -- ther’s a -- bode; It bright -- ens the soul with ra -- di -- ant gleam, And light -- ens each heav -- y load."

[lyrics.3]
text = "God’s won -- der -- ful love will free you from sin; Trans -- form you in ev -- er -- y way; ’Twill cleanse you with -- out, re -- new you with -- in, Ac -- cept it with -- out de -- lay."

[lyrics.chorus]
text = "Oh, won -- der -- ful love of Je -- sus a -- bove, More pre -- cious than sil -- ver and gold; It’s of -- fered to men in dark -- ness and sin, Its val -- ue can nev -- er be told."
