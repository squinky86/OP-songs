[lyrics.1]
text = "To Ca -- naan’s land I’m on my way, Where the soul (of man) nev -- er dies; My dark -- est night will turn to day, Where the soul (of man) nev -- er dies."

[parts.Soprano.lyrics.1]
text = "To Ca -- naan’s land I’m on my way, Where the soul nev -- er dies; My dark -- est night will turn to day, Where the soul nev -- er dies."

[lyrics.2]
text = "A rose is bloom -- ing there for me, Where the soul (of man) nev -- er dies; And I will spend e -- ter -- ni -- ty, Where the soul (of man) nev -- er dies."

[parts.Soprano.lyrics.2]
text = "A rose is bloom -- ing there for me, Where the soul nev -- er dies; And I will spend e -- ter -- ni -- ty, Where the soul nev -- er dies."

[lyrics.3]
text = "A love- -- light beams a -- cross the foam, Where the soul (of man) nev -- er dies; It shines to light the shores of home, Where the soul (of man) nev -- er dies."

[parts.Soprano.lyrics.3]
