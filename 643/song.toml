[lyrics.1]
text = "My heav’n -- ly home is bright and fair: Nor pain nor death can en -- ter there; Its glitt’ -- ring tow’rs the sun out -- shine, That heav’n -- ly man -- sion shall be mine."

[lyrics.2]
text = "My Fa -- ther’s house is built on high, Far, far a -- bove the star -- ry sky: When from this earth -- ly pris -- on free, That heav’n -- ly man -- sion mine shall be."

[lyrics.3]
text = "Let oth -- ers seek a home be -- low, Which flames de -- vour, or waves o’er -- flow: Be mine the hap -- pier lot to own, A heav’n -- ly man -- sion near the throne."

[lyrics.4]
text = "Then fail the earth, let stars de -- cline, And sun and moon re -- fuse to shine; All na -- ture sink and cease to be, That heav’n -- ly man -- sion stands for me."

[lyrics.chorus]
text = "I’m go -- ing home, I’m go -- ing home, I’m go -- ing home to die no more, To die no more, to die no more, I’m go -- ing home, to die no more."

[parts.Alto.lyrics.chorus]
text = "I’m go -- ing home, I’m go -- ing home, I’m go -- ing home, I’m go -- ing home, I’m go -- ing home, to die no more, to die no more, To die no more, To die no more, to die no more, to die no more. I’m go -- ing home, to die no more. to die no more."

[parts.Tenor.lyrics.chorus]
text = "I’m go -- ing home, I’m go -- ing home, I’m go -- ing home, to die no more, to die no more, To die no more, to die no more. I’m go -- ing home, to die no more. to die no more."

[parts.Bass.lyrics.chorus]
text = "I’m go -- ing home, I’m go -- ing home, I’m go -- ing home, to die no more, To die no more, to die no more. I’m go -- ing home, to die no more."
