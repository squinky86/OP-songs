[lyrics.1]
text = "O for a heart to praise my God, A heart from sin set free; A heart that al -- ways feels the blood So free -- ly shed for me."

[lyrics.2]
text = "A heart re -- signed, sub -- mis -- sive, meek, My great Re -- deem -- er’s throne— Where on -- ly Christ is heard to speak, Where Je -- sus reigns a -- lone."

[lyrics.3]
text = "O for a low -- ly, con -- trite heart, Con -- fid -- ing, true and clean, Which nei -- ther life nor death can part From Him that dwells with -- in."

[lyrics.4]
text = "Thy Spir -- it, gra -- cious Lord, im -- part; Di -- rect me from a -- bove; May Thy dear name be near my heart— That dear, best name is Love."
