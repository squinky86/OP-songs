[lyrics.1]
text = "Je -- sus has loved me— won -- der -- ful Sav -- ior! Je -- sus has loved me, I can -- not tell why; Came He to res -- cue sin -- ners all worth -- less, My heart He con -- quered— for Him I would die."

[lyrics.2]
text = "Je -- sus has saved me— won -- der -- ful Sav -- ior! Je -- sus has saved me, I can -- not tell how; All that I know is, He was my ran -- som, Dy -- ing on Cal -- v'ry with thorns on His brow."

[lyrics.3]
text = "Je -- sus will lead me— won -- der -- ful Sav -- ior! Je -- sus will lead me, I can -- not tell where; But I will fol -- low, thro' joy or sor -- row, Sun -- shine or tem -- pest, sweet peace or des -- pair."

[lyrics.4]
text = "Je -- sus will crown me— won -- der -- ful Sav -- ior! Je -- sus will crown me, I can -- not tell when; White throne of splen -- dor hail I with glad -- ness, Crowned 'mid the plau -- dits of an -- gels and men."

[lyrics.chorus]
text = "Glo -- ry to Je -- sus— won -- der -- ful Sav -- ior! Glo -- ry to Je -- sus, the One I a -- dore; Glo -- ry to Je -- sus— won -- der -- ful Sav -- ior! Glo -- ry to Je -- sus and praise ev -- er -- more."
