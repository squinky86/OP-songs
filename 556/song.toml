[lyrics.1]
text = "With a zeal that is new, I a -- gain would pur -- sue, Here, the course that my Sav -- iour com -- mands; Thro’ the light that shines in, Bright -- er hopes now be -- gin, @s1"

[lyrics.2]
text = "I am now on the road, Lead -- ing home to my God; I am plac -- ing my cause in His hands; It is glad -- ness for me Once a -- gain to be free, @s1"

[lyrics.3]
text = "Let me go far a -- way From that field of dis -- may, Nev -- er -- more to be held by its bands; Thro’ the light that is mine, From the Spir -- it di -- vine, @s1"

[lyrics.chorus]
text = "They had mired my feet, Stayed my prog -- ress so sweet, Here, in heed -- ing my Sav -- iour’s com -- mands; O I praise His great name, That this vic -- t’ry I claim, I am leav -- ing the dan -- ger -- ous sands!"

[lyrics.s1]
text = "I am leav -- ing the dan -- ger -- ous sands!"
