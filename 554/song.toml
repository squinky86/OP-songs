[lyrics.1]
text = "Hark! a thrill -- ing voice is sound -- ing; “Christ is nigh,” it seems to say; “Cast a -- way the works of dark -- ness, O ye chil -- dren of the day!”"

[lyrics.2]
text = "Wak -- ened by the sol -- emn warn -- ing, Let the earth- -- bound soul a -- rise; Christ, her Sun, all sloth dis -- pel -- ling, Shines up -- on the morn -- ing skies."

[lyrics.3]
text = "Lo! the Lamb, so long ex -- pect -- ed, Comes with par -- don down from heav’n; Let us haste, with tears of sor -- row, One and all to be for -- giv’n."

[lyrics.4]
text = "So when next He comes with glo -- ry, Wrap -- ping all the world in fear, May He with His mer -- cy shield us, And with words of love draw near."
