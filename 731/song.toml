[lyrics.1]
text = "Je -- sus loved my soul so well That He came and died for me, Suf -- fered more than tongue can tell, Poured His blood out on the tree, He was will -- ing to be slain, Bear the guilt of all the lost, Took up -- on Him ev -- ’ry sin, Died and paid the aw -- ful cost."

[parts.Alto.lyrics.1]
text = "Je -- sus loved my soul so well That He came and died for me, Suf -- fered more than tongue can tell, Poured His blood out on the tree, the tree, He was will -- ing to be slain, Bear the guilt of all the lost, Took up -- on Him ev -- ’ry sin, Died and paid the aw -- ful cost."

[parts.Tenor.lyrics.1]
text = "Je -- sus loved my soul so well That He came and died for me, Suf -- fered more than tongue can tell, Poured His blood out on the tree, the tree, He was will -- ing to be slain, Bear the guilt of all the lost, Took up -- on Him ev -- ’ry sin, Died and paid the aw -- ful cost."

[lyrics.2]
text = "He was beat -- en bruised and killed And He mur -- mered not a word, Car -- ried His cross up the hill Where they cru -- ci -- fied my Lord; Drove the nails in His dear hands, Put the thorn crown on His head, Pierced His side with cru -- el spears, Scoffed and mocked ’till He was dead."

[parts.Alto.lyrics.2]
text = "He was beat -- en bruised and killed And He mur -- mered not a word, Car -- ried His cross up the hill Where they cru -- ci -- fied my Lord; my Lord; Drove the nails in His dear hands, Put the thorn crown on His head, Pierced His side with cru -- el spears, Scoffed and mocked ’till He was dead."

[parts.Tenor.lyrics.2]
text = "He was beat -- en bruised and killed And He mur -- mered not a word, Car -- ried His cross up the hill Where they cru -- ci -- fied my Lord; my Lord; Drove the nails in His dear hands, Put the thorn crown on His head, Pierced His side with cru -- el spears, Scoffed and mocked ’till He was dead."

[lyrics.3]
text = "Then they laid Him in the tomb, Rolled a stone a -- gainst the door, But He broke the bands of death And the grave held Him no more; He as -- cend -- ed up to God, And He sits there on His throne, In -- ter -- ce -- ding for us all, He can save and He a -- lone."

[parts.Alto.lyrics.3]
text = "Then they laid Him in the tomb, Rolled a stone a -- gainst the door, But He broke the bands of death And the grave held Him no more; no more; He as -- cend -- ed up to God, And He sits there on His throne, In -- ter -- ce -- ding for us all, He can save and He a -- lone."

[parts.Tenor.lyrics.3]
text = "Then they laid Him in the tomb, Rolled a stone a -- gainst the door, But He broke the bands of death And the grave held Him no more; no more; He as -- cend -- ed up to God, And He sits there on His throne, In -- ter -- ce -- ding for us all, He can save and He a -- lone."

[lyrics.chorus]
text = "Oh, how sad was that great day, When my bless -- ed Sav -- ior died, When they crowned His head with thorns When they pierced His side, When they nailed His pre -- cious hands And His feet to the tree, What an aw -- ful death He died, Died for you and me."

[parts.Bass.lyrics.chorus]
text = "Oh how sad was the day When my Sav -- ior died, When they crowned Him with thorns When they pierced His pre -- cious side, When they nailed His hands And His feet to the tree, What an aw -- ful death When He died for me."
