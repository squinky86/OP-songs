[lyrics.1]
text = "Tho’ here to friends we say “Good -- bye,” When earth -- ly life is o’er, In that fair home be -- yond the sky, We’ll meet to part no more."

[lyrics.2]
text = "Where an -- gels sing the glad re -- frain, To Him whom we a -- dore, And where there’s nei -- ther care nor pain, We’ll meet to part no more."

[lyrics.3]
text = "When we have gath -- ered o -- ver there, Up -- on that gold -- en shore, Our lov -- ing friends and dear ones fair, We’ll meet to part no more."

[lyrics.4]
text = "And so, when here we say “Good -- bye,” Let not our hearts be sore, For, where the soul’s pos -- ses -- sions lie, We’ll meet to part no more."

[lyrics.chorus]
text = "We’ll meet to part no more, When earth -- ly life is o’er; In that sweet home where none will roam, We’ll meet to part no more."
