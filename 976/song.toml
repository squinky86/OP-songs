[lyrics.1]
text = "The hand that was nailed to the cross of woe, In love reach -- es down to the world be -- low; ’Tis beck -- on -- ing now to the souls that roam, And point -- ing the way to the heav’n -- ly home."

[lyrics.2]
text = "E’en now I can see, thro’ a mist of tears, That hand still out -- stretched o’er a gulf of years, With heal -- ing and hope for my sin -- sick soul; One touch of its fin -- ger will make me whole."

[lyrics.3]
text = "The hand that wrought won -- ders in days of old Holds treas -- ures more pre -- cious than gems of gold; The price of re -- demp -- tion from sin and shame, The gift of sal -- va -- tion thro’ Je -- sus’ name."

[lyrics.4]
text = "Tri -- um -- phant thro’ grace I shall some day stand, With Je -- sus at home on that gold -- en strand, His face in its beau -- ty at last to see, My hand in the hand that was pierced for me."

[lyrics.chorus]
text = "The hand of my Sav -- ior I see, The hand that was wound -- ed for me: ’Twill lead me in love to the man -- sions a -- bove, The hand that was wound -- ed for me!"

[parts.Alto.lyrics.chorus]
text = "The hand of my Sav -- ior I see, The hand that was wound -- ed for me: ’Twill lead me in love to the man -- sions a -- bove, The hand that was wound -- ed was wound -- ed for me!"

[parts.Tenor.lyrics.chorus]
