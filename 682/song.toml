[lyrics.1]
text = "Nev -- er be a -- shamed of Je -- sus, For the Sin -- ner’s friend is He; And He’s wait -- ing to re -- ceive you, If a Chris -- tian you will be."

[lyrics.2]
text = "Now o -- bey the Sav -- ior’s man -- dates, Turn your face a -- way from sin; Then you’ll stand se -- cure in judge -- ment, And to glo -- ry en -- ter in."

[lyrics.3]
text = "En -- ter now the ship of Zi -- on, It will take you up on high; To the place that’s free from sor -- row, There where pleas -- ures nev -- er die."

