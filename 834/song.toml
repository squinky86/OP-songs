[lyrics.1]
text = "Far and near the fields are teem -- ing With the waves of rip -- ened grain; Far and near their gold is gleam -- ing O’er the sun -- ny slope and plain."

[lyrics.2]
text = "Send them forth with morn’s first beam -- ing, Send them in the noon -- tide’s glare; When the sun’s last rays are gleam -- ing, Bid them gath -- er ev -- ’ry -- where."

[lyrics.3]
text = "O thou, whom thy Lord is send -- ing, Gath -- er now the sheaves of gold; Heav’n -- ward then at eve -- ning wend -- ing, Thou shalt come with joy un -- told."

[lyrics.chorus]
text = "Lord of har -- vest, send forth reap -- ers! Hear us, Lord, to Thee we cry; Send them now the sheaves to gath -- er, Ere the har -- vest- -- time pass by."
