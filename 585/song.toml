[lyrics.1]
text = "Weighed in the bal -- ance of jus -- tice true, Sin -- ful the path thou hast trod; Weighed and found want -- ing— will it be you? Weighed by the word of God."

[lyrics.2]
text = "There it will hurt like a wound -- ing dart When this dread an -- swer shall fall; “Weighed and found want -- ing”— ’twill pierce thy heart At the last judg -- ment call."

[lyrics.3]
text = "Weighed by the Word which is giv -- en now, Search it and know thou art pure; Un -- to its man -- dates in meek -- ness bow, Then thou shalt be se -- cure."

[lyrics.4]
text = "At the tri -- bu -- nal where Christ is judge, Where ev -- ’ry deed is made known, “Weighed and found want -- ing” each guil -- ty soul Stands there be -- fore His throne."

[lyrics.chorus]
text = "Weighed and found want -- ing, Weighed and found want -- ing, Re -- ject -- ed at Heav -- en’s door."
