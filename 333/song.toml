[lyrics.1]
text = "A -- rise, my soul, a -- rise; Shake off thy guilt -- y fears; The bleed -- ing Sac -- ri -- fice In my be -- half ap -- pears: Be -- fore the throne my Sure -- ty stands, Be -- fore the throne my Sure -- ty stands, My name is writ -- ten on His hands."

[lyrics.2]
text = "He ev -- er lives a -- bove, For me to in -- ter -- cede; His all re -- deem -- ing love, His pre -- cious blood, to plead: His blood a -- toned for all our race, His blood a -- toned for all our race, And sprin -- kles now the throne of grace."

[lyrics.3]
text = "Five bleed -- ing wounds He bears; Re -- ceived on Cal -- va -- ry; They pour ef -- fect -- ual prayers; They strong -- ly plead for me: For -- give him, O for -- give, they cry, For -- give him, O for -- give, they cry, Nor let that ran -- somed sin -- ner die!"

[lyrics.4]
text = "The Fa -- ther hears Him pray, His dear A -- noint -- ed One; He can -- not turn a -- way, The pres -- ence of His Son; His Spir -- it an -- swers to the blood, His Spir -- it an -- swers to the blood, And tells me I am born of God."

[lyrics.5]
text = "My God is rec -- on -- ciled; His par -- d'ning voice I hear; He owns me for His child; I can no long -- er fear: With con -- fi -- dence I now draw nigh, With con -- fi -- dence I now draw nigh, And Fa -- ther, Ab -- ba, Fa -- ther, cry."
