[lyrics.1]
text = "On that bright and hap -- py shore, Where we’ll meet to part no more, And we live there ev -- er -- more— meet me there; And with loved ones we will be, In that land be -- yond the sea, And so hap -- py we will be— meet me there."

[lyrics.2]
text = "We shall see our Sav -- ior’s face And our moth -- er we’ll em -- brace, In that hap -- py dwell -- ing place— meet me there; And for -- ev -- er we will dwell, And the strain of mu -- sic swell With the songs we love so well— meet me there,"

[lyrics.3]
text = "Sing the glad and joy -- ful sound, That our Sav -- ior has been found, By the soul that’s heav -- en bound— meet me there; And will stage a gos -- pel fight With the pow’r of truth and right, Go -- ing forth in great de -- light— meet me there."

[lyrics.chorus]
text = "Meet me there, meet me there, Where our loved ones for us wait— meet me there, Meet me there, meet me there. Oh, my broth -- er can you say— meet me there."

[parts.Tenor.lyrics.chorus]
text = "Meet me there, oh meet me there, Where our loved ones for us wait— meet me there, Meet me there, oh meet me there. Oh, my broth -- er can you say— meet me there."

[parts.Bass.lyrics.chorus]
text = "Meet me there, oh meet me there, Where our loved ones for us wait— meet me there, Meet me there, oh meet me there. Oh, my broth -- er can you say— meet me there."
