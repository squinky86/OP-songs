[lyrics.1]
text = "Look -- ing back thro’ the years I can see my dear Lord, As they nailed Him that day to the tree; For the love that He bore me His life blood He poured, When His bod -- y was brok -- en for me."

[lyrics.2]
text = "For my sins and trans -- gres -- sions the dear Sav -- ior died On the cross, died in great ag -- o -- ny; Nails thro’ hands and thro’ feet and the spear thro’ His side, When His bod -- y was brok -- en for me."

[lyrics.3]
text = "The sun with -- drew in sor -- row be -- hind a dark veil, Thus re -- fus -- ing the Lord’s death to see; And the earth tried by quak -- ing His foes to as -- sail, When His bod -- y was brok -- en for me."

[lyrics.4]
text = "Yes, for -- ev -- er and ev -- er His great love was proved, When He suf -- fered on dark Cal -- va -- ry; And the curse of the law was for -- ev -- er re -- moved, When His bod -- y was brok -- en for me."

[lyrics.chorus]
text = "O love be -- yond hu -- man ex -- pres -- sion, Com -- pas -- sion so bound -- less and free; Je -- sus proved His great wealth of af -- fec -- tion, When His bod -- y was brok -- en for me."
