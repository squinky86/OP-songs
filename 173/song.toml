[lyrics.1]
text = "Take my life and let it be con -- se -- crat -- ed, Lord, to thee. Take my mo -- ments and my days; let them flow in end -- less praise."

[lyrics.2]
text = "Take my hands and let them move at the im -- pulse of thy love. Take my feet and let them be swift and beau -- ti -- ful for thee."

[lyrics.3]
text = "Take my voice and let me sing al -- ways, on -- ly, for my King. Take my lips and let them be filled with mes -- sag -- es from thee."

[lyrics.4]
text = "Take my sil -- ver and my gold; not a mite would I with -- hold. Take my in -- tel -- lect and use ev -- ery pow -- er thou shalt choose."

[lyrics.5]
text = "Take my will and make it thine; it shall be no lon -- ger mine. Take my heart, it is thine own; it shall be thy roy -- al throne."

[lyrics.6]
text = "Take my love; my Lord, I pour at thy feet its trea -- sure store. Take my -- self, and I will be ev -- er, on -- ly, all for thee."
