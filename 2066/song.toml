[lyrics.1]
text = "There’s a land be -- yond the riv -- er, That we call the sweet for -- ev -- er; And we on -- ly reach that shore by faith’s de -- cree; One by one we’ll gain the por -- tals, There to dwell with the im -- mor -- tals, When they ring the gold -- en bells for you and me."

[lyrics.2]
text = "We shall know no sin nor sor -- row In that hav -- en of to -- mor -- row; When our barque shall sail be -- yond the sil -- ver sea; We shall on -- ly know the bless -- ing, Of our Fa -- ther’s sweet ca -- ress -- ing, When they ring the gold -- en bells for you and me."

[lyrics.3]
text = "When our days shall know their num -- ber, When in death we sweet -- ly slum -- ber; When the King com -- mands the spir -- it to be free; Nev -- er -- more with an -- guish la -- den, We shall reach that love -- ly aid -- en, When they ring the gold -- en bells for you and me."

[lyrics.chorus]
text = "Don’t you hear the bells now ring -- ing? Don’t you hear the an -- gels sing -- ing? ’Tis the glo -- ry hal -- le -- lu -- jah jub -- i -- lee, In that far off sweet for -- ev -- er, just be -- yond the shin -- ing riv -- er, Where they ring the gold -- en bells for you and me."

[parts.Alto.lyrics.chorus]
text = "Don’t you hear the bells now ring -- ing? Don’t you hear the an -- gels sing -- ing? ’Tis the glo -- ry hal -- le -- lu -- jah jub -- i -- lee, jub -- i -- lee, In that far off sweet for -- ev -- er, just be -- yond the shin -- ing riv -- er, Where they ring the gold -- en bells for you and me."

[parts.Tenor.lyrics.chorus]
text = "Don’t you hear the bells now ring -- ing? Don’t you hear the an -- gels sing -- ing? ’Tis the glo -- ry hal -- le -- lu -- jah jub -- i -- lee, jub -- i -- lee, In that far off sweet for -- ev -- er, just be -- yond the shin -- ing riv -- er, Where they ring the gold -- en bells for you and me."
