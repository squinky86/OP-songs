[lyrics.1]
text = "The day Thou gav -- est, Lord, is end -- ed, The dark -- ness falls at Thy be -- hest; To Thee our morn -- ing hymns as -- cend -- ed, Thy praise shall hal -- low now our rest."

[lyrics.2]
text = "We thank Thee that Thy Church, un -- sleep -- ing, While earth rolls on -- ward in -- to light, Thro’ all the world her watch is keep -- ing, And rests not now by day or night."

[lyrics.3]
text = "The sun that bids us rest is wak -- ing Our breth -- ren ’neath the west -- ern sky; And hour by hour fresh lips are mak -- ing Thy won -- drous do -- ings heard on high."

[lyrics.4]
text = "So be it, Lord: Thy throne shall nev -- er, Like earth’s proud em -- pires, pass a -- way; But stand and rule and grow for -- ev -- er, Till all Thy crea -- tures own Thy sway."
