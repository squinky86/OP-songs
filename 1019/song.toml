[lyrics.1]
text = "I have giv -- en my life to Je -- sus, He has trav’led _ the road be -- fore; I will choose what my Lord has chos -- en, I be -- long to my -- self no more."

[lyrics.2]
text = "I have giv -- en my life to Je -- sus, It is sweet to be -- long to Him; It is bless -- ed to trust His guid -- ing, When the way that I walk is dim."

[lyrics.3]
text = "I have giv -- en my life to Je -- sus, And my all at His feet I pour; I have giv -- en my life to Je -- sus, I be -- long to my -- self no more."

