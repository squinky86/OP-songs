[lyrics.1]
text = "While shep -- herds kept their watch -- ing O’er si -- lent flocks by night, Be -- hold, through -- out the heav -- ens There shone a ho -- ly light."

[lyrics.2]
text = "The shep -- herds feared and trem -- bled, When lo! a -- bove the earth Rang out the an -- gel cho -- rus That hailed the Sav -- ior’s birth."

[lyrics.3]
text = "And lo, when they had seen it, They all bowed down and prayed; They trav -- elled on to -- geth -- er To where the babe was laid."

[lyrics.4]
text = "They trav -- elled on to -- geth -- er To where the Babe was raised. And lo, when they had seen Him, They re -- turned home and praised."

[lyrics.5]
text = "Down in a low -- ly man -- ger The hum -- ble Christ was born, And God sent us sal -- va -- tion That bless -- ed Christ -- mas morn."

[lyrics.chorus]
text = "Go, tell it on the moun -- tain, O -- ver the hills and ev -- 'ry -- where; Go, tell it on the moun -- tain, That Je -- sus Christ is born."

