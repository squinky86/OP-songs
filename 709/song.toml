[lyrics.1]
text = "Some -- time the shad -- ows will be gone, Some -- time will come the gold -- en dawn, Some -- time I’ll lift mine eyes and see The man -- sions He’s pre -- pared for me."

[lyrics.2]
text = "Some time I’ll meet my friends a -- gain, For -- ev -- er safe from death and pain, With my dear Sav -- ior I shall be In man -- sions He’s pre -- pared for me."

[lyrics.3]
text = "Oh, grace di -- vine! oh, love un -- told! Oh, crowns of life! oh, harps of gold! My wel -- come will be glad and free In man -- sions He’s pre -- pared for me."

[lyrics.chorus]
text = "Oh, gold -- en time, oh, hap -- py day, Oh, pre -- cious home not far a -- way; What won -- drous joy when I shall see The man -- sion He’s pre -- pared for me."

