[lyrics.1]
text = "Won -- der -- ful grace of Je -- sus, Great -- er than all my sin— How shall my tongue de -- scribe it? Where shall His praise be -- gin? Tak -- ing a -- way my bur -- den, Set -- ting my spir -- it free; For the won -- der -- ful grace of Je -- sus reach -- es me."

[lyrics.2]
text = "Won -- der -- ful grace of Je -- sus, Reach -- ing to all the lost— By it I have been par -- doned, Saved to the ut -- ter -- most. Chains have been torn a -- sun -- der, Giv -- ing me lib -- er -- ty; For the won -- der -- ful grace of Je -- sus reach -- es me."

[lyrics.3]
text = "Won -- der -- ful grace of Je -- sus, Reach -- ing the most de -- filed— By its trans -- form -- ing pow -- er Mak -- ing him God’s dear child, Pur -- chas -- ing peace and heav -- en For all e -- tern -- i -- ty; And the won -- der -- ful grace of Je -- sus reach -- es me."

[lyrics.chorus]
text = "Won -- der -- ful the match -- less grace the match -- less grace of Je -- sus, Deep -- er than the might -- y roll -- ing sea! the roll -- ing sea! Won -- der -- ful grace, all suf -- fi -- cient for me, for ev -- en me! Broad -- er than the scope of my trans -- gres -- sions, Great -- er far than all my sin and shame! O mag -- ni -- fy the pre -- cious name of Je -- sus! Praise His name!"

# Men's refrain: independent words and rhythm, m17-m28; they rejoin the women's
# text at m29. "Spark -- ing" is the plate's spelling (received text: "Spark -- ling").
[parts.Tenor.lyrics.chorus]
text = "Won -- der -- ful the match -- less grace of Je -- sus, Deep -- er than the might -- y roll -- ing sea! High -- er than the mount -- ain, Spark -- ing like a fount -- ain, All suf -- fi -- cient grace for e -- ven me! Broad -- er than the scope of my trans -- gres -- sions, sing it! Great -- er far than all my sin and shame! my sin and shame! O mag -- ni -- fy the pre -- cious name of Je -- sus! Praise His name!"

[parts.Bass.lyrics.chorus]
text = "Won -- der -- ful the match -- less grace of Je -- sus, Deep -- er than the might -- y roll -- ing sea! High -- er than the mount -- ain, Spark -- ing like a fount -- ain, All suf -- fi -- cient grace for e -- ven me! Broad -- er than the scope of my trans -- gres -- sions, sing it! Great -- er far than all my sin and shame! my sin and shame! O mag -- ni -- fy the pre -- cious name of Je -- sus! Praise His name!"
