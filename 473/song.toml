[lyrics.1]
text = "Hear us, heav’n -- ly Fa -- ther, Thou whose gen -- tle care Tends the young and fee -- ble, Hear our sim -- ple pray’r! Hear our pray’r! Fa -- ther, hear!"

[lyrics.2]
text = "Par -- don our of -- fens -- es; Guard us from all ill; Make us, like true chil -- dren, Love Thy ho -- ly will. Hear our pray’r! Fa -- ther, hear!"

[lyrics.3]
text = "Let not sin be -- guile us From Thy paths to stray; But with Thy great mer -- cy Keep us night and day. Hear our pray’r! Fa -- ther, hear!"
