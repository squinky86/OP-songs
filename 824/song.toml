[lyrics.1]
text = "Be -- fore Je -- ho -- vah’s awe -- some throne, Ye na -- tions, bow with sa -- cred joy; Know that the Lord is God a -- lone, He can cre -- ate and He de -- stroy."

[lyrics.2]
text = "His sov -- ’reign pow’r, with -- out our aid, Made us of clay, and formed us men; And when like wand -- ’ring sheep we strayed, He brought us to His fold a -- gain."

[lyrics.3]
text = "We are His peo -- ple, we His care— Our souls, and all our mor -- tal frame; What last -- ing hon -- ors shall we rear, Al -- might -- y Mak -- er, to Thy name?"

[lyrics.4]
text = "Wide as the world is Thy com -- mand, Vast as e -- ter -- ni -- ty Thy love; Firm as a rock Thy truth shall stand, When roll -- ing years shall cease to move."
