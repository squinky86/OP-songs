[lyrics.1]
text = "You can -- not hide from God, Tho' moun -- tains cov -- er you, His eye our se -- cret thoughts be -- holds, His mer -- cies all our lives en -- fold, He knows our pur -- pos -- es un -- told, You can -- not hide from God."

[lyrics.2]
text = "You can -- not hide from God, No mat -- ter what you do, He meets you at life's ev -- 'ry turn, He knows your tho'ts that blight and burn, He weeps when His own Son you spurn, You can -- not hide from God."

[lyrics.3]
text = "You can -- not hide from God, Tho' qui -- et -- ly you go, He notes your foot -- steps ere they fall, He hears your si -- lent heart -- ful call, His knowl -- edge rules high o -- ver all, You can -- not hide from God."

[lyrics.4]
text = "You can -- not hide from God, This one thing you can do, If you would save your sin -- ful soul, If you would be made pure and whole, If you would reach the high -- est goal, Your soul must hide in God."

[lyrics.chorus]
text = "You can -- not hide from God, You can -- not hide from God, Wher -- ev -- er you go, What -- ev -- er you do, You can -- not hide from God, His eye is fixed on you, You can -- not hide from God."
