[lyrics.1]
text = "Hold Thou my hand, so weak I am, and help -- less, I dare not take one step with -- out Thine aid; Hold Thou my hand, for then, O lov -- ing Sav -- ior, No dread of ill shall make my soul a -- fraid."

[lyrics.2]
text = "Hold Thou my hand, and clos -- er, clos -- er draw me To Thy dear self— my hope, my joy, my all; Hold Thou my hand, lest hap -- ly I should wan -- der; And, miss -- ing Thee, my trem -- bling feet shall fall."

[lyrics.3]
text = "Hold Thou my hand, the way is dark be -- fore me With -- out the sun -- light of Thy face di -- vine; But when by faith I catch its ra -- diant glo -- ry, What heights of joy, what rap -- t’rous songs are mine!"

[lyrics.4]
text = "Hold Thou my hand, that when I reach the mar -- gin Of that lone riv -- er Thou didst cross for me, A heav’n -- ly light may flash a -- long its wa -- ters, And ev’ -- ry wave like crys -- tal bright shall be."
