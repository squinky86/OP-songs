[lyrics.1]
text = "Hark! ’tis the Shep -- herd’s voice I hear Out in the des -- ert dark and drear, Call -- ing the sheep who’ve gone a -- stray Far from the Shep -- herd’s fold a -- way."

[lyrics.2]
text = "Who’ll go and help this Shep -- herd kind, Help Him the wan -- d’ring ones to find? Who’ll bring the lost ones to the fold, Where they’ll be shel -- tered from the cold?"

[lyrics.3]
text = "Out in the des -- ert hear their cry, Out on the mount -- ains wild and high; Hark! ’tis the Mas -- ter speaks to thee, “Go find My sheep wher -- e'er they be.”"

[lyrics.chorus]
text = "Bring them in, Bring them in, Bring them in from the fields of sin! Bring them in, Bring them in, Bring the lit -- tle ones to Je -- sus."

[parts.Bass.lyrics.chorus]
text = "Bring them in, Bring them in, Bring them in from the fields of sin! fields of sin! Bring them in, Bring them in, Bring the lit -- tle ones to Je -- sus."

[parts.Soprano.lyrics.chorus]
text = "Bring them in, (Bring them in,) Bring them in, (Bring them in,) Bring them in from the fields of sin! Bring them in, (Bring them in,) Bring them in, (Bring them in,) Bring the lit -- tle ones to Je -- sus."
