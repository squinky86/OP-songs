[lyrics.1]
text = "Be not a -- wea -- ry, for la -- bor will cease Some glad morn -- ing; Tur -- moil will change in -- to in -- fi -- nite peace, Some bright morn -- ing."

[lyrics.2]
text = "Wea -- ri -- some bur -- dens will all be laid down, Some glad morn -- ing; Then shall our cross be ex -- changed for a crown, Some bright morn -- ing."

[lyrics.3]
text = "La -- bor well done will re -- ceive its re -- ward, Some glad morn -- ing; Those who are faith -- ful shall be with the Lord, Some bright morn -- ing."

[lyrics.4]
text = "O what a time of re -- joic -- ing will come, Some glad morn -- ing; When all the ran -- somed are gath -- ered at home, Some bright morn -- ing."

[lyrics.5]
text = "There with the loved ones who’ve gone on be -- fore, Some glad morn -- ing; We shall sing praise to the Lamb ev -- er -- more, Some bright morn -- ing."

[lyrics.chorus]
text = "Some bright morn -- ing, some glad morn -- ing, When the sun is shin -- ing in th’e -- ter -- nal sky; Some bright morn -- ing, some glad morn -- ing, We shall see the Lord of Har -- vest, By and by."
