[lyrics.1]
text = "O -- ver the o -- cean there com -- eth a cry, “Send us the light, send the light; Need -- y and help -- less we per -- ish and die, Send us the light, send the light; Come with your mes -- sage of love o’er the wave, Tell us of Je -- sus, the might -- y to save, Tell how He tri -- umphed o’er sin and the grave, Send us the light, send the light.”"

[lyrics.2]
text = "“Here in the dark -- ness and shad -- ow we grope, Send us the light, send the light; Seek -- ing for light and the com -- fort of hope, Send us the light, send the light; Mill -- ions there are who have nev -- er been told Aught of the won -- der -- ful sto -- ry of old, Aught of the beau -- ti -- ful ci -- ty of gold, Send us the light, send the light.”"

[lyrics.3]
text = "“You who have com -- forts e -- nough and to spare, Send us the light, send the light; You who have known the most boun -- ti -- ful care, Send us the light, send the light; Yours is the du -- ty, to you we ap -- peal, Give of your trea -- sure, your knowl -- edge re -- veal, Tell us of Him who can com -- fort and heal, Send us the light, send the light.”"

[lyrics.4]
text = "Still comes the cry with its bur -- den of tears, “Send us the light, send the light”; Melt -- ing our hearts and un -- lock -- ing our ears, “Send us the light, send the light”; Mas -- ter, for -- give us the long sor -- did past, Out of our self -- ish -- ness lift -- ed at last, May we be ev -- er, where life’s lot is cast, Bear -- ers of light, bear -- ing light."
