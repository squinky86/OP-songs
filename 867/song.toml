[lyrics.1]
text = "If the name of the Sav -- ior is pre -- cious to you, If His care has been con -- stant and ten -- der and true, If the light of His pres -- ence has bright -- ened your way, O will you not tell of your glad -- ness to -- day?"

[lyrics.2]
text = "If your faith in the Sav -- ior has bro’t its re -- ward, If a strength you have found in the strength of your Lord, If the hope of a rest in His pal -- ace is sweet, O will you not, broth -- er, the sto -- ry re -- peat?"

[lyrics.3]
text = "If the souls all a -- round you are liv -- ing in sin, If the Mas -- ter has told you to bid them come in, If the sweet in -- vi -- ta -- tion they nev -- er have heard, O will you not tell them the cheer- -- bring -- ing word?"

[lyrics.chorus]
text = "O will you not will you not tell it to -- day? Will you not will you not tell it to -- day? If the light of His pres -- ence has bright -- ened your way, O will you not tell it to -- day?"

