[lyrics.1]
text = "When the south- -- wind, soft -- ly blow -- ing, Gen -- tly sweeps the qui -- et sea, Then I leave my tent -- ed dwell -- ing, Go -- ing to Geth -- sem -- a -- ne. There I bow in med -- i -- ta -- tion, ’Neath the shade where ol -- ives grow, Think -- ing of the “Man of Sor -- rows,” Kneel -- ing here so long a -- go."

