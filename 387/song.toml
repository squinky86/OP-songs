[lyrics.1]
text = "I need Thee ev -- ery hour, most gra -- cious Lord; No ten -- der voice like Thine can peace af -- ford."

[lyrics.2]
text = "I need Thee ev -- ery hour, stay Thou near -- by; Temp -- ta -- tions lose their power when Thou art nigh."

[lyrics.3]
text = "I need Thee ev -- ery hour, in joy or pain; Come quick -- ly and a -- bide, or life is vain."

[lyrics.4]
text = "I need Thee ev -- ery hour; teach me Thy will; And Thy rich prom -- is -- es in me ful -- fill."

[lyrics.5]
text = "I need Thee ev -- ery hour, most Ho -- ly One; O make me Thine in -- deed, Thou bless -- èd Son."

[lyrics.chorus]
text = "I need Thee, O I need Thee; Ev -- ery hour I need Thee; O bless me now, my Sav -- ior, I come to Thee."
