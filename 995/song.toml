[lyrics.1]
text = "When all Thy mer -- cies, O my God, My ris -- ing soul sur -- veys, Trans -- port -- ed with the view, I’m lost In won -- der, love, and praise."

[lyrics.2]
text = "Un -- num -- bered com -- forts on my soul Thy ten -- der care be -- stowed, Be -- fore my in -- fant heart con -- ceived From whom those com -- forts flowed."

[lyrics.3]
