[lyrics.1]
text = "I am re -- solved no long -- er to lin -- ger, Charmed by the world’s de -- light, Things that are high -- er, things that are nob -- ler, These have al -- lured my sight."

[lyrics.2]
text = "I am re -- solved to go to the Sav -- ior, Leav -- ing my sin and strife; He is the true One, He is the just One, He hath the words of life."

[lyrics.3]
text = "I am re -- solved to fol -- low the Sav -- ior, Faith -- ful and true each day; Heed what He say -- eth, do what He will -- eth, He is the liv -- ing Way."

[lyrics.4]
text = "I am re -- solved to en -- ter the king -- dom Leav -- ing the paths of sin; Friends may op -- pose me, foes may be -- set me, Still will I en -- ter in."

[lyrics.5]
text = "I am re -- solved, and who will go with me? Come, friends, with -- out de -- lay, Taught by the Bi -- ble, led by the Spir -- it, We’ll walk the heav’n -- ly way."

