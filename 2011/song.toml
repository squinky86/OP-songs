[lyrics.1]
text = "Why do you wait, dear broth -- er, Oh, why do you tar -- ry so long? Your Sav -- ior is wait -- ing to give you A place in His sanc -- ti -- fied throng."

[lyrics.2]
text = "What do you hope, dear broth -- er, To gain by a fur -- ther de -- lay? There’s no one to save you but Je -- sus, There’s no oth -- er way but His way."

[lyrics.3]
text = "Do you not feel, dear broth -- er, His Spir -- it now striv -- ing with -- in? O why not ac -- cept His sal -- va -- tion, And throw off thy bur -- den of sin?"

[lyrics.4]
text = "Why do you wait, dear broth -- er? The har -- vest is pass -- ing a -- way; Your Sav -- ior is long -- ing to bless you, There’s dan -- ger and death in de -- lay."

[lyrics.chorus]
text = "Why not? why not? Why not come to Him now? Why not? why not? Why not come to Him now?"
