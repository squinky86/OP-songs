[lyrics.1]
text = "Night, with e -- bon pin -- ion, Brood -- ed o’er the vale; All a -- round was si -- lent, Save the night wind’s wail, When Christ, the Man of Sor -- rows, In tears and sweat and blood, Pros -- trate in the gar -- den, Raised His voice to God."

[lyrics.2]
text = "Smit -- ten for of -- fens -- es Which were not His own, He, for our trans -- gres -- sions, Had to weep a -- lone; No friend with words to com -- fort, Nor hand to help was there, When the Meek and Low -- ly Humb -- ly bowed in pray’r."

[lyrics.3]
text = "Ab -- ba, Fa -- ther, Fa -- ther, If in -- deed it may, Let this cup of an -- guish, Pass from Me, I pray. Yet, if it must be suf -- fered, By Me, Thine on -- ly Son, Ab -- ba, Fa -- ther, Fa -- ther, Let Thy will be done."
