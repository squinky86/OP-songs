[lyrics.1]
text = "Some day the sil -- ver cord will break, (the cord will break,) And I no more as now will sing; (as now will sing;) But O the joy when I shall wake, (when I shall wake,) With -- in the pal -- ace of the King!"

[parts.Bass.lyrics.1]
text = "Some day the sil -- ver cord will break, And I no more as now will sing; But O the joy when I shall wake, With -- in the pal -- ace of the King!"

[lyrics.2]
text = "Some day my earth -- ly house will fall, (the house will fall,) I can not tell how soon ’twill be; (how soon ’twill be;) But this I know my All in All, (my All in All,) Has now a place in heav’n for me!"

[parts.Bass.lyrics.2]
text = "Some day my earth -- ly house will fall, I can not tell how soon ’twill be; But this I know my All in All, Has now a place in heav’n for me!"

[lyrics.3]
text = "Some day; till then I’ll watch and wait, (I’ll watch and wait,) My lamp all trimmed and burn -- ing bright; (and burn -- ing bright;) That when my Sav -- iour ope’s the gate, (the gold -- en gate,) My soul to heav’n may take its flight!"

[parts.Bass.lyrics.3]
text = "Some day; till then I’ll watch and wait, My lamp all trimmed and burn -- ing bright; That when my Sav -- iour ope’s the gate, My soul to heav’n may take its flight!"

[lyrics.chorus]
text = "I’ll see my Sav -- iour face to face; yes, face to face; And tell the sto -- ry, “saved by grace! yes, saved by grace!” Yes, I shall see Him face to face, yes, face to face, And tell the sto -- ry, “saved by grace!”"

[parts.Soprano.lyrics.chorus]
text = "I’ll see my Sav -- iour face to face; And tell the sto -- ry, “saved by grace!” Yes, I shall see Him face to face, And tell the sto -- ry, “saved by grace!”"

