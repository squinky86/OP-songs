[lyrics.1]
text = "I would be true, for there are those who trust me; I would be pure, for there are those who care; I would be strong, for there is much to suf -- fer; I would be brave, for there is much to dare; I would be brave, for there is much to dare."

[lyrics.2]
text = "I would be friend of all— the foe, the friend -- less; I would be giv -- ing, and for -- get the gift; I would be hum -- ble, for I know my weak -- ness; I would look up, and laugh, and love and lift. I would look up, and laugh, and love and lift."

[lyrics.3]
text = "I would be faith -- ful through each pass -- ing mo -- ment; I would be con -- stant -- ly in touch with God; I would be strong to fol -- low where He leads me; I would have faith to keep the path Christ trod; I would have faith to keep the path Christ trod."

[lyrics.4]
text = "Who is so low that I am not his broth -- er? Who is so high that I've no path to him? Who is so poor, that‿I may not feel his hun -- ger? Who is so rich I may not pit -- y him? Who is so rich I may not pit -- y him?"

[lyrics.5]
text = "Who is so hurt I may not know his heart -- ache? Who sings for joy my heart may nev -- er share? Who in God's heav'n has passed be -- yond my vi -- sion? Who to Hell's depths where I may nev -- er fare? Who to Hell's depths where I may nev -- er fare?"

[lyrics.6]
text = "May none, then, call on me for un -- der -- stand -- ing, May none, then, turn to me for help in pain, And drain a -- lone his bit -- ter cup of sor -- row, Or find he knocks up -- on my heart in vain. Or find he knocks up -- on my heart in vain."
