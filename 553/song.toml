[lyrics.1]
text = "Is Christ crowd -- ed out of your bus -- y life With the toil -- ing that each day brings? With the strain and stress of the cares that press You’ve no time for the King of kings."

[lyrics.2]
text = "“No room in the inn” for the Christ- -- Child blest, “In a man -- ger so low He lay;” In the hearts of men o’er and o’er a -- gain, There’s no room for Him still to -- day."

[lyrics.3]
text = "“The fox -- es have holes and the birds have nests But no -- where for His head di -- vine Had the Son of man,” should He come a -- gain Find a place in your heart and mine."

[lyrics.4]
text = "The hearts of the ones whom He died to save Is the home which He seeks to -- day; By His life bought yet He is crowd -- ed out, And “a -- way with Him,” still they say."

[lyrics.5]
text = "There’s com -- ing a day in the great some -- time If for Christ you have nev -- er room, You will knock and wait at the pearl -- y gate, Crowd -- ed out there will be your doom."

[lyrics.chorus]
text = "Crowd -- ed out! crowd -- ed out! You’ve no time for His serv -- ice, you say; While for pleas -- ure and busi -- ness you al -- ways have time, Is Christ crowd -- ed out to -- day?"
