[lyrics.1]
text = "We would see Je -- sus— for the shad -- ows length -- en A -- cross the lit -- tle land -- scape of our life; We would see Je -- sus, our weak faith to strength -- en, For the last wear -- i -- ness, the fi -- nal strife."

[lyrics.2]
text = "We would see Je -- sus— the great Rock foun -- da -- tion, On which our feet were set with sov -- ereign grace; Nor life, nor death, with all their ag -- i -- ta -- tion, Can thence re -- move us, if we see His face."

[lyrics.3]
text = "We would see Je -- sus— this is all we’re need -- ing, Strength, joy, and will -- ing -- ness come with the sight; We would see Je -- sus, dy -- ing, ris -- en, plead -- ing, Then wel -- come day, and fare -- well mor -- tal night!"
