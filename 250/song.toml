[lyrics.1]
text = "Sun of my soul, Thou Sav -- ior dear, It is not night if Thou be near; Oh, may no earth -- born cloud a -- rise To hide Thee from Thy serv -- ant's eyes."

[lyrics.2]
text = "When the soft dews of kind -- ly sleep My wea -- ried eye -- lids gent -- ly steep, Be my last thought, how sweet to rest For -- ev -- er on my Sav -- ior's breast."

[lyrics.3]
text = "A -- bide with me from morn till eve, For with -- out Thee I can -- not live; A -- bide with me when night is nigh, For with -- out Thee I dare not die."

[lyrics.4]
text = "If some poor wand -- 'ring child of Thine Has spurned to -- day the voice di -- vine, Now, Lord, the gra -- cious work be -- gin; Let him no more lie down in sin."

[lyrics.5]
text = "Watch by the sick, en -- rich the poor With bless -- ings from Thy bound -- less store; Be ev -- ery mourn -- er's sleep to -- night, Like in -- fants' slum -- bers, pure and light."

[lyrics.6]
text = "Come near and bless us when we wake, Ere through the world our way we take, Till in the o -- cean of Thy love We lose our -- selves in Heav'n a -- bove."
