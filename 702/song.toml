[lyrics.1]
text = "Sweet is the tho’t to me: lone -- ly my life may be, Still I may win the great re -- ward; For there will be a -- bove— giv -- en in match -- less love— @s1"

[lyrics.2]
text = "Of -- ten the path is drear and we are bur -- dened here, Of -- ten we hear no help -- ful word: But if we trust His grace we shall be -- hold His face!— @s1"

[lyrics.3]
text = "So I will praise His love, look -- ing for help a -- bove, Sure that my strength will be re -- stored; Sure that at set of sun Je -- sus will say, “Well done!”— @s1"

[lyrics.chorus]
text = "Glo -- ry for all, glo -- ry for all! Glo -- ry for all is faith’s re -- ward! is faith’s re -- ward! Oh, there will sure -- ly be glo -- ry for you and me,— Glo -- ry for all who serve the Lord."

