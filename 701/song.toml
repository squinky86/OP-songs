[lyrics.2]
text = "O light of love that mak -- est bright The wea -- ry hours of sor -- row’s night; No tri -- als can thy bright -- ness dim, For thou art from the heart of Him!"

[lyrics.3]
text = "O light of love, ere long, I know, My heart with joy will o -- ver -- flow; For I shall reach that coun -- try bright. Where thou shalt ev -- er be the light!"

