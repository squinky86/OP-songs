[lyrics.1]
text = "Hear the voice of Je -- sus say, Loud -- ly cry -- ing un -- to all, In My vine -- yard work to -- day; Hark -- en to His call."

[lyrics.2]
text = "Why, He asks, thro’ all the day, Stand ye i -- dle, noth -- ing do? En -- ter in with -- out de -- lay; I have work for you."

[lyrics.3]
text = "Work and serve Me with de -- light, Full re -- ward to you I’ll give, At the gath’ -- ring shades of night; Wa -- ges you’ll re -- ceive."

[lyrics.4]
text = "Thro’ the long and toil -- some day, ’Neath a blaz -- ing, burn -- ing sun, Bear the heat, per -- sue your way, Till your task is done."

[lyrics.chorus]
text = "Work, then, for Je -- sus, He will own and bless your la -- bors, Work, work for Je -- sus, Work, work to -- day."
