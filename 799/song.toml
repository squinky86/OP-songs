[lyrics.1]
text = "’Twas on that night, when doomed to know The ea -- ger rage of ev -- ’ry foe, The night in which He was be -- tray’d, The Sav -- ior of the world took bread."

[lyrics.2]
text = "And, aft -- er thanks and glo -- ry giv’n To Him that rules in earth and heav’n, That sym -- bol of His flesh He broke, And thus to all His fol -- l’wers spoke:"

[lyrics.3]
text = "“My bro -- ken bod -- y thus I give For you, for all; take, eat, and live; And oft the sa -- cred feast re -- new, That brings My won -- drous love to view.”"

[lyrics.4]
text = "Then in His hands the cup He raised, And God a -- new He thanked and praised, While kind -- ness in His bos -- om glowed, And from His lips sal -- va -- tion flowed."

[lyrics.5]
text = "“My blood I thus pour forth,” He cries, “To cleanse the soul in sin that lies; Par -- take; and when the cup ye pour, Re -- mem -- ber still My dy -- ing hour.”"
