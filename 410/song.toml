[lyrics.1]
text = "While we pray and while we plead, While you see your soul’s deep need, While our Fa -- ther calls you home, Will you not, my bro -- ther, come?"

[lyrics.2]
text = "You have wan -- dered far a -- way; Do not risk an -- oth -- er day; Do not turn from God your face, But to -- day ac -- cept His grace."

[lyrics.3]
text = "In the world you’ve failed to find Aught of peace for trou -- bled mind; Come to Christ, on Him be -- lieve, Peace and joy you shall re -- ceive."

[lyrics.4]
text = "Come to Christ, con -- fes -- sion make; Come to Christ, and par -- don take; Trust in Him from day to day, He will keep you all the way."

[lyrics.chorus]
text = "Why not now? Why not now? Why not come to Je -- sus now? Why not now? Why not now? Why not come to Je -- sus now?"
