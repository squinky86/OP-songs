[lyrics.1]
text = "’Neath the King’s com -- mand let us march a -- long, With a cheer -- ful step and a cour -- age strong; God has filled our hearts with a sweet new song; @s1"

[lyrics.2]
text = "Now with glad -- some hearts let us serve our King; As we do His will ev -- er praise and sing; For our song may souls to the Sav -- iour bring, @s1"

[lyrics.3]
text = "Let the song ring out, and be not dis -- mayed, Tho’ the hosts of sin are in might ar -- rayed; God’s our strength and shield; He will give us aid; @s1"

[lyrics.4]
text = "O re -- joice, re -- joice, let us grate -- ful be For sal -- va -- tion of -- fered so full, so free; There is life e -- ter -- nal for you for me,— @s1"

[lyrics.chorus]
text = "Let the song ring out, An -- gels hov -- er round a -- bout, Re -- joice, re -- joice and praise the Lord; Let the joy -- ful song ring out."

[parts.Alto.lyrics.chorus]
text = "Let the song ring out, ring out, An -- gels hov -- er round a -- bout, round a -- bout, Re -- joice, re -- joice and praise the Lord; Let the joy -- ful song ring out."

[lyrics.s1]
