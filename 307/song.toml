[lyrics.1]
text = "The whole world was lost In the dark -- ness of sin, The Light of the world is Je -- sus! Like sun -- shine at noon -- day, His glor -- y shone in. The Light of the world is Je -- sus!"

[lyrics.2]
text = "No dark -- ness have we Who in Je -- sus a -- bide; The Light of the world is Je -- sus! We walk in the light When we fol -- low our Guide! The Light of the world is Je -- sus!"

[lyrics.3]
text = "Ye dwell -- ers in dark -- ness With sin blind -- ed eyes, The Light of the world is Je -- sus! Go, wash, at His bid -- ding, And light will a -- rise. The Light of the world is Je -- sus!"

[lyrics.4]
text = "No need of the sun -- light In Hea -- ven we’re told; The Light of the world is Je -- sus! The Lamb is the Light In the ci -- ty of gold, The Light of the world is Je -- sus!"

[lyrics.chorus]
text = "Come to the Light, ’tis shin -- ing for thee; Sweet -- ly the Light has dawned up -- on me. Once I was blind, but now I can see: The Light of the world is Je -- sus!"
