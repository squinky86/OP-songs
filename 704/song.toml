[lyrics.1]
text = "Close to the cross of Je -- sus, Un -- der the crim -- son tide, Washed in the pre -- cious foun -- tain, Let me in peace a -- bide."

[lyrics.2]
text = "There where the great Re -- deem -- er, Dy -- ing in ag -- o -- ny, Prayed for the ones who mocked Him; Sure -- ly He cares for me."

[lyrics.3]
text = "Close to the cross which heav -- en Dark -- ened, the sun to hide, Close to the ran -- som giv -- en, Let me each day a -- bide."

[lyrics.chorus]
text = "Close to the cross let me a -- bide, Close to the cross where Je -- sus died, Close to the cross of my cru -- ci -- fied Sav -- iour, Oh! let me a -- bide."

[parts.Soprano.lyrics.chorus]
text = "Close to the cross, Close to the cross, Close to the cross of my cru -- ci -- fied Sav -- iour, Oh! let me a -- bide."
