[lyrics.1]
text = "Still out -- side! Still out -- side, Liv -- ing in doubt and sin! Sweet is the plea of the Cru -- ci -- fied, Yet you will not come in!"

[lyrics.2]
text = "Still out -- side! Still out -- side, Tho’ the long night is near! Foes will as -- sail you and storms be -- tide, Yet you re -- fuse to hear!"

[lyrics.3]
text = "Still out -- side! Still out -- side, Sin- -- stained, un -- loved and worn! Risk -- ing for pleas -- ures which ne’er a -- bide Heav -- en’s e -- ter -- nal morn."

[lyrics.4]
text = "Still out -- side! Still out -- side, Why will you not come in? Wea -- ry and worn, and dis -- sat -- is -- fied, Just for a life of sin!"

[lyrics.chorus]
text = "“Time e -- nough yet,” to your soul you say, Griev -- ing the Friend who died. O -- pen the door of the fold re -- mains, Yet you are still out -- side."
